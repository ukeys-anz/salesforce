options:
  workerPool: 'anz-cx-cloudbuild-dev-5ef683/custom-workers-dev-pool'

steps:
- id: git_init
  name: 'gcr.io/cloud-builders/git'
  waitFor: ['-']
  entrypoint: bash
  args:
  - -c
  - |
    # Attempt to fetch all tags
    git fetch --unshallow
    git branch -a

- id: 'code_quality_pmd'
  waitFor: [ '-' ]
  name: 'hub.artifactory.gcp.anz/jamesmoriarty/pmd:6.18.0'
  args: [
    'pmd',
    '-R', '/workspace/rulesets/apex/quickstart.xml',
    '-d', '.',
    '-l', 'apex',
    '-f', 'textcolor'
  ]

- id: 'decrypt_key'
  waitFor: [ '-' ]
  name: gcr.io/cloud-builders/gcloud
  entrypoint: bash
  args:
  - -c
  - |
    # Make sure that hotfix/* release/* and master goes to staging, and the rest to systest
    if [[ '$BRANCH_NAME' == master || '$BRANCH_NAME' == release/* || '$BRANCH_NAME' == hotfix/* ]]; then
      ENV='staging'
    else
      ENV='systest'
    fi
    if [[ -n $${ENV+x} ]]; then
      gcloud kms decrypt \
        --ciphertext-file=keys/sfdx-auth-url-"$$ENV".encrypted.txt \
        --plaintext-file=keys/sfdx-auth-url-"$$ENV".txt \
        --location=global \
        --keyring=cloudbuild-keyring \
        --key=salesforce-cli-authentication-key
    fi

- id: 'deploy_to_environment'
  waitFor: ['git_init', 'decrypt_key', 'code_quality_pmd']
  name: 'anzx-docker.artifactory.gcp.anz/salesforce/salesforce-builder:new'
  entrypoint: bash
  args:
  - -euo
  - pipefail
  - -c
  - |
    # The value of USERNAME does not matter, as long as the alias is aligned between the deploy
    # command and the sfdx credential store.
    USERNAME='ASDF'
    # Make sure that hotfix/* release/* and master goes to staging, and the rest to systest
    if [[ '$BRANCH_NAME' == master || '$BRANCH_NAME' == release/* || '$BRANCH_NAME' == hotfix/* ]]; then
      sfdx force:auth:sfdxurl:store --sfdxurlfile 'keys/sfdx-auth-url-staging.txt' --setalias "$$USERNAME"
    else
      sfdx force:auth:sfdxurl:store --sfdxurlfile 'keys/sfdx-auth-url-systest.txt' --setalias "$$USERNAME"
    fi
    exec /workspace/scripts/cicd.sh \
      --branch '${BRANCH_NAME}' \
      --username "$$USERNAME"

- id: 'push_tag'
  waitFor: ['deploy_to_environment']
  name: 'gcr.io/cloud-builders/git'
  entrypoint: bash
  args:
  - -xeuo
  - pipefail
  - -c
  - |
    if [[ -e tag.txt ]]; then
      TAG=$$(cat tag.txt)
      git tag "$$TAG"
      git push origin "$$TAG"
    fi

