steps:
- name: 'gcr.io/cloud-builders/curl'
  id: 'curl-salesforce'
  args:
  - -v
  - https://anz.my.salesforce.com

- name: gcr.io/cloud-builders/gcloud
  args:
  - kms
  - decrypt
  - --ciphertext-file=keys/cli-key.pem.enc
  - --plaintext-file=keys/cli-key.pem
  - --location=global
  - --keyring=cloudbuild-keyring
  - --key=salesforce-cli-authentication-key

- id: 'Test code in scratch environment'
  name: 'anzx-docker.artifactory.gcp.anz/salesforce/salesforce-builder:latest'
  args:
  - ci_pre_setup
  - setup
  - run_tests
  - ci_test_status
  - ci_coverage_status
  env:
  - "CONSUMER_KEY=3MVG9LYo_0A0MtgGa1jC8NYSa4WuSg3ndmj3q_chvURy1vwz02QUKoebiTEyEJDETwGJ42eU3x5p38E5sPZwo"
  - "HUB_USERNAME=tech.gcb@anzx.com"
  - "INSTANCE_URL=https://anz.my.salesforce.com"
  - "JWT_KEY_FILE=/workspace/keys/cli-key.pem"

- id: 'Code Quality (Sonarqube)'
  waitFor: [ '-' ]
  name: 'gcr.io/cloud-builders/docker'
  args: [
    'run', '-v', '/workspace:/usr/src',
      'hub.artifactory.gcp.anz/newtmitch/sonar-scanner:4.0.0',
        '-Dsonar.projectKey=salesforce',
        '-Dsonar.projectName=Salesforce',
        '-Dsonar.sources=.',
        '-Dsonar.host.url=http://sonarqube.services.anzx.gcpnp.anz',
        '-Dsonar.login=280ee81e19bf95d66c9da0b6022afa49dfd2819a'
  ]

- id: 'Code Quality (PMD)'
  waitFor: [ '-' ]
  name: 'gcr.io/cloud-builders/docker'
  args: [ 'run',  '-v', '/workspace:/workdir', 'hub.artifactory.gcp.anz/jamesmoriarty/pmd:6.18.0',
    'pmd',
      '-R', 'rulesets/apex/quickstart.xml',
      '-d', '.',
      '-l', 'apex',
      '-f', 'textcolor'
  ]

options:
  workerPool: 'anz-cx-cloudbuild-dev-5ef683/custom-workers-dev-pool'

timeout: 45m
