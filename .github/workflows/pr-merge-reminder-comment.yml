name: Add PR Merge Reminder
on:
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: [self-hosted, salesforce-prod]
    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: "Checkout Action Repo"
        uses: actions/checkout@v2
        with:
          repository: anzx/salesforce-actions
          token: ${{ secrets.SALESFORCE_ACTIONS_CHECKOUT_TOKEN }}
          path: .github/actions
          ref: v3

      - name: "Add Comment Reminder"
        uses: ./.github/actions/auto-comment
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pullRequestOpened: |
            👋 @{{ author }} here's a reminder for merging PR's:

            | Squash &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; |     |         |
            | ------- | --- | ------- |
            | feature | ➡️  | epic    |
            | feature | ➡️  | release |
            | feature | ➡️  | master  |
            | epic **   | ➡️  | release |

            | Merge Commit |     |         |
            | ------------ | --- | ------- |
            | release      | ➡️  | develop |
            | release      | ➡️  | epic    |
            | develop      | ➡️  | master  |
            | master       | ➡️  | develop |

            ** *epic branch can be squashed into release except in scenario where epic/x contains multiple epics*
