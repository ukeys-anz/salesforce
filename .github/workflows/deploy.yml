# This workflow deploys changes to a Salesforce project to a Salesforce org
name: Deploy

# This workflow will only run on pushes to master , develop and epic/*
on:
  push:
    paths:
      - "force-app/**"
    branches:
      - develop
      - master
      - epic/*
      - "!epic/lock-card"
      - "!epic/disputes"
      - "!epic/fraud"
      - "!epic/anzx-bau"

jobs:
  prepare:
    runs-on: [self-hosted, salesforce]
    outputs:
      IS_SANDBOX_SECRET_SET: ${{ steps.checksecret.outputs.IS_SANDBOX_SECRET_SET }}
    steps:
      - name: Set Branch Name
        run: echo BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/}) >> $GITHUB_ENV

      - name: Set Sandbox Name
        run: |
          if [ ${{ env.BRANCH_NAME }} == 'develop' ]; then echo SANDBOX_NAME=$(echo SYSTEST) >> $GITHUB_ENV; elif [ ${{ env.BRANCH_NAME }} == 'master' ]; then echo SANDBOX_NAME=$(echo STAGING) >> $GITHUB_ENV; else echo SANDBOX_NAME=$(echo ${{ env.BRANCH_NAME }} |  tr -d '-' | tr 'a-z' 'A-Z' | cut -d'/' -f 2 | cut -c1-10) >> $GITHUB_ENV; fi

      - name: Set secret prefix
        run: echo SANDBOX_SECRET=SALESFORCE_${{ env.SANDBOX_NAME }} >> $GITHUB_ENV

      - name: Check whether the sandbox secret exists
        id: checksecret
        env:
          MY_SECRET: ${{ secrets[env.SANDBOX_SECRET] }}
        run: |
          echo "IS_SANDBOX_SECRET_SET: ${{ env.MY_SECRET != '' }}"
          echo "::set-output name=IS_SANDBOX_SECRET_SET::${{ env.MY_SECRET != '' }}" 
          echo ${{ steps.checksecret.outputs.IS_SANDBOX_SECRET_SET }}

  build_and_deploy:
    needs: [prepare]
    if: needs.prepare.outputs.IS_SANDBOX_SECRET_SET == 'true'
    runs-on: [self-hosted, salesforce]
    env:
      SFDX_NPM_REGISTRY: https://artifactory.gcp.anz/artifactory/api/npm/npmjs-org/
      SFDX_DISABLE_TELEMETRY: true
      SFDX_DISABLE_AUTOUPDATE: true
      HTTP_PROXY: http://127.0.0.1:3128
      HTTPS_PROXY: http://127.0.0.1:3128

    steps:
      - name: Set Branch Name
        run: echo BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/}) >> $GITHUB_ENV
      - name: Set Sandbox Name
        run: |
          if [ ${{ env.BRANCH_NAME }} == 'develop' ]; then echo SANDBOX_NAME=$(echo SYSTEST) >> $GITHUB_ENV; elif [ ${{ env.BRANCH_NAME }} == 'master' ]; then echo SANDBOX_NAME=$(echo STAGING) >> $GITHUB_ENV; else echo SANDBOX_NAME=$(echo ${{ env.BRANCH_NAME }} |  tr -d '-' | tr 'a-z' 'A-Z' | cut -d'/' -f 2 | cut -c1-10) >> $GITHUB_ENV; fi

      - name: Set secret prefix
        run: echo SANDBOX_SECRET=SALESFORCE_${{ env.SANDBOX_NAME }} >> $GITHUB_ENV

      - uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: "Install npm packages"
        run: |
          mv ci.npmrc .npmrc
          npm ci

      - name: "Authenticate the org"
        shell: bash
        run: |
          echo 'Authenticating ${{ env.SANDBOX_NAME }}'
          echo ${{ secrets[env.SANDBOX_SECRET] }} > ./SFDX_URL_${{ env.SANDBOX_NAME }}.txt
          npx sfdx force:auth:sfdxurl:store -a ${{ env.SANDBOX_NAME }} --sfdxurlfile=./SFDX_URL_${{ env.SANDBOX_NAME }}.txt

      - name: "Generate package"
        id: package
        shell: bash
        run: |
          git fetch --tags 
          ci/package.sh

      - uses: actions/upload-artifact@v1
        if: ${{ steps.package.outputs.ARTEFACT_GENERATED }}
        with:
          name: package
          path: ./artefact/

      - name: "Deploy Changes"
        shell: bash
        run: ci/deploy.sh
        env:
          DEPLOY_ROOT: ./artefact/
          BUILD_COMMAND: deploy
          ORG_NAME: ${{ env.SANDBOX_NAME }}

      - name: "Tag Release"
        shell: bash
        run: |
          echo "${GITHUB_REF#refs/heads/}-${GITHUB_RUN_ID}"
          TAG="${GITHUB_REF#refs/heads/}-${GITHUB_RUN_ID}"
          git tag "$TAG"
          git push origin "$TAG"

  create_documentation:
    runs-on: [self-hosted, salesforce]
    needs: build_and_deploy
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v2
        with:
          repository: anzx/salesforce-docs
          token: ${{ secrets.SALESFORCE_DOCS_TOKEN }}

      - name: Checkout doc plugin
        uses: actions/checkout@v2
        with:
          repository: anzx/salesforce-doc-gen
          token: ${{ secrets.SALESFORCE_DOC_GEN_TOKEN }}
          path: plugin
          ref: "17f9f5d"

      - name: Checkout salesforce repo
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          path: salesforce

      - name: "Install npm packages"
        working-directory: salesforce
        run: |
          mv ci.npmrc .npmrc
          npm ci

      - name: Install plugin
        working-directory: plugin
        shell: bash
        run: yarn install

      - name: "Create auth files with SFDX_URL secret"
        working-directory: salesforce
        shell: bash
        run: echo ${{ secrets.SALESFORCE_SYSTEST}} > ./SFDX_URL_SYSTEST.txt

      - name: "Authenticate all orgs in SFDX CLI"
        working-directory: salesforce
        run: npx sfdx force:auth:sfdxurl:store -a systest --sfdxurlfile=./SFDX_URL_SYSTEST.txt

      - name: Generate sysl
        working-directory: salesforce
        shell: bash
        run: |
          ../plugin/bin/run doc:sysl -f config/doc-def.json -u systest

      - name: Copy docs
        run: |
          rm -rf ./sysl/salesforce.edg.sysl
          mkdir -p ./sysl/
          cp -r salesforce/docs/sysl ./

      - name: Create new branch on anzx/salesforce-docs
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b ${GITHUB_RUN_ID}
          git add sysl/
          git commit -m "Update salesforce documentation"
          git push origin ${GITHUB_RUN_ID}

      - name: Create a PR on anzx/salesforce-docs
        shell: bash
        run: |
          if git branch | grep -q -w ${GITHUB_RUN_ID}; then hub pull-request -b master -h ${GITHUB_RUN_ID} --no-edit -m "${GITHUB_REF#refs/heads/}-${GITHUB_RUN_ID} Sysl Update" -m "An automated PR to update access and schema documentation from https://github.com/anzx/salesforce/releases/tag/${GITHUB_REF#refs/heads/}-${GITHUB_RUN_ID}"; fi
        env:
          GITHUB_TOKEN: ${{ secrets.SALESFORCE_DOCS_TOKEN }}
