name: Automation-Test

on:
  schedule:
    - cron: "0 18 * * 0-4" # UTC Time, Run at 4-5AM AEST weekday

jobs:
  automation-test:
    runs-on: [self-hosted, salesforce]
    steps:
      - name: Trigger Harness Job
        run: |
          docker run --rm \
            anzx-docker.artifactory.gcp.anz/github-actions-harness-trigger:ede3323 \
            --harness-api- \
            --kms-key=projects/anz-x-services-platdev-fcf8c0/locations/global/keyRings/developer-experience/cryptoKeys/anz-x-services-platdev-fcf8c0_github-runner-common-secrets \
            --application-name=salesforce \
            --target-name=salesforce-automation-test-np \
            --target-type=WORKFLOW \
            --wait
      - if: success()
        name: Send Slack Notification
        run: |
          sleep 30

          TodayDate="$(TZ=Australia/Melbourne date +%F)"

          summary=$(curl https://artifactory.gcp.anz/artifactory/anzx-salesforce-automation-test-np/${TodayDate}-results-summary.csv)
          summaryArr=($(echo "$summary" | tr "," "\n"))

          summaryArrLen=${#summaryArr[@]}
          singleArrLen=$(( summaryArrLen / 2 ))

          Failed=""
          Broken=""
          Passed=""
          Skipped=""
          ResultsUrl="https://artifactory.gcp.anz/artifactory/anzx-salesforce-automation-test-np/${TodayDate}-results.zip"
          ResultsReportUrl="https://artifactory.gcp.anz/artifactory/anzx-salesforce-automation-test-np/${TodayDate}-results-report.csv"

          index=0

          for el in "${summaryArr[@]}"
          do
              valueIndex=$(( index + singleArrLen))
              val="${summaryArr[$valueIndex]}"
              
              el=$(eval echo "$el")

              if [[ $el == "FAILED" ]]; then
                  Failed=$val
              elif [[ $el == "BROKEN" ]]; then
                  Broken=$val
              elif [[ $el == "PASSED" ]];then
                  Passed=$val
              elif [[ $el == "SKIPPED" ]]; then
                  Skipped=$val
              elif [ $index == $singleArrLen ]; then
                  break
              fi
              index=$(( index + 1 ))
          done

          IDENTITY_TOKEN=$(curl -H "Metadata-Flavor: Google" 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=https://platform-notify.platform-notify.services-platdev.x.gcpnp.anz&format=full&licenses=TRUE')
          curl -H "Authorization: Bearer ${IDENTITY_TOKEN}" --data '{"channel":"sf-automation-test","templateID":"ghasfautomationtest","args":{"startdatetime":"'${TodayDate}'","passed":'${Passed}',"failed":'${Failed}',"broken":'${Broken}',"skipped":'${Skipped}',"resultsurl":"'${ResultsUrl}'","resultsreporturl":"'${ResultsReportUrl}'"}}' https://platform-notify.platform-notify.services-platdev.x.gcpnp.anz/slack
