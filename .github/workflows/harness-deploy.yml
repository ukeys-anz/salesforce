# This workflow deploys changes to a Salesforce project to a Salesforce org
name: Deploy
# This workflow will only run on pushes to master , develop and epic/*
on:
  push:
    branches:
      - x
  workflow_dispatch:
    inputs:
      BASEREF:
        description: "Base Ref"
        required: true
        type: text

jobs:
  harness-deploy:
    runs-on: [self-hosted, salesforce-prod]
    steps:
      - name: Set BASE_REF
        run: |
          if [[ ${{ github.event_name }} == 'workflow_dispatch' ]];then
            echo BASE_REF="${{ github.event.inputs.BASEREF }}" >> $GITHUB_ENV
            echo REF="refs/heads/${{ github.event.inputs.BASEREF }}" >> $GITHUB_ENV
            echo GIT_REF="${{ github.event.inputs.BASEREF }}-${GITHUB_RUN_ID}" >> $GITHUB_ENV
          else
            echo BASE_REF=$(echo ${GITHUB_REF#refs/heads/}) >> $GITHUB_ENV
            echo REF="${{ github.ref }}"
            echo GIT_REF="${GITHUB_REF#refs/heads/}-${GITHUB_RUN_ID}" >> $GITHUB_ENV
          fi

      - if: env.BASE_REF != 'release'
        name: Read Harness API Key
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@main
        with:
          secrets: |-
            harness-api-key:projects/36540621485/secrets/ghr-salesforce-prod-salesforce-harness-np/versions/1

      - if: env.BASE_REF != 'release'
        name: Trigger Harness Job
        uses: docker://anzx-docker.artifactory.gcp.anz/github-actions-harness-trigger:latest
        env:
          GITHUB_REF: ${{ env.REF }}
          GITHUB_SHA: ${{ github.sha }}
          UPLOAD_ARTIFACT: false
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          application-name: salesforce
          harness-api-key-plaintext: ${{ steps.secrets.outputs.harness-api-key}}
          target-name: salesforce-cd-np
          target-type: WORKFLOW
          variables: "GITHUB_BASE_REF=${{ env.BASE_REF }};GITHUB_REF=${{ env.GITHUB_REF }};GITHUB_SHA=${{ env.GITHUB_SHA }};UPLOAD_ARTIFACT=${{ env.UPLOAD_ARTIFACT }};REPO_NAME=${{ env.REPO_NAME }}"
          wait: TRUE

      - uses: actions/checkout@v2
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      - name: "Tag Release"
        shell: bash
        run: |
          echo "${{ env.GIT_REF }}"
          TAG="${{ env.GIT_REF }}"
          git tag "$TAG"
          git push origin "$TAG"
