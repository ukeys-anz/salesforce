# This workflow deploys changes to a Salesforce project to a Salesforce org
name: Deploy
# This workflow will only run on pushes to master , develop and epic/*
on:
  push:
    branches:
      - "develop"
      - "epic/*"

jobs:
  harness-deploy:
    runs-on: [self-hosted, salesforce-prod]
    steps:
      - name: Set BASE_REF
        run: echo BASE_REF=$(echo ${GITHUB_REF#refs/heads/}) >> $GITHUB_ENV

      - name: Read Harness API Key
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@main
        with:
          secrets: |-
            harness-api-key:projects/36540621485/secrets/ghr-salesforce-prod-salesforce-harness-np/versions/1

      - name: Trigger Harness Job
        uses: docker://anzx-docker.artifactory.gcp.anz/github-actions-harness-trigger:latest
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          UPLOAD_ARTIFACT: ${{ contains(github.base_ref, 'develop') || contains(github.base_ref, 'master') }}
        with:
          application-name: salesforce
          harness-api-key-plaintext: ${{ steps.secrets.outputs.harness-api-key}}
          target-name: salesforce-cd-np
          target-type: WORKFLOW
          variables: "GITHUB_BASE_REF=${{ env.BASE_REF }};GITHUB_REF=${{ env.GITHUB_REF }};GITHUB_SHA=${{ env.GITHUB_SHA }};UPLOAD_ARTIFACT=${{ env.UPLOAD_ARTIFACT }}"
          wait: TRUE

      - uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: "Tag Release"
        shell: bash
        run: |
          echo "${GITHUB_REF#refs/heads/}-${GITHUB_RUN_ID}"
          TAG="${GITHUB_REF#refs/heads/}-${GITHUB_RUN_ID}"
          git tag "$TAG"
          git push origin "$TAG"
