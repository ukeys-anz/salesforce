name: Salesforce Validation/Quick Deployment Reusable Workflow
on:
  workflow_call:
    inputs:
      sfdx_name:
        required: false
        description: "Secret Name as an Input"
        type: string
    secrets:
      token:
        required: true
        description: "Repo token"
      plugin-token:
        required: true
        description: "Plugin repo token"

jobs:
  validate:
    uses: ./.github/workflows/_validation.yml
    with:
      sfdx_name: ${{ inputs.sfdx_name }}
    secrets:
      token: ${{ secrets.token }}
      plugin-token: ${{ secrets.plugin-token }}

  deploy:
    needs: [validate]
    uses: ./.github/workflows/_quick-deployment.yml
    with:
      sfdx_name: ${{ inputs.sfdx_name }}
    secrets:
      token: ${{ secrets.token }}
      plugin-token: ${{ secrets.plugin-token }}
