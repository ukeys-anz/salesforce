name: Salesforce Validation/Quick Deployment Reusable Workflow
on:
  workflow_call:
    inputs:
      sfdx_name:
        required: false
        description: "Secret Name as an Input"
        type: string
      base_ref:
        required: false
        description: "Base reference branch"
        type: string
    secrets:
      token:
        required: true
        description: "Repo token"

jobs:
  validate:
    uses: ./.github/workflows/_validation.yml
    with:
      sfdx_name: ${{ inputs.sfdx_name }}
      base_ref: ${{ inputs.base_ref }}
    secrets:
      token: ${{ secrets.token }}

  deploy:
    needs: [validate]
    uses: ./.github/workflows/_quick-deployment.yml
    with:
      sfdx_name: ${{ inputs.sfdx_name }}
      base_ref: ${{ inputs.base_ref }}
    secrets:
      token: ${{ secrets.token }}
