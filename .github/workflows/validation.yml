name: Validation

on:
  pull_request:
    branches: [master, develop, release, epic/*]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: "${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  validation:
    container:
      image: "salesforce-docker.artifactory.gcp.anz/salesforce-delegate:2.1.1"
      options: --user root
    runs-on: anzx-default
    env:
      SERVICE_ACCOUNT: "h-sf-primary-np@anz-x-bootstrap-np-487e09.iam.gserviceaccount.com"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH_NAME: "${{ github.head_ref }}"
      PR_NUMBER: "${{ github.event.number }}"
      DRAFT_PR: "${{ github.event.pull_request.draft }}"
      SPECIFIED_TEST_PR: "${{ contains( toJson(github.event.pull_request.labels), 'Run Specified Tests') }}"
      REPO_NAME: "${{ github.event.repository.name }}"
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "true"
          token: ${{ secrets.SALESFORCE_ACTIONS_CHECKOUT_TOKEN }}

      - name: Link plugin
        run: |
          cd /opt/harness-delegate/sf-plugin
          sf plugins link .

      - name: OIDC Authentication (Salesforce Harness Delegate Service Account)
        id: "authenticate-harness-delegate"
        uses: "anzx/github-reusable-actions/authenticate-gcp@main"
        with:
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: ENV vars
        run: |
          baseRef="${{ github.base_ref }}"
          [[ "$baseRef" == "release" ]] && baseRef=develop
          echo BASE_REF="$baseRef" >> $GITHUB_ENV
          echo WORKING_DIR="$(pwd)" >> $GITHUB_ENV

          lastTag="$( git describe --abbrev=0 --tags --match $baseRef* )"
          echo BASE_REF_LAST_TAG="$lastTag" >> $GITHUB_ENV

      - name: Find Secret Names
        run: |
          sfdxURL=$( node ci/workflows/Orchestrations/findSecret.mjs )
          echo "$sfdxURL"
          echo SECRET_NAME="$sfdxURL" >> $GITHUB_ENV

      - name: Retrieve GSM Credentials
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@main
        with:
          secrets: |-
            sfdxurl:projects/anz-x-gh-sf-nonprod-ea5caa/secrets/${{ env.SECRET_NAME }}/versions/latest
            artifactory:projects/anz-x-gh-sf-nonprod-ea5caa/secrets/sf-platform-np-artifact/versions/latest

      - name: Run Validation
        run: |
          node --no-warnings ci/workflows/Orchestrations/validation.mjs "${{ steps.secrets.outputs.sfdxurl }}" "${{ steps.secrets.outputs.artifactory }}"
          if [[ "${{ env.DRAFT_PR }}" == 'false' ]];then
            echo WHICH_JOB="coverage" >> $GITHUB_ENV
          else
            echo WHICH_JOB="clean" >> $GITHUB_ENV
          fi

      - name: Run Code Coverage
        if: github.event.pull_request.draft == false
        run: |
          node --no-warnings ci/workflows/Orchestrations/code-coverage.mjs "${{ steps.secrets.outputs.sfdxurl }}" "${{ steps.secrets.outputs.artifactory }}"
          echo WHICH_JOB="clean" >> $GITHUB_ENV

      - name: Check sending new pr comment
        id: pr-comment-run
        if: github.event.pull_request.draft == false
        run: |
          PR_COMPARE_FILE="code-coverage-report-${{env.REPO_NAME}}-${{env.PR_NUMBER}}-report"
          CODE_COVERAGE_HTML_FILE="code-coverage-report-${{env.REPO_NAME}}-${{env.PR_NUMBER}}.html"
          skip=false

          if [[ ! -f "$CODE_COVERAGE_HTML_FILE" ]]; then
            skip=true
          fi

          if [[ -f "$PR_COMPARE_FILE" ]]; then
            compare=$(cat "$PR_COMPARE_FILE")
            echo "Same PR comment as before? $compare"

            if [[ "$compare" == *'true'* ]]; then
              skip=true
            fi
          else
            echo "$PR_COMPARE_FILE or $CODE_COVERAGE_HTML_FILE does not exist..."
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Setup Github CLI
        if: github.event.pull_request.draft == false && steps.pr-comment-run.outputs.skip == 'false'
        uses: anzx/github-reusable-actions/setup-gh-cli@main
        with:
          gh-cli-version: "2.50.0"

      - name: Send PR comment
        if: github.event.pull_request.draft == false && steps.pr-comment-run.outputs.skip == 'false'
        run: |
          set -e
          existing_comment_id=$(gh api repos/"$REPO"/issues/"$PR_NUMBER"/comments \
            --jq '.[] | select(.body | contains("📊 Apex Code Coverage Summary")) | .id')

          CODE_COVERAGE_HTML_FILE="code-coverage-report-${{env.REPO_NAME}}-${{env.PR_NUMBER}}.html"

          if [[ -n "$existing_comment_id" ]]; then
            # Update the existing PR comment
            gh api \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              /repos/"$REPO"/issues/comments/"$existing_comment_id" \
              -f body="$(<"$CODE_COVERAGE_HTML_FILE")"

          elif [[ -f "$CODE_COVERAGE_HTML_FILE" ]]; then
            # No comment exists yet, but file exists → create new PR comment
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$CODE_COVERAGE_HTML_FILE"
          fi

      - name: Code Coverage Cleanup
        if: github.event.pull_request.draft == false
        run: |
          node --no-warnings ci/workflows/Orchestrations/code-coverage.mjs "${{ steps.secrets.outputs.sfdxurl }}" "${{ steps.secrets.outputs.artifactory }}"

      - name: Cleanup Validation
        run: |
          node --no-warnings ci/workflows/Orchestrations/validation.mjs
