# Currently under development. This workflow syncs object changes to gcs bucket in non-prod.
name: Validate Object Changes

on:
  pull_request:
    branches:
      - epic/upload-object-changes-workflow

permissions:
  contents: "read"
  id-token: "write"

env:
  BUCKET_NAME: salesforce-nonprod-github-workflows

jobs:
  validate_object_changes:
    runs-on: [anzx-default]
    steps:
      - uses: actions/setup-node@v2.1.5
        with:
          node-version: "18"

      - name: Checkout salesforce repo
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          path: salesforce

      - name: "OIDC Authentication (Salesforce Harness Delegate Service Account)"
        id: "authenticate-harness-delegate"
        uses: "anzx/github-reusable-actions/authenticate-gcp@main"
        with:
          service_account: "h-sf-primary-np@anz-x-bootstrap-np-487e09.iam.gserviceaccount.com"

      - name: Pull changes from artifactory
        working-directory: salesforce
        id: pull-from-artifactory
        shell: bash
        run: |
          ARTIFACTORY_ARTIFACT_NAME="sf_objects_success_diff_develop_${{ github.event.pull_request.head.sha }}"
          ARTIFACTORY_ARTIFACT_LINK=https://artifactory.gcp.anz/artifactory/anzx-salesforce-releases-np/$ARTIFACTORY_ARTIFACT_NAME.zip
          echo "ARTIFACTORY_ARTIFACT_LINK=$ARTIFACTORY_ARTIFACT_LINK"
          if  ! response=$(wget --server-response -P artifactory_success_output/ "$ARTIFACTORY_ARTIFACT_LINK" 2>&1); then
          echo "Error when pulling artifact from artifactory: $response"
          fi
          status_code=$(echo "$response" | awk '/HTTP\// {print $2}' | tail -n 1)
          if [ -n "$status_code" ]; then
            if [ "$status_code" -eq 200 ]; then
              unzip artifactory_success_output/$ARTIFACTORY_ARTIFACT_NAME.zip -d artifactory_success_output
            elif [ "$status_code" -eq 404 ]; then
                echo "Error: File not found (Status code: $status_code). This means that the upload-object-changes.yml workflow was not run on ${{ github.event.pull_request.head.sha }} as a post deployment step on the develop branch. If this was a commit for a conflict fix on master, please merge it into develop first and then run the upload-object-changes.yml workflow on the develop branch. You can then re-run this workflow."
                echo "wget threw error with status code: $status_code"
                exit 1
            else
                echo "wget threw error with status code: $status_code"
                exit 1
            fi
          fi

      - name: "Set up Cloud SDK"
        uses: "anzx/github-reusable-actions/setup-gcloud@main"
        with:
          install_components: "core"

      - name: Pull current changes from GCS Nonprod
        working-directory: salesforce
        id: pull-from-gcs
        shell: bash
        run: |
          mkdir gcs_bucket
          object_array=($(find artifactory_success_output/output -maxdepth 1 -mindepth 1 -type d -exec basename {} \;))
          for object in "${object_array[@]}"; do
            output=$(gsutil -m cp -r gs://${{ env.BUCKET_NAME }}/$object gcs_bucket 2>&1)
            status=$?
            if [ "$status" -ne 0 ]; then
              if echo "$output" | grep -q "No URLs matched"; then
                echo "No files or folders matched, but continuing without error."
              else
                echo "An error occurred during gsutil copy."
                echo "$output"
                exit 1
              fi
            fi
          done
          ls -la gcs_bucket

      - name: Run diff
        working-directory: salesforce
        id: run-diff
        shell: bash
        run: |
          sfdatasync_sha_object_fields="artifactory_success_output/output"
          sfdatasync_gcs_object_fields="gcs_bucket"

          echo "artifactory_success_output..."
          ls -la artifactory_success_output

          echo "gcs_bucket..."
          ls -la gcs_bucket

          CHANGES_DETECTED=FALSE
          if [ -d "$sfdatasync_sha_object_fields" ] && [ -d "$sfdatasync_gcs_object_fields" ]; then
            diff_output=$(diff -qr "$sfdatasync_sha_object_fields" "$sfdatasync_gcs_object_fields" || true)
            status=$? && echo $diff_output
            if [ $status -eq 2 ]; then
              echo "An error occurred while comparing directories."
              exit 2
            elif [ -n "$diff_output" ]; then
                echo "Changes found between $sfdatasync_sha_object_fields and $sfdatasync_gcs_object_fields..."
                CHANGES_DETECTED=TRUE
            else
                echo "No changes found for sfdatasync user. Moving on..."
            fi

            echo "CHANGES_DETECTED=$CHANGES_DETECTED" >> $GITHUB_OUTPUT
          else
            echo "Error: Either folders $sfdatasync_sha_object_fields or $sfdatasync_gcs_object_fields don't exist. Please check the logs to troubleshoot." >&2
            exit 1
          fi

      # Upload to GCS
      # - id: "upload-folder-to-gcs"
