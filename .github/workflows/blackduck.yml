name: BlackDuck 🦆 Scan

on:
  pull_request:
    branches:
      - master
      - epic/platform
  push:
    branches:
      - develop
  schedule:
    - cron: "57 2 * * *" # Run every day between 2-3am

jobs:
  blackduck:
    runs-on: [self-hosted, salesforce-prod]
    steps:
      - name: Set BASE_REF
        run: echo BASE_REF=$(echo ${GITHUB_REF#refs/heads/}) >> $GITHUB_ENV

      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@main
        with:
          secrets: |-
            harness-api-key:projects/anz-x-gha-prod-0f0d8b/secrets/ghrcommon-secscan-harness-api-key/versions/1

      - name: "🦆 Black Duck Scan"
        id: blackduck
        uses: docker://anzx-docker.artifactory.gcp.anz/github-actions-harness-trigger:latest
        with:
          application-name: secscan
          harness-api-key-plaintext: ${{ steps.secrets.outputs.harness-api-key }}
          target-name: BlackduckScanCI
          target-type: PIPELINE
          variables: |
            GIT_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            GIT_REF=${{ github.ref }}
            PULL_REQUEST=${{ github.event.pull_request.number }}
            REPO=github.com/${{ github.repository }}
          wait: True
        continue-on-error: true

      - name: Slack message
        env:
          BLACKDUCK_STATUS: ${{ steps.blackduck.outcome }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ $BLACKDUCK_STATUS == success ]];then
            status=:white_check_mark:
          else
            status=:X:
          fi

          if [[ $GITHUB_HEAD_REF == '' ]];then
            GITHUB_HEAD_REF="$BASE_REF"
          fi

          TodayDate="$(TZ=Australia/Melbourne date +%F\|%H:%M)"
          IDENTITY_TOKEN=$(curl -H "Metadata-Flavor: Google" 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=https://platform-notify.platform-notify.services-platdev.x.gcpnp.anz&format=full&licenses=TRUE')
          curl -H "Authorization: Bearer ${IDENTITY_TOKEN}" --data '{"channel":"sf-blackduck","templateID":"ghasfblackduck","args":{"startdatetime":"'${TodayDate}'","passed":"'${status}'","branch":"'$GITHUB_HEAD_REF'"}}' https://platform-notify.platform-notify.services-platdev.x.gcpnp.anz/slack
