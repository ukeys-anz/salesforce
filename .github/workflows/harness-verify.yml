# This workflow deploys changes to a Salesforce project to a Salesforce org with the check only flag
name: Verify

# This workflow will only run on Pull Reqeusts against master , develop and epic/*
on:
  pull_request:
    branches:
      - "master"
      - "develop"
      - "epic/*"
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - edited

jobs:
  # This job only does the validation, even though it reads as build_and_deploy. This is due to a name mismatch in terraform.
  build_and_deploy:
    runs-on: [self-hosted, salesforce]
    steps:
      - name: Trigger Harness Job
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF: ${{ github.ref }}
          DRAFT_PR: ${{ github.event.pull_request.draft }}
          UPLOAD_ARTIFACT: ${{ !env.DRAFT_PR }}
          RUN_ALL_TESTS_LABEL: ${{ contains( toJson(github.event.pull_request.labels), 'Run All Tests') }} 
        run: |
          docker run --rm \
            anzx-docker.artifactory.gcp.anz/github-actions-harness-trigger:ede3323 \
            --harness-api- \
            --kms-key=projects/anz-x-services-platdev-fcf8c0/locations/global/keyRings/developer-experience/cryptoKeys/anz-x-services-platdev-fcf8c0_github-runner-common-secrets \
            --application-name=salesforce \
            --target-name=salesforce-ci-np \
            --target-type=WORKFLOW \
            --variables='GITHUB_BASE_REF=${{ env.GITHUB_BASE_REF }};GITHUB_REF=${{ env.GITHUB_REF }};UPLOAD_ARTIFACT=${{ env.UPLOAD_ARTIFACT }};DRAFT_PR=${{ env.DRAFT_PR }};RUN_ALL_TESTS=${{ env.RUN_ALL_TESTS_LABEL }}' \
            --wait
