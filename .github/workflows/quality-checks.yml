name: Quality Checks

on:
  pull_request:
    branches: [master, develop, release, epic/*]

jobs:
  detect-changes:
    runs-on: anzx-default
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      security_needed: ${{ steps.set-flags.outputs.security_needed }}
      sysl_needed: ${{ steps.set-flags.outputs.sysl_needed }}
      pmd_needed: ${{ steps.set-flags.outputs.pmd_needed }}
      prettier_needed: ${{ steps.set-flags.outputs.prettier_needed }}
      eslint_lwc_needed: ${{ steps.set-flags.outputs.eslint_lwc_needed }}
      security_changed_files: ${{ steps.set-flags.outputs.security_changed_files }}
      sysl_changed_files: ${{ steps.set-flags.outputs.sysl_changed_files }}
      pmd_changed_files: ${{ steps.set-flags.outputs.pmd_changed_files }}
      prettier_changed_files: ${{ steps.set-flags.outputs.prettier_changed_files }}
      eslint_lwc_changed_files: ${{ steps.set-flags.outputs.eslint_lwc_changed_files }}
    steps:
      - name: Checkout repo (shallow)
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Setup Github CLI
        uses: anzx/github-reusable-actions/setup-gh-cli@main
        with:
          gh-cli-version: "2.50.0"

      - name: Detect Changed Files
        id: set-flags
        run: |
          chmod +x ci/workflows-scripts/detect-changes.sh
          ./ci/workflows-scripts/detect-changes.sh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  security-check:
    needs: detect-changes
    runs-on: anzx-default
    outputs:
      result: ${{ steps.run-check.outputs.result }}
      skipped: ${{ steps.should-skip.outputs.skip }}
    steps:
      - name: Check if security check is needed
        id: should-skip
        run: |
          if [[ "${{ needs.detect-changes.outputs.security_needed }}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ No security-related files changed. Skipping security check."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo (shallow)
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Run Security Check
        if: steps.should-skip.outputs.skip == 'false'
        id: run-check
        run: |
          chmod +x ci/workflows-scripts/security-check.sh
          ci/workflows-scripts/security-check.sh "${{ needs.detect-changes.outputs.security_changed_files }}"

  sysl-check:
    needs: detect-changes
    runs-on: anzx-default
    outputs:
      result: ${{ steps.run-check.outputs.result }}
      skipped: ${{ steps.should-skip.outputs.skip }}
    steps:
      - name: Check if security check is needed
        id: should-skip
        run: |
          if [[ "${{ needs.detect-changes.outputs.sysl_needed }}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ No sysl-related files changed. Skipping sysl check."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo (shallow)
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Install node
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Run Sysl Check
        if: steps.should-skip.outputs.skip == 'false'
        id: run-check
        run: |
          chmod +x ci/workflows-scripts/sysl-check.sh
          ci/workflows-scripts/sysl-check.sh "${{ needs.detect-changes.outputs.sysl_changed_files }}"

  pmd:
    needs: detect-changes
    runs-on: anzx-default
    outputs:
      result: ${{ steps.run-check.outputs.result }}
      skipped: ${{ steps.should-skip.outputs.skip }}
    env:
      JAVA_URL: "https://artifactory.gcp.anz/artifactory/git-github/AdoptOpenJDK/openjdk11-binaries/releases/download/jdk-11.0.10%2B9/OpenJDK11U-jdk_x64_linux_hotspot_11.0.10_9.tar.gz"
      PMD_URL: "https://artifactory.gcp.anz/artifactory/github/pmd/pmd/releases/download/pmd_releases%2F7.2.0/pmd-dist-7.2.0-bin.zip"
    steps:
      - name: Check if pmd check is needed
        id: should-skip
        run: |
          if [[ "${{ needs.detect-changes.outputs.pmd_needed }}" != 'true' ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ No pmd-related files changed. Skipping pmd check."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo (shallow)
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Download Java
        if: steps.should-skip.outputs.skip == 'false'
        run: wget -O $RUNNER_TEMP/java_package.tar.gz "${{ env.JAVA_URL }}"

      - name: Setup Java
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/setup-java@v3
        with:
          distribution: "jdkfile"
          jdkFile: ${{ runner.temp }}/java_package.tar.gz
          java-version: "11.0.12"
          architecture: x64

      - name: Java settings
        if: steps.should-skip.outputs.skip == 'false'
        run: |
          echo $PATH
          echo $JAVA_HOME
          java -version
          export JAVA_HOME="/opt/jdk/jdk-11.0.12"
          export PATH="${JAVA_HOME}/bin:$PATH"

      - name: Install PMD
        if: steps.should-skip.outputs.skip == 'false'
        shell: bash
        run: |
          curl -o pmd.zip -OL "${{ env.PMD_URL }}"
          unzip pmd.zip
          chmod +x $GITHUB_WORKSPACE/pmd-bin-7.2.0/bin

      - name: Run PMD Check
        if: steps.should-skip.outputs.skip == 'false'
        id: run-check
        run: |
          chmod +x ci/workflows-scripts/pmd-check.sh
          ci/workflows-scripts/pmd-check.sh "${{ needs.detect-changes.outputs.pmd_changed_files }}"

      - name: "Cleaning"
        if: always()
        run: rm -rf ./tmpPMD ./pmdReport.html ./pmdValidationReport.html ./pmdWarningReport.html

  prettier:
    needs: detect-changes
    runs-on: anzx-default
    outputs:
      result: ${{ steps.run-check.outputs.result }}
      skipped: ${{ steps.should-skip.outputs.skip }}
    env:
      JAVA_URL: "https://artifactory.gcp.anz/artifactory/git-github/AdoptOpenJDK/openjdk11-binaries/releases/download/jdk-11.0.10%2B9/OpenJDK11U-jdk_x64_linux_hotspot_11.0.10_9.tar.gz"
    steps:
      - name: Check if prettier check is needed
        id: should-skip
        run: |
          if [[ "${{ needs.detect-changes.outputs.prettier_needed }}" != 'true' ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ No prettier-related files changed. Skipping prettier check."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo (shallow)
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Download Java
        if: steps.should-skip.outputs.skip == 'false'
        run: wget -O $RUNNER_TEMP/java_package.tar.gz "${{ env.JAVA_URL }}"

      - name: Setup Java
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/setup-java@v3
        with:
          distribution: "jdkfile"
          jdkFile: ${{ runner.temp }}/java_package.tar.gz
          java-version: "11.0.12"
          architecture: x64

      - name: Java settings
        if: steps.should-skip.outputs.skip == 'false'
        run: |
          echo $PATH
          echo $JAVA_HOME
          java -version
          export JAVA_HOME="/opt/jdk/jdk-11.0.12"
          export PATH="${JAVA_HOME}/bin:$PATH"

      - name: Install node
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install node packages
        if: steps.should-skip.outputs.skip == 'false'
        run: |
          mv ci.npmrc .npmrc
          npm ci -f

      - name: Run Prettier Check
        if: steps.should-skip.outputs.skip == 'false'
        id: run-check
        run: |
          chmod +x ci/workflows-scripts/prettier-check.sh
          ci/workflows-scripts/prettier-check.sh "${{ needs.detect-changes.outputs.prettier_changed_files }}"

      - name: Cleanup temp logs
        if: steps.should-skip.outputs.skip == 'false'
        run: |
          echo "🧹 Cleaning up temporary error logs..."
          rm -f $RUNNER_TEMP/*_error.log

  eslint:
    needs: detect-changes
    runs-on: anzx-default
    outputs:
      result: ${{ steps.run-check.outputs.result }}
      skipped: ${{ steps.should-skip.outputs.skip }}
    steps:
      - name: Check if eslint check is needed
        id: should-skip
        run: |
          if [[ "${{ needs.detect-changes.outputs.eslint_lwc_needed }}" != 'true' ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ No eslint-related files changed. Skipping eslint check."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo (shallow)
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Install node
        if: steps.should-skip.outputs.skip == 'false'
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install node packages
        if: steps.should-skip.outputs.skip == 'false'
        run: |
          mv ci.npmrc .npmrc
          npm ci -f

      - name: RUN ESLINT Check
        if: steps.should-skip.outputs.skip == 'false'
        shell: bash
        id: run-check
        run: |
          chmod +x ci/workflows-scripts/eslint-check.sh
          ci/workflows-scripts/eslint-check.sh "${{ needs.detect-changes.outputs.eslint_lwc_changed_files }}"

  aggregate-report:
    needs:
      - security-check
      - sysl-check
      - pmd
      - prettier
      - eslint
    runs-on: anzx-default
    if: ${{ always() && !cancelled() && needs.security-check.result != 'skipped' && needs.sysl-check.result != 'skipped' && needs.pmd.result != 'skipped' && needs.prettier.result != 'skipped' && needs.eslint.result != 'skipped' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repo (shallow)
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Setup GitHub CLI
        uses: anzx/github-reusable-actions/setup-gh-cli@main
        with:
          gh-cli-version: "2.50.0"

      - name: Post Aggregate Results Comment
        id: post-comment
        shell: bash
        run: |
          set -e
          # Prepare summary lines:
          echo "<h2>🚦 Quality Checks Summary</h2>" > summary.html
          echo "" >> summary.html

          # Load the reusable function
          chmod +x ci/workflows-scripts/report-check.sh
          source ci/workflows-scripts/report-check.sh

          # Collect outputs
          SECURITY_SKIPPED="${{ needs.security-check.outputs.skipped }}"
          SECURITY_RESULT="${{ needs.security-check.outputs.result }}"

          SYSL_SKIPPED="${{ needs.sysl-check.outputs.skipped }}"
          SYSL_RESULT="${{ needs.sysl-check.outputs.result }}"

          PMD_SKIPPED="${{ needs.pmd.outputs.skipped }}"
          PMD_RESULT="${{ needs.pmd.outputs.result }}"

          PRETTIER_SKIPPED="${{ needs.prettier.outputs.skipped }}"
          PRETTIER_RESULT="${{ needs.prettier.outputs.result }}"

          ESLINT_SKIPPED="${{ needs.eslint.outputs.skipped }}"
          ESLINT_RESULT="${{ needs.eslint.outputs.result }}"

          # Use the function
          report_check "PMD" "$PMD_SKIPPED" "$PMD_RESULT"
          report_check "Prettier" "$PRETTIER_SKIPPED" "$PRETTIER_RESULT"
          report_check "ESLint" "$ESLINT_SKIPPED" "$ESLINT_RESULT"
          report_check "Sysl" "$SYSL_SKIPPED" "$SYSL_RESULT"
          report_check "Security" "$SECURITY_SKIPPED" "$SECURITY_RESULT"

          # Post the comment
          existing_comment_id=$(gh pr view $PR_NUMBER --json comments --jq '.comments[] | select(.body | contains("🚦 Quality Checks Summary")) | .id' || echo "")

          if [[ -n "$existing_comment_id" ]]; then
            gh pr comment $PR_NUMBER --body-file "summary.html" --edit-last
          else
            gh pr comment $PR_NUMBER --body-file "summary.html"
          fi
