name: Salesforce Quick Deployment

on:
  workflow_call:
    inputs:
      sfdx_name:
        required: false
        description: "Secret Name as an Input"
        type: string
    secrets:
      token:
        required: true
        description: "Repo token"
      plugin-token:
        required: true
        description: "Plugin repo token"

permissions:
  contents: write
  id-token: write

jobs:
  Quick-Deployment:
    name: Quick Deployment ${{inputs.sfdx_name}}
    container:
      image: "salesforce-docker.artifactory.gcp.anz/salesforce-delegate:1.5.0"
      options: --user root
    runs-on: anzx-default-np
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "true"
          token: ${{ secrets.token }}
          path: salesforce

      - name: OIDC Authentication (Salesforce Harness Delegate Service Account)
        id: "authenticate-harness-delegate"
        uses: "anzx/github-reusable-actions/authenticate-gcp@main"
        with:
          service_account: "h-sf-primary-np@anz-x-bootstrap-np-487e09.iam.gserviceaccount.com"

      - name: ENV vars
        working-directory: salesforce
        run: |
          echo BASE_REF="${{ github.base_ref }}" >> $GITHUB_ENV
          echo BRANCH_NAME="${{ github.head_ref }}" >> $GITHUB_ENV
          echo PR_NUMBER="${{ github.event.number }}" >> $GITHUB_ENV
          echo RUN_ID="${GITHUB_RUN_ID}" >> $GITHUB_ENV
          echo WORKING_DIR="$(pwd)" >> $GITHUB_ENV
          echo REPO_NAME="${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo JOB_NAME="${{ inputs.sfdx_name }}" >> $GITHUB_ENV
          echo ARTIFACTORY_SECRET_NAME="sf-platform-np-artifact" >> $GITHUB_ENV
          echo WHICH_JOB="quickDeployment" >> $GITHUB_ENV

      - name: Find Secret Names
        working-directory: salesforce
        run: |
          sfdxURL="${{ inputs.sfdx_name }}"
          projectId=anz-x-bootstrap-np-487e09

          if [[ "$sfdxURL" == "" ]];then
            sfdxURL=$( node ci/workflows/Orchestrations/findSecret.mjs )
          fi

          if [[ "$sfdxURL" == "sf-platform-np-"* ]];then
            projectId=anz-x-gh-sf-nonprod-ea5caa
          fi

          echo "$sfdxURL"
          echo SECRET_NAME="$sfdxURL" >> $GITHUB_ENV
          echo PROJECT_ID="$projectId" >> $GITHUB_ENV

      - name: Retrieve GSM Credentials
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@main
        with:
          secrets: |-
            sfdxurl:projects/${{ env.PROJECT_ID }}/secrets/${{ env.SECRET_NAME }}/versions/latest
            artifactory:projects/anz-x-gh-sf-nonprod-ea5caa/secrets/${{ env.ARTIFACTORY_SECRET_NAME }}/versions/latest

      - name: Checkout salesforce-plugin repo
        uses: actions/checkout@v4
        with:
          repository: anzx/salesforce-plugin
          token: ${{ secrets.plugin-token }}
          path: salesforce-plugin

      - name: Install plugin
        working-directory: salesforce-plugin
        shell: bash
        run: |
          rm -rf node_modules && yarn install --frozen-lockfile
          yarn build
          sf plugins link .

      - name: Run Quick Deployment
        id: deployment
        working-directory: salesforce
        run: |
          node --no-warnings ci/workflows/Orchestrations/quickDeployment.mjs "${{ steps.secrets.outputs.sfdxurl }}" "${{ steps.secrets.outputs.artifactory }}"
          echo WHICH_JOB="quickClean" >> $GITHUB_ENV

      - name: Creating New Tag and Cleaning
        working-directory: salesforce
        run: |
          node --no-warnings ci/workflows/Orchestrations/quickDeployment.mjs

      - name: Publish Deployment Event
        if: always() && !cancelled() && steps.deployment.outcome != 'skipped'
        uses: anzx/github-reusable-actions/publish-deployment-event@main
        with:
          environment: "np"
          service_name: "salesforce"
          service_account: "h-sf-primary-np@anz-x-bootstrap-np-487e09.iam.gserviceaccount.com"
          event_status: ${{ steps.deployment.outcome }}
