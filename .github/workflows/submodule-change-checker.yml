name: Check Submodule Changes

on:
  pull_request:
    branches: [release, develop]
    types: [opened, synchronize, reopened]

jobs:
  check-submodule:
    runs-on: anzx-default
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Detect submodule changes in the PR
        id: diff
        run: |
          # Get base and head commit SHAs from the PR event payload
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"

          echo "Base ref: $BASE_REF"
          echo "Head ref: $HEAD_REF"

          # Find the common ancestor of base and head
          MERGE_BASE=$(git merge-base $BASE_REF $HEAD_REF)
          echo "Merge base: $MERGE_BASE"

          # Get list of changed files introduced by the PR
          changed_files=$(git diff --name-only $MERGE_BASE $HEAD_REF)

          echo "Changed files:"
          echo "$changed_files"

          # Get all submodule paths from .gitmodules
          submodule_paths=($(git config --file .gitmodules --get-regexp path | awk '{print $2}'))

          echo "Submodule paths:"
          printf '%s\n' "${submodule_paths[@]}"

          submodule_changed=''

          # Check if any changed file is a submodule pointer (top-level folder matches submodule path)
          for submodule_path in "${submodule_paths[@]}"; do
            if echo "$changed_files" | grep -q "^$submodule_path"; then
              echo "Submodule changed: $submodule_path"

              if [[ -z "$submodule_changed" ]]; then
                submodule_changed=$submodule_path
              else
                submodule_changed="$submodule_changed, $submodule_path"
              fi
            fi
          done
          echo "submodule_changed=$submodule_changed" >> "$GITHUB_OUTPUT"

      - name: "Install GH"
        if: ${{ steps.diff.outputs.submodule_changed != '' }}
        uses: "anzx/github-reusable-actions/setup-gh-cli@main"
        with:
          gh-cli-version: "2.50.0"

      - name: Send PR comment
        if: ${{ steps.diff.outputs.submodule_changed != '' }}
        run: |
          existing_comment_id=$(gh api repos/"$REPO"/issues/"$PR_NUMBER"/comments \
            --jq '.[] | select(.body | contains("🗂️ Submodule Change")) | .id')

          SUBMODULE_CHANGED="${{ steps.diff.outputs.submodule_changed }}"
          COMMENT="🗂️ Submodule Change Detected: $SUBMODULE_CHANGED"

          if [[ -n "$existing_comment_id" ]]; then
            echo "✅ Found existing comment. Editing PR comment..."
            gh api \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              /repos/"$REPO"/issues/comments/"$existing_comment_id" \
              -f body="$COMMENT"
          elif [[ "$SUBMODULE_CHANGED" != '' ]]; then
            gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
          fi
