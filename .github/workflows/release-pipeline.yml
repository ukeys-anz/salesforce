name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      NAME:
        description: "Release Name"
        required: true
        type: string

permissions:
  contents: "write"
  id-token: "write"

jobs:
  Release:
    container:
      image: "salesforce-docker.artifactory.gcp.anz/salesforce-delegate:1.5.0"
      options: --user root
      volumes:
        - ${{ github.workspace }}/release:/opt/harness-delegate/release
    runs-on: anzx-default
    concurrency:
      group: "salesforce-release-${{ github.event.inputs.NAME }}"
      cancel-in-progress: false
    name: "${{ matrix.config.DEPLOYMENT_TITLE }}"
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        config:
          - DEPLOYMENT_ENVIRONMENT: "prod-release-start"
            DEPLOYMENT_TITLE: "Stage 1: Preprod Deployment"
            PUBLISH_EVENT_ENV_NAME: "preprod"

          - DEPLOYMENT_ENVIRONMENT: "prod-validation"
            DEPLOYMENT_TITLE: "Stage 2: Prod Validation"
            PUBLISH_EVENT_ENV_NAME: ""

          - DEPLOYMENT_ENVIRONMENT: "prod-deployment"
            DEPLOYMENT_TITLE: "Stage 3: Prod Deployment"
            PUBLISH_EVENT_ENV_NAME: "prod"

    environment: "${{ matrix.config.DEPLOYMENT_ENVIRONMENT }}"
    env:
      SERVICE_ACCOUNT: "h-sf-primary-prod@anz-x-bootstrap-prod-3b7a6d.iam.gserviceaccount.com"
      RELEASE_NAME: "${{ github.event.inputs.NAME }}"
      ARTIFACTORY_SECRET_NAME: "sf-platform-prod-artifact"
      PREPROD_SECRET_NAME: "sf-platform-prod-preprod"
      PROD_CONSUMER_KEY_SECRET_NAME: "sf-platform-prod-ca-consumerkey"
      PROD_CERT_SECRET_NAME: "sf-platform-prod-cert"
      PREPROD_DEPLOYMENT_STEP: ${{ matrix.config.DEPLOYMENT_ENVIRONMENT == 'prod-release-start' }}
      PROD_VALIDATION_STEP: ${{ matrix.config.DEPLOYMENT_ENVIRONMENT == 'prod-validation' }}
      PROD_DEPLOYMENT_STEP: ${{ matrix.config.DEPLOYMENT_ENVIRONMENT == 'prod-deployment' }}
      PUBLISH_EVENT_ENV_NAME: ${{ matrix.config.PUBLISH_EVENT_ENV_NAME }}
      STAGE_NAME: ${{ matrix.config.DEPLOYMENT_ENVIRONMENT }}
      REPO_NAME: ${{ github.event.repository.name }}
      PROD_DEPLOY_USERNAME: "tech.gcb@anzx.com"
      PROD_URL: "https://anz.my.salesforce.com"

    steps:
      - name: Environment Varibales Debug
        run: |
          echo "DEBUG: PREPROD_DEPLOYMENT_STEP=${{ env.PREPROD_DEPLOYMENT_STEP }}"
          echo "DEBUG: PROD_VALIDATION_STEP=${{ env.PROD_VALIDATION_STEP }}"
          echo "DEBUG: PROD_DEPLOYMENT_STEP=${{ env.PROD_DEPLOYMENT_STEP }}"
          echo "DEBUG: STAGE_NAME=${{ env.STAGE_NAME }}"
          echo "DEBUG: REPO_NAME=${{ env.REPO_NAME }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "true"
          token: ${{ secrets.SALESFORCE_PROD_CHECKOUT_TOKEN }}
          path: salesforce

      - name: "OIDC Authentication (Salesforce Harness Delegate Service Account)"
        id: "authenticate-harness-delegate"
        uses: "anzx/github-reusable-actions/authenticate-gcp@main"
        with:
          service_account: "${{ env.SERVICE_ACCOUNT }}"

      - name: "Retrieve GSM Credentials"
        id: secrets
        uses: "google-github-actions/get-secretmanager-secrets@v1"
        with:
          secrets: |-
            preprod:projects/anz-x-gh-sf-prod-be3529/secrets/${{ env.PREPROD_SECRET_NAME }}/versions/latest
            prod-consumer-key:projects/anz-x-gh-sf-prod-be3529/secrets/${{ env.PROD_CONSUMER_KEY_SECRET_NAME }}/versions/latest
            prod-cert:projects/anz-x-gh-sf-prod-be3529/secrets/${{ env.PROD_CERT_SECRET_NAME }}/versions/latest
            artifactory:projects/anz-x-gh-sf-prod-be3529/secrets/${{ env.ARTIFACTORY_SECRET_NAME }}/versions/latest

      - name: Add Genral Secrets to ENV
        working-directory: salesforce
        run: |
          echo CLEANING_JOB="false" >> $GITHUB_ENV
          echo WORKING_DIR="$(pwd)" >> $GITHUB_ENV
          lastTag="$( git describe --abbrev=0 --tags --match master* )"
          echo BASE_REF_LAST_TAG="$lastTag" >> $GITHUB_ENV

      - name: Checkout salesforce-plugin repo
        uses: actions/checkout@v4
        with:
          repository: anzx/salesforce-plugin
          token: ${{ secrets.SALESFORCE_PROD_PLUGIN_TOKEN }}
          path: salesforce-plugin

      - name: Install plugin
        working-directory: salesforce-plugin
        shell: bash
        run: |
          rm -rf node_modules && yarn install --frozen-lockfile
          yarn build
          sf plugins link .

      - name: Run ${{ matrix.config.DEPLOYMENT_ENVIRONMENT }}
        id: deployment
        working-directory: salesforce
        run: |
          node --no-warnings ci/workflows/Orchestrations/release.mjs "${{ steps.secrets.outputs.preprod }}" "${{ steps.secrets.outputs.prod-consumer-key }}" "${{ steps.secrets.outputs.prod-cert }}" "${{ steps.secrets.outputs.artifactory }}"
          echo CLEANING_JOB="true" >> $GITHUB_ENV

      - name: Cleaning | Create Tag
        working-directory: salesforce
        run: |
          node --no-warnings ci/workflows/Orchestrations/release.mjs "${{ steps.secrets.outputs.preprod }}" "${{ steps.secrets.outputs.prod-consumer-key }}" "${{ steps.secrets.outputs.prod-cert }}" "${{ steps.secrets.outputs.artifactory }}"

      - name: Publish Deployment Event
        if: ${{ always() && !cancelled() && steps.deployment.outcome != 'skipped' && env.PUBLISH_EVENT_ENV_NAME != '' }}
        uses: anzx/github-reusable-actions/publish-deployment-event@main
        with:
          environment: "${{ env.PUBLISH_EVENT_ENV_NAME }}"
          service_name: "salesforce"
          service_account: "${{ env.SERVICE_ACCOUNT }}"
          event_status: ${{ steps.deployment.outcome }}

  Cleanup:
    name: "Cleanup"
    runs-on: anzx-default
    needs: [Release]
    if: failure() || always()
    steps:
      - name: Cleanup build artifacts
        id: cleanup
        run: |
          if [ -d "${{ github.workspace }}/release" ]; then
            rm -rf "${{ github.workspace }}/release"
          fi

  upload_bq_prod_schema_changes:
    uses: ./.github/workflows/bq-upload-object-changes.yaml
    needs: [Release]
    secrets: inherit
    with:
      prod_deployment: true

  update-sdva:
    runs-on: anzx-default
    needs: [Release]
    outputs:
      last_tag: ${{ steps.info.outputs.last_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest master tag
        id: info
        run: |
          lastTag="$( git describe --abbrev=0 --tags --match 'master*' )"
          echo "Last tag: $lastTag"
          echo "last_tag=$lastTag" >> $GITHUB_OUTPUT

      - name: update-plat-app-versions
        if: ${{ success() }}
        uses: anzx/sec-domain-actions/publish-app-scm-version@main
        with:
          repo: ${{ github.repository }}
          asset: salesforce
          component: salesforce
          env: prod
          release-tag-or-sha: ${{ steps.info.outputs.last_tag }}
          use-gh-token-vending: true
          app-repo-token: ${{ secrets.GITHUB_TOKEN }}
