<template>
  <ul class="slds-timeline">
    <template if:true={releases}>
      <template for:each={releases} for:item="release">
        <div class="slds-media" key={release.Id}>
          <div class="slds-media__body">
            <div
              class="slds-grid slds-grid_vertical-align-center slds-truncate_container_75 slds-no-space"
            >
              <h3 class="slds-truncate" title="Release Name Goes Here">
                <a href="javascript:void(0);">
                  <strong>Release - {release.Name}</strong>
                </a>
              </h3>
            </div>
            <div class="slds-timeline__actions slds-timeline__actions_inline">
              <p class="slds-timeline__date">{release.Release_Date__c}</p>
            </div>

            <template if:true={release.Additions__c}>
              <article
                class="slds-box new-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                aria-hidden="false"
              >
                <div>
                  <span class="slds-text-title new-text-title">New</span>
                  <ul class="slds-list_dotted">
                    <template
                      for:each={release.Additions__c}
                      for:item="addition"
                    >
                      <li key={addition} class="slds-p-top_x-small">
                        {addition}
                      </li>
                    </template>
                  </ul>
                </div>
              </article>
            </template>

            <template if:true={release.Changes__c}>
              <article
                class="slds-box change-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                aria-hidden="false"
              >
                <div>
                  <span class="slds-text-title change-text-title">Changes</span>
                  <ul class="slds-list_dotted">
                    <template for:each={release.Changes__c} for:item="change">
                      <li key={change} class="slds-p-top_x-small">{change}</li>
                    </template>
                  </ul>
                </div>
              </article>
            </template>

            <template if:true={release.Fixes__c}>
              <article
                class="slds-box fix-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                aria-hidden="false"
              >
                <div>
                  <span class="slds-text-title fix-text-title">Fixes</span>
                  <ul class="slds-list_dotted">
                    <template for:each={release.Fixes__c} for:item="fix">
                      <li key={fix} class="slds-p-top_x-small">{fix}</li>
                    </template>
                  </ul>
                </div>
              </article>
            </template>
          </div>
        </div>
      </template>
    </template>
  </ul>
</template>
