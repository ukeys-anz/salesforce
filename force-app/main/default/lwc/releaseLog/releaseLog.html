<template>
  <div class="slds-box slds-theme_default">
    <template if:false={releases}>
      <strong data-id="no-release">No releases</strong>
    </template>
    <template if:true={releases}>
      <template for:each={releases} for:item="release">
        <div class="slds-media" key={release.Id}>
          <div class="slds-media__body">
            <div
              class="slds-grid slds-grid_vertical-align-center slds-no-space"
            >
              <h3
                class="slds-truncate"
                data-id="release-heading"
                title={release.Name}
              >
                <template if:true={release.Release_Notes__c}>
                  <a href={release.Release_Notes__c} target="_blank">
                    <strong data-id="release-name">{release.Name}</strong>
                  </a>
                </template>
                <template if:false={release.Release_Notes__c}>
                  <strong>{release.Name}</strong>
                </template>
              </h3>
              <strong style="margin-left: auto"
                >Version: {release.Version__c}</strong
              >
            </div>
            <div class="slds-timeline__actions slds-timeline__actions_inline">
              <p class="slds-timeline__date" style="margin-left: auto">
                {release.Release_Date__c}
              </p>
            </div>

            <template if:true={release.Additions__c}>
              <div class="slds-grid">
                <div class="log-container">
                  <article
                    class="new-box slds-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                    aria-hidden="false"
                  >
                    <div class="container">
                      <div class="change-type">
                        <span class="slds-badge slds-theme_success">New</span>
                      </div>
                      <div class="horizontal-line-new">
                        <hr class="slds-theme_success" />
                      </div>
                    </div>
                    <div>
                      <ul data-id="release-additions" class="slds-list_dotted">
                        <template
                          for:each={release.Additions__c}
                          for:item="addition"
                        >
                          <li key={addition} class="slds-p-top_x-small">
                            {addition}
                          </li>
                        </template>
                      </ul>
                    </div>
                  </article>
                </div>
              </div>
            </template>

            <template if:true={release.Changes__c}>
              <div data-id="release-changes" class="slds-grid">
                <div class="log-container">
                  <article
                    class="change-box slds-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                    aria-hidden="false"
                  >
                    <div class="container">
                      <div class="change-type">
                        <span class="slds-badge slds-theme_warning"
                          >Changes</span
                        >
                      </div>
                      <div class="horizontal-line-change">
                        <hr class="slds-theme_warning" />
                      </div>
                    </div>
                    <div>
                      <ul class="slds-list_dotted">
                        <template
                          for:each={release.Changes__c}
                          for:item="change"
                        >
                          <li key={change} class="slds-p-top_x-small">
                            {change}
                          </li>
                        </template>
                      </ul>
                    </div>
                  </article>
                </div>
              </div>
            </template>

            <template if:true={release.Fixes__c}>
              <div class="slds-grid">
                <div class="log-container">
                  <article
                    class="fix-box slds-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                    aria-hidden="false"
                  >
                    <div class="container">
                      <div class="change-type">
                        <span class="slds-badge slds-badge_inverse">Fixes</span>
                      </div>
                      <div class="horizontal-line-fix">
                        <hr class="slds-badge_inverse" />
                      </div>
                    </div>
                    <div>
                      <ul data-id="release-fixes" class="slds-list_dotted">
                        <template for:each={release.Fixes__c} for:item="fix">
                          <li key={fix} class="slds-p-top_x-small">{fix}</li>
                        </template>
                      </ul>
                    </div>
                  </article>
                </div>
              </div>
            </template>

            <template if:true={release.Release_Image__c}>
              <div class="slds-grid">
                <div class="log-container">
                  <article
                    class="image-box slds-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                    aria-hidden="false"
                  >
                    <div>
                      <img
                        data-id="release-image"
                        class="release-image"
                        alt="Release Image"
                        src={release.Release_Image__c}
                      />
                    </div>
                  </article>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
      <template if:true={loadMore}>
        <button
          class="slds-button slds-button_brand slds-button_stretch"
          onclick={loadRecords}
          style="margin-top: 50px"
          data-id="load-more-button"
        >
          Load More
        </button>
      </template>
    </template>
  </div>
</template>
