<template>
  <ul class="slds-timeline">
    <template if:true={releases}>
      <template for:each={releases} for:item="release">
        <div class="slds-media" key={release.Id}>
          <div class="slds-media__body">
            <div
              class="slds-grid slds-grid_vertical-align-center slds-truncate_container_75 slds-no-space"
            >
              <h3 class="slds-truncate" title={release.Name}>
                <strong>Release - {release.Name}</strong>
                <template if:true={release.Release_Notes__c}>
                  <a href={release.Release_Notes__c}>
                    <span
                      class="slds-icon_container "
                      title="Change log details"
                    >
                      <svg
                        class="slds-icon slds-icon-text-default"
                        aria-hidden="true"
                      >
                        <use
                          xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#link"
                        ></use>
                      </svg>
                      <span class="slds-assistive-text">Change log</span>
                    </span>
                  </a>
                </template>
              </h3>
              <strong style="float: right;"
                >Version: {release.Version__c}</strong
              >
            </div>
            <div class="slds-timeline__actions slds-timeline__actions_inline">
              <p class="slds-timeline__date">{release.Release_Date__c}</p>
            </div>

            <template if:true={release.Additions__c}>
              <div class="slds-grid">
                <div
                  class="slds-col slds-size_1-of-1 lds-medium-size_1-of-5 slds-large-size_1-of-5"
                >
                  <!-- <span class="slds-badge slds-theme_success">New</span> -->
                </div>
                <div
                  class="slds-col slds-size_1-of-1 slds-medium-size_4-of-5 slds-large-size_4-of-5"
                >
                  <article
                    class="new-box slds-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                    aria-hidden="false"
                  >
                    <div class="container">
                      <div class="change-type">
                        <span class="slds-badge slds-theme_success">New</span>
                      </div>
                      <div class="horizontal-line">
                        <hr class="slds-theme_success" />
                      </div>
                    </div>
                    <div>
                      <ul class="slds-list_dotted">
                        <template
                          for:each={release.Additions__c}
                          for:item="addition"
                        >
                          <li key={addition} class="slds-p-top_x-small">
                            {addition}
                          </li>
                        </template>
                      </ul>
                    </div>
                  </article>
                </div>
              </div>
            </template>

            <template if:true={release.Changes__c}>
              <div class="slds-grid">
                <div
                  class="slds-col slds-size_1-of-1 lds-medium-size_1-of-5 slds-large-size_1-of-5"
                ></div>
                <div
                  class="slds-col slds-size_1-of-1 slds-medium-size_4-of-5 slds-large-size_4-of-5"
                >
                  <article
                    class="change-box slds-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                    aria-hidden="false"
                  >
                    <div class="container">
                      <div class="change-type">
                        <span class="slds-badge slds-theme_warning"
                          >Changes</span
                        >
                      </div>
                      <div class="horizontal-line">
                        <hr class="slds-theme_warning" />
                      </div>
                    </div>
                    <div>
                      <ul class="slds-list_dotted">
                        <template
                          for:each={release.Changes__c}
                          for:item="change"
                        >
                          <li key={change} class="slds-p-top_x-small">
                            {change}
                          </li>
                        </template>
                      </ul>
                    </div>
                  </article>
                </div>
              </div>
            </template>

            <template if:true={release.Fixes__c}>
              <div class="slds-grid">
                <div
                  class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5 slds-large-size_1-of-5"
                ></div>
                <div
                  class="slds-col slds-size_1-of-1 slds-medium-size_4-of-5 slds-large-size_4-of-5"
                >
                  <article
                    class="fix-box slds-box slds-timeline__item_details slds-m-top_x-small slds-m-horizontal_xx-small slds-p-around_medium"
                    aria-hidden="false"
                  >
                    <div class="container">
                      <div class="change-type">
                        <span class="slds-badge slds-badge_inverse">Fixes</span>
                      </div>
                      <div class="horizontal-line">
                        <hr class="slds-badge_inverse" />
                      </div>
                    </div>
                    <div>
                      <ul class="slds-list_dotted">
                        <template for:each={release.Fixes__c} for:item="fix">
                          <li key={fix} class="slds-p-top_x-small">{fix}</li>
                        </template>
                      </ul>
                    </div>
                  </article>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </template>
  </ul>
</template>
