<template>
  <template lwc:if={loading}>
    <article class="financialAccountcards slds-card">
      <div
        class="slds-align_absolute-center"
        style="height: 30rem"
        data-id="loading-spinner"
      >
        <div role="status" class="slds-spinner_inline">
          <lightning-spinner
            alternative-text="Loading"
            variant="brand"
          ></lightning-spinner>
        </div>
      </div>
    </article>
  </template>
  <template lwc:else>
    <div class="slds-grid slds-wrap">
      <div class="slds-col slds-grid slds-size_1-of-1">
        <div class="slds-grid slds-wrap slds-size_1-of-1">
          <div
            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-right_xx-small"
          >
            <c-financial-account
              account-type="checking"
              record-id={recordId}
              account-details={accountData.checking}
              data-id="checking-account"
              data-test-id="checking-account"
              ocv-id={ocvId}
            ></c-financial-account>

            <div class="slds-m-top_medium"></div>
            <c-home-loan-account
              record-id={recordId}
              object-api-name={objectApiName}
              account-details={loanData}
              data-id="home-account"
              offset-details={offsetData}
            ></c-home-loan-account>
          </div>
          <div
            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-left_xx-small"
          >
            <c-financial-account
              account-type="savings"
              record-id={recordId}
              account-details={accountData.savings}
              savings-jar={savingsJar}
              data-id="savings-account"
              data-test-id="savings-account"
              ocv-id={ocvId}
            ></c-financial-account>
            <div class="slds-m-top_medium"></div>
            <template lwc:if={isS2AccountExist}>
              <c-financial-account
                account-type="savingss2"
                record-id={recordId}
                account-details={accountData.savingss2}
                savings-jar={savingsJar}
                data-id="savingss2-account"
                data-test-id="savingss2-account"
                ocv-id={ocvId}
              ></c-financial-account>
              <div class="slds-m-top_medium"></div>
            </template>
            <c-financial-goals-person-account
              goal-data={goalDetails}
              savings-account={savingsId}
              error={goalError}
            >
            </c-financial-goals-person-account>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
