<template>
  <article class="slds-card slds-m-bottom_small slds-text-align_center">
    <template if:true={displayContent}>
      <button
        class="slds-button"
        onclick={refreshData}
        data-id="refresh"
        data-test-id="refresh-button"
      >
        Refresh Balances
      </button>
    </template>
    <template if:false={displayContent}>
      <p class="grey">Refresh Balances</p>
    </template>
  </article>
  <template if:false={loading}>
    <c-total-balance
      record-id={recordId}
      total-balance={totalBalance}
      total-saved={totalSaved}
      error={totalBalanceError}
      data-id="total-balance"
    ></c-total-balance>

    <div class="slds-m-top_small"></div>

    <c-financial-account
      account-type="checking"
      record-id={recordId}
      account-details={accountData.checking}
      data-id="checking-account"
      data-test-id="checking-account"
    ></c-financial-account>

    <div class="slds-m-top_small"></div>

    <c-financial-account
      account-type="savings"
      record-id={recordId}
      account-details={accountData.savings}
      savings-jar={savingsJar}
      data-id="savings-account"
      data-test-id="savings-account"
    ></c-financial-account>

    <div class="slds-m-top_small"></div>
    <c-financial-goals-person-account
      goal-data={goalDetails}
      savings-account={savingsId}
      error={goalError}
    >
    </c-financial-goals-person-account>

    <div class="slds-m-top_small"></div>
    <c-home-loan-account
      record-id={recordId}
      object-api-name={objectApiName}
      account-details={loanData}
    ></c-home-loan-account>
  </template>
  <template if:true={loading}>
    <div
      class="slds-align_absolute-center"
      style="height: 4rem"
      data-id="loading-spinner"
    >
      <div role="status" class="slds-spinner_inline">
        <lightning-spinner
          alternative-text="Loading"
          variant="brand"
        ></lightning-spinner>
      </div>
    </div>
  </template>
</template>
