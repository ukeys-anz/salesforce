<template>
  <template lwc:if={loading}>
    <article class="financialAccountcards slds-card">
      <div
        class="slds-align_absolute-center"
        style="height: 30rem"
        data-id="loading-spinner"
      >
        <div role="status" class="slds-spinner_inline">
          <lightning-spinner
            alternative-text="Loading"
            variant="brand"
          ></lightning-spinner>
        </div>
      </div>
    </article>
  </template>
  <template lwc:else>
    <div class="slds-grid slds-wrap">
      <div class="slds-col slds-grid slds-size_1-of-1">
        <div class="slds-grid slds-wrap slds-size_1-of-1">
          <div
            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-right_xx-small"
          >
            <template
              for:each={processedAccounts}
              for:item="eachGroupedAccount"
            >
              <div key={eachGroupedAccount.productCode}>
                <template lwc:if={eachGroupedAccount.isOthers}>
                  <c-financial-account
                    record-id={recordId}
                    account-details={eachGroupedAccount.accounts}
                    data-id="other-account"
                    data-test-id="other-account"
                    ocv-id={ocvId}
                    component-title={eachGroupedAccount.sectionHeaderTitle}
                    component-sub-title={eachGroupedAccount.productNameTitle}
                    balance-title={eachGroupedAccount.balanceTitle}
                    title-icon="custom:custom51"
                    icon-color="slds-m-right_small"
                    product-code={eachGroupedAccount.productCode}
                  ></c-financial-account>
                </template>
              </div>
            </template>

            <template lwc:if={hasHomeLoan}>
              <c-home-loan-account
                record-id={recordId}
                object-api-name={objectApiName}
                account-details={homeLoanAccounts}
                data-id="home-account"
                offset-details={offsetData}
              ></c-home-loan-account>
            </template>
          </div>

          <div
            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-left_xx-small"
          >
            <template
              for:each={processedAccounts}
              for:item="eachGroupedAccount"
            >
              <div key={eachGroupedAccount.productCode}>
                <template lwc:if={eachGroupedAccount.isSaving}>
                  <c-financial-account
                    record-id={recordId}
                    account-details={eachGroupedAccount.accounts}
                    data-id="savings-account"
                    data-test-id="savings-account"
                    ocv-id={ocvId}
                    component-title={eachGroupedAccount.sectionHeaderTitle}
                    component-sub-title={eachGroupedAccount.productNameTitle}
                    balance-title={eachGroupedAccount.balanceTitle}
                    title-icon="custom:custom17"
                    icon-color="slds-m-right_small cicon"
                    product-code={eachGroupedAccount.productCode}
                  ></c-financial-account>
                </template>
              </div>
            </template>

            <div class="slds-m-top_medium"></div>

            <template lwc:if={isSavingAccountExist}>
              <c-financial-goals-person-account
                goal-data={goalDetails}
                error={goalError}
              >
              </c-financial-goals-person-account>
            </template>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
