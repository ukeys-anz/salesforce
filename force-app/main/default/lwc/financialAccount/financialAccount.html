<template>
  <article class="financialAccountCardSize slds-card">
    <h1 class="card-title" data-id="component-title">
      <lightning-icon
        icon-name={titleIcon}
        size="medium"
        class={iconColor}
      ></lightning-icon>
      {componentTitle}
    </h1>
    <template lwc:if={displayContent}>
      <template lwc:if={hasAccountDetails}>
        <template for:each={accountDetails} for:item="finAccount">
          <div class="dividerTop" key={finAccount.Id}></div>
          <div
            class="slds-card__body slds-card__body_inner"
            key={finAccount.Id}
            data-id="fin-account"
          >
            <article class="slds-card">
              <div class="slds-grid slds-p-around_xx-small">
                <header class="slds-has-flexi-truncate">
                  <h2 class="card-heading-bold">
                    <a
                      onclick={navigateToRecordViewPage}
                      data-id={finAccount.Id}
                      data-ownership={finAccount.showMultipartyBadge}
                      class="slds-truncate"
                      title={finAccount.Name}
                    >
                      <span>{finAccount.Name}</span>
                    </a>
                    <template lwc:if={finAccount.showMultipartyBadge}>
                      <span class="slds-badge dormantBadgeClass"
                        >{finAccount.multiParty}</span
                      >
                    </template>
                  </h2>
                </header>
              </div>
              <div class="slds-grid slds-wrap">
                <div class="slds-col slds-grid slds-size_1-of-1">
                  <div class="slds-grid slds-wrap slds-size_1-of-1">
                    <div
                      class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                    >
                      <div class="header-column">
                        <p class="card-heading-font">Account Number</p>
                        <p class="card-heading-value">
                          {finAccount.FinServ__FinancialAccountNumber__c}
                        </p>
                      </div>
                    </div>
                    <div
                      class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small slds-text-align_right"
                    >
                      <div class="header-column">
                        <p class="card-heading-font">
                          {balanceTitle}
                          <lightning-icon
                            icon-name="utility:info"
                            size="xx-small"
                            class="tooltip"
                            onclick={handleInfoModal}
                          ></lightning-icon>
                        </p>
                        <p data-test-id="balance">
                          <lightning-formatted-number
                            value={finAccount.FinServ__Balance__c}
                            format-style="currency"
                            data-id="amount"
                            class="fontstyle"
                          ></lightning-formatted-number>
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          </div>
        </template>
      </template>
      <template lwc:else>
        <div
          class="slds-card__body slds-card__body_inner emptyCard slds-text-align_center"
          data-id="fin-account"
        >
          All accounts closed - no longer a customer
        </div>
      </template>
      <footer class="slds-card__footer account-footer">
        <div class="lastUpdated" data-test-id="last-updated-time">
          Last Updated {timestamp}
        </div>
      </footer>
    </template>
    <template lwc:else>
      <div class="slds-grid">
        <p class="message-padding">
          Don’t worry, it’s not broken. To view this you need a higher
          permission level.
        </p>
      </div>
    </template>
  </article>
  <template lwc:if={showInfoModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header modal-header">
          <lightning-icon
            icon-name="utility:close"
            onclick={handleInfoModal}
            class="slds-button slds-button_icon slds-modal__close close-modal"
          ></lightning-icon>
          <h2 class="slds-modal__title slds-hyphenate">
            What does {balanceTitle} mean?
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <span>
            <p class="slds-text-title_bold">
              The amount shown is indicative of the amount you may be able to
              use but may not be what is actually available.
            </p>
            <br />
            The amount shown is indicative of the amount you may be able to use
            in your {productTitle} account. This amount, when shown at an ATM or
            on a receipt, may have a different label such as 'Funds' or
            'Balance'. Regardless, the amount shown may not be what is actually
            available because:
            <ul class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium">
              <li>
                some transactions may not have updated the amount shown (e.g.
                reversals)
              </li>
              <li>
                some transactions may have updated the amount shown but are not
                yet fully processed (e.g. pending transactions)
              </li>
              <li>
                we may not process transactions at the time, on the day or in
                the order that they are made, and/or
              </li>
              <li>
                some transactions may have been processed and updated the amount
                shown, but are later adjusted.
              </li>
            </ul>
            If you proceed with a transaction when there may be insufficient
            funds, your account may go overdrawn or the transaction may be
            declined.
          </span>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleInfoModal}
          >
            Close
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
