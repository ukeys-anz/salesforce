<template>
  <!-- Header Label -->
  <template lwc:if={label}>
    <label class="slds-form-element__label">
      <abbr class="slds-required" title="required">*</abbr>{label}</label
    >
    <lightning-helptext
      content="Select each account relating to this issue – you can select multiple accounts. If the issue does not relate to any account, select ‘N/A'"
    >
    </lightning-helptext>
  </template>
  <div class="slds-combobox_container">
    <div
      class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open"
      aria-expanded="true"
      aria-haspopup="listbox"
      role="combobox"
    >
      <!-- Search Input-->
      <div
        class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
        role="none"
      >
        <lightning-input
          disabled={disabled}
          class="inputBox .slds-form-element_readonly"
          placeholder="Select an Option"
          onblur={blurEvent}
          onclick={showOptions}
          onkeydown={showOptionsKey}
          value={searchString}
          label=""
          variant="label-hidden"
          id="combobox-id-1"
        ></lightning-input>
        <lightning-icon
          class="slds-input__icon"
          icon-name="utility:down"
          size="x-small"
          alternative-text="search"
        ></lightning-icon>
      </div>
      <!-- Dropdown List -->
      <template lwc:if={showDropdown}>
        <div
          id="listbox-id-1"
          class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid multiDropDown"
        >
          <ul
            class="slds-listbox slds-listbox_vertical recordListBox"
            role="presentation"
          >
            <template lwc:if={message}>
              <li class="slds-listbox__item">
                <span
                  class="slds-media slds-listbox__option_entity verticalAlign slds-truncate"
                  >{message}</span
                >
              </li>
            </template>
            <template lwc:else>
              <template for:each={optionData} for:item="option">
                <template lwc:if={option.isVisible}>
                  <li
                    key={option.value}
                    data-id={option.value}
                    onmousedown={selectItem}
                    class={option.background}
                  >
                    <template lwc:if={option.selected}>
                      <lightning-icon
                        icon-name="utility:check"
                        size="x-small"
                        alternative-text="icon"
                      ></lightning-icon>
                    </template>
                    <span
                      class="slds-media slds-listbox__option_entity verticalAlign slds-truncate"
                      >{option.label}</span
                    >
                  </li>
                </template>
              </template>
            </template>
          </ul>
        </div>
      </template>
    </div>
  </div>
  <template lwc:if={disabled}>
    <label class="slds-form-element__label">
      All accounts have been automatically selected</label
    >
  </template>
  <template lwc:else>
    <!-- Multi Select Pills -->
    <template for:each={optionData} for:item="option">
      <template lwc:if={option.selected}>
        <lightning-pill
          key={option.value}
          class="slds-m-around_xx-small"
          name={option.value}
          label={option.label}
          onremove={removePill}
        ></lightning-pill>
      </template>
    </template>
  </template>
</template>
