<template>
  <template if:true={loading}>
    <article class="slds-card slds-m-bottom_small">
      <div class="slds-align_absolute-center" style="height: 4rem">
        <div role="status" class="slds-spinner_inline">
          <lightning-spinner
            alternative-text="Loading"
            variant="brand"
          ></lightning-spinner>
        </div>
      </div>
    </article>
  </template>

  <template if:false={loading}>
    <template if:true={hasError}>
      <template if:true={hasPermissionIssue}>
        <c-error permission-issue={hasPermissionIssue}></c-error>
      </template>
      <template if:false={hasPermissionIssue}>
        <c-error message={errorMsg}></c-error>
      </template>
    </template>

    <template if:false={hasError}>
      <div class="slds-m-bottom_xx-small">
        <lightning-card>
          <h1 class="card-title">
            <lightning-icon
              icon-name="custom:custom40"
              size="small"
              class="slds-m-right_small"
            ></lightning-icon>
            Card Details
          </h1>
          <template if:true={showFetch}>
            <lightning-button
              label="Get Card Details"
              onclick={getCardDetails}
              slot="actions"
              data-id="get-cards-button"
            ></lightning-button>

            <div class="slds-card__body slds-card__body_inner">
              <div class="slds-col slds-size_1-of-3">
                <img
                  src={defaultImage}
                  class="slds-carousel__image slds-carousel__image"
                />
              </div>
            </div>
          </template>

          <template if:true={noCards}>
            <article class="slds-card">
              <h1 class="slds-card__header-title main-title">
                <span>No cards available on account</span>
              </h1>
            </article>
          </template>

          <template if:true={showDetails}>
            <template if:true={showExpandCollapse}>
              <lightning-button
                label={collapseExpandText}
                slot="actions"
                onclick={handleViewAll}
                data-id="collapse-expand-button"
              ></lightning-button>
            </template>

            <template for:each={cardDetails} for:item="card">
              <div
                class="slds-m-bottom_xx-small slds-border_top"
                key={card.name}
              >
                <lightning-card>
                  <div class="buttonsContainer">
                    <template
                      if:true={card.buttons}
                      for:each={card.buttons}
                      for:item="btn"
                    >
                      <lightning-button
                        key={btn.label}
                        class="btn"
                        label={btn.label}
                        slot="actions"
                        data-button="card-button"
                        data-card-number={card.tokenizedCardNumber}
                        disabled={btn.disable}
                        onclick={handleActionAccordingClickedButton}
                        variant={btn.variant}
                      >
                      </lightning-button>
                    </template>
                  </div>

                  <div
                    class="slds-card__body slds-card__body_inner"
                    data-id="loaded-card-details"
                  >
                    <article class="card-container">
                      <div class="cardDetail">
                        <div class="slds-col slds-size_1-of-3">
                          <img src={card.image} class="slds-carousel__image" />
                        </div>

                        <div class="slds-col slds-size_1-of-3">
                          <div class="slds-col slds-size_1-of-1">
                            <div class="slds-p-bottom_medium">
                              <p class="slds-text-title_bold">Cardholder</p>
                              <p class="slds-text-body_regular">{card.name}</p>
                            </div>
                          </div>

                          <div class="slds-col slds-size_1-of-1">
                            <div class="slds-p-bottom_medium">
                              <p class="slds-text-title_bold">Last 4 Digits</p>
                              <p class="slds-text-body_regular">
                                {card.last4Digits}
                              </p>
                            </div>
                          </div>

                          <div class="slds-col slds-size_1-of-1">
                            <div class="slds-p-bottom_medium dig-wallet">
                              <p class="slds-text-title_bold">Digital Wallet</p>
                              <template if:true={card.hasWallet}>
                                <template
                                  for:each={card.walletList}
                                  for:item="wallet"
                                >
                                  <p
                                    class="slds-text-body_regular wallet-detail"
                                    key={wallet}
                                  >
                                    {wallet}
                                  </p>
                                </template>
                              </template>
                              <template if:false={card.hasWallet}>
                                <p class="slds-text-body_regular">N/A</p>
                              </template>
                            </div>
                            <div class="slds-col slds-size_1-of-1">
                              <div class="slds-p-bottom_medium">
                                <p class="slds-text-title_bold">
                                  Digital Wallet
                                </p>
                                <template if:true={card.hasWallet}>
                                  <template
                                    for:each={card.walletList}
                                    for:item="wallet"
                                  >
                                    <p
                                      class="slds-text-body_regular"
                                      key={wallet}
                                    >
                                      {wallet}
                                    </p>
                                  </template>
                                </template>
                                <template if:false={card.hasWallet}>
                                  <p class="slds-text-body_regular">N/A</p>
                                </template>
                              </div>
                            </div>
                          </div>
                        </div>

                        <div class="slds-col slds-size_1-of-3">
                          <div class="slds-col slds-size_1-of-1">
                            <div class="slds-p-bottom_medium">
                              <p class="slds-text-title_bold">Expiry Date</p>
                              <p class="slds-text-body_regular">
                                {card.expiryDate}
                              </p>
                            </div>
                          </div>

                          <div class="slds-col slds-size_1-of-1">
                            <div class="slds-p-bottom_medium">
                              <p class="slds-text-title_bold">
                                Status
                                <template if:true={card.isLocked}>
                                  <lightning-helptext
                                    class="tooltip"
                                    content="Coaches don't have the ability to remove a temporary lock. Customers can unlock their card anytime on their mobile app."
                                  ></lightning-helptext>
                                </template>
                              </p>
                              <p class="slds-text-body_regular status">
                                {card.statusToShow}
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </article>
                  </div>
                </lightning-card>
              </div>
            </template>

            <template if:true={showLock}>
              <c-card-temp-lock
                show-modal={showLock}
                card-number={tokenizedCardNumber}
                record-id={recordId}
              ></c-card-temp-lock>
            </template>

            <template if:true={showReplace}>
              <c-replace-card
                show-modal={showReplace}
                card-number={tokenizedCardNumber}
                record-id={recordId}
                replace-lost-unavailable={replaceLostUnavailable}
                replace-stolen-unavailable={replaceStolenUnavailable}
                replace-damaged-unavailable={replaceDamagedUnavailable}
                replace-lock-unavailable={replaceLockUnavailable}
              ></c-replace-card>
            </template>

            <template if:true={showFraudLock}>
              <c-card-fraud-lock
                card-status={cardFraudLockStatus}
                show-modal={showFraudLock}
                card-number={tokenizedCardNumber}
                record-id={recordId}
                button-clicked={buttonClicked}
                last-4-digits={last4Digits}
                onstatuschange={changeStatusHadnler}
              ></c-card-fraud-lock>
            </template>
          </template>

          <template if:true={showViewAllButton}>
            <button
              class="slds-button slds-align_absolute-center"
              onclick={handleViewAll}
              data-id="load-more-button"
            >
              Load More
            </button>
          </template>
        </lightning-card>
      </div>
    </template>
  </template>
</template>
