<template>
  <template if:true={loading}>
    <div class="slds-align_absolute-center" style="height: 4rem">
      <div role="status" class="slds-spinner_inline">
        <lightning-spinner
          alternative-text="Loading"
          variant="brand"
        ></lightning-spinner>
      </div>
    </div>
  </template>
  <template if:false={loading}>
    <article class="goals slds-card">
      <div class="slds-card__header slds-grid">
        <header class="slds-has-flexi-truncate">
          <h1 class="slds-card__header-title main-title">
            <span>Goals</span>
          </h1>
        </header>
      </div>
      <div class="slds-card__body slds-card__body_inner">
        <div class="slds-card__body slds-card__body_inner padded-card">
          <article class="slds-card slds-card_boundary in-progress">
            <div class="slds-card__header slds-grid">
              <header class="slds-has-flexi-truncate">
                <h2 class="slds-card__header-title">
                  <span>In Progress</span>
                </h2>
              </header>
            </div>
            <template if:true={inProgressGoals}>
              <div class="slds-card__body slds-card__body_inner">
                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                  <template for:each={inProgressGoals} for:item="finGoal">
                    <li class={cardSizeClass} key={finGoal.Id}>
                      <div class="slds-card__body slds-card__body_inner">
                        <article class="slds-card slds-card_boundary">
                          <div class="slds-card__header slds-grid">
                            <header class="slds-has-flexi-truncate">
                              <h2 class="slds-card__header-title">
                                <a
                                  onclick={navigateToRecordViewPage}
                                  data-id={finGoal.Id}
                                  title={finGoal.Name}
                                >
                                  <span>{finGoal.Name}</span>
                                </a>
                              </h2>
                            </header>
                          </div>
                          <div class="slds-card__body slds-card__body_inner">
                            <lightning-layout class={gridClass}>
                              <lightning-layout-item class={fieldPaddingClass}>
                                <div class="header-column">
                                  <p class="field-title slds-text-color_weak">
                                    Target Value
                                  </p>
                                  <p class="slds-text-title_bold">
                                    {finGoal.FinServ__TargetValue__c}
                                  </p>
                                </div>
                              </lightning-layout-item>
                              <lightning-layout-item class={fieldPaddingClass}>
                                <div class="header-column">
                                  <p class="field-title slds-text-color_weak">
                                    Available Balance
                                  </p>
                                  <p class="slds-text-title_bold">
                                    {finGoal.FinServ__ActualValue__c}
                                  </p>
                                </div>
                              </lightning-layout-item>
                            </lightning-layout>
                            <lightning-layout class={gridClass}>
                              <lightning-layout-item class={fieldPaddingClass}>
                                <div class="header-column">
                                  <p class="field-title slds-text-color_weak">
                                    Target Date
                                  </p>
                                  <p class="slds-text-title_bold">
                                    {finGoal.FinServ__TargetDate__c}
                                  </p>
                                </div>
                              </lightning-layout-item>
                              <lightning-layout-item class={fieldPaddingClass}>
                                <div class="header-column">
                                  <p class="field-title slds-text-color_weak">
                                    Recommended Savings Amount
                                  </p>
                                  <p class="slds-text-title_bold">
                                    {finGoal.Recommended_Savings_Amount__c}
                                  </p>
                                  <lightning-helptext
                                    class="tooltip"
                                    content="Displayed as Daily amount"
                                  >
                                  </lightning-helptext>
                                </div>
                              </lightning-layout-item>
                            </lightning-layout>
                            <div class={ringClass}>
                              <c-progress-ring
                                progress={finGoal.fillPercent}
                                emoticon={finGoal.Icon__c}
                              >
                              </c-progress-ring>
                            </div>
                          </div>
                        </article>
                      </div>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
            <template if:false={inProgressGoals}>
              <h1 class="slds-card__header-title main-title">
                <span class="not-found">No Financial Goals In Progress</span>
              </h1>
            </template>
          </article>
        </div>
      </div>
      <div class="slds-card__body slds-card__body_inner">
        <div class="slds-card__body slds-card__body_inner padded-card">
          <article class="slds-card slds-card_boundary completed">
            <div class="slds-card__header slds-grid">
              <header class="slds-has-flexi-truncate">
                <h2 class="slds-card__header-title">
                  <span>Completed</span>
                </h2>
              </header>
            </div>
            <template if:true={completedGoals}>
              <div class="slds-card__body slds-card__body_inner">
                <template for:each={completedGoals} for:item="finGoal">
                  <div
                    class="slds-card__body slds-card__body_inner"
                    key={finGoal.Id}
                  >
                    <article class="slds-card slds-card_boundary">
                      <div class="slds-card__header slds-grid">
                        <header class="slds-has-flexi-truncate">
                          <h2 class="slds-card__header-title">
                            <a
                              onclick={navigateToRecordViewPage}
                              data-id={finGoal.Id}
                              title={finGoal.Name}
                            >
                              <span>{finGoal.Name}</span>
                            </a>
                          </h2>
                        </header>
                      </div>
                      <div class="slds-card__body slds-card__body_inner">
                        <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                          <li
                            class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-5"
                          >
                            <article class="slds-tile slds-hint-parent">
                              <div
                                class="slds-grid slds-grid_align-spread slds-has-flexi-truncate"
                              >
                                <h3
                                  class="slds-tile__title slds-text-color_weak"
                                  title="Target Value"
                                >
                                  Target Value
                                </h3>
                              </div>
                              <div class="slds-tile__detail">
                                <dl class="slds-list_horizontal slds-wrap">
                                  <dt
                                    class="slds-item_label"
                                    title="Target Value"
                                  >
                                    {finGoal.FinServ__TargetValue__c}
                                  </dt>
                                </dl>
                              </div>
                            </article>
                          </li>
                          <li
                            class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-5"
                          >
                            <article class="slds-tile slds-hint-parent">
                              <div
                                class="slds-grid slds-grid_align-spread slds-has-flexi-truncate"
                              >
                                <h3
                                  class="slds-tile__title slds-text-color_weak"
                                  title="Available Balance"
                                >
                                  Available Balance
                                </h3>
                              </div>
                              <div class="slds-tile__detail">
                                <dl class="slds-list_horizontal slds-wrap">
                                  <dt
                                    class="slds-item_label"
                                    title="Available Balance"
                                  >
                                    {finGoal.FinServ__ActualValue__c}
                                  </dt>
                                </dl>
                              </div>
                            </article>
                          </li>
                          <li
                            class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-5"
                          >
                            <article class="slds-tile slds-hint-parent">
                              <div
                                class="slds-grid slds-grid_align-spread slds-has-flexi-truncate"
                              >
                                <h3
                                  class="slds-tile__title slds-text-color_weak"
                                  title="Target Date"
                                >
                                  Target Date
                                </h3>
                              </div>
                              <div class="slds-tile__detail">
                                <dl class="slds-list_horizontal slds-wrap">
                                  <dt class="slds-item_label" title="Current">
                                    {finGoal.FinServ__TargetDate__c}
                                  </dt>
                                </dl>
                              </div>
                            </article>
                          </li>
                          <li
                            class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-5"
                          >
                            <article class="slds-tile slds-hint-parent">
                              <div
                                class="slds-grid slds-grid_align-spread slds-has-flexi-truncate"
                              >
                                <h3
                                  class="slds-tile__title slds-text-color_weak"
                                  title="Date Achieved"
                                >
                                  Date Achieved
                                </h3>
                              </div>
                              <div class="slds-tile__detail">
                                <dl class="slds-list_horizontal slds-wrap">
                                  <dt class="slds-item_label" title="Current">
                                    {finGoal.FinServ__CompletionDate__c}
                                  </dt>
                                </dl>
                              </div>
                            </article>
                          </li>
                          <template if:true={finGoal.Icon__c}>
                            <li
                              class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-5"
                            >
                              <article class="slds-tile slds-hint-parent">
                                <div class="icon-background">
                                  <span class="icon">{finGoal.Icon__c}</span>
                                </div>
                              </article>
                            </li>
                          </template>
                        </ul>
                      </div>
                    </article>
                  </div>
                </template>
              </div>
            </template>
            <template if:false={completedGoals}>
              <h1 class="slds-card__header-title main-title">
                <span class="not-found">No Financial Goals Completed</span>
              </h1>
            </template>
          </article>
        </div>
      </div>
      <footer class="slds-card__footer">
        <span class="last-updated">Last Updated Date/Time {timestamp}</span>
      </footer>
    </article>
  </template>
</template>
