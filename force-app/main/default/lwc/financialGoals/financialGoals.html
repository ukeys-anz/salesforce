<template>
  <article class="goals slds-card">
    <h1 class="card-title">
      <lightning-icon
        icon-name="standard:goals"
        size="medium"
        class="slds-m-right_small"
      ></lightning-icon>
      Savings Goals
    </h1>
    <template if:true={displayContent}>
      <template if:true={error}>
        <c-error message={error} data-id="error"></c-error>
      </template>
      <template if:false={error}>
        <div class="slds-card__body slds-card__body_inner padded-card">
          <article class="slds-card in-progress">
            <template if:true={goals}>
              <div class="slds-card__body slds-card__body_inner">
                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                  <template for:each={goals} for:item="finGoal">
                    <li
                      class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-1"
                      key={finGoal.Id}
                    >
                      <div
                        class="slds-card__body slds-card__body_inner"
                        data-id="goal-body"
                      >
                        <article class="slds-card slds-card_boundary">
                          <div class="slds-card__header slds-grid">
                            <header class="slds-has-flexi-truncate">
                              <h2 class="slds-card__header-title">
                                <a
                                  onclick={navigateToRecordViewPage}
                                  data-id={finGoal.Id}
                                  title={finGoal.name}
                                >
                                  <span>{finGoal.name}</span>
                                </a>
                              </h2>
                            </header>
                          </div>
                          <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-grid slds-size_1-of-1">
                              <div class="slds-grid slds-wrap slds-size_1-of-1">
                                <div
                                  class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 field-padding"
                                >
                                  <div>
                                    <p class="field-title slds-text-color_weak">
                                      Target Value
                                    </p>
                                    <p class="slds-text-title_bold">
                                      {finGoal.targetAmount}
                                    </p>
                                  </div>
                                </div>
                                <div
                                  class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 field-padding"
                                >
                                  <div>
                                    <p class="field-title slds-text-color_weak">
                                      Total Saved
                                      <lightning-icon
                                        icon-name="utility:info"
                                        size="xx-small"
                                        class="tooltip-modal"
                                        onclick={handleInfoModal}
                                        data-id="total-saved-info"
                                      ></lightning-icon>
                                    </p>
                                    <p class="slds-text-title_bold">
                                      {finGoal.currentBalance}
                                    </p>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-grid slds-size_1-of-1">
                              <div class="slds-grid slds-wrap slds-size_1-of-1">
                                <div
                                  class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 field-padding"
                                >
                                  <div>
                                    <p class="field-title slds-text-color_weak">
                                      Target Date
                                      <lightning-helptext
                                        class="tooltip"
                                        content={finGoal.daysRemainingText}
                                      >
                                      </lightning-helptext>
                                    </p>
                                    <p class="slds-text-title_bold">
                                      {finGoal.targetDate}
                                    </p>
                                  </div>
                                </div>
                                <div
                                  class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 field-padding"
                                >
                                  <div>
                                    <p class="field-title slds-text-color_weak">
                                      Recommended Savings Amount per Week
                                      <lightning-helptext
                                        class="tooltip"
                                        content="Savings amount is calculated to per week to achieve the goal by the target date."
                                      >
                                      </lightning-helptext>
                                    </p>
                                    <p class="slds-text-title_bold">
                                      {finGoal.recommendedSavings}
                                    </p>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="ring">
                            <c-progress-ring
                              progress={finGoal.fillPercent}
                              emoticon={finGoal.icon}
                            >
                            </c-progress-ring>
                          </div>
                        </article>
                      </div>
                    </li>
                  </template>
                </ul>
              </div>
              <template if:true={showInfoModal}>
                <section
                  role="dialog"
                  class="slds-modal slds-fade-in-open"
                  data-id="total-saved-modal"
                >
                  <div class="slds-modal__container">
                    <header class="slds-modal__header modal-header">
                      <lightning-icon
                        icon-name="utility:close"
                        onclick={handleInfoModal}
                        class="slds-button slds-button_icon slds-modal__close close-modal"
                      ></lightning-icon>
                      <h2 class="slds-modal__title slds-hyphenate">
                        What does Total Saved mean?
                      </h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                      <span>
                        <p class="slds-text-title_bold">
                          The amount shown is indicative of the amount you may
                          be able to use but may not be what is actually
                          available.
                        </p>
                        <br />
                        The amount shown is indicative of the amount you may be
                        able to use in your ANZ Save account
                        <strong> for this goal</strong>. The amount shown may
                        not be what is actually available because:
                        <ul
                          class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium"
                        >
                          <li>
                            some transactions may not have updated the amount
                            shown (e.g. reversals)
                          </li>
                          <li>
                            some transactions may have updated the amount shown
                            but are not yet fully processed (e.g. pending
                            transactions), and/or
                          </li>
                          <li>
                            we may not process transactions at the time, on the
                            day or in the order that they are made.
                          </li>
                        </ul>
                        If you proceed with a transaction when there may be
                        insufficient funds, your account may go overdrawn or the
                        transaction may be declined.
                      </span>
                    </div>
                    <footer class="slds-modal__footer">
                      <button
                        class="slds-button slds-button_neutral"
                        onclick={handleInfoModal}
                      >
                        Close
                      </button>
                    </footer>
                  </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
              </template>
            </template>
            <template if:false={goals}>
              <h1 class="slds-card__header-title main-title">
                <span class="not-found">No Financial Goals</span>
              </h1>
            </template>
          </article>
        </div>
      </template>
    </template>
    <template if:false={displayContent}>
      <div class="slds-grid">
        <p class="field-padding">
          Don’t worry, it’s not broken. To view this you need a higher
          permission level.
        </p>
      </div>
    </template>
    <footer class="slds-card__footer">
      <span class="last-updated">Last Updated {timestamp}</span>
    </footer>
  </article>
</template>
