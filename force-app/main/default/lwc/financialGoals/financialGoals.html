<template>
  <article class="slds-card">
    <div class="card-title">
      <span class="title-text">
        <lightning-icon
          icon-name="standard:goals"
          size="medium"
          class="slds-m-right_small"
        ></lightning-icon>
        Savings Goals
      </span>
      <lightning-button
        label="Clear filters"
        onclick={handleClearFilters}
        class="filter-buttons"
      ></lightning-button>
      <lightning-button
        label="Apply filters"
        onclick={dispatchFilters}
        class="filter-buttons"
      ></lightning-button>
    </div>
    <template if:true={displayContent}>
      <template if:true={error}>
        <c-error message={error} data-id="error"></c-error>
      </template>
      <template if:false={error}>
        <div class="slds-card__body slds-card__body_inner padded-card">
          <article class="slds-card goal-container">
            <template if:true={goalList}>
              <p class="slds-p-around_small">
                Select one or more goals by clicking on the name and hit 'Apply
                filters' to see all transactions for that goal(s).
              </p>
              <div class="slds-grid slds-wrap" data-id="goal-container">
                <template for:each={goalList} for:item="goal">
                  <div
                    class="slds-col slds-size_1-of-3 slds-box slds-box_small goal slds-p-top_small slds-m-left_small"
                    key={goal.id}
                    data-id={goal.id}
                    onclick={handleFilter}
                  >
                    <div class="slds-text-align_center">
                      <a>{goal.goal.name}</a>
                      <div class="ring">
                        <c-progress-ring
                          progress={goal.fillPercent}
                          emoticon={goal.emoji}
                          image={goal.image}
                        >
                        </c-progress-ring>
                      </div>
                    </div>
                    <div class="slds-grid slds-wrap slds-p-top_small">
                      <div
                        class="slds-col slds-size_1-of-2 slds-p-around_x-small"
                      >
                        <p class="slds-text-title_bold slds-text-color_weak">
                          Target Value
                        </p>
                        <p class="slds-text-color_weak">
                          {goal.goal.target_amount}
                        </p>
                      </div>
                      <div
                        class="slds-col slds-size_1-of-2 slds-p-around_x-small"
                      >
                        <p class="slds-text-title_bold slds-text-color_weak">
                          Total Saved
                          <lightning-icon
                            icon-name="utility:info"
                            size="xx-small"
                            class="tooltip-modal"
                            onclick={handleInfoModal}
                            data-id="total-saved-info"
                          ></lightning-icon>
                        </p>
                        <p class="slds-text-color_weak">
                          <lightning-formatted-number
                            value={goal.balance.value}
                            format-style="currency"
                            data-id="amount"
                          ></lightning-formatted-number>
                        </p>
                      </div>
                      <div
                        class="slds-col slds-size_1-of-2 slds-p-around_x-small"
                      >
                        <p class="slds-text-title_bold slds-text-color_weak">
                          Date Started
                        </p>
                        <p class="slds-text-color_weak">{goal.created_at}</p>
                      </div>
                      <div
                        class="slds-col slds-size_1-of-2 slds-p-around_x-small"
                      >
                        <p class="slds-text-title_bold slds-text-color_weak">
                          Target Date
                        </p>
                        <p class="slds-text-color_weak">
                          {goal.goal.target_date}
                        </p>
                      </div>
                      <div
                        class="slds-col slds-size_1-of-1 slds-p-around_x-small"
                      >
                        <p class="slds-text-title_bold slds-text-color_weak">
                          Recommended Weekly Savings
                          <lightning-helptext
                            class="tooltip"
                            content="Savings amount is calculated to per week to achieve the goal by the target date."
                          >
                          </lightning-helptext>
                        </p>
                        <p class="slds-text-color_weak">
                          {goal.recommendedSavings}
                        </p>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
              <template if:true={nextPageToken}>
                <template if:true={loadingMore}>
                  <div class="slds-align_absolute-center" style="height: 4rem">
                    <div role="status" class="slds-spinner_inline">
                      <lightning-spinner
                        alternative-text="Loading"
                        variant="brand"
                      ></lightning-spinner>
                    </div>
                  </div>
                </template>
                <template if:false={loadingMore}>
                  <div
                    class="slds-grid slds-text-align_center slds-box slds-box_xx-small slds-m-top_large"
                  >
                    <div class="slds-col">
                      <button class="slds-button" onclick={handleLoadMore}>
                        Load More
                      </button>
                    </div>
                  </div>
                </template>
              </template>

              <template if:true={showInfoModal}>
                <section
                  role="dialog"
                  class="slds-modal slds-fade-in-open"
                  data-id="total-saved-modal"
                >
                  <div class="slds-modal__container">
                    <header class="slds-modal__header modal-header">
                      <lightning-icon
                        icon-name="utility:close"
                        onclick={handleInfoModal}
                        class="slds-button slds-button_icon slds-modal__close close-modal"
                      ></lightning-icon>
                      <h2 class="slds-modal__title slds-hyphenate">
                        What does Total Saved mean?
                      </h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                      <span>
                        <p class="slds-text-title_bold">
                          The amount shown is indicative of the amount you may
                          be able to use but may not be what is actually
                          available.
                        </p>
                        <br />
                        The amount shown is indicative of the amount you may be
                        able to use in your ANZ Save account
                        <strong> for this goal</strong>. The amount shown may
                        not be what is actually available because:
                        <ul
                          class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium"
                        >
                          <li>
                            some transactions may not have updated the amount
                            shown (e.g. reversals)
                          </li>
                          <li>
                            some transactions may have updated the amount shown
                            but are not yet fully processed (e.g. pending
                            transactions), and/or
                          </li>
                          <li>
                            we may not process transactions at the time, on the
                            day or in the order that they are made.
                          </li>
                        </ul>
                        If you proceed with a transaction when there may be
                        insufficient funds, your account may go overdrawn or the
                        transaction may be declined.
                      </span>
                    </div>
                    <footer class="slds-modal__footer">
                      <button
                        class="slds-button slds-button_neutral"
                        onclick={handleInfoModal}
                      >
                        Close
                      </button>
                    </footer>
                  </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
              </template>
            </template>
            <template if:false={goalList}>
              <h1 class="slds-card__header-title main-title">
                <span class="not-found" data-id="no-goals"
                  >Customer hasn't set any goals</span
                >
              </h1>
            </template>
          </article>
        </div>
      </template>
    </template>
    <template if:false={displayContent}>
      <div class="slds-grid">
        <p class="field-padding">
          Don’t worry, it’s not broken. To view this you need a higher
          permission level.
        </p>
      </div>
    </template>
    <footer class="slds-card__footer">
      <span class="last-updated">Last Updated {timestamp}</span>
    </footer>
  </article>
</template>
