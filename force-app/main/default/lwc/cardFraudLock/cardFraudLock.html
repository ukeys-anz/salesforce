<template>
  <template lwc:if={displayTeamToContact}>
    <section class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <article class="slds-card dialogBox">
          <div class="slds-card__header slds-grid header-div headerBorder">
            <header class="slds-has-flexi-truncate card-header">
              <h2>Select Team For Customer to Contact</h2>
            </header>
          </div>
          <div class="slds-card__body slds-p-horizontal--small btnDiv">
            <div class="body-wording-section">
              <p>
                Please select the respective team for the customer to contact
                regarding the lock placed on their card.
              </p>
              <br />
              <div class="btnGroup">
                <template for:each={teamToContactOptions} for:item="opt">
                  <p key={opt.label} class="btnWidth">
                    <lightning-button
                      class="btn btnTeamToContact"
                      label={opt.label}
                      data-label={opt.label}
                      variant={opt.variantSituation}
                      onclick={teamToContactSelectHandler}
                    ></lightning-button>
                  </p>
                </template>
              </div>
            </div>
          </div>

          <footer class="slds-modal__footer">
            <lightning-button
              variant="brand"
              label="Continue"
              title="Continue"
              class="continue-button"
              onclick={handleTeamToContact}
              data-id="continue-button"
            >
            </lightning-button>

            <lightning-button
              variant="neutral"
              label="Cancel"
              title="Cancel"
              class="slds-float_left"
              onclick={closeAction}
              data-id="cancel-button"
            >
            </lightning-button>
          </footer>
        </article>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <template lwc:elseif={displayFraudOptions}>
    <section class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <article class="slds-card dialogBox">
          <div class="slds-card__header slds-grid header-div headerBorder">
            <header class="slds-has-flexi-truncate card-header">
              <h2>Select Fraud Block</h2>
            </header>
          </div>
          <div class="slds-card__body slds-p-horizontal--small btnDiv">
            <div class="body-wording-section">
              <p>Please select one fraud block to place on the card.</p>
              <p>
                If a block is already active, it will be a selected blue button.
              </p>
              <br />
              <div class="btnGroup">
                <template for:each={fraudLockOptions} for:item="opt">
                  <p key={opt.status} class="btnWidth">
                    <lightning-button
                      class="btn btnFraudLock"
                      label={opt.label}
                      data-status={opt.status}
                      variant={opt.variantSituation}
                      onclick={fraudLockStatusSelectHandler}
                    ></lightning-button>
                  </p>
                </template>
              </div>
            </div>
          </div>

          <footer class="slds-modal__footer">
            <lightning-button
              variant="brand"
              label="Submit"
              title="Submit"
              class="submit-button"
              onclick={handleFraudLock}
              data-id="submit-button"
            >
            </lightning-button>

            <lightning-button
              variant="neutral"
              label="Cancel"
              title="Cancel"
              class="slds-float_left"
              onclick={closeAction}
              data-id="cancel-button"
            >
            </lightning-button>
          </footer>
        </article>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <template lwc:else>
    <section class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <article class="slds-card messageBox">
          <div class="slds-card__header slds-grid header-div headerBorder">
            <header class="slds-has-flexi-truncate card-header">
              <h2>{message.title}</h2>
            </header>
          </div>
          <div class="slds-card__body slds-p-horizontal--small messageDiv">
            <div class="body-wording-section-submission">
              <p><strong>{message.firstMessage}</strong></p>
              <br />

              <p>{message.secondMessage}</p>
              <br />

              <p lwc:if={message.thirdMessage}>
                <Strong lwc:if={message.strongText}
                  ><em>Please note: </em></Strong
                >
                {message.thirdMessage}
              </p>
            </div>
          </div>

          <footer class="slds-modal__footer">
            <lightning-button
              class="confirm-button"
              onclick={submitHandler}
              data-id="confirm-button"
              label={message.label}
              title={message.label}
              variant={message.variant}
              disabled={confirmButtonTriggered}
            ></lightning-button>

            <lightning-button
              variant="neutral"
              label="Cancel"
              title="Cancel"
              class="slds-float_left"
              onclick={closeAction}
              data-id="cancel-button"
            >
            </lightning-button>
          </footer>
        </article>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
