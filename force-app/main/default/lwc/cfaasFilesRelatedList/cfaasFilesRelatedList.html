<template>
  <h1 class="card-title" data-id="component-title">
    <lightning-icon
      icon-name="standard:file"
      size="small"
      class="slds-m-right_small"
    ></lightning-icon>
    {title}
  </h1>
  <article class="card-article slds-card">
    <div lwc:if={isLoading}>
      <lightning-spinner alternative-text="Loading..." variant="brand">
      </lightning-spinner>
    </div>
    <div lwc:else>
      <template lwc:if={error}>
        <c-error message={error} data-id="error"></c-error>
      </template>
      <template lwc:else>
        <template lwc:if={displayRecords}>
          <div class="div-data-table">
            <template lwc:if={showSpinner}>
              <lightning-spinner
                alternative-text="Launching Preview"
              ></lightning-spinner>
            </template>
            <c-custom-datatable
              class="slds-table"
              key-field="Id"
              data={displayRecords}
              columns={columns}
              hide-checkbox-column
              default-sort-direction={defaultSortDirection}
              sorted-direction={sortDirection}
              sorted-by={sortedBy}
              enable-infinite-loading
              onloadmore={loadMoreData}
              wrap-text-max-lines="1"
              onclickurl={handleFilePreview}
            >
            </c-custom-datatable>
          </div>

          <template lwc:if={objectApiName}>
            <footer class="slds-card__footer">
              <a
                class="slds-card__footer-action"
                href="#"
                onclick={navigateToRelatedListSubTab}
                >View All
                <span class="slds-assistive-text">View All {title}</span>
              </a>
            </footer>
          </template>
        </template>

        <template lwc:else>
          <div class="div-no-files slds-align_absolute-center">
            There are currently no files
          </div>
        </template>
      </template>
    </div>
  </article>
</template>
