<template>
  <template if:true={transactionRecord.showDateTitle}>
    <div
      class="slds-text-color_weak slds-card__header-title transaction-date"
      data-test-id="transaction-date"
    >
      {transactionDate}
    </div>
  </template>
  <article class={transactionRecord.rowColour}>
    <div class="slds-grid slds-m-bottom_small">
      <div class="slds-col slds-size--1-of-7 logo-container">
        <template if:true={transactionRecord.logo}>
          <img class={logoClass} alt="Logo" src={transactionRecord.logo} />
        </template>
        <template if:true={transactionRecord.source_emoji}>
          <div class="source-emoji">{transactionRecord.source_emoji}</div>
        </template>
        <template if:true={transactionRecord.source_image}>
          <div class={sourceClass}>
            <img src={transactionRecord.source_image} />
          </div>
        </template>
        <template if:true={transactionRecord.destination_emoji}>
          <div class="destination-emoji">
            {transactionRecord.destination_emoji}
          </div>
        </template>
        <template if:true={transactionRecord.destination_image}>
          <div class={destinationClass}>
            <img src={transactionRecord.destination_image} />
          </div>
        </template>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Name</div>
        <p class="slds-truncate name" title={transactionRecord.title}>
          {transactionRecord.title}
        </p>
        <div class="description-tooltip">{transactionRecord.title}</div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Transaction Type</div>
        <div class="slds-grid" data-test-id="transaction-type">
          {transactionRecord.formatted_type}
        </div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Transaction Time</div>
        <div class="slds-grid" data-test-id="transaction-time">
          {transactionTime}
        </div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Short Description</div>
        <div class="slds-grid slds-hyphenate">
          {transactionRecord.enrichment_id}
        </div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Amount</div>
        <div class="slds-grid">
          <template if:true={positiveAmount}>
            <span class="positive-amount"
              >+<lightning-formatted-number
                data-test-id="amount"
                value={amountNumber}
                format-style="currency"
                data-id="amount"
              ></lightning-formatted-number
            ></span>
          </template>
          <template if:true={negativeAmount}>
            <span>
              <lightning-formatted-number
                data-test-id="amount"
                value={amountNumber}
                format-style="currency"
              >
              </lightning-formatted-number>
            </span>
          </template>
        </div>
      </div>
      <div class="slds-col slds-size--1-of-7 button-icon-col">
        <lightning-button-menu alternative-text="Show Actions">
          <template if:false={showTransactionDetails}>
            <lightning-menu-item
              value="Show Details"
              label="Show Details"
              onclick={handleDetailsToggle}
            >
            </lightning-menu-item>
          </template>
          <template if:true={showTransactionDetails}>
            <lightning-menu-item
              value="Hide Details"
              label="Hide Details"
              onclick={handleDetailsToggle}
            >
            </lightning-menu-item>
          </template>
          <lightning-menu-item
            value="Raise Dispute"
            label="Raise Dispute"
            onclick={handleRaiseDispute}
            disabled={disableRaiseDisputeBtn}
          >
          </lightning-menu-item>
          <template if:true={disableRaiseDisputeBtn}>
            <div
              class="slds-popover slds-popover_tooltip slds-nubbin_left-top"
              role="tooltip"
              id="help"
              style="position: absolute; top: 20px; left: 120px; width: 150px"
            >
              <div class="slds-popover__body">{disputeButtonTooltip}</div>
            </div>
          </template>
        </lightning-button-menu>
      </div>
    </div>
    <template if:true={showTransactionDetails}>
      <div class="slds-grid slds-m-bottom_small">
        <div class="slds-col slds-size--1-of-7"></div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Status</div>
          <div class="slds-grid">{transactionRecord.status}</div>
        </div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Long Description</div>
          <div class="slds-grid description">{transactionRecord.long_desc}</div>
          <div class="description-tooltip" data-id="longDesc">
            {transactionRecord.long_desc}
          </div>
        </div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Transaction ID</div>
          <div class="slds-grid" data-id="transactionId">
            {transactionRecord.transaction_id}
          </div>
        </div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Error Reason</div>
          <div class="slds-grid word-fix" data-id="transError">
            {transactionRecord.Error}
          </div>
        </div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Currency Code</div>
          <div class="slds-grid">{transactionRecord.amount.currency_code}</div>
        </div>
      </div>

      <template if:true={transactionRecord.merchantDetails}>
        <div class="transaction-section">
          <h3 class="section-title">Merchant Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Name</div>
              <div class="slds-grid" data-test-id="merchant-name">
                {transactionRecord.merchantName}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Address</div>
              <div class="slds-grid">{transactionRecord.merchantLocation}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Phone</div>
              <div class="slds-grid">
                <template if:true={transactionRecord.merchantPhoneNumber}>
                  {transactionRecord.merchantPhoneNumber}
                </template>
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Website</div>
              <div class="slds-grid word-fix">
                {transactionRecord.merchantWebsiteUrl}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Email</div>
              <div class="slds-grid">{transactionRecord.merchantEmail}</div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.internationalDetails}>
        <div class="transaction-section">
          <h3 class="section-title">International Exchange Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Converted Amount
              </div>
              <div class="slds-grid">
                <lightning-formatted-number
                  value={amountConvertedValue}
                  format-style="currency"
                >
                </lightning-formatted-number>
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Converted Currency Code
              </div>
              <div class="slds-grid" data-test-id="converted-currency-code">
                {amountConvertedCurrency}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Exchange Rate
              </div>
              <div class="slds-grid">{amountExchangeRateValue}</div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.card}>
        <div class="transaction-section">
          <h3 class="section-title">Card Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Card Scheme</div>
              <div class="slds-grid" data-test-id="card-scheme">
                {transactionRecord.card.formatted_scheme}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Card Last 4 Digits
              </div>
              <div class="slds-grid">
                {transactionRecord.card.last_four_digits}
              </div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.transfer}>
        <div class="transaction-section">
          <h3 class="section-title">Transfer Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Payer Account Number
              </div>
              <div class="slds-grid">
                {transactionRecord.transfer.source_account.account.transactionAccountNumber}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Payer BSB Number
              </div>
              <div class="slds-grid">
                {transactionRecord.transfer.source_account.account.bsb}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Message</div>
              <div class="slds-grid">{transactionRecord.transfer.message}</div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.bpay}>
        <div class="transaction-section">
          <h3 class="section-title">BPAY Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Biller Name</div>
              <div class="slds-grid">{transactionRecord.bpay.biller_name}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Biller Code</div>
              <div class="slds-grid">{transactionRecord.bpay.biller_code}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Biller Reference Number
              </div>
              <div class="slds-grid">
                {transactionRecord.bpay.customer_reference_number}
              </div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.pay_anyone}>
        <div class="transaction-section">
          <h3 class="section-title">Pay Anyone Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Payer Account Number
              </div>
              <div class="slds-grid">
                {transactionRecord.pay_anyone.other_entity.account.transactionAccountNumber}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Payer BSB Number
              </div>
              <div class="slds-grid">
                {transactionRecord.pay_anyone.other_entity.account.bsb}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Alias Name</div>
              <div class="slds-grid">
                {transactionRecord.pay_anyone.other_entity.alias_name}
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Alias ID</div>
              <div class="slds-grid">
                {transactionRecord.pay_anyone.other_entity.alias_id}
              </div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.tagList}>
        <div class="transaction-section">
          <h3 class="section-title">Tags</h3>
          <div class="slds-grid slds-m-bottom_small slds-wrap">
            <template for:each={transactionRecord.tagList} for:item="tag">
              <div
                key={tag}
                class="slds-col slds-size--1-of-5 slds-m-bottom_small tag"
              >
                <lightning-badge label={tag}></lightning-badge>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.mapMarkers}>
        <div class="transaction-section">
          <h3 class="section-title">Map</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <lightning-map
              map-markers={transactionRecord.mapMarkers}
              zoom-level={zoomLevel}
              class="map"
            >
            </lightning-map>
          </div>
        </div>
      </template>
    </template>
  </article>

  <!-- Show dispute record type selection modal -->
  <template if:true={showRecordTypeSelection}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
            What type of dispute would you like to raise?
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-radio-group
            options={disputeRecordTypes}
            value={value}
            onchange={handleSelectedRecordType}
            required
            variant="label-hidden"
          >
          </lightning-radio-group>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleToggleModal}
          >
            Cancel
          </button>
          <button
            class="slds-button slds-button_brand"
            onclick={handleNavigateToDisputeForm}
          >
            Next
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
