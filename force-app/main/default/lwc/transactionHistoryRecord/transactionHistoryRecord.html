<template>
  <template if:true={transactionRecord.showDateTitle}>
    <div class="slds-text-color_weak slds-card__header-title transaction-date">
      {transactionDate}
    </div>
  </template>
  <article class={transactionRecord.rowColour}>
    <div class="slds-grid slds-m-bottom_small">
      <div class="slds-col slds-size--1-of-7">
        <template if:true={transactionRecord.logo}>
          <img class="logo-image" alt="Logo" src={transactionRecord.logo} />
        </template>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Name</div>
        <div class="slds-grid">{transactionRecord.name}</div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Transaction Type</div>
        <div class="slds-grid">{transactionRecord.type}</div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Transaction Time</div>
        <div class="slds-grid">{transactionRecord.TransactionTime}</div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Short Description</div>
        <div class="slds-grid">{transactionRecord.enrichmentId}</div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <div class="slds-grid slds-form-element__label">Amount</div>
        <div class="slds-grid">
          <template if:true={positiveAmount}>
            <span class="positive-amount"
              >+$<lightning-formatted-number
                value={amountNumber}
              ></lightning-formatted-number
            ></span>
          </template>
          <template if:true={negativeAmount}>
            <span
              >$<lightning-formatted-number
                value={amountNumber}
              ></lightning-formatted-number
            ></span>
          </template>
        </div>
      </div>
      <div class="slds-col slds-size--1-of-7">
        <template if:false={showTransactionDetails}>
          <lightning-icon
            icon-name="utility:chevronleft"
            alternative-text="Collapsed"
            title="Collapsed"
            size="xx-small"
            class="chevron"
            onclick={handleDetailsToggle}
          ></lightning-icon>
        </template>
        <template if:true={showTransactionDetails}>
          <lightning-icon
            icon-name="utility:chevrondown"
            alternative-text="Expanded"
            title="Expanded"
            size="xx-small"
            class="chevron"
            onclick={handleDetailsToggle}
          ></lightning-icon>
        </template>
      </div>
    </div>
    <template if:true={showTransactionDetails}>
      <div class="slds-grid slds-m-bottom_small">
        <div class="slds-col slds-size--1-of-7"></div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Status</div>
          <div class="slds-grid">{transactionRecord.status}</div>
        </div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Long Description</div>
          <div class="slds-grid description">{transactionRecord.longDesc}</div>
          <div class="description-tooltip">{transactionRecord.longDesc}</div>
        </div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Transaction ID</div>
          <div class="slds-grid" data-id="transactionId">
            {transactionRecord.transactionId}
          </div>
        </div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Error Reason</div>
          <div class="slds-grid word-fix" data-id="transError">
            {transactionRecord.Error}
          </div>
        </div>
        <div class="slds-col slds-size--1-of-7">
          <div class="slds-grid slds-form-element__label">Currency Code</div>
          <div class="slds-grid">
            {transactionRecord.amount.charged.currency}
          </div>
        </div>
      </div>

      <template if:true={transactionRecord.merchantDetails}>
        <div class="transaction-section">
          <h3 class="section-title">Merchant Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Name</div>
              <div class="slds-grid">{transactionRecord.merchant.name}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Address</div>
              <div class="slds-grid">{transactionRecord.merchantLocation}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Phone</div>
              <div class="slds-grid">
                <template if:true={transactionRecord.merchant.phone_number}>
                  {merchantPhoneNumber}
                </template>
              </div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Website</div>
              <div class="slds-grid word-fix">{merchantWebsiteUrl}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Email</div>
              <div class="slds-grid">{transactionRecord.merchant.email}</div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.internationalDetails}>
        <div class="transaction-section">
          <h3 class="section-title">International Exchange Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Converted Amount
              </div>
              <div class="slds-grid">{amountConvertedValue}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Converted Currency Code
              </div>
              <div class="slds-grid">{amountConvertedCurrency}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Exchange Rate
              </div>
              <div class="slds-grid">{amountExchangeRateValue}</div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.card}>
        <div class="transaction-section">
          <h3 class="section-title">Card Details</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">Card Scheme</div>
              <div class="slds-grid">{transactionRecord.card.scheme}</div>
            </div>
            <div class="slds-col slds-size--1-of-7">
              <div class="slds-grid slds-form-element__label">
                Card Last 4 Digits
              </div>
              <div class="slds-grid">
                {transactionRecord.card.last_four_digits}
              </div>
            </div>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.tagList}>
        <div class="transaction-section">
          <h3 class="section-title">Tags</h3>
          <div class="slds-grid slds-m-bottom_small slds-wrap">
            <template for:each={transactionRecord.tagList} for:item="tag">
              <div
                key={tag}
                class="slds-col slds-size--1-of-5 slds-m-bottom_small tag"
              >
                <lightning-badge label={tag}></lightning-badge>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template if:true={transactionRecord.mapMarkers}>
        <div class="transaction-section">
          <h3 class="section-title">Map</h3>
          <div class="slds-grid slds-m-bottom_small">
            <div class="slds-col slds-size--1-of-7"></div>
            <lightning-map
              map-markers={transactionRecord.mapMarkers}
              zoom-level={zoomLevel}
              class="map"
            ></lightning-map>
          </div>
        </div>
      </template>
    </template>
  </article>
</template>
