<template>
  <div class={errorClass}>
    <div class="slds-col">
      <template lwc:if={errorImageUrl}>
        <img class="error-image" src={errorImageUrl} />
      </template>
      <template lwc:else>
        <lightning-icon
          icon-name="utility:error"
          alternative-text="Error"
          variant={iconVariant}
          size={emojiSize}
          class={emojiClass}
        ></lightning-icon>
      </template>
    </div>
    <div class="slds-col">
      <template lwc:if={errorMessage}>
        <span class={classesForText}>{errorMessage}</span>
      </template>
      <template lwc:else>
        <span class={classesForText}
          >An error has occurred. Please refresh and try again. If the problem
          persists, please contact your System Administrator.</span
        >
      </template>
    </div>
  </div>
</template>
