<template>
  <div class="slds-card slds-grid slds-grid_vertical-align-center">
    <div class="slds-col">
      <template lwc:if={errorImageUrl}>
        <img class="error-image" src={errorImageUrl} />
      </template>
      <template lwc:else>
        <lightning-icon
          icon-name="utility:error"
          alternative-text="Error"
          size="large"
          class="emoji"
        ></lightning-icon>
      </template>
    </div>
    <div class="slds-col">
      <template lwc:if={errorMessage}>
        <span
          class="slds-text-align_center slds-text-color_weak slds-text-heading_small"
          >{errorMessage}</span
        >
      </template>
      <template lwc:else>
        <span
          class="slds-text-align_center slds-text-color_weak slds-text-heading_small"
          >An error has occurred. Please refresh and try again. If the problem
          persists, please contact your System Administrator.</span
        >
      </template>
    </div>
  </div>
</template>
