<template>
  <template if:true={displayContent}>
    <template if:false={loading}>
      <div class="slds-clearfix">
        <lightning-button
          label="Refresh all"
          onclick={refreshData}
          class="slds-float_right slds-p-bottom_small"
        ></lightning-button>
      </div>
      <c-financial-account
        record-id={recordId}
        account-type={financialAccountType}
        account-details={financialAccountData}
        error={financialAccountError}
        data-id="financial-account"
      ></c-financial-account>
      <div class="slds-m-top_small"></div>
      <template if:true={isSavings}>
        <template if:true={goalData}>
          <c-financial-goals
            record-id={recordId}
            goal-data={goalData}
            data-id="financial-goals"
            error={goalError}
            onloadmoregoals={handleLoadMoreGoals}
            onfiltergoals={handleGoalFilters}
            preselected-goal={preselectedGoal}
          ></c-financial-goals>
          <div class="slds-m-top_small"></div>
        </template>
      </template>
      <template if:true={transactionLoading}>
        <div
          class="slds-align_absolute-center"
          style="height: 4rem"
          data-id="loading-spinner"
        >
          <div role="status" class="slds-spinner_inline">
            <lightning-spinner
              alternative-text="Loading"
              variant="brand"
            ></lightning-spinner>
          </div>
        </div>
      </template>
      <template if:false={transactionLoading}>
        <c-transaction-history-board
          record-id={recordId}
          transaction-details={transactionData}
          error={transactionError}
          onloadmore={handleLoadMore}
          onsearch={handleSearchDates}
          data-id="transaction-history"
          parent-loading={transactionLoading}
        ></c-transaction-history-board>
      </template>
    </template>
    <template if:true={loading}>
      <div
        class="slds-align_absolute-center"
        style="height: 4rem"
        data-id="loading-spinner"
      >
        <div role="status" class="slds-spinner_inline">
          <lightning-spinner
            alternative-text="Loading"
            variant="brand"
          ></lightning-spinner>
        </div>
      </div>
    </template>
  </template>
</template>
