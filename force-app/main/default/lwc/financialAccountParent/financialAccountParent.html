<template>
  <template lwc:if={loading}>
    <div
      class="slds-align_absolute-center"
      style="height: 4rem"
      data-id="loading-spinner"
    >
      <div role="status" class="slds-spinner_inline">
        <lightning-spinner
          alternative-text="Loading"
          variant="brand"
        ></lightning-spinner>
      </div>
    </div>
  </template>
  <template lwc:else>
    <template lwc:if={hasAccountData}>
      <template lwc:if={displayLoan}>
        <c-home-loan-account
          record-id={recordId}
          object-api-name={objectApiName}
          account-details={homeLoanAccounts}
          data-id="home-account"
          ownership-type={accountOwnershipType}
          account-owners-list={accountOwners}
          offset-details={offsetData}
          component-title={financialAccount.sectionHeaderTitle}
        ></c-home-loan-account>
      </template>
      <template lwc:else>
        <template lwc:if={financialAccount.accounts}>
          <div class="slds-clearfix">
            <lightning-button
              label="Refresh all"
              onclick={refreshData}
              class="slds-float_right slds-p-bottom_small"
            ></lightning-button>
          </div>
        </template>
        <c-financial-account-header
          record-id={recordId}
          account-details={financialAccount.accounts}
          error={accountError}
          savings-jar={savingsJar}
          data-id="financial-account"
          account-owners-list={accountOwners}
          component-title={financialAccount.sectionHeaderTitle}
          component-sub-title={componentSubTitle}
          balance-title={financialAccount.balanceTitle}
          title-icon="custom:custom17"
          icon-color="slds-m-right_small cicon"
          product-code={financialAccount.productCode}
        ></c-financial-account-header>
      </template>
    </template>
    <div class="slds-m-top_small"></div>
    <template lwc:if={showGoals}>
      <c-financial-goals
        record-id={recordId}
        goal-data={goalData}
        data-id="financial-goals"
        error={goalError}
        onloadmoregoals={handleLoadMoreGoals}
        onfiltergoals={handleGoalFilters}
        preselected-goal={preselectedGoal}
        loading-more={goalsLoading}
      ></c-financial-goals>
      <div class="slds-m-top_small"></div>
    </template>
    <!-- Transaction Data Block -->
    <template lwc:if={transactionData}>
      <c-transaction-history-board
        component-title={componentTitle}
        record-id={recordId}
        has-error={hasTransactionError}
        error={transactionError}
        onloadmore={handleLoadMore}
        onsearch={handleSearchDates}
        tstart-date={transactionStartDate}
        tend-date={transactionEndDate}
        data-id="transaction-history"
        more-data={moreData}
        loading={transactionLoading}
        clear-transactions={clearTransactions}
        transaction-load-more={transactionLoadMore}
        dispute-record-types-from-parent={disputeRecordTypes}
        show-raise-dispute={showRaiseDispute}
        transaction-type-dispute-id-map-from-parent={transactionTypeDisputeIdMap}
        transaction-data={transactionData}
        ocv-id={ocvId}
        ownership={accountOwnershipType}
      ></c-transaction-history-board>
    </template>
  </template>
</template>
