<template>
  <template if:true={showSelectionMenu}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header header">
          <h2 class="slds-modal__title slds-hyphenate">
            Card Management Options
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <div
            class="slds-grid slds-grid_vertical slds-align_absolute-center button-container"
          >
            <div class="slds-col slds-m-bottom_medium">
              <button
                class="slds-button slds-button_neutral slds-button_stretch"
                onclick={handleLostMenu}
                disabled={replaceLostUnavailable}
                data-id="lost-path"
              >
                Lost Card
              </button>
            </div>
            <div class="slds-col slds-m-bottom_medium">
              <button
                class="slds-button slds-button_neutral slds-button_stretch"
                onclick={handleReplaceMenu}
                disabled={replaceStolenUnavailable}
                data-id="stolen"
              >
                Stolen Card
              </button>
            </div>
            <div class="slds-col">
              <button
                class="slds-button slds-button_neutral slds-button_stretch"
                onclick={handleReplaceMenu}
                disabled={replaceDamagedUnavailable}
                data-id="damaged"
              >
                Damaged Card
              </button>
            </div>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <button class="slds-button slds-button_neutral" onclick={closeAction}>
            Cancel
          </button>
        </footer>
      </div>
    </section>
  </template>
  <template if:true={showLostMenu}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header header">
          <h2 class="slds-modal__title slds-hyphenate">
            Card Management Options
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-text-heading_small slds-align_absolute-center">
            <strong>Lost Card</strong>
          </p>
          <p
            class="slds-align_absolute-center slds-p-around_medium slds-m-bottom_xx-large"
          >
            Are you sure you want to order a replacement card for the lost card?
            This cannot be undone if the card is found.
          </p>
          <div class="slds-grid slds-gutters slds-align_absolute-center">
            <div class="slds-col">
              <button
                class="slds-button slds-button_neutral slds-button_stretch"
                onclick={handleReplaceMenu}
                disabled={replaceLostUnavailable}
                data-id="lost"
              >
                Order Replacement Card
              </button>
            </div>
            <div class="slds-col">
              <button
                class="slds-button slds-button_neutral slds-button_stretch"
                onclick={handleLockMenu}
                disabled={replaceLockUnavailable}
                data-id="lock-button-path"
              >
                Temporarily Lock Card
              </button>
            </div>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <button class="slds-button slds-button_neutral" onclick={closeAction}>
            Cancel
          </button>
        </footer>
      </div>
    </section>
  </template>
  <template if:true={showReplaceMenu}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header header">
          <h2 class="slds-modal__title slds-hyphenate">
            Card Management Options
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-text-heading_small slds-align_absolute-center">
            <strong>Replace Card</strong>
          </p>
          <p
            class="slds-align_absolute-center slds-p-around_medium slds-m-bottom_small slds-text-title_bold"
          >
            Please confirm the customer's address below before proceeding with
            card replacement as this action cannot be undone.
          </p>
          <div class="slds-m-left_xx-large slds-m-bottom_large">
            <p>{billingStreet}</p>
            <p>{billingCity} {billingState} {billingPostalCode}</p>
            <p>{billingCountry}</p>
          </div>
          <p
            class="slds-align_absolute-center slds-p-around_medium slds-m-bottom_small"
          >
            Note: if the above address is incorrect the customer will need to
            update their address.
          </p>
          <div class="slds-grid slds-gutters">
            <div>
              <button
                class="slds-button slds-button_brand slds-button_stretch slds-m-left_medium"
                onclick={handleReplaceCard}
                data-id="order-replacement-button"
              >
                Order Replacement Card
              </button>
            </div>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <button class="slds-button slds-button_neutral" onclick={closeAction}>
            Cancel
          </button>
        </footer>
      </div>
    </section>
  </template>
  <template if:true={showLockMenu}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header header">
          <h2 class="slds-modal__title slds-hyphenate">
            Card Management Options
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-text-heading_small slds-align_absolute-center">
            <strong>Temporarily Lock Card</strong>
          </p>
          <p
            class="slds-align_absolute-center slds-p-around_medium slds-m-bottom_medium"
          >
            Are you sure you want to place a temporary lock on the customer's
            card?
            <br />
            <br />
            This will not trigger an automated card replacement, and the
            customer will be able to undo this action via ANZ Plus app.
          </p>
          <div class="slds-p-around_medium slds-m-bottom_small">
            <strong>What's Blocked</strong>
            <div class="slds-p-top_small">
              <li>
                Payments or withdrawals attempted using the physical card or
                card details
              </li>
              <li>
                Digital Wallets (as applicable - Apple Pay, Samsung Pay, Google
                Pay and Garmin Pay)
              </li>
              <li>
                Any services or recurring payments the customer has set up using
                their card details
              </li>
            </div>
            <p class="slds-m-top_small">
              Please advise the customer that their physical card and digital
              wallet will be locked pretty much instantly. If the customer would
              only like their physical card locked, they can do this via their
              app.
            </p>
          </div>
          <div class="slds-grid slds-gutters">
            <div>
              <button
                class="slds-button slds-button_brand slds-button_stretch slds-m-left_medium"
                onclick={handleLockCard}
                data-id="lock-button"
              >
                Temporarily Lock Card
              </button>
            </div>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <button class="slds-button slds-button_neutral" onclick={closeAction}>
            Cancel
          </button>
        </footer>
      </div>
    </section>
  </template>
  <div class="slds-backdrop slds-backdrop_open"></div>
</template>
