<template>
  <template if:true={displayContent}>
    <article class="slds-card slds-m-bottom_small">
      <template if:true={loading}>
        <div class="slds-align_absolute-center" style="height: 4rem">
          <div role="status" class="slds-spinner_inline">
            <lightning-spinner
              alternative-text="Loading"
              variant="brand"
            ></lightning-spinner>
          </div>
        </div>
      </template>
      <template if:false={loading}>
        <template if:true={hasError}>
          <c-error message={error}></c-error>
        </template>
        <template if:false={hasError}>
          <div class="slds-grid slds-wrap">
            <div class="slds-col slds-grid slds-size_1-of-1">
              <div class="slds-grid slds-wrap slds-size_1-of-1">
                <div
                  class="slds-col slds-size_1-of-1 slds-large-size_1-of-1 slds-align_absolute-center slds-p-top_medium"
                >
                  <div class="header-column">
                    <p class="slds-tile__title slds-text-color_weak">
                      {balanceTitle}
                    </p>
                    <p class="slds-item_label">{availableBalance}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <footer class="slds-card__footer">
            <span class="lastUpdated">Last Updated {timestamp}</span>
          </footer>
        </template>
      </template>
    </article>
  </template>
  <template if:false={displayContent}>
    <article class="balances slds-card slds-m-bottom_small">
      <div class="slds-card__body">
        <p class="slds-var-p-around_small">
          Don’t worry, it’s not broken. To view this you need a higher
          permission level.
        </p>
      </div>
    </article>
  </template>
</template>
