<template>
  <template lwc:if={displayContent}>
    <article class="slds-card slds-m-bottom_small">
      <template lwc:if={loading}>
        <div class="slds-align_absolute-center" style="height: 4rem">
          <div role="status" class="slds-spinner_inline">
            <lightning-spinner
              alternative-text="Loading"
              variant="brand"
            ></lightning-spinner>
          </div>
        </div>
      </template>
      <template lwc:else>
        <template lwc:if={hasError}>
          <c-error message={error}></c-error>
        </template>
        <template lwc:else>
          <div class="slds-grid slds-wrap" data-id="balance-container">
            <div class="slds-col slds-grid slds-size_1-of-1">
              <div class="slds-grid slds-wrap slds-size_1-of-1">
                <div
                  class="slds-col slds-size_1-of-1 slds-large-size_1-of-1 slds-align_absolute-center slds-p-top_medium"
                >
                  <div class="header-column">
                    <p class="slds-tile__title slds-text-color_weak">
                      {balanceTitle}
                      <lightning-icon
                        icon-name="utility:info"
                        size="xx-small"
                        class="tooltip"
                        onclick={handleInfoModal}
                      ></lightning-icon>
                    </p>
                    <p class="slds-item_label">{availableBalance}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <footer class="slds-card__footer">
            <span class="lastUpdated">Last Updated {timestamp}</span>
          </footer>
          <template lwc:if={showInfoModal}>
            <section role="dialog" class="slds-modal slds-fade-in-open">
              <div class="slds-modal__container">
                <header class="slds-modal__header modal-header">
                  <lightning-icon
                    icon-name="utility:close"
                    onclick={handleInfoModal}
                    class="slds-button slds-button_icon slds-modal__close close-modal"
                  ></lightning-icon>
                  <h2 class="slds-modal__title slds-hyphenate">
                    What does {balanceTitle} mean?
                  </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                  <span>
                    <p class="slds-text-title_bold">
                      The amount shown is indicative of the amount you may be
                      able to use but may not be what is actually available.
                    </p>
                    <br />
                    The amount shown is indicative of the amount you may be able
                    to use in your {productTitle} account. This amount, when
                    shown at an ATM or on a receipt, may have a different label
                    such as 'Funds' or 'Balance'. Regardless, the amount shown
                    may not be what is actually available because:
                    <ul
                      class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium"
                    >
                      <li>
                        some transactions may not have updated the amount shown
                        (e.g. reversals)
                      </li>
                      <li>
                        some transactions may have updated the amount shown but
                        are not yet fully processed (e.g. pending transactions),
                        and/or
                      </li>
                      <li>
                        we may not process transactions at the time, on the day
                        or in the order that they are made.
                      </li>
                    </ul>
                    If you proceed with a transaction when there may be
                    insufficient funds, your account may go overdrawn or the
                    transaction may be declined.
                  </span>
                </div>
                <footer class="slds-modal__footer">
                  <button
                    class="slds-button slds-button_neutral"
                    onclick={handleInfoModal}
                  >
                    Close
                  </button>
                </footer>
              </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
          </template>
        </template>
      </template>
    </article>
  </template>
  <template lwc:else>
    <article class="balances slds-card slds-m-bottom_small">
      <div class="slds-card__body">
        <p class="slds-var-p-around_small">
          Don’t worry, it’s not broken. To view this you need a higher
          permission level.
        </p>
      </div>
    </article>
  </template>
</template>
