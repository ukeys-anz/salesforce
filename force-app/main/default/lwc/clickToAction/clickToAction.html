<template>
  <article class="articleHeight slds-card slds-m-bottom_small">
    <h1 class="card-title-header">
      <div class="slds-grid slds-wrap">
        <div class="slds-col slds-grid slds-size_1-of-1">
          <div class="slds-grid slds-wrap slds-size_1-of-1">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <div class="heading-font">
                <lightning-icon
                  icon-name={iconName}
                  size="small"
                  class="slds-m-right_small"
                ></lightning-icon>
                {title}
              </div>
            </div>

            <div
              class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_xxx-small slds-text-align_right"
            >
              <lightning-button
                label={buttonName}
                title={buttonName}
                onclick={handleClick}
                class="slds-m-left_x-small"
                slot="actions"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </h1>
  </article>
</template>
