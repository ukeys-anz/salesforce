<!-- Rendered in the Person Account -->
<!-- sldsValidatorIgnore -->
<template>
  <template lwc:if={hasPermissionIssue}>
    <c-error
      permission-issue={hasPermissionIssue}
      error-image-url={errorImageUrl}
    ></c-error>
  </template>
  <template lwc:elseif={hasError}>
    <c-error message={errorMsg}></c-error>
  </template>
  <template lwc:elseif={showHomeLoan}>
    <template for:each={financialAccounts} for:item="finAccount">
      <article
        class="financialAccountCardSize slds-card"
        key={finAccount.account_number}
      >
        <h1 class="card-title" data-id="component-title">
          <lightning-icon
            icon-name="custom:custom107"
            size="medium"
            class="slds-m-right_small cicon"
          ></lightning-icon>
          Loan
          <p class="sub-title">
            {finAccount.finserv_product_display_name}
            <lightning-icon
              src={finAccount.anzIcon}
              size="small"
              class="slds-m-left_x-small"
            ></lightning-icon>
          </p>
        </h1>
        <div
          class="slds-card__body slds-card__body_inner"
          data-id="fin-account"
        >
          <article class="slds-card">
            <div class="slds-grid slds-p-around_xx-small">
              <header class="slds-has-flexi-truncate">
                <h2 class="card-heading-bold">
                  <a
                    onclick={navigateToRecordViewPage}
                    data-id={finAccount.id}
                    class="slds-truncate"
                    title={finAccount.account_name}
                  >
                    <span>{finAccount.account_name}</span>
                  </a>
                </h2>
              </header>
            </div>
            <div class="slds-grid slds-wrap">
              <div class="slds-col slds-size_1-of-1">
                <div class="slds-grid slds-wrap">
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                  >
                    <p class="card-heading-font">Account Number</p>
                    <p class="card-heading-value">
                      {finAccount.account_number}
                    </p>
                  </div>
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small slds-text-align_right"
                  >
                    <div>
                      <p class="card-heading-font">
                        Loan Balance
                        <lightning-icon
                          icon-name="utility:info"
                          size="xx-small"
                          class="tooltip"
                          data-field="loan_balance"
                          data-id={finAccount.linkedProductCode}
                          onclick={handleInfoModal}
                        ></lightning-icon>
                      </p>
                      <p data-test-id="balance">
                        <lightning-formatted-number
                          value={finAccount.balances.current_balance.value}
                          format-style="currency"
                          data-id="amount"
                          class="fontstyle"
                        ></lightning-formatted-number>
                      </p>
                    </div>
                  </div>
                </div>
                <div class="slds-grid slds-wrap slds-p-top_medium">
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                  >
                    <p class="card-heading-font">Interest Rate</p>
                    <p class="fontstyle" data-test-id="interestrate">
                      {finAccount.loan_details.interests.rate}% p.a.
                    </p>
                  </div>
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small slds-text-align_right"
                  >
                    <div>
                      <p class="card-heading-font">
                        Redraw Amount
                        <lightning-icon
                          icon-name="utility:info"
                          size="xx-small"
                          class="tooltip"
                          data-field="redraw_amount"
                          data-id={finAccount.linkedProductCode}
                          onclick={handleInfoModal}
                        ></lightning-icon>
                      </p>
                      <p data-test-id="amount">
                        <lightning-formatted-number
                          value={finAccount.loan_details.redrawAvailable}
                          format-style="currency"
                          data-id="redraw_amount"
                          class="fontstyle"
                        ></lightning-formatted-number>
                      </p>
                    </div>
                  </div>
                </div>
                <div
                  class="slds-grid slds-wrap slds-p-top_medium"
                  data-id="offsetAccountDetails"
                >
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                  >
                    <p class="card-heading-font">
                      Linked Offset
                      <lightning-helptext
                        class="tooltip"
                        content="Offset uses the money in an eligible account to offset the loan balance - reducing the interest paid."
                      ></lightning-helptext>
                    </p>
                    <template lwc:if={finAccount.isAnzPlusAccount}>
                      <p class="fontstyle">
                        <template lwc:if={hasOffsetError}>
                          <lightning-icon
                            icon-name="utility:error"
                            size="x-small"
                            class="slds-m-right_x-small"
                          ></lightning-icon>
                          <span>Error. Refresh Page</span>
                        </template>
                        <template lwc:else>
                          <p lwc:if={finAccount.isOffsetListEmpty}>No Offset</p>
                          <p lwc:else data-test-id="offsetAccount">
                            <template
                              for:each={finAccount.offsetDetails}
                              for:item="offsetValues"
                            >
                              <a
                                onclick={navigateToRecordViewPage}
                                data-id={offsetValues.financialAccountId}
                                class="slds-truncate"
                                title={offsetValues.financialAccountNumber}
                                key={offsetValues.financialAccountId}
                              >
                                <span
                                  >{offsetValues.financialAccountNumber}</span
                                ><br />
                              </a>
                            </template>
                          </p>
                        </template>
                      </p>
                    </template>

                    <template lwc:else>
                      <p class="fontstyle">Unknown - refer to CAP</p>
                    </template>
                  </div>

                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small slds-text-align_right"
                  >
                    <p class="card-heading-font">
                      Term
                      <lightning-helptext
                        class="tooltip"
                        content="As of the loan commencement or the date certain changes were made to the loan."
                      ></lightning-helptext>
                    </p>
                    <p data-test-id="term" class="fontstyle">
                      {finAccount.loanTerm}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
        <footer class="slds-card__footer slds-p-bottom_large">
          <span class="lastUpdated" data-test-id="last-updated-time"
            >Last Updated {finAccount.lastModifiedTimestamp}</span
          >
        </footer>
      </article>
    </template>
  </template>
  <template lwc:else>
    <article class="financialAccountCardSize slds-card">
      <h1 class="card-title" data-id="component-title">
        <lightning-icon
          icon-name="custom:custom107"
          size="medium"
          class="slds-m-right_small cicon"
        ></lightning-icon>
        Loan Account
      </h1>
      <div
        class="slds-card__body slds-card__body_inner emptyCard slds-text-align_center"
        data-id="fin-account"
      >
        Customer has no active loan accounts
      </div>
      <footer class="slds-card__footer slds-p-bottom_large">
        <span class="lastUpdated" data-test-id="last-updated-time"
          >Last Updated {timestamp}</span
        >
      </footer>
    </article>
  </template>
  <template lwc:if={showInfoModal}>
    <c-dynamic-tooltip-util
      header-title={headerTitle}
      resource-name={tooltipCode}
      product-name={tooltipCode}
      onclosemodal={closeModal}
    ></c-dynamic-tooltip-util>
  </template>
</template>
