<!-- Rendered in the Person Account -->
<!-- sldsValidatorIgnore -->
<template>
  <template lwc:if={hasPermissionIssue}>
    <c-error
      permission-issue={hasPermissionIssue}
      error-image-url={errorImageUrl}
    ></c-error>
  </template>
  <template lwc:elseif={hasError}>
    <c-error message={errorMsg}></c-error>
  </template>
  <template lwc:elseif={showHomeLoan}>
    <template for:each={financialAccounts} for:item="finAccount">
      <article
        class="financialAccountCardSize slds-card"
        key={finAccount.account_number}
      >
        <h1 class="card-title" data-id="component-title">
          <lightning-icon
            icon-name="custom:custom107"
            size="medium"
            class="slds-m-right_small cicon"
          ></lightning-icon>
          Loan - {finAccount.product_details.name} Account
        </h1>
        <div
          class="slds-card__body slds-card__body_inner"
          data-id="fin-account"
        >
          <article class="slds-card">
            <div class="slds-grid slds-p-around_xx-small">
              <header class="slds-has-flexi-truncate">
                <h2 class="card-heading-bold">
                  <a
                    onclick={navigateToRecordViewPage}
                    data-id={finAccount.recordId}
                    class="slds-truncate"
                    title={finAccount.account_name}
                  >
                    <span>{finAccount.account_name}</span>
                  </a>
                </h2>
              </header>
            </div>
            <div class="slds-grid slds-wrap">
              <div class="slds-col slds-size_1-of-1">
                <div class="slds-grid slds-wrap">
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                  >
                    <p class="card-heading-font">Account Number</p>
                    <p class="card-heading-value">
                      {finAccount.account_number}
                    </p>
                  </div>
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small slds-text-align_right"
                  >
                    <div>
                      <p class="card-heading-font">
                        Loan Balance
                        <lightning-icon
                          icon-name="utility:info"
                          size="xx-small"
                          class="tooltip"
                          onclick={handleBalanceModal}
                        ></lightning-icon>
                      </p>
                      <p data-test-id="balance">
                        <lightning-formatted-number
                          value={finAccount.balances.current_balance.value}
                          format-style="currency"
                          data-id="amount"
                          class="fontstyle"
                        ></lightning-formatted-number>
                      </p>
                    </div>
                  </div>
                </div>
                <div class="slds-grid slds-wrap slds-p-top_medium">
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-var-p-around_small"
                  >
                    <p class="card-heading-font">Interest Rate</p>
                    <p class="fontstyle" data-test-id="interestrate">
                      {finAccount.loan_details.interests.rate}% p.a.
                    </p>
                  </div>
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-var-p-around_small slds-text-align_center"
                  >
                    <p class="card-heading-font">
                      Term
                      <lightning-helptext
                        class="tooltip"
                        content="As of the loan commencement or the date certain changes were made to the loan."
                      ></lightning-helptext>
                    </p>
                    <p data-test-id="term" class="fontstyle">
                      {finAccount.loanTerm}
                    </p>
                  </div>
                  <div
                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-var-p-around_small slds-text-align_right"
                  >
                    <div>
                      <p class="card-heading-font">
                        Redraw Amount
                        <lightning-icon
                          icon-name="utility:info"
                          size="xx-small"
                          class="tooltip"
                          onclick={handleRedrawAvailableModal}
                        ></lightning-icon>
                      </p>
                      <p data-test-id="amount">
                        <lightning-formatted-number
                          value={finAccount.loan_details.redrawAvailable}
                          format-style="currency"
                          data-id="redraw_amount"
                          class="fontstyle"
                        ></lightning-formatted-number>
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
        <footer class="slds-card__footer slds-p-bottom_large">
          <span class="lastUpdated" data-test-id="last-updated-time"
            >Last Updated {finAccount.lastModifiedTimestamp}</span
          >
        </footer>
      </article>
    </template>
  </template>
  <template lwc:else>
    <article class="financialAccountCardSize slds-card">
      <h1 class="card-title" data-id="component-title">
        <lightning-icon
          icon-name="custom:custom107"
          size="medium"
          class="slds-m-right_small cicon"
        ></lightning-icon>
        Loan Account
      </h1>
      <div
        class="slds-card__body slds-card__body_inner emptyCard slds-text-align_center"
        data-id="fin-account"
      >
        Customer has no active loan accounts
      </div>
      <footer class="slds-card__footer slds-p-bottom_large">
        <span class="lastUpdated" data-test-id="last-updated-time"
          >Last Updated {timestamp}</span
        >
      </footer>
    </article>
  </template>
  <template lwc:if={showBalanceModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header modal-header">
          <lightning-icon
            icon-name="utility:close"
            onclick={handleBalanceModal}
            class="slds-button slds-button_icon slds-modal__close close-modal"
          ></lightning-icon>
          <h2 class="slds-modal__title slds-hyphenate">
            What does Loan Balance mean?
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <span>
            <p class="slds-text-title_bold">
              Loan Balance is indicative of the amount you owe.
            </p>
            <br />
            It generally reflects money in or out but:
            <ul class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium">
              <li>
                some transactions that have occurred may not have updated the
                amount shown; and
              </li>
              <li>
                some transactions that have occurred may have updated the amount
                shown but are not yet processed (e.g. cheques deposited, funds
                transfers in) or are awaiting for bank decision (e.g.
                transactions which may be blocked or refused, accounts with
                blocks).
              </li>
            </ul>
          </span>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleBalanceModal}
          >
            Close
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <!--Added changes here-->
  <template lwc:if={showRedrawAvailableModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header modal-header">
          <lightning-icon
            icon-name="utility:close"
            onclick={handleRedrawAvailableModal}
            class="slds-button slds-button_icon slds-modal__close close-modal"
          ></lightning-icon>
          <h2 class="slds-modal__title slds-hyphenate">
            What does Redraw Amount mean?
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <span>
            <p class="slds-text-title_bold">
              This is an indicative amount of how much you may be able to redraw
              at any time. It’s generally the total of all the payments made
              minus all the payments required to have been made, minus amounts
              that’ve already been redrawn.
            </p>
            <br />
            <p>
              Some or all of it may not be available right away, or in some
              circumstances, at all. There are a number of reasons for this.
            </p>
            <br />
            <p>You may not be able to redraw extra payments if:</p>
            <ul class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium">
              <li>
                You've paid us everything owing under this contract, or your
                Loan Balance is positive
              </li>
              <li>
                You try to redraw using a method your Loan Account does not
                support
              </li>
              <li>You have an overdue payment, or a Default has happened</li>
              <li>
                If there is more than one borrower:
                <ul class="slds-list_dotted">
                  <li>One of you has asked us that redraw be blocked or</li>
                  <li>
                    One of you has asked us that both of you have to approve a
                    redraw and the other borrower doesn't approve the redraw or
                  </li>
                </ul>
              </li>
              <li>
                Transactions are delayed, blocked or not being processed for any
                reason.
              </li>
            </ul>
            <p>
              See ‘Redraw’ and other terms in the ANZ Plus Home Loan T&Cs for
              more details.
            </p>
          </span>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleRedrawAvailableModal}
          >
            Close
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
