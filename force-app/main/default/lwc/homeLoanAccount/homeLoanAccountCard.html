<!-- Rendered in the Person Account -->
<!-- sldsValidatorIgnore -->
<template>
  <template lwc:if={hasPermissionIssue}>
    <c-error
      permission-issue={hasPermissionIssue}
      error-image-url={errorImageUrl}
    ></c-error>
  </template>
  <template lwc:elseif={hasError}>
    <c-error message={errorMsg}></c-error>
  </template>
  <template lwc:elseif={financialAccountList}>
    <template lwc:if={financialAccounts}>
      <template for:each={financialAccounts} for:item="finAccount">
        <article class="homeLoanAccount slds-card" key={finAccount.Id}>
          <h1 class="card-title" data-id="component-title">
            <lightning-icon
              icon-name="custom:custom107"
              size="medium"
              class="slds-m-right_small cicon"
            ></lightning-icon>
            Loan - {finAccount.product_details.name} Account
          </h1>
          <div
            class="slds-card__body slds-card__body_inner"
            data-id="fin-account"
          >
            <article class="slds-card">
              <div class="slds-grid">
                <header class="slds-has-flexi-truncate slds-var-p-around_small">
                  <h2 class="slds-card__header-title">
                    <a
                      onclick={navigateToRecordViewPage}
                      data-id={finAccount.recordId}
                      class="slds-truncate"
                      title={finAccount.account_name}
                    >
                      <span>{finAccount.account_name}</span>
                    </a>
                    <span
                      lwc:if={finAccount.accountActive}
                      class="slds-badge slds-theme_success"
                      >Open</span
                    >
                    <span lwc:else class="slds-badge slds-theme_error"
                      >Closed</span
                    >
                  </h2>
                </header>
              </div>
              <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                  <div class="slds-m-top_small">
                    <img class="loan-image" src={loanImageUrl} />
                  </div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                  <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                      <p class="slds-text-color_weak slds-p-right_xx-small">
                        Account Number
                      </p>
                      <p class="slds-text-heading_medium">
                        {finAccount.account_number}
                      </p>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                      <p class="slds-text-color_weak">
                        Loan Balance
                        <lightning-icon
                          icon-name="utility:info"
                          size="xx-small"
                          class="tooltip"
                          onclick={handleBalanceModal}
                        ></lightning-icon>
                      </p>
                      <p
                        class="slds-text-heading_medium"
                        data-test-id="balance"
                      >
                        <lightning-formatted-number
                          value={finAccount.balances.current_balance.value}
                          format-style="currency"
                          data-id="amount"
                        ></lightning-formatted-number>
                      </p>
                    </div>
                  </div>
                  <div class="slds-grid slds-gutters slds-p-top_medium">
                    <div class="slds-col slds-size_1-of-2">
                      <p class="slds-text-color_weak slds-p-right_xx-small">
                        Payments Made
                        <lightning-helptext
                          class="tooltip"
                          content="Calculated by subtracting Loan Balance from Loan Amount. Amount may also include fees and charges you have paid that have been applied to the Loan Balance."
                        ></lightning-helptext>
                      </p>
                      <p
                        class="slds-text-heading_medium"
                        data-test-id="payment"
                      >
                        <lightning-formatted-number
                          value={finAccount.paidOff}
                          format-style="currency"
                          data-id="amount"
                        ></lightning-formatted-number>
                      </p>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                      <p class="slds-text-color_weak">Interest Rate</p>
                      <p
                        class="slds-text-heading_medium"
                        data-test-id="interestrate"
                      >
                        {finAccount.loan_details.interests.rate}% p.a.
                      </p>
                    </div>
                  </div>
                  <div class="slds-grid slds-gutters slds-p-top_medium">
                    <div class="slds-col slds-size_1-of-2">
                      <p class="slds-text-color_weak slds-p-right_xx-small">
                        Minimum Repayment
                        <lightning-helptext
                          class="tooltip"
                          content="This is your Repayment Amount under your credit contract. Does not include any arrears (if applicable)."
                        ></lightning-helptext>
                      </p>
                      <p
                        class="slds-text-heading_medium"
                        data-test-id="minirepayment"
                      >
                        <lightning-formatted-number
                          value={finAccount.loan_details.repayment_amount.value}
                          format-style="currency"
                          data-id="amount "
                        ></lightning-formatted-number>
                      </p>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                      <p class="slds-text-color_weak">Next Repayment</p>
                      <p
                        class="slds-text-heading_medium"
                        data-test-id="nextrepayment"
                      >
                        {finAccount.nextRepayment}
                      </p>
                    </div>
                  </div>
                </div>
              </div>
              <footer class="slds-card__footer account-footer">
                <span class="lastUpdated" data-test-id="last-updated-time"
                  >Last Updated {finAccount.lastModifiedTimestamp}</span
                >
              </footer>
            </article>
          </div>
        </article>
      </template>
    </template>
  </template>

  <template lwc:if={showBalanceModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header modal-header">
          <lightning-icon
            icon-name="utility:close"
            onclick={handleBalanceModal}
            class="slds-button slds-button_icon slds-modal__close close-modal"
          ></lightning-icon>
          <h2 class="slds-modal__title slds-hyphenate">
            What does Loan Balance mean?
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <span>
            <p class="slds-text-title_bold">
              Loan Balance is indicative of the amount you owe.
            </p>
            <br />
            It generally reflects money in or out but:
            <ul class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium">
              <li>
                some transactions that have occurred may not have updated the
                amount shown; and
              </li>
              <li>
                some transactions that have occurred may have updated the amount
                shown but are not yet processed (e.g. cheques deposited, funds
                transfers in) or are awaiting for bank decision (e.g.
                transactions which may be blocked or refused, accounts with
                blocks).
              </li>
            </ul>
          </span>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleBalanceModal}
          >
            Close
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
