<!-- Rendered on the Financial Account -->
<!-- sldsValidatorIgnore -->
<template>
  <template lwc:if={hasPermissionIssue}>
    <c-error permission-issue={hasPermissionIssue}></c-error>
  </template>
  <template lwc:elseif={singleFinAccount}>
    <article class="homeLoanAccount slds-card">
      <div class="slds-section slds-is-open">
        <h1 class="slds-section__title slds-theme_shade">
          <lightning-icon
            icon-name="custom:custom107"
            size="medium"
            class="slds-m-right_small cicon"
          ></lightning-icon>
          {componentTitle}
          <p class="sub-title">
            {singleFinAccount.finserv_product_display_name}
          </p>
        </h1>
        <div
          aria-hidden="false"
          class="slds-section__content"
          data-id="fin-details"
        >
          <div class="slds-grid">
            <header class="slds-has-flexi-truncate slds-var-p-around_small">
              <h2 class="slds-card__header-title">
                <template for:each={accountOwnersList} for:item="eachOwner">
                  <a
                    onclick={navigateToRecordViewPage}
                    data-id={eachOwner.Id}
                    class="slds-truncate"
                    title={eachOwner.Name}
                    key={eachOwner.Id}
                  >
                    <span>{eachOwner.Name}</span>
                  </a>
                  <template lwc:if={eachOwner.ShowSeparator}>
                    &nbsp;&amp;&nbsp;
                  </template>
                </template>
                <span
                  lwc:if={singleFinAccount.accountActive}
                  class="slds-badge slds-theme_success"
                  >Open</span
                >
                <span lwc:else class="slds-badge slds-theme_error">Closed</span>
              </h2>
            </header>
          </div>

          <div class="slds-grid slds-gutters slds-wrap">
            <div
              class="slds-col slds-large-size_1-of-2 slds-size_1-of-1 slds-medium-size_1-of-1"
            >
              <div class="slds-m-top_small slds-align_absolute-center">
                <img class="loan-image" src={loanImageUrl} width="75%" />
              </div>
            </div>
            <div
              class="slds-col slds-large-size_1-of-2 slds-size_1-of-1 slds-medium-size_1-of-1 alignment"
            >
              <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                  <p class="slds-text-color_weak slds-p-right_xx-small">
                    Account Number
                  </p>
                  <p class="slds-text-heading_medium">
                    {singleFinAccount.account_number}
                  </p>
                </div>
                <div class="slds-col slds-size_1-of-2">
                  <p class="slds-text-color_weak">
                    Loan Balance
                    <lightning-icon
                      icon-name="utility:info"
                      size="xx-small"
                      class="tooltip tooltip-margin-modal"
                      data-field="loan_balance"
                      data-id={singleFinAccount.linkedProductCode}
                      onclick={handleInfoModal}
                    ></lightning-icon>
                  </p>
                  <p class="slds-text-heading_medium" data-test-id="balance">
                    <lightning-formatted-number
                      value={singleFinAccount.balances.current_balance.value}
                      format-style="currency"
                      data-id="amount"
                    ></lightning-formatted-number>
                  </p>
                </div>
              </div>

              <div class="slds-grid slds-gutters slds-p-top_xx-large slds-wrap">
                <div class="slds-col slds-size_1-of-2">
                  <p class="slds-text-color_weak">
                    Redraw Amount
                    <lightning-icon
                      icon-name="utility:info"
                      size="xx-small"
                      class="tooltip tooltip-margin-modal"
                      data-field="redraw_amount"
                      data-id={singleFinAccount.linkedProductCode}
                      onclick={handleInfoModal}
                    ></lightning-icon>
                  </p>
                  <p class="slds-text-heading_medium" data-test-id="amount">
                    <lightning-formatted-number
                      value={singleFinAccount.loan_details.redrawAvailable}
                      format-style="currency"
                      data-id="redraw_amount"
                    ></lightning-formatted-number>
                  </p>
                </div>
                <div class="slds-col slds-size_1-of-2">
                  <p class="slds-text-color_weak">
                    Payments Made
                    <lightning-helptext
                      class="tooltip tooltip-margin"
                      content="Calculated by subtracting Loan Balance from Loan Amount. Amount may also include fees and charges you have paid that have been applied to the Loan Balance."
                    ></lightning-helptext>
                  </p>
                  <p class="slds-text-heading_medium" data-test-id="payment">
                    <lightning-formatted-number
                      value={singleFinAccount.paidOff}
                      format-style="currency"
                      data-id="paidoff"
                    ></lightning-formatted-number>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <lightning-accordion
        allow-multiple-sections-open
        active-section-name={activeSections}
        class="accordionSection"
      >
        <lightning-accordion-section name="loandetails" label="Loan Details">
          <div class="slds-grid slds-wrap slds-var-p-around_small">
            <div class="slds-col slds-grid slds-size_1-of-3">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Interest Rate
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="interestrate"
                >
                  {singleFinAccount.loan_details.interests.rate}% p.a.
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Rate Type
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="ratetype"
                >
                  {singleFinAccount.rateType}
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
              <div class="header-column r">
                <p class="slds-text-color_weak">
                  Loan Amount
                  <lightning-helptext
                    class="tooltip tooltip-margin"
                    content="As of the loan commencement or the date certain changes were made to the loan."
                  ></lightning-helptext>
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="loanamount"
                >
                  <lightning-formatted-number
                    value={singleFinAccount.loan_details.loan_amount.value}
                    format-style="currency"
                    data-id="loan-amount"
                  ></lightning-formatted-number>
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3 rowgap">
              <div class="header-column">
                <p class="slds-text-color_weak">
                  Term
                  <lightning-helptext
                    class="tooltip tooltip-margin"
                    content="As of the loan commencement or the date certain changes were made to the loan."
                  ></lightning-helptext>
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="minirepayment"
                >
                  {singleFinAccount.loanTerm}
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3 rowgap">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Settlement Date
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="settlementdate"
                >
                  {singleFinAccount.settlementDate}
                </p>
              </div>
            </div>

            <div class="slds-col slds-grid slds-size_1-of-3 rowgap">
              <div class="header-column" data-id="offsetAccounts">
                <p class="slds-text-color_weak">
                  Linked Offset
                  <lightning-helptext
                    class="tooltip tooltip-margin"
                    content="Offset uses the money in an eligible account to offset the loan balance - reducing the interest paid."
                  ></lightning-helptext>
                </p>
                <template lwc:if={singleFinAccount.isAnzPlusAccount}>
                  <p class="slds-text-heading_small slds-align_absolute-center">
                    <template lwc:if={hasOffsetError}>
                      <lightning-icon
                        icon-name="utility:error"
                        size="x-small"
                        class="slds-m-right_x-small"
                      ></lightning-icon>
                      <span>Error. Refresh Page</span>
                    </template>
                    <template lwc:else>
                      <p lwc:if={showOffsetData} data-test-id="offsetAccount">
                        <template for:each={offsetList} for:item="offsetValues">
                          <a
                            onclick={navigateToRecordViewPage}
                            data-id={offsetValues.financialAccountId}
                            class="slds-truncate"
                            title={offsetValues.financialAccountNumber}
                            key={offsetValues.financialAccountId}
                          >
                            <span>{offsetValues.financialAccountNumber}</span
                            ><br />
                          </a>
                        </template>
                      </p>
                      <p
                        lwc:else
                        class="slds-text-color_weak slds-align_absolute-center"
                      >
                        No Offset
                      </p>
                    </template>
                  </p>
                </template>
                <template lwc:else>
                  <p class="fontstyle">Unknown - refer to CAP</p>
                </template>
              </div>
            </div>

            <div class="slds-col slds-grid slds-size_1-of-3 rowgap">
              <div class="header-column">
                <p class="slds-text-color_weak">Property Use</p>
                <p class="slds-text-heading_small slds-align_absolute-center">
                  {singleFinAccount.loan_details.property_use_type}
                </p>
              </div>
            </div>
          </div>
        </lightning-accordion-section>
        <lightning-accordion-section
          name="repaymentdetails"
          label="Repayment Details"
        >
          <div class="slds-grid slds-wrap slds-var-p-around_small">
            <div class="slds-col slds-grid slds-size_1-of-4">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Next Repayment
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="nextrepayment"
                >
                  {singleFinAccount.nextRepayment}
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-4">
              <div class="header-column">
                <p class="slds-text-color_weak">
                  Minimum Repayment
                  <lightning-helptext
                    class="tooltip tooltip-margin"
                    content="This is your Repayment Amount under your credit contract. Does not include any arrears (if applicable)."
                  ></lightning-helptext>
                </p>
                <p class="slds-text-heading_small" data-test-id="minirepayment">
                  <lightning-formatted-number
                    class="slds-align_absolute-center"
                    value={singleFinAccount.loan_details.repayment_amount.value}
                    format-style="currency"
                    data-id="repayment-amount"
                  ></lightning-formatted-number>
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-4">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Repayment Frequency
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="nextrepayment"
                >
                  {singleFinAccount.repaymentFrequency}
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-4">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Repayment Type
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="nextrepayment"
                >
                  {singleFinAccount.repaymentType}
                </p>
              </div>
            </div>
          </div>
        </lightning-accordion-section>
      </lightning-accordion>
      <div class="slds-card__body slds-card__body_inner">
        <article class="slds-card">
          <footer class="slds-card__footer account-footer">
            <span class="lastUpdated" data-test-id="last-updated-time"
              >Last Updated {singleFinAccount.lastModifiedTimestamp}</span
            >
          </footer>
        </article>
      </div>
    </article>
  </template>
  <template lwc:if={hasError}>
    <c-error message={errorMsg}></c-error>
  </template>

  <template lwc:if={showInfoModal}>
    <c-dynamic-tooltip-util
      header-title={headerTitle}
      resource-name={tooltipCode}
      product-name={tooltipCode}
      onclosemodal={closeModal}
    ></c-dynamic-tooltip-util>
  </template>
</template>
