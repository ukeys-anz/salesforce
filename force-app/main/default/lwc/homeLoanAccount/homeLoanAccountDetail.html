<!-- Rendered on the Financial Account -->
<!-- sldsValidatorIgnore -->
<template>
  <template lwc:if={hasPermissionIssue}>
    <c-error permission-issue={hasPermissionIssue}></c-error>
  </template>
  <template lwc:elseif={singleFinAccount}>
    <article class="homeLoanAccount slds-card">
      <div class="slds-section slds-is-open">
        <h1 class="slds-section__title slds-theme_shade">
          <lightning-icon
            icon-name="custom:custom107"
            size="medium"
            class="slds-m-right_small cicon"
          ></lightning-icon>
          Loan - {singleFinAccount.product_details.name} Account
        </h1>
        <div
          aria-hidden="false"
          class="slds-section__content"
          data-id="fin-details"
        >
          <div class="slds-grid">
            <header class="slds-has-flexi-truncate slds-var-p-around_small">
              <h2 class="slds-card__header-title">
                <a
                  onclick={navigateToRecordViewPage}
                  data-id={ownerOne.id}
                  class="slds-truncate"
                  title={ownerOne.name}
                >
                  <span>{ownerOne.name}</span>
                </a>
                <template lwc:if={multiparty}>
                  &nbsp;&&nbsp;
                  <a
                    onclick={navigateToRecordViewPage}
                    data-id={ownerTwo.id}
                    class="slds-truncate"
                    title={ownerTwo.name}
                  >
                    <span>{ownerTwo.name}</span>
                  </a>
                </template>
                <span
                  lwc:if={singleFinAccount.accountActive}
                  class="slds-badge slds-theme_success"
                  >Open</span
                >
                <span lwc:else class="slds-badge slds-theme_error">Closed</span>
              </h2>
            </header>
          </div>

          <div class="slds-grid slds-gutters slds-wrap">
            <div
              class="slds-col slds-large-size_1-of-2 slds-size_1-of-1 slds-medium-size_1-of-1"
            >
              <div class="slds-m-top_small slds-align_absolute-center">
                <img class="loan-image" src={loanImageUrl} width="75%" />
              </div>
            </div>
            <div
              class="slds-col slds-large-size_1-of-2 slds-size_1-of-1 slds-medium-size_1-of-1 alignment"
            >
              <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                  <p class="slds-text-color_weak slds-p-right_xx-small">
                    Account Number
                  </p>
                  <p class="slds-text-heading_medium">
                    {singleFinAccount.account_number}
                  </p>
                </div>
                <div class="slds-col slds-size_1-of-2">
                  <p class="slds-text-color_weak">
                    Loan Balance
                    <lightning-icon
                      icon-name="utility:info"
                      size="xx-small"
                      class="tooltip"
                      onclick={handleBalanceModal}
                    ></lightning-icon>
                  </p>
                  <p class="slds-text-heading_medium" data-test-id="balance">
                    <lightning-formatted-number
                      value={singleFinAccount.balances.current_balance.value}
                      format-style="currency"
                      data-id="amount"
                    ></lightning-formatted-number>
                  </p>
                </div>
              </div>

              <div class="slds-grid slds-gutters slds-p-top_xx-large slds-wrap">
                <div class="slds-col slds-size_1-of-2">
                  <p class="slds-text-color_weak">
                    Redraw Amount
                    <lightning-icon
                      icon-name="utility:info"
                      size="xx-small"
                      class="tooltip"
                      onclick={handleRedrawAvailableModal}
                    ></lightning-icon>
                  </p>
                  <p class="slds-text-heading_medium" data-test-id="amount">
                    <lightning-formatted-number
                      value={singleFinAccount.loan_details.redrawAvailable}
                      format-style="currency"
                      data-id="redraw_amount"
                    ></lightning-formatted-number>
                  </p>
                </div>
                <div class="slds-col slds-size_1-of-2">
                  <p class="slds-text-color_weak">
                    Payments Made
                    <lightning-helptext
                      class="tooltip"
                      content="Calculated by subtracting Loan Balance from Loan Amount. Amount may also include fees and charges you have paid that have been applied to the Loan Balance."
                    ></lightning-helptext>
                  </p>
                  <p class="slds-text-heading_medium" data-test-id="payment">
                    <lightning-formatted-number
                      value={singleFinAccount.paidOff}
                      format-style="currency"
                      data-id="paidoff"
                    ></lightning-formatted-number>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <lightning-accordion
        allow-multiple-sections-open
        active-section-name={activeSections}
        class="accordionSection"
      >
        <lightning-accordion-section name="loandetails" label="Loan Details">
          <div class="slds-grid slds-wrap slds-var-p-around_small">
            <div class="slds-col slds-grid slds-size_1-of-3">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Interest Rate
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="interestrate"
                >
                  {singleFinAccount.loan_details.interests.rate}% p.a.
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Rate Type
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="ratetype"
                >
                  {singleFinAccount.rateType}
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3">
              <div class="header-column r">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Loan Amount
                  <lightning-helptext
                    class="tooltip"
                    content="As of the loan commencement or the date certain changes were made to the loan."
                  ></lightning-helptext>
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="loanamount"
                >
                  <lightning-formatted-number
                    value={singleFinAccount.loan_details.loan_amount.value}
                    format-style="currency"
                    data-id="loan-amount"
                  ></lightning-formatted-number>
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-3 rowgap">
              <div class="header-column">
                <p class="slds-text-color_weak">
                  Term
                  <lightning-helptext
                    class="tooltip"
                    content="As of the loan commencement or the date certain changes were made to the loan."
                  ></lightning-helptext>
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="minirepayment"
                >
                  {singleFinAccount.loanTerm}
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_2-of-3 rowgap">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Settlement Date
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="settlementdate"
                >
                  {singleFinAccount.settlementDate}
                </p>
              </div>
            </div>
          </div>
        </lightning-accordion-section>
        <lightning-accordion-section
          name="repaymentdetails"
          label="Repayment Details"
        >
          <div class="slds-grid slds-wrap slds-var-p-around_small">
            <div class="slds-col slds-grid slds-size_1-of-4">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Next Repayment
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="nextrepayment"
                >
                  {singleFinAccount.nextRepayment}
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-4">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Minimum Repayment
                  <lightning-helptext
                    class="tooltip"
                    content="This is your Repayment Amount under your credit contract. Does not include any arrears (if applicable)."
                  ></lightning-helptext>
                </p>
                <p class="slds-text-heading_small" data-test-id="minirepayment">
                  <lightning-formatted-number
                    class="slds-align_absolute-center"
                    value={singleFinAccount.loan_details.repayment_amount.value}
                    format-style="currency"
                    data-id="repayment-amount"
                  ></lightning-formatted-number>
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-4">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Repayment Frequency
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="nextrepayment"
                >
                  {singleFinAccount.repaymentFrequency}
                </p>
              </div>
            </div>
            <div class="slds-col slds-grid slds-size_1-of-4">
              <div class="header-column">
                <p class="slds-text-color_weak slds-align_absolute-center">
                  Repayment Type
                </p>
                <p
                  class="slds-text-heading_small slds-align_absolute-center"
                  data-test-id="nextrepayment"
                >
                  {singleFinAccount.repaymentType}
                </p>
              </div>
            </div>
          </div>
        </lightning-accordion-section>
      </lightning-accordion>
      <div class="slds-card__body slds-card__body_inner">
        <article class="slds-card">
          <footer class="slds-card__footer account-footer">
            <span class="lastUpdated" data-test-id="last-updated-time"
              >Last Updated {singleFinAccount.lastModifiedTimestamp}</span
            >
          </footer>
        </article>
      </div>
    </article>
  </template>
  <template lwc:if={hasError}>
    <c-error message={errorMsg}></c-error>
  </template>

  <template lwc:if={showBalanceModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header modal-header">
          <lightning-icon
            icon-name="utility:close"
            onclick={handleBalanceModal}
            class="slds-button slds-button_icon slds-modal__close close-modal"
          ></lightning-icon>
          <h2 class="slds-modal__title slds-hyphenate">
            What does Loan Balance mean?
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <span>
            <p class="slds-text-title_bold">
              Loan Balance is indicative of the amount you owe.
            </p>
            <br />
            It generally reflects money in or out but:
            <ul class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium">
              <li>
                some transactions that have occurred may not have updated the
                amount shown; and
              </li>
              <li>
                some transactions that have occurred may have updated the amount
                shown but are not yet processed (e.g. cheques deposited, funds
                transfers in) or are awaiting for bank decision (e.g.
                transactions which may be blocked or refused, accounts with
                blocks).
              </li>
            </ul>
          </span>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleBalanceModal}
          >
            Close
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <!--Added changes here-->
  <template lwc:if={showRedrawAvailableModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header modal-header">
          <lightning-icon
            icon-name="utility:close"
            onclick={handleRedrawAvailableModal}
            class="slds-button slds-button_icon slds-modal__close close-modal"
          ></lightning-icon>
          <h2 class="slds-modal__title slds-hyphenate">
            What does Redraw Amount mean?
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <span>
            <p class="slds-text-title_bold">
              This is an indicative amount of how much you may be able to redraw
              at any time. It’s generally the total of all the payments made
              minus all the payments required to have been made, minus amounts
              that’ve already been redrawn.
            </p>
            <br />
            <p>
              Some or all of it may not be available right away, or in some
              circumstances, at all. There are a number of reasons for this.
            </p>
            <br />
            <p>You may not be able to redraw extra payments if:</p>
            <ul class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium">
              <li>
                You've paid us everything owing under this contract, or your
                Loan Balance is positive
              </li>
              <li>
                You try to redraw using a method your Loan Account does not
                support
              </li>
              <li>You have an overdue payment, or a Default has happened</li>
              <li>
                If there is more than one borrower:
                <ul class="slds-list_dotted">
                  <li>One of you has asked us that redraw be blocked or</li>
                  <li>
                    One of you has asked us that both of you have to approve a
                    redraw and the other borrower doesn't approve the redraw or
                  </li>
                </ul>
              </li>
              <li>
                Transactions are delayed, blocked or not being processed for any
                reason.
              </li>
            </ul>
            <p>
              See ‘Redraw’ and other terms in the ANZ Plus Home Loan T&Cs for
              more details.
            </p>
          </span>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleRedrawAvailableModal}
          >
            Close
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
