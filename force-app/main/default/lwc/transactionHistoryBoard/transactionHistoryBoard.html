<!-- sldsValidatorIgnore -->
<template>
  <article class="transactionHistoryBoard slds-card">
    <div class="card-title" data-id="component-title">
      <div class="slds-grid">
        <div class="slds-col slds-size_1-of-11 flex-override">
          <lightning-icon
            icon-name="standard:product_item_transaction"
            size="medium"
            class="slds-m-right_small"
          >
          </lightning-icon>
        </div>
        <div class="slds-col slds-size_10-of-11 flex-override">
          {componentTitle}
        </div>
      </div>
    </div>
    <div
      class="slds-card__body slds-card__body_inner padded-card"
      data-test-id="board-body"
    >
      <template lwc:if={displayContent}>
        <template lwc:if={loading}>
          <div class="slds-align_absolute-center" style="height: 4rem">
            <div role="status" class="slds-spinner_inline">
              <lightning-spinner
                alternative-text="Loading"
                variant="brand"
              ></lightning-spinner>
            </div>
          </div>
        </template>
        <template lwc:else>
          <template lwc:if={hasError}>
            <c-error message={error}></c-error>
          </template>
          <template lwc:else>
            <div class="search-section">
              <div class="slds-text-title_bold slds-m-bottom_medium">
                Transaction History
              </div>
              <div class="slds-form--inline">
                <div class="slds-form-element">
                  <lightning-input
                    type="date"
                    name="startDate"
                    data-id="startDateInput"
                    data-test-id="startDateInput"
                    label="Start Date"
                    value={startDate}
                    max={endDate}
                    onchange={handleStartDateChange}
                  >
                  </lightning-input>
                </div>
                <div class="slds-form-element">
                  <lightning-input
                    type="date"
                    name="endDate"
                    data-id="endDateInput"
                    data-test-id="endDateInput"
                    label="End Date"
                    value={endDate}
                    max={todayDate}
                    min={startDate}
                    onchange={handleEndDateChange}
                  >
                  </lightning-input>
                </div>
                <template lwc:if={disableSearch}>
                  <div class="slds-form-element">
                    <lightning-button
                      variant="brand"
                      label="Search"
                      title="Search"
                      class="slds-m-left_x-small"
                      disabled
                    ></lightning-button>
                  </div>
                </template>
                <template lwc:else>
                  <div class="slds-form-element">
                    <lightning-button
                      variant="brand"
                      label="Search"
                      title="Search"
                      onclick={handleSearch}
                      class="slds-m-left_x-small"
                    ></lightning-button>
                  </div>
                </template>
              </div>
              <button
                class="slds-button expand-collapse"
                onclick={handleExpandAll}
              >
                <template lwc:if={expandAll}>Collapse All</template>
                <template lwc:else>Expand All</template>
              </button>
            </div>
            <template lwc:if={transactionList}>
              <template for:each={transactionList} for:item="transRecord">
                <c-transaction-history-record
                  key={transRecord.transaction_id}
                  transaction-record={transRecord}
                  expand-all={expandAll}
                  show-raise-dispute={showRaiseDispute}
                  dispute-record-types-from-parent={disputeRecordTypesFromParent}
                  person-account={personAccount}
                  financial-account-id={recordId}
                  ocv-id={ocvId}
                >
                </c-transaction-history-record>
              </template>
              <template lwc:if={transactionLoadMore}>
                <div class="slds-align_absolute-center" style="height: 4rem">
                  <div role="status" class="slds-spinner_inline">
                    <lightning-spinner
                      alternative-text="Loading"
                      variant="brand"
                    ></lightning-spinner>
                  </div>
                </div>
              </template>
              <template lwc:else>
                <div class="slds-grid">
                  <div class="slds-col slds-align_absolute-center">
                    <template lwc:if={showLoadMore}>
                      <button
                        class="slds-button load-more"
                        onclick={handleLoadMore}
                      >
                        Load More
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </template>
            <template lwc:else>
              <h1 class="slds-card__header-title main-title">
                <span class="not-found">No Transactions Found</span>
              </h1>
            </template>
          </template>
        </template>
      </template>
      <template lwc:else>
        <div class="slds-text-title_bold slds-m-bottom_medium">
          Transaction History
        </div>
        <div class="slds-grid">
          <p class="field-padding">
            Don’t worry, it’s not broken. To view this you need a higher
            permission level.
          </p>
        </div>
      </template>
    </div>
  </article>
</template>
