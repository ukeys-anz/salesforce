<!-- Pill Omni Component Flex -->
<template>
  <div class="slds-var-p-bottom_small">
    <label class="slds-form-element__label">
      <abbr class="slds-required" title="required">* </abbr>Reason For
      Visit</label
    >
    <div
      class="slds-form-element__control slds-var-p-top_small underlineCustom"
    >
      <template for:each={_allValuesReason} for:item="eachValue">
        <lightning-pill
          key={eachValue.value}
          label={eachValue.label}
          class="slds-var-p-around_xx-small textblue"
        ></lightning-pill>
      </template>
    </div>
  </div>
  <div class="slds-var-p-bottom_small">
    <label class="slds-form-element__label">
      <abbr class="slds-required" title="required">* </abbr>Actual Topic</label
    >
    <div
      class="slds-form-element__control slds-var-p-top_small underlineCustom"
    >
      <template for:each={_allValuesTopic} for:item="eachValue">
        <lightning-pill
          key={eachValue.value}
          label={eachValue.label}
          class="slds-var-p-around_xx-small textblue"
        ></lightning-pill>
      </template>
    </div>
  </div>
  <div class="slds-var-p-bottom_small">
    <label class="slds-form-element__label">
      <abbr class="slds-required" title="required">* </abbr>Products</label
    >
    <div
      class="slds-form-element__control slds-var-p-top_small underlineCustom"
    >
      <template for:each={_allValuesProduct} for:item="eachValue">
        <lightning-pill
          key={eachValue.value}
          label={eachValue.label}
          class="slds-var-p-around_xx-small textblue"
        ></lightning-pill>
      </template>
    </div>
  </div>
</template>
