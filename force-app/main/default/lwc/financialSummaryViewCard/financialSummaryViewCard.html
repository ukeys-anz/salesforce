<template>
  <div class="slds-p-left_x-large" style="display: flex">
    <div class="slds-m-top_xx-small">{headerName}</div>
    <template if:true={showHelpText}>
      <lightning-helptext
        class="slds-m-left_xx-small"
        content={helpText}
      ></lightning-helptext>
    </template>
  </div>
  <br />
  <template lwc:if={showOtherValue}>
    <lightning-formatted-text
      class="slds-italic slds-p-left_x-large"
      value={headerOtherValue}
      padding="around-small"
    ></lightning-formatted-text>
  </template>
  <template lwc:elseif={showHeaderValueText}>
    <lightning-formatted-text
      class="slds-p-left_x-large slds-text-heading_x-small slds-text-title_bold"
      value={headerValue}
      padding="around-small"
    ></lightning-formatted-text>
  </template>
  <template lwc:else>
    <lightning-formatted-number
      padding="around-small"
      class="slds-p-left_x-large slds-text-heading_x-small slds-text-title_bold"
      value={headerValue}
      format-style="currency"
      currency-code="AUD"
    ></lightning-formatted-number>
  </template>
</template>
