<template>
  <div class="slds-box slds-theme_default">
    <div class="slds-card">
      <header class="slds-card__header slds-grid slds-grid_align-spread">
        <div class="slds-grid slds-align-center">
          <lightning-icon
            icon-name="standard:case"
            size="medium"
            class="slds-m-right_small"
          ></lightning-icon>

          <span
            class="slds-text-heading_small slds-align-middle slds-text-title_bold"
            >Cases</span
          >
        </div>
        <div>
          <template lwc:if={showNewButton}>
            <lightning-button
              label="New"
              onclick={handleNewCase}
            ></lightning-button>
          </template>
        </div>
      </header>

      <!-- body  -->
    </div>
    <template lwc:if={visibledata}>
      <lightning-datatable
        key-field="caseId"
        data={visibledata}
        columns={columns}
        onrowaction={handleRowAction}
      >
      </lightning-datatable>
    </template>
    <template lwc:else>
      <div class="slds-text-color_error">
        <lightning-icon
          icon-name="utility:error"
          alternative-text="error"
          title="error"
        >
        </lightning-icon>
        Error Loading Cases: {error.body.message}
      </div>
    </template>
    <!-- Pagination Contorls-->
    <div class="slds-grid slds-p-top_medium slds-grid_align-spread">
      <div class="slds-col slds-align-left">
        <lightning-button
          label="Previous"
          title="previous"
          disabled={isFirstPage}
          onclick={handlePrevious}
        ></lightning-button>
      </div>
      <div class="slds-col slds-align-right">
        <lightning-button
          label="Next"
          title="next"
          disabled={isLastPage}
          onclick={handleNext}
        ></lightning-button>
      </div>
    </div>
  </div>
</template>
