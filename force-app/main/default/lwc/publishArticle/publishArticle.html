<template>
  <lightning-quick-action-panel title="Escalate to CRC" class="maxwidth">
    <div>
      <b>Are you sure you want to publish this article?</b>
      <div if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
      </div>
    </div>

    <div slot="footer">
      <div if:false={isLoading}>
        <lightning-button
          class="btn"
          variant="neutral"
          label="Cancel"
          onclick={closeAction}
        ></lightning-button>
        <lightning-button
          class="btn"
          variant="brand"
          label="Publish"
          onclick={publish}
        ></lightning-button>
      </div>
    </div>
  </lightning-quick-action-panel>
</template>
