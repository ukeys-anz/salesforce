<template>
  <div class="slds-card">
    <template if:true={showOptions}>
      <div
        class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium slds-p-left_large"
      >
        <lightning-combobox
          label="Select a template"
          value={template}
          options={templateList}
          onchange={handleTemplateSelection}
          required
        ></lightning-combobox>
      </div>
    </template>
    <br />
    <template if:true={showTemplateDetails}>
      <div
        class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-left_large"
      >
        <lightning-input
          type="checkbox"
          label="Email"
          name="Email"
          value={isEmail}
          onchange={handleEmail}
        >
        </lightning-input>
        <lightning-input
          type="checkbox"
          label="Letter"
          name="Letter"
          value={isLetter}
          onchange={handleLetter}
        >
        </lightning-input>
      </div>
      <br />
      <lightning-datatable
        key-field="fileId"
        data={fieldData}
        columns={columns}
        oncellchange={handlelineItemUpdate}
        draft-values={draftValues}
        suppress-bottom-bar
        hide-checkbox-column
      >
      </lightning-datatable>
      <br />
      <div class="slds-float slds-align_absolute-center slds-p-top_medium">
        <lightning-button
          variant="brand"
          onclick={validateFields}
          class="saveComms"
          name="saveComms"
          label="Create Comms"
          aria-label="Press to save the form and create the comms for the case"
        ></lightning-button>
      </div>
    </template>
    <template if:true={showSuccess}>
      <lightning-icon
        icon-name="utility:success"
        alternative-text="Success!"
        variant="success"
        title="success variant xx-small"
        size="xx-small"
      ></lightning-icon>
      &nbsp; SUCCESS!!
    </template>
  </div>
  <template if:true={showModal}>
    <section
      role="dialog"
      tabindex="-1"
      class="slds-modal slds-fade-in-open slds-modal_small"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      aria-describedby="modal-content-id-1"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <lightning-button-icon
            icon-name="utility:close"
            class="slds-float_right"
            onclick={closeModal}
            alternative-text="close"
            arial-label="Press to close the dialog and return to the form"
          >
          </lightning-button-icon>
          <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
            {modalHeader}
          </h2>
        </header>
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-id-1"
        >
          <lightning-formatted-rich-text
            value={modalMessage}
          ></lightning-formatted-rich-text>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            variant="brand"
            label="Close"
            arial-label="Press to close the dialog and return to the form"
            title="Close"
            onclick={closeModal}
            class="slds-m-left_x-small"
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
