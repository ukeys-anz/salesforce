<template>
  <template if:true={isPicklist}>
    <lightning-combobox
      class="slds-size_12-of-12"
      name={omniJsonDef.name}
      label={omniJsonDef.propSetMap.label}
      value={value}
      placeholder=""
      required={isRequired}
      options={options}
      disabled={isDisabled}
      onchange={handleChange}
    >
    </lightning-combobox>
  </template>
  <template lwc:if={isText}>
    <lightning-input
      type="text"
      value={inpValue}
      label={omniJsonDef.propSetMap.label}
      required={isRequired}
      disabled={isDisabled}
      onchange={handleChange}
    >
    </lightning-input>
  </template>
</template>
