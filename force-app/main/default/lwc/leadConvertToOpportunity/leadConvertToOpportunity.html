<template>
  <lightning-spinner lwc:if={isLoading}></lightning-spinner>
  <template lwc:if={hasError}>
    <c-error message={errorMessage}></c-error>
  </template>
  <template lwc:if={isModalOpen}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="modal-heading-01"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container convertLeadContianer">
        <div class="slds-modal__header">
          <!--Start header-->
          <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
            {leadTitle}
          </h1>
          <!--End header-->
        </div>
        <template lwc:if={invalidLead}>
          <!--Invalid lead message block-->
          <div class="slds-modal__content slds-p-around_medium contentDiv">
            <lightning-card>
              <p class="modalSubText">{modalBodySubText}</p>
              <div>
                <ul class="slds-m-around_medium">
                  <template for:each={validationMessage} for:item="message">
                    <li key={message.Id}>{message.id}. {message.body}</li>
                  </template>
                </ul>
                <br />
              </div>
            </lightning-card>
          </div>
          <!--End invlaid lead message block-->
          <!--start footer-->
          <div class="slds-modal__footer">
            <lightning-button
              class="slds-button slds-var-p-around_x-small"
              variant="neutral"
              label="OK"
              title="Close"
              onclick={closeAction}
              >OK
            </lightning-button>
          </div>
          <!--End footer-->
        </template>
        <template lwc:if={validLead}>
          <!--Start MLCRM Lead details div-->
          <template lwc:if={isMLCRMlead}>
            <template lwc:if={leadDetails}>
              <div class="slds-modal__content slds-p-around_medium contentDiv">
                <!--Start Missmatched lead warning block-->
                <template lwc:if={misMatchWarning}>
                  <div class="slds-text-title">
                    <div>
                      <img src={warningSignUrl} class="imgDivPadding" />
                      <font size="2"><b>{warningMsgConstant}</b></font>
                    </div>
                    <lightning-formatted-rich-text
                      value={misMatchLeadDetailsMessage}
                    ></lightning-formatted-rich-text>
                  </div>
                </template>
                <!--End Missmatched lead warning block-->
                <!--Start Lead details page-->
                <lightning-card title="Lead Details" icon-name="standard:lead">
                  {modalBodySubText}
                  <div class="slds-var-m-around_medium">
                    <lightning-record-view-form
                      object-api-name="Lead"
                      record-id={recordId}
                    >
                      <lightning-layout>
                        <lightning-layout-item flexibility="auto">
                          <lightning-output-field
                            field-name="Name"
                          ></lightning-output-field>
                          <lightning-output-field
                            field-name="MobilePhone"
                          ></lightning-output-field>
                          <lightning-output-field
                            field-name="Home_Phone__c"
                          ></lightning-output-field>
                          <lightning-output-field
                            field-name="Work_Phone__c"
                          ></lightning-output-field>
                        </lightning-layout-item>
                        <lightning-layout-item flexibility="auto">
                          <lightning-output-field
                            field-name="FinServ__RelatedAccount__c"
                          ></lightning-output-field>
                          <lightning-output-field
                            field-name="Email"
                          ></lightning-output-field>
                          <lightning-output-field
                            field-name="Address"
                          ></lightning-output-field>
                        </lightning-layout-item>
                      </lightning-layout>
                      <div style="height: 0px" class="ml-hidden-fields">
                        <lightning-output-field
                          field-name="Street"
                        ></lightning-output-field>
                        <lightning-output-field
                          field-name="City"
                        ></lightning-output-field>
                        <lightning-output-field
                          field-name="State"
                        ></lightning-output-field>
                        <lightning-output-field
                          field-name="PostalCode"
                        ></lightning-output-field>
                        <lightning-output-field
                          field-name="Country"
                        ></lightning-output-field>
                      </div>
                    </lightning-record-view-form>
                  </div>
                </lightning-card>
                <!--End Lead details page-->
              </div>
              <!--Start MLCRM Detail page buttons-->
              <div class="slds-modal__footer">
                <lightning-button
                  class="slds-button"
                  variant="neutral"
                  label="Cancel"
                  title="Cancel"
                  onclick={cancelAction}
                ></lightning-button>
                <lightning-button
                  class="slds-button"
                  variant="neutral"
                  label="Continue"
                  title="Continue"
                  onclick={convertLeadMLCRM}
                ></lightning-button>
              </div>
              <!--End MLCRM Detail page buttons-->
            </template>
          </template>
          <!--End CCRM Lead details div-->
          <!--Start CCRM Lead details div-->
          <template lwc:if={isCCRMlead}>
            <template lwc:if={leadDetails}>
              <div class="slds-modal__content slds-p-around_medium contentDiv">
                <lightning-card title="Lead Details" icon-name="standard:lead">
                  {modalBodySubText}
                  <div class="slds-var-m-around_medium">
                    <lightning-record-form
                      object-api-name="Lead"
                      record-id={recordId}
                      fields={fields}
                      mode="readonly"
                      columns="2"
                    ></lightning-record-form>
                  </div>
                </lightning-card>
              </div>
              <!-- CCRM Detail page button-->
              <div class="slds-modal__footer">
                <lightning-button
                  class="slds-button"
                  variant="neutral"
                  label="Cancel"
                  title="Cancel"
                  onclick={cancelAction}
                ></lightning-button>
                <template lwc:if={isOrgCustomer}>
                  <lightning-button
                    class="slds-button"
                    variant="neutral"
                    label="Search Party"
                    title="Search Party"
                    onclick={searchForParty}
                  ></lightning-button>
                </template>
                <template lwc:if={isIndividual}>
                  <lightning-button
                    class="slds-button"
                    variant="neutral"
                    label="Continue"
                    title="Continue"
                    onclick={convertLeadIndividualCCRM}
                  ></lightning-button>
                </template>
                <!--End Detail page button-->
              </div>
            </template>
          </template>
          <!--End CCRM lead details div-->
          <!--Start Search party result div-->
          <template lwc:if={searchParty}>
            <div
              class="slds-modal__content slds-p-around_medium contentDiv slds-border_bottom"
            >
              <!--Start Result table-->
              <lightning-card>
                <p class="modalSubText">{modalBodySubText}</p>
                <div style={setTableHeight}>
                  <lightning-datatable
                    class="resultTable"
                    key-field="resultsTableId"
                    data={searchResults}
                    columns={columns}
                    max-row-selection="1"
                    onrowselection={getSelectedRow}
                    selected-rows={setSelectedRow}
                  >
                  </lightning-datatable>
                </div>
                <template lwc:if={noDataFound}>
                  <div style="height: 100px">
                    <br />
                    <h1 class="slds-align_absolute-center">
                      <span>No Records Found!</span>
                    </h1>
                  </div>
                </template>
                <lightning-radio-group
                  name="radioGroup"
                  label=""
                  options={noMatchOption}
                  value={noMatchSelected}
                  onchange={enableCreateNewCustomerConvertButton}
                  type="radio"
                ></lightning-radio-group>
              </lightning-card>
              <!--End Result table-->
            </div>
            <!--Org Customer result page buttons-->
            <div class="slds-modal__footer">
              <lightning-button
                class="slds-button"
                variant="neutral"
                label="Cancel"
                title="Cancel"
                onclick={cancelAction}
              ></lightning-button>
              <template lwc:if={enableCreatePartAndConvertButton}>
                <lightning-button
                  class="slds-button"
                  variant="brand"
                  label="Create new Customer & Convert"
                  title="Create new Customer & Convert"
                  onclick={createParty}
                ></lightning-button>
              </template>
              <template lwc:if={isConvertLeadButton}>
                <lightning-button
                  class="slds-button"
                  variant="brand"
                  label="Convert"
                  title="Convert"
                  onclick={initiateLeadConversion}
                ></lightning-button>
              </template>
              <!--End Org Customer result page buttons-->
            </div>
          </template>
          <!--End Searcg party result div -->
          <!--Start Maintainparty Result Div-->
          <template lwc:if={maintainPartyExist}>
            <div
              class="slds-modal__content slds-p-around_medium contentDiv slds-border_bottom"
            >
              <!--Start Result table-->
              <lightning-card>
                <p class="modalSubText">{modalBodySubText}</p>
                <div style="height: 50px">
                  <br />
                  <h1 class="slds-align_left">
                    <span>Match Found</span>
                  </h1>
                  <br />
                </div>
                <div style={setTableHeight}>
                  <lightning-datatable
                    class="resultTable2"
                    key-field="resultsTable2Id"
                    data={searchResults}
                    columns={columnsIndividual}
                    hide-checkbox-column="true"
                  >
                  </lightning-datatable>
                </div>
                <template lwc:if={noDataFound}>
                  <div style="height: 100px">
                    <br />
                    <h1 class="slds-align_absolute-center">
                      <span>No Records Found!</span>
                    </h1>
                  </div>
                </template>
              </lightning-card>
              <!--End result table-->
            </div>
            <!--Individual result page buttons-->
            <div class="slds-modal__footer">
              <lightning-button
                class="slds-button"
                variant="neutral"
                label="Cancel"
                title="Cancel"
                onclick={cancelAction}
              ></lightning-button>
              <template lwc:if={searchResults}>
                <lightning-button
                  class="slds-button"
                  variant="brand"
                  label="Continue"
                  title="Continue"
                  onclick={convertLeadWithMatchedParty}
                ></lightning-button>
              </template>
            </div>
            <!--End Individual result page buttons-->
          </template>
          <!--End Maintainparty Result Div-->
          <!--Start Convert Lead Progress Indicator Block-->
          <template lwc:if={isConvertLead}>
            <div class="slds-modal__content slds-p-around_medium contentDiv">
              <div
                class="slds-modal__content slds-p-around_medium"
                id="modal-content-id-2"
              >
                {leadTitle} You will be automatically redirected to the new
                Opportunity page.
              </div>
              <div style="margin-left: 2%">
                <lightning-progress-bar
                  size="medium"
                  value={progress}
                  variant="circular"
                >
                </lightning-progress-bar>
              </div>
              <div
                class="slds-text-align--center slds-text-title"
                style="color: forestgreen"
              >
                {processStatus} ({progress}/100)
              </div>
            </div>
          </template>
          <!--End Convert Lead Progress Indicator Block-->
        </template>
      </div>
    </section>
  </template>
</template>
