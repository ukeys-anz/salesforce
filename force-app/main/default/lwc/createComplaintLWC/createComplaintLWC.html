<template>
  <div class="slds-card">
    <lightning-record-edit-form
      object-api-name={caseObject}
      record-type-id={recordType}
      onsubmit={handleSubmit}
      onsuccess={handleCaseSuccess}
      onerror={handleCaseError}
    >
      <template if:false={isCustomerComplaint}>
        <h3
          class="slds-m-left_large slds-m-top_small slds-section__title primaryPaletteBorder"
        >
          Non Customer Complaint
        </h3>
        <template if:false={showSections}>
          <div class="slds-grid">
            <div class="slds-col slds-size_5-of-6">
              <div
                class="slds-form-element__row slds-m-left_large slds-m-top_small slds-m-bottom_small bordered-box"
              >
                <div
                  class="slds-media__figure slds-p-top_medium slds-p-left_medium"
                >
                  <lightning-icon
                    class="slds-current-color"
                    icon-name="utility:chat"
                    alternative-text=""
                    size="medium"
                  ></lightning-icon>
                </div>
                <div class="slds-box slds-text-heading--small script-style">
                  <p>
                    In order to assist you further, we need to collect some
                    personal details such as your name and contact details from
                    you. ANZ uses the information provided by you to respond to
                    your query which may not be possible without these details.
                  </p>
                  <br />
                  <p>
                    Your personal information will not be disclosed outside the
                    ANZ group, which may include our contact centres located
                    overseas.
                  </p>
                  <br />
                  <p>
                    ANZ's Privacy Policy explains how ANZ handles personal
                    information and explains how you may access and seek
                    correction of the information ANZ holds about you or raise a
                    concern about how ANZ has handled your information.
                  </p>
                  <br />
                  <p>
                    For a copy of ANZ’s privacy policy please visit
                    www.anz.com/privacy
                  </p>
                  <br />
                  <p>
                    Do you provide permission for ANZ to record these details?
                  </p>
                </div>
              </div>
            </div>
          </div>
        </template>
        <lightning-radio-group
          class="slds-m-left_large"
          required
          name="consentGroup"
          label="Customer Decision"
          onchange={handleConsentChange}
          options={consentOptions}
          value={consentOptionValue}
          type="button"
        >
        </lightning-radio-group>
        <div if:false={consentValue} class="slds-grid">
          <div class="slds-col slds-size_5-of-6">
            <div
              class="slds-form-element__row slds-m-left_large slds-m-top_small slds-m-bottom_small bordered-box"
            >
              <div
                class="slds-media__figure slds-p-top_medium slds-p-left_medium"
              >
                <lightning-icon
                  class="slds-current-color"
                  icon-name="utility:chat"
                  alternative-text=""
                  size="medium"
                ></lightning-icon>
              </div>
              <div class="slds-box slds-text-heading--small script-style">
                <p>
                  ANZ supports your decision to remain anonymous and appreciates
                  your feedback.
                </p>
                <br />
                <p>
                  Complaints made anonymously or using a pseudonym may limit our
                  ability to manage some complaints effectively and may mean we
                  can only provide a generic response.
                </p>
              </div>
            </div>
          </div>
        </div>
      </template>
      <lightning-accordion
        allow-multiple-sections-open
        onsectiontoggle={handleSectionToggle}
        active-section-name={activeSections}
      >
        <template if:true={showSections}>
          <lightning-accordion-section
            name="A"
            label="Customer Details"
            data-id="customer-details"
          >
            <template if:true={isCustomerComplaint}>
              <div class="slds-grid slds-wrap" tabindex="0">
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large"
                  tabindex="0"
                >
                  <lightning-combobox
                    name="Customer Identifier"
                    label="Customer Identifier"
                    aria-label="Customer Identifier"
                    value={customerIdentifierValue}
                    options={customerNumberTypeOptions}
                    onchange={handleCustomerIdentifierChange}
                    data-id="idtype-id"
                    title="Select which customer identifier (i.e. the type of customer number) you would like to use to search"
                    required
                  ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-6" tabindex="0">
                  <label class="slds-form-element__label" for="text-input-id-1">
                    <abbr class="slds-required" title="required">* </abbr
                    >Customer Number</label
                  >
                  <lightning-input
                    class="input inputCapCisId"
                    variant="label-hidden"
                    required
                    onchange={handleCustomerNumberChange}
                    data-id="customerNumber-id"
                  >
                  </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-12 slds-m-right_large">
                  <div class="searchButtonDiv">
                    <lightning-button
                      type="button"
                      variant="brand"
                      name="search"
                      label="Search"
                      onclick={handleSearch}
                      disabled={searchDisabled}
                      data-id="searchButton-id"
                    ></lightning-button>
                  </div>
                </div>
              </div>

              <template if:true={displayCustomerInfo}>
                <c-customer-information
                  cust-identifier={customerIdentifierValue}
                  customer-id={customerId}
                  show-as-grid="true"
                  oncustinfochecked={handleCustNumValidated}
                  class="slds-m-top_large"
                >
                </c-customer-information>
              </template>
              <div class="slds-grid slds-wrap" tabindex="0">
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required
                    aria-label="Dropdown Customer Type"
                    onchange={handleComplaintTypeChange}
                    field-name={complaintType}
                    data-id="customerType-id"
                  ></lightning-input-field>
                </div>
                <div
                  if:true={isBusiness}
                  class="slds-col slds-size_1-of-4 slds-m-right_large"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={businessName}
                  ></lightning-input-field>
                </div>
              </div>
            </template>

            <template if:false={isCustomerComplaint}>
              <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required
                    aria-label="Dropdown Customer Type"
                    onchange={handleComplaintTypeChange}
                    field-name={complaintType}
                    data-id="customerType2-id"
                  ></lightning-input-field>
                </div>
                <div
                  if:true={isBusiness}
                  class="slds-col slds-size_1-of-4 slds-m-right_large"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={businessName}
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={consentValue}
                    field-name={firstName}
                    data-id="firstName-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={middleNames}
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={consentValue}
                    field-name={lastName}
                    data-id="lastName-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    aria-label="Dropdown Age"
                    required
                    field-name={age}
                    data-id="age-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required
                    aria-label="Dropdown Gender"
                    field-name={gender}
                    data-id="gender-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={email}
                    data-id="email-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <div class="slds-form-element__control">
                    <label class="slds-form-element__label" for="mobileinput-id"
                      >Mobile e.g. 61474977148</label
                    >
                    <lightning-input-field
                      data-id="mobileinput-id"
                      variant="label-hidden"
                      field-name={mobile}
                    >
                    </lightning-input-field>
                  </div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={phone}
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    required={isAddressRequired}
                    variant="label-stacked"
                    field-name={street}
                    data-id="street-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    required={isAddressRequired}
                    variant="label-stacked"
                    field-name={suburb}
                    data-id="suburb-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    required
                    variant="label-stacked"
                    field-name={postcode}
                    data-id="postcode-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={isAddressRequired}
                    aria-label="Dropdown State"
                    field-name={state}
                    data-id="state-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={isAddressRequired}
                    aria-label="Dropdown Country"
                    field-name={country}
                    data-id="country-id"
                  ></lightning-input-field>
                </div>
              </div>
            </template>

            <lightning-input
              type="toggle"
              label="Switch off Customer Notifications?"
              onchange={handleCustomerNotificationChange}
              message-toggle-active="Yes"
              message-toggle-inactive="No"
              data-id="customerNotification-id"
            >
            </lightning-input>

            <!--Express CMOS Case Creation Section-->
            <c-idr-express-complaint
              class="slds-var-p-around_medium"
              onselected={knownIssueChangeHandler}
              ontogglechecked={expressToggleCheckedHandler}
            ></c-idr-express-complaint>

            <!-- Nominated Third party details -->
            <template if:true={consentValue}>
              <lightning-input
                type="toggle"
                label="Does Customer wish to be represented by a nominated third
              party?"
                onchange={handle3rdPartyToggleChange}
                message-toggle-active="Yes"
                message-toggle-inactive="No"
                data-id="nominatedThirdParty-id"
              >
              </lightning-input>
            </template>
            <template if:true={hasNominatedThirdParty}>
              <lightning-input
                type="toggle"
                label="Switch off 3rd Party Notifications?"
                onchange={handle3rdPartyNotificationChange}
                message-toggle-active="Yes"
                message-toggle-inactive="No"
                data-id="thirdPartyNotification-id"
              >
              </lightning-input>
              <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required
                    field-name={thirdPartyName}
                    data-id="thirdPartyName-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasNominatedThirdParty}
                    aria-label="Dropdown Relationship to the complainant"
                    field-name={thirdPartyRelationShip}
                    data-id="thirdPartyRelationShip-id"
                  >
                  </lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={thirdPartyEmail}
                    data-id="thirdPartyEmail-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={thirdPartyMobile}
                    data-id="thirdPartyMobile-id"
                  ></lightning-input-field>
                  <div class="slds-form-element__help">ex: 61474977148</div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={thirdPartyPhone}
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={thirdPartyStreet}
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={thirdPartySuburb}
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    field-name={thirdPartyPostcode}
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasNominatedThirdParty}
                    aria-label="Dropdown Nominated 3rd party country"
                    field-name={thirdPartyCountry}
                    data-id="thirdPartyCountry-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasNominatedThirdParty}
                    aria-label="Dropdown Nominated 3rd party state"
                    field-name={thirdPartyState}
                    data-id="thirdPartyState-id"
                  ></lightning-input-field>
                </div>
              </div>
            </template>
          </lightning-accordion-section>

          <lightning-accordion-section
            name="B"
            label="Complaint Details"
            data-id="complaint-details"
          >
            <div class="slds-grid slds-wrap">
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-input-field
                  variant="label-stacked"
                  aria-label="Dropdown Priority"
                  required
                  field-name={Priority}
                  data-id="priority-id"
                  onchange={handlePriorityChange}
                ></lightning-input-field>
              </div>
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-input-field
                  variant="label-stacked"
                  required
                  aria-label="Dropdown Channel Received"
                  field-name={ChannelReceived}
                  data-id="channelReceived-id"
                ></lightning-input-field>
              </div>
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-input-field
                  variant="label-stacked"
                  aria-label="Dropdown Issue Type"
                  required
                  field-name={complaintIssue}
                  onchange={handleAccNoOneSelection}
                  data-id="issueType-id"
                ></lightning-input-field>
              </div>
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-input-field
                  variant="label-stacked"
                  aria-label="Dropdown Subsequent Issue Type"
                  required
                  field-name={complaintSubIssue}
                  data-id="subsequentIssue-id"
                ></lightning-input-field>
              </div>
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-input-field
                  variant="label-stacked"
                  required
                  aria-label="Autocomplete Product or Service Name"
                  field-name={Product}
                  value={productValue}
                  onchange={handleProductChange}
                  data-id="product-id"
                ></lightning-input-field>
              </div>
              <template if:true={isCustomerComplaint}>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <c-multi-select-combobox
                    options={accountNumberOptions}
                    onselect={handleAccountNumberChange}
                    disabled={disableAccNoOneField}
                    label="Account/Policy Number"
                    data-id="accPolicyNum-id"
                  ></c-multi-select-combobox>
                </div>
              </template>
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-textarea
                  required
                  label="Description of Issue"
                  field-level-help="Provide a detailed, accurate and grammatically correct description of the customer's concern, from Customer's perspective. This field should not display subjective comments from your, or ANZ's perspective."
                  onchange={handleDescriptionChange}
                  data-id="descOfIssue-id"
                ></lightning-textarea>
              </div>
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-input-field
                  variant="label-stacked"
                  required
                  field-name={ComplainantDesiredOutcome}
                  data-id="custOutCome"
                ></lightning-input-field>
              </div>
            </div>
            <!-- Issue2 starts here -->
            <lightning-input
              type="toggle"
              label="Is there an another Issue?"
              onchange={handle2ndIssueToggleChange}
              message-toggle-active="Yes"
              message-toggle-inactive="No"
              data-id="issue2-id"
            >
            </lightning-input>
            <template if:true={hasSecondIssue}>
              <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasSecondIssue}
                    field-name={issueType2}
                    onchange={handleAccNoTwoSelection}
                    data-id="issueType2-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasSecondIssue}
                    field-name={subsequentIssue2}
                    data-id="subsequentIssue2-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasSecondIssue}
                    field-name={productValue2}
                    data-id="productValue2-id"
                  ></lightning-input-field>
                </div>
                <template if:true={isCustomerComplaint}>
                  <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                    <c-multi-select-combobox
                      options={accountNumberOptions}
                      onselect={handleAccountNumber2Change}
                      disabled={disableAccNoTwoField}
                      label="Account/Policy Number 2"
                      data-id="accPolicyNum2-id"
                    ></c-multi-select-combobox>
                  </div>
                </template>
              </div>
            </template>
            <!-- Issue2 end here -->
            <!-- Issue3 starts here -->
            <template if:true={hasSecondIssue}>
              <lightning-input
                type="toggle"
                label="Is there an another Issue?"
                onchange={handle3rdIssueToggleChange}
                message-toggle-active="Yes"
                message-toggle-inactive="No"
                data-id="issue3-id"
              >
              </lightning-input>
            </template>
            <template if:true={hasThirdIssue}>
              <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasThirdIssue}
                    field-name={issueType3}
                    onchange={handleAccNoThreeSelection}
                    data-id="issueType3-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasThirdIssue}
                    field-name={subsequentIssue3}
                    data-id="subsequentIssue3-id"
                  ></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                  <lightning-input-field
                    variant="label-stacked"
                    required={hasThirdIssue}
                    field-name={productValue3}
                    data-id="productValue3-id"
                  ></lightning-input-field>
                </div>
                <template if:true={isCustomerComplaint}>
                  <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                    <c-multi-select-combobox
                      options={accountNumberOptions}
                      onselect={handleAccountNumber3Change}
                      disabled={disableAccNoThreeField}
                      label="Account/Policy Number 3"
                      data-id="accPolicyNum3-id"
                    ></c-multi-select-combobox>
                  </div>
                </template>
              </div>
            </template>
            <!-- Issue3 end here -->
          </lightning-accordion-section>

          <lightning-accordion-section name="C" label="Resolution Information">
            <div if:true={showComplianceFields} class="slds-m-bottom_medium">
              Compliance Checks
            </div>
            <div class="slds-grid slds-wrap">
              <template if:true={showComplianceFields}>
                <div class="slds-col slds-size_2-of-4">
                  <lightning-radio-group
                    required
                    name="writtenResponseGroup"
                    label="Has the customer requested a written response? (Do not ask the customer, only record yes if customer has specifically requested a response in writing)"
                    onchange={handleWrittenResponseChange}
                    options={writtenresponseoptions}
                    value={writtenResponseValue}
                    type="button"
                    data-id="writtenResponseGroup-id"
                  >
                  </lightning-radio-group>
                </div>
                <div class="slds-col slds-size_2-of-4 slds-m-bottom_large">
                  <lightning-radio-group
                    required
                    name="writtenRequiredGroup"
                    label="Is the complaint relating to hardship, a declined insurance claim, the value of an insurance claim or a decision of a superannuation trustee?"
                    onchange={handleWrittenRequiredChange}
                    options={writtenrequiredoptions}
                    value={writtenRequiredValue}
                    type="button"
                    data-id="writtenRequiredGroup-id"
                  ></lightning-radio-group>
                </div>
              </template>
              <template if:true={isAddressRequired}>
                <div class="slds-col slds-size_2-of-4">
                  <div
                    class="slds-form-element__row slds-m-top_small slds-m-bottom_small bordered-box"
                  >
                    <div
                      class="slds-media__figure slds-p-top_medium slds-p-left_medium"
                    >
                      <lightning-icon
                        class="slds-current-color"
                        icon-name="utility:chat"
                        alternative-text=""
                        size="medium"
                      ></lightning-icon>
                    </div>
                    <div class="slds-box slds-text-heading--small script-style">
                      <p>If Yes, the case must be Escalated</p>
                      <br />
                    </div>
                  </div>
                </div>
                <div class="slds-col slds-size_2-of-4"></div>
              </template>
              <!-- Real Form Changes-->
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-helptext
                  content="A REAL form is required if there has been an Operational Risk Event: a failure of internal process, people and/or systems, or from an external event.
                  Note: Ticking this box does not automatically generate a REAL form. If a REAL form is required, it will need to be submitted by following your Businesses BAU process. For assistance, search: ‘REAL form’ on MAX or speak with your Line Manager."
                >
                </lightning-helptext>
                <lightning-radio-group
                  required
                  name="realFormRequiredGroup"
                  label="Is a REAL form required?"
                  onchange={handleRealFormNeeded}
                  options={realFormReqOptions}
                  type="button"
                  data-id="realFormRequiredGroup-id"
                ></lightning-radio-group>
              </div>
              <template if:true={isRealFormNeeded}>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-radio-group
                    required={isRealFormNeeded}
                    name="realFormSubmittedGroup"
                    label="Has a REAL form been submitted?"
                    onchange={handleRealFormSubmitted}
                    options={realFormReqOptions}
                    type="button"
                    data-id="realFormSubmittedGroup-id"
                  ></lightning-radio-group>
                </div>
              </template>
              <template if:true={isRealFormSubmitted}>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-input
                    type="text"
                    label="Risk Event ID"
                    value={realFormRefNo}
                    max-length="50"
                    onchange={handleRealFormRefNoChange}
                    data-id="realFormRefNoGroup-id"
                  ></lightning-input>
                </div>
              </template>
              <!--Complaint Status-->
              <div
                class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
              >
                <lightning-combobox
                  name="ComplaintStatus"
                  label="Complaint Status"
                  aria-label="Dropdown Complaint Status"
                  value={caseStatus}
                  options={statusOptions}
                  onchange={handleStatusChange}
                  data-id="caseStatus-id"
                ></lightning-combobox>
              </div>
              <template if:true={isComplaintEscalated}>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    aria-label="Dropdown Complaint Escalation Reason"
                    required={isComplaintEscalated}
                    field-name={escalationReason}
                    data-id="escalationReason-id"
                  ></lightning-input-field>
                </div>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    aria-label="Restriction Level"
                    required={isComplaintEscalated}
                    onchange={handleRestrictionLevel}
                    field-name={restrictionLevel}
                    data-id="restrictionLevel-id"
                  ></lightning-input-field>
                </div>
              </template>
              <template if:true={isComplaintResolved}>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    aria-label="Dropdown Complaint Outcome"
                    required={isComplaintResolved}
                    field-name={complaintOutcome}
                    data-id="compOutCome-id"
                  ></lightning-input-field>
                </div>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    required={isComplaintResolved}
                    field-name={outcomeDescription}
                    data-id="descOutcome-id"
                  ></lightning-input-field>
                </div>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    aria-label="Dropdown Complaint Remedy"
                    required={isComplaintResolved}
                    field-name={complaintRemedy}
                    onchange={handleComplaintRemedy}
                    data-id="compRemedy-id"
                  ></lightning-input-field>
                </div>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <template if:true={isFinancialComplaintRemedy}>
                    <label
                      class="slds-form-element__label"
                      for="text-input-id-149"
                    >
                      <abbr class="slds-required" title="required">* </abbr
                      >Financial Amount</label
                    >
                    <lightning-input
                      variant="label-hidden"
                      required
                      step="any"
                      pattern="^[1-9]\d{0,6}(\.\d{1,2})?$|^0\.(?!0+$)\d{1,2}$"
                      formatter="currency"
                      type="number"
                      onchange={handleFinancialCompensation}
                      class="input inputFinCompensation"
                      message-when-pattern-mismatch="Must be a positive value with up to 7 whole digits and 2 decimal digits"
                      data-id="finAmount-id"
                    ></lightning-input>
                  </template>
                  <template if:true={isNonFinancialComplaintRemedy}>
                    <lightning-input-field
                      variant="label-stacked"
                      required
                      field-name={nonFinancialRemedy}
                      data-id="nonFinancialRemedy-id"
                    ></lightning-input-field>
                  </template>
                  <template if:true={isReferredToProductManufacturer}>
                    <lightning-input-field
                      variant="label-stacked"
                      required
                      field-name={thirdPartyProductManufacturer}
                      onchange={handleThirdPartyProductManufacturer}
                      data-id="thirdPartyProductManufacturer-id"
                    >
                    </lightning-input-field>
                  </template>
                </div>
                <template if:true={isOtherProductManufacturer}>
                  <div
                    class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                  >
                    <lightning-input-field
                      variant="label-stacked"
                      required
                      field-name={thirdPartyOtherProductManufacturer}
                      data-id="thirdPartyOtherProductManufacturer-id"
                    >
                    </lightning-input-field>
                  </div>
                </template>
                <template if:true={isReferredToProductManufacturer}>
                  <div
                    class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                  >
                    <lightning-input
                      type="checkbox"
                      label="The details of this complaint have been provided to the product manufacturer"
                      name="thirdPartyIsDetailsProvidedToProductManufacturer"
                      required
                      message-when-value-missing="Acknowledgement that the complaint details have been provided to the product manufacturer is required"
                      field-level-help="Evidence that the details of the complaint have been passed onto the product manufacturer must be included on the case"
                      data-id="thirdPartyIsDetailsProvidedToProductManufacturer-id"
                      onchange={handleIsDetailsProvidedToProductManufacturer}
                    ></lightning-input>
                  </div>
                </template>
              </template>
            </div>
            <!--Systemic issues-->
            <div class="slds-grid slds-wrap">
              <div class="slds-col slds-size_1-of-4 slds-m-right_large">
                <lightning-helptext
                  content="Issues which may impact more than one customer AND are of a compliance nature. E.g. ANZ systems or processes not working properly or non-compliance with terms and conditions"
                >
                </lightning-helptext>
                <lightning-radio-group
                  required
                  name="commoncomplaintGroup"
                  label="Is this a possible systemic issue?"
                  onchange={handleCommonComplaint}
                  options={commoncomplaintoptions}
                  value={isCommonComplaintYesNo}
                  type="button"
                  data-id="commoncomplaintGroup-id"
                >
                </lightning-radio-group>
              </div>
              <template if:true={isCommonComplaint}>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    required={isCommonComplaint}
                    field-name={systemicIssueDescription}
                    data-id="siDescription-id"
                  ></lightning-input-field>
                </div>
                <div
                  class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                >
                  <lightning-input-field
                    variant="label-stacked"
                    required={isCommonComplaint}
                    field-name={systemicIssueCategory}
                    data-id="siCategory-id"
                  ></lightning-input-field>
                </div>
                <template if:true={hasSecondIssue}>
                  <div
                    class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
                  >
                    <lightning-input-field
                      variant="label-stacked"
                      field-name={possibleSystemicIssues}
                      data-id="possibleSystemicIssues-id"
                    ></lightning-input-field>
                  </div>
                </template>
              </template>
            </div>
          </lightning-accordion-section>
        </template>
      </lightning-accordion>

      <template if:true={loading}>
        <div style="height: 6rem">
          <div class="slds-spinner_container">
            <div
              role="status"
              class="slds-spinner slds-spinner_medium slds-spinner_brand"
            >
              <span class="slds-assistive-text">Loading</span>
              <div class="slds-spinner__dot-a"></div>
              <div class="slds-spinner__dot-b"></div>
            </div>
          </div>
        </div>
      </template>
      <div
        class="slds-clearfix slds-m-top_large slds-m-bottom_large slds-m-right_large"
      >
        <div class="slds-float slds-align_absolute-center">
          <lightning-button
            variant="brand"
            type="submit"
            onclick={validateFields}
            class="saveButton"
            name="save"
            label="Create Case"
            data-id="submit-id"
            aria-label="Press to save the form and create the case"
          ></lightning-button>
        </div>
      </div>
    </lightning-record-edit-form>
  </div>
  <template if:true={showModal}>
    <section
      role="dialog"
      tabindex="-1"
      class="slds-modal slds-fade-in-open slds-modal_small"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      aria-describedby="modal-content-id-1"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <lightning-button-icon
            icon-name="utility:close"
            class="slds-float_right"
            onclick={closeModal}
            alternative-text="close"
          ></lightning-button-icon>
          <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
            {modalHeader}
          </h2>
        </header>
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-id-1"
        >
          <lightning-formatted-rich-text
            data-id="modalMessage-id"
            value={modalMessage}
          ></lightning-formatted-rich-text>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            variant="brand"
            label="Close"
            title="Close"
            onclick={closeModal}
            class="slds-m-left_x-small"
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
