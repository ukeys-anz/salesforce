<template>
  <article class="slds-card">
    <div class="slds-card__header slds-grid header-div">
      <header class="slds-has-flexi-truncate card-header">
        <h2>Temporary Card Block</h2>
      </header>
    </div>
    <div class="slds-card__body slds-p-horizontal--small">
      <div class="body-wording-section">
        <p>
          Are you sure you want to place a temporary block on the customer's
          card? This will <span class="slds-text-title_bold">not</span> trigger
          an automated card replacement, and the customer will be able to undo
          this action via their mobile app
        </p>
      </div>
      <button
        class="slds-button slds-button--brand block-button"
        onclick={closeAction}
      >
        Temporarily Block Card
      </button>
      <button
        class="slds-button slds-button--neutral cancel-button"
        onclick={closeAction}
      >
        Cancel
      </button>
    </div>
  </article>
</template>
