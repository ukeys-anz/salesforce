<template>
  <lightning-card title={title} variant="Narrow" icon-name={icon}>
    <template lwc:if={error}>
      <c-error message={error} data-id="error"></c-error>
    </template>
    <template lwc:else>
      <lightning-datatable
        key-field="Id"
        data={records}
        columns={columns}
        hide-checkbox-column
      >
      </lightning-datatable>
    </template>
  </lightning-card>
</template>
