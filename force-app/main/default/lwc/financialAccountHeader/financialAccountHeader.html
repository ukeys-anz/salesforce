<template>
  <article class="financialAccount slds-card">
    <template lwc:if={componentTitle}>
      <h1 class="card-title" data-id="component-title">
        <lightning-icon
          icon-name={titleIcon}
          size="medium"
          class={iconColor}
        ></lightning-icon>
        {componentTitle}
        <p class="sub-title">{componentSubTitle}</p>
      </h1>
    </template>
    <template lwc:if={displayContent}>
      <template lwc:if={error}>
        <c-error message={error} data-id="error"></c-error>
      </template>
      <template lwc:else>
        <template lwc:if={processedFinAccounts}>
          <template for:each={processedFinAccounts} for:item="finAccount">
            <div
              class="slds-card__body slds-card__body_inner"
              key={finAccount.id}
              data-id="fin-account"
            >
              <article class="slds-card">
                <template lwc:if={finAccount.showSavingsJar}>
                  <template lwc:if={savingsJar}>
                    <div class="slds-grid">
                      <header class="slds-has-flexi-truncate">
                        <h2 class="slds-card__header-title">
                          <template
                            for:each={accountOwnersList}
                            for:item="eachOwner"
                          >
                            <a
                              onclick={navigateToRecordViewPage}
                              data-id={eachOwner.Id}
                              class="slds-truncate"
                              title={eachOwner.Name}
                              key={eachOwner.Id}
                            >
                              <span>{eachOwner.Name}</span>
                            </a>
                            <template lwc:if={eachOwner.ShowSeparator}>
                              &nbsp;&amp;&nbsp;
                            </template>
                          </template>
                          <span class={finAccount.badgeClass}
                            >{finAccount.finserv_status}</span
                          >
                          <template lwc:if={finAccount.showMultipartyBadge}>
                            <span class="slds-badge dormantBadgeClass"
                              >{finAccount.finserv_ownership}</span
                            >
                          </template>
                        </h2>
                      </header>
                    </div>
                    <div class="slds-grid slds-wrap">
                      <div class="slds-col slds-grid slds-size_1-of-1">
                        <div class="slds-grid slds-wrap slds-size_1-of-1">
                          <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-4 slds-var-p-around_small vertical-align"
                          >
                            <div class="header-column">
                              <p class="slds-text-color_weak">Account Number</p>
                              <p class="slds-text-heading_medium">
                                {finAccount.account_number}
                              </p>
                              <template lwc:if={finAccount.finserv_closedate}>
                                <p class="slds-text-color_weak italictext">
                                  Date Closed : {finAccount.finserv_closedate}
                                </p>
                              </template>
                            </div>
                          </div>
                          <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-4 slds-var-p-around_small balance-padding vertical-align"
                          >
                            <div class="header-column slds-float_right">
                              <p class="slds-text-color_weak">
                                {balanceTitle}
                                <lightning-icon
                                  icon-name="utility:info"
                                  size="xx-small"
                                  class="tooltip"
                                  onclick={handleInfoModal}
                                ></lightning-icon>
                              </p>
                              <p class="slds-text-heading_large">
                                <lightning-formatted-number
                                  value={finAccount.balances.balance.value}
                                  format-style="currency"
                                  data-id="amount"
                                ></lightning-formatted-number>
                              </p>
                            </div>
                          </div>
                          <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-4 slds-var-p-around_small slds-border_left slds-text-align_center"
                          >
                            <p class="slds-text-color_weak">
                              {savingsJar.goal.name}
                            </p>
                            <template lwc:if={savingsJar.image}>
                              <img
                                class="savings-jar"
                                src={savingsJar.image}
                                width="90%"
                              />
                            </template>
                          </div>
                          <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-4 slds-var-p-around_small balance-padding vertical-align"
                          >
                            <div class="header-column slds-float_right">
                              <p class="slds-text-color_weak">
                                Total Saved
                                <lightning-icon
                                  icon-name="utility:info"
                                  size="xx-small"
                                  class="tooltip"
                                  onclick={handleInfoModal}
                                ></lightning-icon>
                              </p>
                              <p class="slds-text-heading_large">
                                <lightning-formatted-number
                                  value={savingsJar.balance.value}
                                  format-style="currency"
                                  data-id="amount"
                                ></lightning-formatted-number>
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                  <template lwc:else>
                    <div class="slds-grid">
                      <header class="slds-has-flexi-truncate">
                        <h2 class="slds-card__header-title">
                          <template
                            for:each={accountOwnersList}
                            for:item="eachOwner"
                          >
                            <a
                              onclick={navigateToRecordViewPage}
                              data-id={eachOwner.Id}
                              class="slds-truncate"
                              title={eachOwner.Name}
                              key={eachOwner.Id}
                            >
                              <span>{eachOwner.Name}</span>
                            </a>
                            <template lwc:if={eachOwner.ShowSeparator}>
                              &nbsp;&amp;&nbsp;
                            </template>
                          </template>
                          <span class={finAccount.badgeClass}
                            >{finAccount.finserv_status}</span
                          >
                          <template lwc:if={finAccount.showMultipartyBadge}>
                            <span class="slds-badge dormantBadgeClass"
                              >{finAccount.multiParty}</span
                            >
                          </template>
                        </h2>
                      </header>
                    </div>
                    <div class="slds-grid slds-wrap">
                      <div class="slds-col slds-grid slds-size_1-of-1">
                        <div class="slds-grid slds-wrap slds-size_1-of-1">
                          <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                          >
                            <div class="header-column">
                              <p class="slds-text-color_weak">Account Number</p>
                              <p class="slds-text-heading_medium">
                                {finAccount.account_number}
                              </p>
                            </div>
                          </div>
                          <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small balance-padding"
                          >
                            <div class="header-column slds-float_right">
                              <p class="slds-text-color_weak">
                                {balanceTitle}
                                <lightning-icon
                                  icon-name="utility:info"
                                  size="xx-small"
                                  class="tooltip"
                                  onclick={handleInfoModal}
                                ></lightning-icon>
                              </p>
                              <p class="slds-text-heading_large">
                                <lightning-formatted-number
                                  value={finAccount.balances.balance.value}
                                  format-style="currency"
                                  data-id="amount"
                                ></lightning-formatted-number>
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                </template>
                <template lwc:else>
                  <div class="slds-grid">
                    <header class="slds-has-flexi-truncate">
                      <h2 class="slds-card__header-title">
                        <template
                          for:each={accountOwnersList}
                          for:item="eachOwner"
                        >
                          <a
                            onclick={navigateToRecordViewPage}
                            data-id={eachOwner.Id}
                            class="slds-truncate"
                            title={eachOwner.Name}
                            key={eachOwner.Id}
                          >
                            <span>{eachOwner.Name}</span>
                          </a>
                          <template lwc:if={eachOwner.ShowSeparator}>
                            &nbsp;&amp;&nbsp;
                          </template>
                        </template>

                        <span class={finAccount.badgeClass}
                          >{finAccount.finserv_status}</span
                        >
                        <template lwc:if={finAccount.showMultipartyBadge}>
                          <span class="slds-badge dormantBadgeClass"
                            >{finAccount.finserv_ownership}</span
                          >
                        </template>
                      </h2>
                    </header>
                  </div>
                  <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-grid slds-size_1-of-1">
                      <div class="slds-grid slds-wrap slds-size_1-of-1">
                        <div
                          class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                        >
                          <div class="header-column">
                            <p class="slds-text-color_weak">Account Number</p>
                            <p class="slds-text-heading_medium">
                              {finAccount.account_number}
                            </p>
                          </div>
                        </div>
                        <div
                          class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small balance-padding"
                        >
                          <div class="header-column slds-float_right">
                            <p
                              class="slds-text-color_weak slds-var-p-right_small slds-float_right"
                            >
                              {balanceTitle}
                              <lightning-icon
                                icon-name="utility:info"
                                size="xx-small"
                                class="tooltip"
                                onclick={handleInfoModal}
                              ></lightning-icon>
                            </p>
                            <p class="slds-text-heading_large">
                              <template lwc:if={finAccount.isCard}>
                                <lightning-formatted-number
                                  value={finAccount.balances.current_balance.value}
                                  format-style="currency"
                                  data-id="amount"
                                ></lightning-formatted-number>
                              </template>
                              <template lwc:else>
                                <lightning-formatted-number
                                  value={finAccount.balances.balance.value}
                                  format-style="currency"
                                  data-id="amount"
                                ></lightning-formatted-number>
                              </template>
                            </p>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="slds-col slds-grid slds-size_1-of-1">
                      <div class="slds-grid slds-wrap slds-size_1-of-1">
                        <template lwc:if={finAccount.isCard}>
                          <div
                            class="slds-col slds-size_1-of-1 slds-large-size_2-of-2 slds-var-p-around_small balance-padding"
                          >
                            <div class="header-column slds-float_right">
                              <p
                                class="slds-text-color_weak slds-var-p-right_small slds-float_right"
                              >
                                Funds
                                <lightning-icon
                                  icon-name="utility:info"
                                  size="xx-small"
                                  class="tooltip"
                                  onclick={handleInfoModal}
                                ></lightning-icon>
                              </p>
                              <p class="slds-text-heading_large">
                                <lightning-formatted-number
                                  value={finAccount.balances.available_limit.value}
                                  format-style="currency"
                                  data-id="amount"
                                ></lightning-formatted-number>
                              </p>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>
                <footer class="slds-card__footer account-footer">
                  <span class="lastUpdated">Last Updated {timestamp}</span>
                </footer>
              </article>
            </div>
          </template>
        </template>
        <template lwc:else>
          <h1 class="slds-card__header-title slds-text-align_center">
            <span class="not-found" data-id="no-accounts"
              >No {productCode} Accounts</span
            >
          </h1>
        </template>
      </template>
    </template>
    <template lwc:else>
      <div class="slds-grid">
        <p class="message-padding">
          Don’t worry, it’s not broken. To view this you need a higher
          permission level.
        </p>
      </div>
    </template>
  </article>
  <template lwc:if={showInfoModal}>
    <c-dynamic-tooltip-util
      header-title={balanceTitle}
      resource-name={productCode}
      product-name={componentSubTitle}
      onclosemodal={closeModal}
    ></c-dynamic-tooltip-util>
  </template>
</template>
