<template>
  <template lwc:if={isCasesCreated}>
    <div class="slds-modal__content slds-var-p-horizontal_large">
      <lightning-icon
        class="slds-icon-utility-success slds-icon_container slds-align_absolute-center slds-var-m-top_large"
        icon-name="utility:success"
        alternative-text="success"
        variant="success"
        size="large"
        title="success"
      ></lightning-icon>

      <div
        class="slds-m-top_large slds-align_absolute-center slds-text-heading_medium slds-var-m-bottom_medium"
      >
        Child Cases have been successfully created to modify CoP Status to the
        following accounts.
      </div>
      <div class="slds-m-top_large">
        <lightning-datatable
          data-id="casesDataTable"
          key-field="id"
          data={casesData}
          columns={caseColumns}
          hide-checkbox-column
        >
        </lightning-datatable>
      </div>
    </div>

    <div class="slds-m-top_large">
      <lightning-modal-footer>
        <lightning-button
          class="slds-button"
          variant="neutral"
          label="Close"
          onclick={handleCancel}
        ></lightning-button>
      </lightning-modal-footer>
    </div>
  </template>

  <template lwc:else>
    <template lwc:if={loading}>
      <lightning-spinner
        data-id="spinner"
        alternative-text="Loading"
        size="small"
      ></lightning-spinner>
    </template>
    <template lwc:else>
      <div class="slds-var-m-top_large">
        <h2
          class="slds-text-heading_small slds-p-around_xx-small slds-theme_shade"
        >
          Modify CoP Account Status
        </h2>

        <template lwc:if={showCheckbox}>
          <!-- Checkbox -->
          <div
            class="slds-var-m-top_medium slds-grid slds-grid_align-end slds-var-p-horizontal_small"
          >
            <lightning-input
              data-id="copyToAll"
              type="checkbox"
              label="Tick to use the same details for all accounts"
              onchange={handleUseSameDetailsCheckbox}
            >
            </lightning-input>
          </div>
        </template>

        <template for:each={_selectedRows} for:item="row">
          <div key={row.id} class="slds-var-m-top_medium">
            <h3
              class="slds-text-title_bold slds-m-left_x-small slds-var-p-top_medium"
            >
              For {row.productName} {row.accountType} Account
              ({row.accountNumber})
            </h3>

            <!-- Wrapper for 2 fields per row -->
            <div class="slds-grid slds-gutters slds-var-m-top_medium">
              <div>
                <div class="slds-col slds-size_1-of-1">
                  <c-editable-field
                    row-id={row.id}
                    name="updateAccountStatusCOP"
                    label="Modify CoP Status To"
                    value={row.updateAccountStatusCOP}
                    type="input"
                    read-only="true"
                  >
                  </c-editable-field>
                </div>
              </div>

              <template lwc:if={isOptOut}>
                <div class="slds-col slds-size_3-of-6">
                  <c-editable-field
                    row-id={row.id}
                    name="copReason"
                    is-invalid={row.iscopReasonInvalid}
                    label="CoP Reason"
                    value={row.copReason}
                    type="combobox"
                    help-text="Updated COP Status."
                    options={copResonValues}
                    onfieldchange={handleFieldChange}
                  >
                  </c-editable-field>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>
    <div class="slds-m-top_large">
      <lightning-modal-footer>
        <template lwc:if={_selectedRows.length}>
          <div class="slds-align_absolute-center">
            <lightning-button
              class="slds-button"
              variant="neutral"
              data-id="cancel"
              label="Cancel"
              onclick={handleCancel}
            ></lightning-button>
            <lightning-button
              class="slds-button slds-m-left_x-small"
              data-id="createChildCasesButton"
              variant="brand"
              onclick={handleCreateChildCases}
              label="Create Child Cases"
            ></lightning-button>
          </div>
        </template>
      </lightning-modal-footer>
    </div>
  </template>
</template>
