<template>
  <template if:false={isCasesCreated}>
    <template if:true={loading}>
      <lightning-spinner
        data-id="spinner"
        alternative-text="Loading"
        size="small"
      ></lightning-spinner>
    </template>
    <template if:false={loading}>
      <div class="slds-var-m-top_large">
        <h2
          class="slds-text-heading_small slds-p-around_xx-small slds-theme_shade"
        >
          Forwarding Account Details
        </h2>

        <template if:true={showCheckbox}>
          <!-- Checkbox -->
          <div
            class="slds-var-m-top_medium slds-grid slds-grid_align-end slds-var-p-horizontal_small"
          >
            <lightning-input
              data-id="copyToAll"
              type="checkbox"
              label="Tick to use the same details for all accounts"
              onchange={handleUseSameDetailsCheckbox}
            >
            </lightning-input>
          </div>
        </template>

        <template for:each={_selectedRows} for:item="row">
          <div key={row.id} class="slds-var-m-top_medium">
            <h3 class="bold-heading slds-var-p-top_medium">
              For {row.productName} {row.accountType} Account
              ({row.accountNumber})
            </h3>

            <!-- Wrapper for 2 fields per row -->
            <div class="slds-grid slds-gutters slds-var-m-top_medium">
              <!-- Closure Reason Field -->
              <div class="slds-col slds-size_1-of-2">
                <c-editable-field
                  row-id={row.id}
                  name="closureReason"
                  is-invalid={row.isClosureReasonInvalid}
                  label="Closure Reason"
                  value={row.closureReason}
                  type="combobox"
                  options={closureResonValues}
                  onfieldchange={handleFieldChange}
                >
                </c-editable-field>
              </div>

              <!-- Intended Account Name Field -->
              <div class="slds-col slds-size_1-of-2">
                <c-editable-field
                  row-id={row.id}
                  name="intendedAccountName"
                  is-invalid={row.isAccountNameInvalid}
                  label="Intended Account Name"
                  value={row.intendedAccountName}
                  help-text="Account name of the recipient where the money was meant to go."
                  type="input"
                  onfieldchange={handleFieldChange}
                >
                </c-editable-field>
              </div>
            </div>

            <!-- Wrapper for next set of fields (e.g. Intended Account BSB and Intended Account Number) -->
            <div class="slds-grid slds-gutters slds-var-m-top_medium">
              <!-- Intended Account BSB Field -->
              <div class="slds-col slds-size_1-of-2">
                <c-editable-field
                  row-id={row.id}
                  name="intendedAccountBsb"
                  is-invalid={row.isaccountBsbInvalid}
                  label="Intended Account BSB"
                  value={row.intendedAccountBsb}
                  help-text="Branch code of the recipient's bank where the money was meant to go."
                  type="input"
                  onfieldchange={handleFieldChange}
                >
                </c-editable-field>
              </div>
              <!-- Intended Account Number Field -->
              <div class="slds-col slds-size_1-of-2">
                <c-editable-field
                  row-id={row.id}
                  name="intendedAccountNumber"
                  is-invalid={row.isAccountNumberInvalid}
                  label="Intended Account Number"
                  value={row.intendedAccountNumber}
                  type="input"
                  onfieldchange={handleFieldChange}
                >
                </c-editable-field>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <div class="modal-footer">
      <lightning-modal-footer>
        <template if:false={_selectedRows.length}>
          <lightning-button
            class="slds-button"
            variant="neutral"
            data-id="cancel"
            label="Cancel"
            onclick={handleCancel}
          ></lightning-button>
        </template>
        <template if:true={_selectedRows.length}>
          <div class="slds-align_absolute-center">
            <lightning-button
              class="slds-button"
              variant="neutral"
              label="Cancel"
              onclick={handleCancel}
            ></lightning-button>
            <lightning-button
              class="slds-button slds-m-left_x-small"
              data-id="createChildCasesButton"
              variant="brand"
              onclick={handleCreateChildCases}
              label="Create Child Cases"
            ></lightning-button>
          </div>
        </template>
      </lightning-modal-footer>
    </div>
  </template>

  <template if:true={isCasesCreated}>
    <div class="slds-modal__content slds-var-p-horizontal_large">
      <lightning-icon
        class="slds-icon-utility-success slds-icon_container slds-align_absolute-center slds-var-m-top_large"
        icon-name="utility:success"
        alternative-text="success"
        variant="success"
        size="large"
        title="success"
      ></lightning-icon>

      <div
        class="slds-var-m-top_large slds-align_absolute-center slds-text-heading_medium slds-var-m-bottom_medium"
      >
        Child Cases have been successfully created to close the following
        accounts.
      </div>
      <lightning-datatable
        data-id="casesDataTable"
        key-field="id"
        data={casesData}
        columns={caseColumns}
        hide-checkbox-column
      >
      </lightning-datatable>
    </div>

    <div class="modal-footer">
      <lightning-modal-footer>
        <template if:true={isCasesCreated}>
          <lightning-button
            class="slds-button"
            variant="neutral"
            label="Close"
            onclick={handleCancel}
          ></lightning-button>
        </template>
      </lightning-modal-footer>
    </div>
  </template>
</template>
