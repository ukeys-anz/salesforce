<template>
  <div
    class="slds-form-element"
    onmouseleave={toggleResult}
    data-source="lookupContainer"
  >
    <div class="slds-combobox_container slds-has-selection">
      <label class="slds-form-element__label" for="combobox-id-1"
        >{label}</label
      >
      <div
        class="lookupInputContainer slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
        aria-expanded="false"
        aria-haspopup="listbox"
        role="combobox"
      >
        <div
          class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
          role="none"
        >
          <div class="searchBoxWrapper slds-show">
            <!--Lookup Input Field-->
            <lightning-input
              type="search"
              data-source="searchInputField"
              onclick={toggleResult}
              onchange={handleKeyChange}
              is-loading={isSearchLoading}
              value={searchKey}
              variant="label-hidden"
              placeholder={placeholder}
            ></lightning-input>
          </div>

          <!--Lookup Selected record pill container start-->
          <div class="pillDiv slds-hide">
            <span class="slds-icon_container slds-combobox__input-entity-icon">
              <lightning-icon
                icon-name={selectedRecord.iconName}
                size="x-small"
                alternative-text="icon"
              ></lightning-icon>
            </span>
            <input
              type="text"
              id="combobox-id-1"
              value={selectedRecord.label}
              class="slds-input slds-combobox__input slds-combobox__input-value"
              readonly
            />
            <button
              class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
              title="Remove selected option"
            >
              <lightning-icon
                icon-name="utility:close"
                size="x-small"
                alternative-text="close icon"
                onclick={handleRemove}
              ></lightning-icon>
            </button>
          </div>
        </div>

        <!-- lookup search result part start-->
        <div
          id="listbox-id-5"
          class="slds-margin_lookup slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid"
          role="listbox"
        >
          <ul class="slds-listbox slds-listbox_vertical" role="presentation">
            <template lwc:if={hasRecords}>
              <template for:each={searchResults} for:item="obj">
                <li
                  key={obj.uniqueId}
                  role="presentation"
                  class="slds-listbox__item"
                >
                  <div
                    data-recid={obj.uniqueId}
                    onclick={handleSelectedRecord}
                    class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta hasOptions"
                    role="option"
                  >
                    <span
                      class="slds-pointer_events slds-media__figure slds-listbox__option-icon"
                    >
                      <span class="slds-icon_container">
                        <lightning-icon
                          icon-name={obj.iconName}
                          size="small"
                          alternative-text="icon"
                        ></lightning-icon>
                      </span>
                    </span>
                    <span class="slds-pointer_events slds-media__body">
                      <span
                        class="slds-listbox__option-text slds-listbox__option-text_entity"
                        >{obj.label}</span
                      >
                      <span
                        class="slds-listbox__option-meta slds-listbox__option-meta_entity"
                        >{obj.subLabel}</span
                      >
                    </span>
                  </div>
                </li>
              </template>
            </template>
            <!--ERROR msg, if there is no records..-->
            <template lwc:else>
              <li
                class="slds-listbox__item slds-text-align_center slds-text-title_bold"
              >
                No Records Found....
              </li>
            </template>
          </ul>
        </div>
      </div>
    </div>
  </div>
</template>
