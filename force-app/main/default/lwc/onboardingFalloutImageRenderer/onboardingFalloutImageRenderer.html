<template>
  <template lwc:if={showSpinner}>
    <div class="slds-col slds-size_1-of-1 slds-wrap spinnerHolder">
      <lightning-spinner
        alternative-text="Loading"
        variant="brand"
      ></lightning-spinner>
    </div>
  </template>
  <template lwc:if={imgSrc}>
    <img
      src={imgSrc}
      oncontextmenu={disableRightClick}
      class={imgClass}
      onload={handleImageLoad}
      onerror={handleErrorLoad}
    />
    <template lwc:if={showError}>
      <div class="slds-text-align_center">
        <lightning-icon
          icon-name="utility:warning"
          alternative-text="Warning!"
          title="Warning"
        ></lightning-icon>
        Image not found
      </div>
    </template>
  </template>
</template>
