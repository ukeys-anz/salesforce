<template>
  <lightning-card title="Customer Information" icon-name="standard:people">
    <template lwc:if={customerInfo}>
      <template lwc:if={showAsGrid}>
        <div class="slds-grid slds-wrap slds-m-left_medium">
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Customer Type : {customerInfo.complainant_type}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            First Name : {customerInfo.first_name}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Last Name : {customerInfo.last_name}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Middle Names : {customerInfo.middlename}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Gender : {customerInfo.gender}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Age : {customerInfo.age}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            CPID : {customerInfo.cpId}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            OCV ID : {customerInfo.ocvId}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            DOB : {customerInfo.dob}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Email : {customerInfo.email}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Mobile : {customerInfo.mobile}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Street : {customerInfo.street}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Suburb : {customerInfo.suburb}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            State : {customerInfo.state}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Postcode : {customerInfo.postcode}
          </div>
          <div
            class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
          >
            Country : {customerInfo.country}
          </div>
        </div>
        <template lwc:if={isRMDetails}>
          <div
            class="slds-text-heading_small slds-m-left_medium slds-text-title_bold"
          >
            Relationship Manager Details
          </div>
          <br />
          <div class="slds-grid slds-m-left_medium">
            <div
              class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
            >
              Name : {customerInfo.rmData.name}
            </div>
            <div
              class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
            >
              Phone : {customerInfo.rmData.phone}
            </div>
            <div
              class="slds-col slds-size_1-of-4 slds-text-body_regular slds-m-right_large slds-m-bottom_large slds-border_bottom"
            >
              Office Address : {customerInfo.rmData.officeAddress}
            </div>
          </div>
        </template>
        <template lwc:if={rmDetailsError}>
          <div
            class="slds-text-heading_small slds-m-left_medium slds-text-title_bold"
          >
            Relationship Manager Details
          </div>
          <br />
          <div class="slds-p-around_medium">
            <ul class="slds-list_vertical slds-has-dividers_bottom-space">
              <li class="slds-list__item" title="Customer Type">
                Error : {rmDetailsError}
              </li>
            </ul>
          </div>
        </template>
      </template>
      <template lwc:else>
        <div class="slds-p-around_medium">
          <ul class="slds-list_vertical slds-has-dividers_bottom-space">
            <li class="slds-list__item" title="Customer Type">
              Customer Type : {customerInfo.complainant_type}
            </li>
            <li class="slds-list__item" title="First Name">
              First Name : {customerInfo.first_name}
            </li>
            <li class="slds-list__item" title="Middle Names">
              Middle Names : {customerInfo.middlename}
            </li>
            <li class="slds-list__item" title="Last Name">
              Last Name : {customerInfo.last_name}
            </li>
            <li class="slds-list__item" title="Last Name">
              RM Complaint :
              <template lwc:if={customerInfo.isRmPresent}>YES</template>
              <template lwc:else>NO</template>
            </li>
            <template lwc:if={showMore}>
              <li class="slds-list__item" title="Gender">
                Gender : {customerInfo.gender}
              </li>
              <li class="slds-list__item" title="Age">
                Age : {customerInfo.age}
              </li>
              <li class="slds-list__item" title="Cpid">
                CPID : {customerInfo.cpId}
              </li>
              <li class="slds-list__item" title="Ocvid">
                OCVID : {customerInfo.ocvId}
              </li>
              <li class="slds-list__item" title="Email">
                Email : {customerInfo.email}
              </li>
              <li class="slds-list__item" title="Mobile">
                Mobile : {customerInfo.mobile}
              </li>
              <li class="slds-list__item" title="Street">
                Street : {customerInfo.street}
              </li>
              <li class="slds-list__item" title="Suburb">
                Suburb : {customerInfo.suburb}
              </li>
              <li class="slds-list__item" title="State">
                State : {customerInfo.state}
              </li>
              <li class="slds-list__item" title="Postcode">
                Postcode : {customerInfo.postcode}
              </li>
              <li class="slds-list__item" title="Country">
                Country : {customerInfo.country}
              </li>
            </template>
            <template lwc:else>
              <div>
                <button
                  class="slds-button showMore"
                  onclick={showAllCustomerData}
                >
                  Show More
                </button>
              </div>
            </template>
          </ul>
        </div>
        <template lwc:if={showMore}>
          <lightning-accordion
            class="example-accordion"
            allow-multiple-sections-open
            active-section-name=""
          >
            <lightning-accordion-section
              name="A"
              label="Customer Details"
              data-id="account-details"
            >
              <div class="slds-p-around_medium">
                <ul>
                  <template for:each={customerInfo.accounts} for:item="account">
                    <li class="slds-list__item" key={account.accountNumber}>
                      {account.accountNumber}
                    </li>
                  </template>
                </ul>
              </div>
            </lightning-accordion-section>
            <lightning-accordion-section
              name="B"
              label="Relationship Manager Details"
              data-id="rel-details"
            >
              <template lwc:if={isRMDetails}>
                <ul class="slds-list_vertical slds-has-dividers_bottom-space">
                  <li class="slds-list__item" title="Customer Type">
                    Name : {customerInfo.rmData.name}
                  </li>
                  <li class="slds-list__item" title="Customer Type">
                    Phone : {customerInfo.rmData.phone}
                  </li>
                  <li class="slds-list__item" title="Customer Type">
                    Office Address : {customerInfo.rmData.officeAddress}
                  </li>
                </ul>
              </template>
              <template lwc:if={rmDetailsError}> rmDetailsError </template>
            </lightning-accordion-section>
          </lightning-accordion>
        </template>
      </template>
    </template>
    <template lwc:if={error}>
      <div class="slds-p-around_medium">
        <ul class="slds-list_vertical slds-has-dividers_bottom-space">
          <li class="slds-list__item" title="Customer Type">Error : {error}</li>
        </ul>
      </div>
    </template>
    <template lwc:if={isLoading}>
      <div class="spinner">
        <lightning-spinner
          size="small"
          alternative-text="Loading"
          variant="brand"
        ></lightning-spinner>
      </div>
    </template>
  </lightning-card>
</template>
