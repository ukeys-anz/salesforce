<template>
    <lightning-card title="Customer Information" icon-name="standard:people"> 
        <template if:true={customerInfo}>
            <div class="slds-p-around_medium">
                    <ul class="slds-list--vertical slds-has-dividers--bottom-space">
                        <li class="slds-list__item" title="Complainant Type">Complainant Type : {customerInfo.complainant_type}</li>
                        <li class="slds-list__item" title="First Name">First Name : {customerInfo.first_name}</li>
                        <li class="slds-list__item" title="Middle Names">Middle Names : {customerInfo.middlename}</li>
                        <li class="slds-list__item" title="Last Name">Last Name : {customerInfo.last_name}</li>
                        <li class="slds-list__item" title="Gender">Gender : {customerInfo.gender}</li>
                        <li class="slds-list__item" title="Age">Age : {customerInfo.age}</li>
                        <li class="slds-list__item" title="Aboriginal or Torres Strait Islander">Aboriginal or Torres Strait Islander : {customerInfo.aboriginal}</li>
                        <li class="slds-list__item" title="Email">Email : {customerInfo.email}</li>
                        <li class="slds-list__item" title="Mobile">Mobile : {customerInfo.mobile}</li>
                        <li class="slds-list__item" title="Phone">Phone : {customerInfo.phone}</li>
                        <li class="slds-list__item" title="Street">Street : {customerInfo.street}</li>
                        <li class="slds-list__item" title="Suburb">Suburb : {customerInfo.suburb}</li>
                        <li class="slds-list__item" title="State">State : {customerInfo.state}</li>
                        <li class="slds-list__item" title="Postcode">Postcode : {customerInfo.postcode}</li>
                        <li class="slds-list__item" title="Country">Country : {customerInfo.country}</li>
                    </ul>
                    </div>
        </template>
        <template if:true={error}>
            <div class="slds-p-around_medium">
                <ul class="slds-list--vertical slds-has-dividers--bottom-space">
                    <li class="slds-list__item" title="Complainant Type">Error : {error} </li>         
                </ul>
            </div>
        </template>
        <template if:false={loaded}>
          <div class="spinner"> 
            <lightning-spinner size="small" alternative-text="Loading" variant="brand"></lightning-spinner>
           </div> 
        </template>
    </lightning-card>
</template>
