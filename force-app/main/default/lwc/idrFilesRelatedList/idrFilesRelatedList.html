<template>
  <div
    class="slds-box slds-box_xx-small slds-theme_shade slds-align_absolute-center"
  >
    <c-file-Upload onnewfileupload={refreshFileList} record-id={recordId}>
    </c-file-Upload>
  </div>
  <br />
  <div class="slds-box slds-theme_shade">
    <h1 style="font-size: medium">Search</h1>
    <lightning-layout horizontal-align="space">
      <lightning-layout-item padding="around-small">
        <lightning-input
          class="fileNameSearch"
          type="search"
          label="File Name"
          value={searchFileName}
          onchange={UpdateFileNameSearch}
        >
        </lightning-input>
      </lightning-layout-item>
      <lightning-layout-item padding="around-small">
        <lightning-input
          class="fileTypeSearch"
          type="search"
          label="File Type"
          value={searchFileType}
          onchange={UpdateFileTypeSearch}
        >
        </lightning-input>
      </lightning-layout-item>
      <lightning-layout-item padding="around-small">
        <lightning-input
          class="fileOwnerSearch"
          type="search"
          label="Owner"
          value={searchOwner}
          onchange={UpdateOwnerSearch}
        >
        </lightning-input>
      </lightning-layout-item>
      <lightning-layout-item padding="around-small">
        <lightning-input
          class="fileContainsSearch"
          type="search"
          label="Contains"
          value={searchContains}
          onchange={UpdateContainsSearch}
        >
        </lightning-input>
      </lightning-layout-item>
      <lightning-layout-item padding="around-small">
        <lightning-input
          class="fileStartDateSearch"
          type="date"
          label="Start Date"
          value={searchStartDate}
          onchange={UpdateStartDateSearch}
        >
        </lightning-input>
      </lightning-layout-item>
      <lightning-layout-item padding="around-small">
        <lightning-input
          class="fileEndDateSearch"
          type="date"
          label="End Date"
          value={searchEndDate}
          onchange={UpdateEndDateSearch}
        >
        </lightning-input>
      </lightning-layout-item>
    </lightning-layout>
  </div>
  <br />
  <template lwc:if={files}>
    <lightning-datatable
      key-field="fileId"
      data={filesToDisplay}
      columns={columns}
      hide-checkbox-column
      default-sort-direction={defaultSortDirection}
      sorted-direction={sortDirection}
      sorted-by={sortedBy}
      onrowaction={handleRowAction}
      onsort={onHandleSort}
      wrap-text-max-lines="6"
    >
    </lightning-datatable>
  </template>
  <template lwc:if={displayRemovalConfirmation}>
    <section class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container slds-grid">
        <lightning-card>
          <h2 slot="title" class="slds-p-around_small">
            Confirm removal from Case
          </h2>
          <p class="slds-p-horizontal_small">
            Are you sure you want to remove this file?
          </p>
          <p class="slds-p-horizontal_small">
            If you remove this file, it will no longer be available to view or
            access.
          </p>
          <div slot="footer" style="height: 44px">
            <lightning-button
              class="slds-float_right slds-p-around_x-small"
              variant="neutral"
              label="Cancel"
              onclick={closeRemovalConfirmation}
            >
            </lightning-button>
            <lightning-button
              class="slds-float_right slds-p-around_x-small"
              variant="brand"
              label="Confirm"
              onclick={handleRemovalConfirmation}
              data-test-id="submit-button"
            >
            </lightning-button>
          </div>
        </lightning-card>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
