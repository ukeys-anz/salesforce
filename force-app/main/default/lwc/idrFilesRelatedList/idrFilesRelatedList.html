<template>
    <lightning-layout horizontal-align="space">
        <lightning-layout-item padding="around-small">
            <lightning-input
            type="search" 
            label="File Name"
            value={searchFileName}
            onchange={UpdateFileNameSearch}
                >
            </lightning-input>
        </lightning-layout-item>
        <lightning-layout-item padding="around-small">
            <lightning-input
            type="search" 
            label="File Type"
            value={searchFileType}
            onchange={UpdateFileTypeSearch}
                >
            </lightning-input>
        </lightning-layout-item>
        <lightning-layout-item padding="around-small">
            <lightning-input
            type="search" 
            label="Owner"
            value={searchOwner}
            onchange={UpdateOwnerSearch}
                >
            </lightning-input>
        </lightning-layout-item>
        <lightning-layout-item padding="around-small">
            <lightning-input
            type="search" 
            label="Contains"
            value={searchContains}
            onchange={UpdateContainsSearch}
                >
            </lightning-input>
        </lightning-layout-item>
    </lightning-layout>
    <c-file-Upload
                  customer-id={customerId}
                  onnewfileupload={refreshFileList}
                  class="slds-m-top_large"
                >
    </c-file-Upload>
    <template if:true={files}>
        <lightning-datatable key-field="fileId"
        data={filesToDisplay}
        columns={columns}   
        hide-checkbox-column>
        </lightning-datatable>
    </template>
</template>
