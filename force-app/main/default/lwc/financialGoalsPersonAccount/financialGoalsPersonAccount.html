<template>
  <article class="financialAccountCardSize slds-card">
    <h1 class="card-title">
      <lightning-icon
        icon-name="standard:goals"
        size="medium"
        class="slds-m-right_small"
      ></lightning-icon>
      Savings Goals
    </h1>
    <template lwc:if={displayContent}>
      <template lwc:if={error}>
        <c-error message={error}></c-error>
      </template>
      <template lwc:else>
        <template lwc:if={hasGoals}>
          <template for:each={goalDetails} for:item="finAccount">
            <template lwc:if={finAccount.showGoals}>
              <div class="dividerTop" key={finAccount.account_id}></div>
              <div
                class="slds-card__body slds-card__body_inner"
                key={finAccount.account_id}
                data-id="fin-account"
              >
                <article class="slds-card">
                  <div class="slds-grid slds-p-around_xx-small">
                    <header class="slds-has-flexi-truncate">
                      <h2 class="card-heading-bold">
                        <a
                          onclick={navigateToFinancialAccountViewPage}
                          data-id={finAccount.account_id}
                          class="slds-truncate"
                          title={finAccount.account_name}
                        >
                          <span>{finAccount.account_name}</span>
                        </a>
                        <template lwc:if={finAccount.showMultipartyBadge}>
                          <span
                            class="slds-badge dormantBadgeClass slds-m-left_x-small"
                            >{finAccount.ownershipType}</span
                          >
                        </template>
                      </h2>
                    </header>
                  </div>
                  <div class="slds-grid slds-wrap">
                    <div class="slds-col">
                      <div>
                        <div
                          class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                        >
                          <div class="header-column slds-var-p-bottom_small">
                            <p class="card-heading-font">Account Number</p>
                            <p class="card-heading-bold">
                              {finAccount.account_number}
                            </p>
                          </div>
                        </div>
                        <template lwc:if={finAccount.haveBuckets}>
                          <div class="dividerTop">
                            <template
                              for:each={finAccount.buckets}
                              for:item="goal"
                            >
                              <div data-id="goal-body" key={goal.id}>
                                <div
                                  class="slds-grid slds-wrap slds-size_1-of-1 slds-m-top_small"
                                >
                                  <div
                                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-p-left_small"
                                  >
                                    <template lwc:if={goal.image}>
                                      <img src={goal.image} width="60%" />
                                    </template>
                                    <template lwc:else>
                                      <div class="emoji">
                                        <span>{goal.emoji}</span>
                                      </div>
                                    </template>
                                  </div>
                                  <div
                                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-var-p-around_small"
                                  >
                                    <div class="slds-text-align_center">
                                      <p class="ellipsis card-heading-bold">
                                        <a
                                          onclick={navigateToRecordViewPageFilter}
                                          class="slds-truncate"
                                          data-id={goal.id}
                                          data-finid={finAccount.account_id}
                                        >
                                          {goal.goal.name}
                                        </a>
                                      </p>
                                      <div class="description-tooltip">
                                        {goal.goal.name}
                                      </div>
                                    </div>
                                  </div>
                                  <div
                                    class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-var-p-around_small"
                                  >
                                    <p class="card-heading-font custom-padding">
                                      {finAccount.balance_title}
                                      <lightning-icon
                                        icon-name="utility:info"
                                        size="xx-small"
                                        class="tooltip-modal"
                                        onclick={handleInfoModal}
                                        data-productname={finAccount.product_name}
                                        data-balancetitle={finAccount.balance_title}
                                        data-id="total-info"
                                      ></lightning-icon>
                                    </p>
                                    <div class="slds-grid slds-gutters">
                                      <div
                                        class="slds-col slds-size_1-of-3"
                                        data-test-id="total-saved"
                                      >
                                        <lightning-progress-ring
                                          class="progress-ring"
                                          value={goal.fillPercentValue}
                                          size="large"
                                        >
                                        </lightning-progress-ring>
                                        <div
                                          class="progress-tooltip slds-text-align_center"
                                        >
                                          {goal.fillPercent}%
                                        </div>
                                      </div>
                                      <div
                                        class="slds-col slds-size_2-of-3"
                                        data-test-id="total-saved"
                                      >
                                        <lightning-formatted-number
                                          value={goal.balance.value}
                                          format-style="currency"
                                          data-id="amount"
                                          class="fontstyle"
                                        ></lightning-formatted-number>
                                        <div
                                          class="description-tooltip slds-text-align_center"
                                        >
                                          <lightning-formatted-number
                                            value={goal.balance.value}
                                            format-style="currency"
                                            data-id="amount"
                                          >
                                          </lightning-formatted-number>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </template>
                            <template lwc:if={finAccount.viewAll}>
                              <footer
                                class="slds-card__footer slds-align_absolute-center"
                              >
                                <a
                                  onclick={navigateToFinancialAccountViewPage}
                                  data-id={finAccount.account_id}
                                  class="slds-truncate"
                                  title="View All"
                                  label="View All"
                                >
                                  View All ({finAccount.goalsLeftToView})
                                </a>
                              </footer>
                            </template>
                          </div>
                        </template>
                        <template lwc:else>
                          <div
                            class="dividerTop slds-grid slds-wrap slds-size_1-of-1 slds-m-top_small"
                          >
                            <h1
                              class="slds-card__body slds-card__body_inner slds-size_1-of-1"
                            >
                              <span
                                class="slds-align_absolute-center"
                                data-id="no-goals"
                                >This account has no savings goals.</span
                              >
                            </h1>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                </article>
              </div>
            </template>
          </template>
        </template>
        <template lwc:else>
          <h1
            class="slds-card__body slds-card__body_inner emptyCardGoal slds-text-align_center"
          >
            <span class="no-goals" data-id="no-goals"
              >This customer has no savings goals.</span
            >
          </h1>
        </template>
      </template>
    </template>
    <template lwc:else>
      <div class="slds-grid">
        <p class="message-padding">
          Don’t worry, it’s not broken. To view this you need a higher
          permission level.
        </p>
      </div>
    </template>
    <div slot="footer" class="slds-p-around_medium slds-border_top">
      <span class="last-updated">Last Updated {timestamp}</span>
    </div>
  </article>
  <template lwc:if={showInfoModal}>
    <c-dynamic-tooltip-util
      data-id="total-info-modal"
      header-title={balanceTitle}
      resource-name="savingGoals"
      product-name={productName}
      onclosemodal={closeModal}
    ></c-dynamic-tooltip-util>
  </template>
</template>
