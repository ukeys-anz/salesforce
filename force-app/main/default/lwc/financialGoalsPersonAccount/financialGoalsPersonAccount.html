<template>
  <lightning-card>
    <h1 class="card-title">
      <lightning-icon
        icon-name="standard:goals"
        size="medium"
        class="slds-m-right_small"
      ></lightning-icon>
      Savings Goals
    </h1>
    <template if:true={displayContent}>
      <template if:true={error}>
        <c-error message={error}></c-error>
      </template>
      <template if:false={error}>
        <template if:true={hasGoals}>
          <div class="slds-grid slds-wrap" data-id="goal-body">
            <template for:each={goalDetails} for:item="goal">
              <div
                class="slds-col slds-size_1-of-3 slds-border_right"
                data-test-id="goal"
                key={goal.id}
              >
                <div class="slds-text-align_center">
                  <p
                    class="slds-text-color_weak ellipsis slds-text-heading_small"
                  >
                    <a
                      onclick={navigateToRecordViewPageFilter}
                      class="slds-truncate"
                      data-id={goal.id}
                    >
                      {goal.goal.name}
                    </a>
                  </p>
                  <div class="description-tooltip">{goal.goal.name}</div>
                  <template if:true={goal.image}>
                    <img src={goal.image} width="80%" />
                  </template>
                  <template if:false={goal.image}>
                    <div class="emoji">
                      <span>{goal.emoji}</span>
                    </div>
                  </template>
                </div>
                <div class="slds-m-top_x-large slds-m-left_small">
                  <p class="slds-text-body_small slds-text-color_weak">
                    Total Saved
                    <lightning-icon
                      icon-name="utility:info"
                      size="xx-small"
                      class="tooltip-modal"
                      onclick={handleInfoModal}
                      data-id="total-info"
                    ></lightning-icon>
                  </p>
                  <div class="slds-grid slds-gutters">
                    <div
                      class="slds-col slds-size_2-of-3"
                      data-test-id="total-saved"
                    >
                      <lightning-formatted-number
                        value={goal.balance.value}
                        format-style="currency"
                        data-id="amount"
                        class="slds-text-heading_small ellipsis"
                      ></lightning-formatted-number>
                      <div class="description-tooltip slds-text-align_center">
                        <lightning-formatted-number
                          value={goal.balance.value}
                          format-style="currency"
                          data-id="amount"
                        >
                        </lightning-formatted-number>
                      </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                      <lightning-progress-ring
                        class="progress-ring"
                        value={goal.fillPercentValue}
                        size="large"
                      >
                      </lightning-progress-ring>
                      <div class="progress-tooltip slds-text-align_center">
                        {goal.fillPercent}%
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <template if:true={viewAll}>
            <div
              class="slds-border_top slds-text-align_center slds-m-top_large slds-p-top_small"
            >
              <a
                onclick={navigateToRecordViewPage}
                class="slds-truncate"
                title="View All"
              >
                View All
              </a>
            </div>
          </template>
        </template>
        <template if:false={hasGoals}>
          <h1 class="slds-card__header-title slds-text-align_center">
            <span class="no-goals" data-id="no-goals"
              >Customer hasn't set any goals</span
            >
          </h1>
        </template>
      </template>
    </template>
    <template if:false={displayContent}>
      <div class="slds-grid">
        <p class="message-padding">
          Don’t worry, it’s not broken. To view this you need a higher
          permission level.
        </p>
      </div>
    </template>
    <div slot="footer" class="slds-m-bottom_x-small">
      <span class="last-updated">Last Updated {timestamp}</span>
    </div>
  </lightning-card>

  <template if:true={showInfoModal}>
    <section
      role="dialog"
      class="slds-modal slds-fade-in-open"
      data-id="total-info-modal"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header modal-header">
          <lightning-icon
            icon-name="utility:close"
            onclick={handleInfoModal}
            class="slds-button slds-button_icon slds-modal__close close-modal"
          ></lightning-icon>
          <h2 class="slds-modal__title slds-hyphenate">
            What does Total Saved mean?
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <span>
            <p class="slds-text-title_bold">
              The amount shown is indicative of the amount you may be able to
              use but may not be what is actually available.
            </p>
            <br />
            The amount shown is indicative of the amount you may be able to use
            in your ANZ Save account
            <strong> for this goal</strong>. The amount shown may not be what is
            actually available because:
            <ul class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium">
              <li>
                some transactions may not have updated the amount shown (e.g.
                reversals)
              </li>
              <li>
                some transactions may have updated the amount shown but are not
                yet fully processed (e.g. pending transactions), and/or
              </li>
              <li>
                we may not process transactions at the time, on the day or in
                the order that they are made.
              </li>
            </ul>
            If you proceed with a transaction when there may be insufficient
            funds, your account may go overdrawn or the transaction may be
            declined.
          </span>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleInfoModal}
          >
            Close
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
