<template>
  <div
    class="slds-is-relative slds-border_top slds-border_bottom slds-border_left slds-border_right slds-p-top_x-small slds-p-bottom_x-small slds-p-left_x-small slds-p-right_x-small"
  >
    <template lwc:if={showSpinner}>
      <lightning-spinner
        alternative-text="Loading"
        size="x-small"
      ></lightning-spinner>
    </template>
    <div class="slds-grid">
      <div class="slds-col slds-size_3-of-12">
        <lightning-card
          title="Financial Summary"
          icon-name="custom:custom17"
        ></lightning-card>
      </div>
      <div
        class="slds-col slds-size_8-of-12 slds-text-align_right slds-p-top_x-small"
      >
        <p>{lastSummaryCalculated}</p>
      </div>
      <div class="slds-col slds-size_1-of-12 slds-text-align_right">
        <lightning-button-icon
          title="Refresh"
          icon-name="utility:refresh"
          slot="actions"
          alternative-text="Settings"
          onclick={handleRefresh}
          disabled={isDisableRefresh}
        ></lightning-button-icon>
      </div>
    </div>
    <lightning-layout multiple-rows>
      <template if:true={showTotalCustmerBalanceInfo}>
        <lightning-layout-item size="4" padding="around-small">
          <c-financial-summary-view-card
            header-name="Total Customer Balance"
            header-value={totalCustBalance}
            show-other-value={showTotalBalOtherValue}
            header-other-value={totalBalOtherValue}
          ></c-financial-summary-view-card>
        </lightning-layout-item>
      </template>
      <template if:true={showTerminalInfo}>
        <!--lightning-layout-item size="4" padding="around-small">
          <c-financial-summary-view-card
            header-name="No. Merchant Terminals"
            header-value={totalTerminal}
            show-other-value={showTerminalOtherValue}
            header-other-value={terminalOtherValue}
          ></c-financial-summary-view-card>
        </lightning-layout-item-->
      </template>
      <template if:true={showAssetFinanceInfo}>
        <lightning-layout-item size="4" padding="around-small">
          <c-financial-summary-view-card
            header-name="Total Asset Financial Balance"
            header-value={totalAssetBalance}
            show-other-value={showAssetOtherValue}
            header-other-value={assetOtherValue}
          ></c-financial-summary-view-card>
        </lightning-layout-item>
      </template>
      <template if:true={showDebitBalanceInfo}>
        <lightning-layout-item size="4" padding="around-small">
          <c-financial-summary-view-card
            header-name="Total Debit Balance"
            header-value={totalDebitBalance}
            show-other-value={showDebitBalOtherValue}
            header-other-value={totalDebitOtherBalance}
          ></c-financial-summary-view-card>
        </lightning-layout-item>
      </template>
      <template if:true={showCreditBalanceInfo}>
        <lightning-layout-item size="4" padding="around-small">
          <c-financial-summary-view-card
            header-name="Total Credit Balance"
            header-value={totalCreditBalance}
            show-other-value={showCreditBalOtherValue}
            header-other-value={totalCreditOtherBalance}
          ></c-financial-summary-view-card>
        </lightning-layout-item>
      </template>
      <template if:true={showTotalLimitInfo}>
        <lightning-layout-item size="4" padding="around-small">
          <c-financial-summary-view-card
            header-name="Total Limits"
            header-value={totalLimitValue}
            show-other-value={showLimitOtherValue}
            header-other-value={totalLimitOtherValue}
          ></c-financial-summary-view-card>
        </lightning-layout-item>
      </template>
      <template if:true={showClgCreditRatingInfo}>
        <lightning-layout-item size="4" padding="around-small">
          <c-financial-summary-view-card
            header-name="CLG Credit Rating"
            header-value=""
            show-other-value="true"
            header-other-value={clgCreditRating}
          ></c-financial-summary-view-card>
        </lightning-layout-item>
      </template>
      <template if:true={showMortageLimitInfo}>
        <lightning-layout-item size="4" padding="around-small">
          <c-financial-summary-view-card
            header-name="Total Mortgage Limit"
            header-value={totalMortageValue}
            show-other-value={showTotalMortageOtherValue}
            header-other-value={totalMortageOtherValue}
          ></c-financial-summary-view-card>
        </lightning-layout-item>
      </template>
    </lightning-layout>
    <div
      lwc:if={showCCCalculationMsg}
      class="slds-col slds-size_5-of-12 slds-align_absolute-center slds-p-top_x-small slds-text-body_small"
    >
      <b>
        The calculated values above currently do not include some Credit Card
        products
      </b>
    </div>
  </div>
</template>
