<template>
  <div class="slds-card" data-test-id="initiate-interact-card">
    <div class="slds-tabs_scoped slds-tabs_medium">
      <template lwc:if={isLoaded}>
        <ul class="slds-tabs_scoped__nav" role="tablist">
          <template lwc:if={contactCustomer}>
            <li class={contactTab} title="Contact" role="presentation">
              <div
                class="slds-tabs_scoped__link slds-text-align_center"
                role="tab"
                onclick={handleShowContactTab}
              >
                <lightning-icon
                  class="dialing"
                  icon-name="utility:dialing"
                  alternative-text="Dialing"
                  title="Dialing"
                  size="small"
                ></lightning-icon>
                Contact Customer
              </div>
            </li>
          </template>
          <li class={dialTab} title="Dial" role="presentation">
            <div
              class="slds-tabs_scoped__link slds-text-align_center"
              role="tab"
              onclick={handleShowDialTab}
            >
              <lightning-icon
                class="keypad"
                icon-name="utility:keypad"
                alternative-text="Keypad"
                title="Keypad"
                size="small"
              ></lightning-icon>
              Dial Number
            </div>
          </li>
        </ul>
        <template lwc:if={showContactTab}>
          <div>
            <div class="slds-m-around_small">
              <template lwc:if={showMessageCustomer}>
                <template lwc:if={displayOutboundChat}>
                  <div class="slds-align_absolute-center">
                    <lightning-button
                      data-id="message-customer"
                      data-test-id="message-customer-button"
                      variant="brand-outline"
                      label="Message Customer"
                      title="Message"
                      onclick={handleShowChatWindow}
                      icon-name="utility:chat"
                      class="slds-p-around_x-small button-display"
                    >
                    </lightning-button>
                  </div>
                </template>
                <template lwc:else>
                  <div class="slds-align_absolute-center">
                    <lightning-button
                      data-id="message-customer"
                      data-test-id="message-customer-button"
                      variant="brand-outline"
                      label="Message Customer"
                      title="Message"
                      icon-name="utility:chat"
                      class="slds-p-around_x-small button-display"
                      disabled
                    >
                    </lightning-button>
                  </div>
                </template>
              </template>
              <div class="slds-align_absolute-center">
                <template lwc:if={callPhoneNumber}>
                  <template lwc:if={displayOutboundDial}>
                    <lightning-button
                      data-id="call-customer"
                      data-test-id="call-customer-button"
                      variant="brand-outline"
                      label={callPhoneNumber}
                      title="Call"
                      onclick={handleCallCustomer}
                      icon-name="utility:call"
                      class="slds-p-around_x-small button-display"
                    >
                    </lightning-button>
                  </template>
                  <template lwc:else>
                    <lightning-button
                      data-id="call-customer"
                      data-test-id="call-customer-button"
                      variant="brand-outline"
                      label={callPhoneNumber}
                      title="Call"
                      icon-name="utility:call"
                      class="slds-p-around_x-small button-display"
                      disabled
                    >
                    </lightning-button>
                  </template>
                </template>
              </div>
              <div
                class="slds-m-top_x-small slds-m-bottom_small slds-align_absolute-center"
              >
                <span>
                  * When making outbound calls, remember to
                  <b> authenticate the customer</b> (using their full name,
                  including middle names) and let them know we
                  <b> record all our calls*</b></span
                >
              </div>
            </div>
          </div>
        </template>
        <template lwc:if={showDialTab}>
          <div>
            <div class="slds-m-around-small dial-tab">
              <label class="slds-form-element__label slds-p-top_small">
                Enter a number
                <lightning-helptext
                  class="slds-p-left_x-small slds-m-bottom_small"
                  content="Calling internationally? Ensure you use the country code including the '+' symbol."
                >
                </lightning-helptext>
              </label>

              <lightning-input
                data-id="phone-input"
                type="tel"
                placeholder="+61"
                onchange={handlePhoneChange}
                pattern="^([^a-zA-Z]*)$"
                message-when-pattern-mismatch="Please enter the number in a valid format"
                min-length="2"
                max-length="15"
              ></lightning-input>
              <div
                class="slds-m-bottom_medium slds-p-top_small slds-align_absolute-center"
              >
                <span>
                  * When making outbound calls, remember to
                  <b> authenticate the customer</b> (using their full name,
                  including middle names) and let them know we
                  <b> record all our calls*</b></span
                >
              </div>
              <div class="slds-m-bottom_x-small slds-align_absolute-center">
                <template lwc:if={displayOutboundDial}>
                  <lightning-button
                    data-id="call-now"
                    variant="brand"
                    label="Call Now"
                    title="Call"
                    onclick={handleCallNow}
                    icon-name="utility:call"
                    class="slds-p-around_x-small button-display"
                    disabled={invalidNumber}
                  >
                  </lightning-button>
                </template>
                <template lwc:else>
                  <lightning-button
                    data-id="call-now"
                    variant="brand"
                    label="Call Now"
                    title="Call"
                    icon-name="utility:call"
                    class="slds-p-around_x-small button-display"
                    disabled
                  >
                  </lightning-button>
                </template>
              </div>
            </div>
          </div>
        </template>
        <template lwc:if={showChatWindow}>
          <div>
            <div class="slds-m-around-small chat-window">
              <div class="slds-m-top_medium">
                <div class="slds-grid">
                  <div
                    class="slds-col slds-size_1-of-8 slds-p-bottom_small slds-align_absolute-center"
                  >
                    <lightning-icon icon-name="utility:chat"> </lightning-icon>
                  </div>
                  <div class="slds-col slds-size_7-of-8">
                    <b class="message-header">Send a message</b>
                    <br />
                    <label class="slds-form-element__label">
                      Start a conversation with the first outbound message.
                      Reinitiate in Twilio Flex to continue.
                    </label>
                  </div>
                </div>
              </div>
              <template lwc:if={showMessageDialog}>
                <lightning-textarea
                  data-id="message-body"
                  data-test-id="message-body-textarea"
                  class="message-area"
                  placeholder="Start typing here..."
                  onchange={handleMessageChange}
                  min-length="4"
                  maxlength="1000"
                  message-when-too-long="A maximum of 1000 characters are allowed"
                  message-when-value-missing="Please enter a valid message"
                ></lightning-textarea>
                <span class={remainingCharStyle}>{remainingCharMsg}</span>
                <div lwc:if={isLoadingCase}>
                  <lightning-spinner
                    alternative-text="Loading..."
                    variant="brand"
                  >
                  </lightning-spinner>
                </div>
                <div class="slds-m-top_large slds-m-bottom_small">
                  <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                      <lightning-button
                        data-id="cancel"
                        variant="brand-outline"
                        title="Cancel"
                        label="Cancel"
                        onclick={handleShowContactTab}
                        class="slds-p-bottom_x-small cancel"
                      >
                      </lightning-button>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                      <lightning-button
                        data-id="send-now"
                        data-test-id="send-now-button"
                        variant="brand"
                        label="Send Now"
                        title="Send"
                        onclick={handleMessageCustomer}
                        disabled={invalidMessage}
                        class="slds-p-bottom_x-small slds-float_right send-now"
                      >
                      </lightning-button>
                    </div>
                  </div>
                </div>
              </template>
              <template lwc:if={showMessageToast}>
                <template lwc:if={showSuccessMessage}>
                  <div class="slds-is-relative slds-p-top_large">
                    <div class="slds-theme_success" role="status">
                      <span class="slds-assistive-text">Success</span>
                      <div
                        class="slds-notify__content slds-p-left_medium slds-p-bottom_large slds-p-top_large"
                      >
                        <h2 class="slds-text-heading_medium">
                          Your message was sent.
                        </h2>
                        <div class="slds-p-top_large">Remember:</div>
                        <div class="slds-p-left_small">
                          - Interaction will be created with linked chat thread
                        </div>
                        <div class="slds-p-left_small">
                          - Click <strong>Reinitiate Chat</strong> to continue
                          conversation in Twilio Flex
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
                <template lwc:if={showErrorMessage}>
                  <div class="slds-is-relative slds-p-top_large">
                    <div class="slds-theme_error" role="status">
                      <span class="slds-assistive-text">Error</span>
                      <div
                        class="slds-notify__content slds-p-left_medium slds-p-bottom_large slds-p-top_large"
                      >
                        <h2 class="slds-text-heading_medium">
                          An Error Occurred
                        </h2>
                        <div class="slds-p-top_large">{errMsg}</div>
                      </div>
                    </div>
                  </div>
                </template>
                <div class="slds-m-top_small slds-m-bottom_small">
                  <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                      <lightning-button
                        data-id="cancel"
                        variant="brand-outline"
                        title="Cancel"
                        label="Cancel"
                        onclick={handleShowContactTab}
                        class="slds-p-bottom_x-small cancel"
                      >
                      </lightning-button>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                      <template lwc:if={isLoadingCase}>
                        <lightning-spinner
                          alternative-text="Loading..."
                          variant="brand"
                        >
                        </lightning-spinner>
                      </template>
                      <template lwc:else>
                        <lightning-button
                          data-id="send-now"
                          data-test-id="reinitiate-chat-button"
                          variant="brand"
                          label="Reinitiate Chat"
                          title="Reinitiate"
                          onclick={handleReinitiate}
                          class="slds-p-bottom_x-small slds-float_right send-now"
                        >
                        </lightning-button>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </template>
    </div>
  </div>
</template>
