<template>
  <article class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-tabs_scoped">
          <ul class="slds-tabs_scoped__nav slds-grid slds-wrap" role="tablist">
            <template lwc:if={showCaseChatTabHead}>
              <li class={chatTab} title="Dial" role="presentation">
                <div
                  class="slds-tabs_scoped__link"
                  role="tab"
                  onclick={handleShowChatTab}
                >
                  Chats
                </div>
              </li>
            </template>
            <template lwc:if={showAppTab}>
              <li class={appointmentTab} title="Contact" role="presentation">
                <div
                  class="slds-tabs_scoped__link"
                  role="tab"
                  onclick={handleShowAppointmentTab}
                >
                  Appointments
                </div>
              </li>
            </template>
            <template lwc:if={showMsgTab}>
              <li class={messageTab} title="Message" role="presentation">
                <div
                  class="slds-tabs_scoped__link"
                  role="tab"
                  onclick={handleShowMessageTab}
                >
                  Messages
                </div>
              </li>
            </template>
            <template if:true={showCallIntTab}>
              <li class={callTab} title="Call" role="presentation">
                <div
                  class="slds-tabs_scoped__link"
                  role="tab"
                  onclick={handleShowCallTab}
                >
                  Calls
                </div>
              </li>
            </template>
            <template lwc:if={showStoreIntTab}>
              <li class={storeTab} title="Store" role="presentation">
                <div
                  class="slds-tabs_scoped__link"
                  role="tab"
                  onclick={handleShowStoreTab}
                >
                  In Person
                </div>
              </li>
            </template>
            <template lwc:if={showAccChatTabHead}>
              <li class={chatTab} title="Dial" role="presentation">
                <div
                  class="slds-tabs_scoped__link"
                  role="tab"
                  onclick={handleShowChatTab}
                >
                  Chats
                </div>
              </li>
            </template>
            <li class="slds-tabs_scoped__item slds-col slds-m-right_xx-small">
              <button
                class="slds-button slds-float_right slds-button_neutral slds-m-top_xx-small"
                onclick={handleNewButton}
              >
                New
              </button>
            </li>
          </ul>
        </div>
      </header>
    </div>
    <div class="slds-card__body slds-card__body_inner">
      <template lwc:if={showAppointmentTab}>
        <template lwc:if={showAppointmentRecords}>
          <template for:each={appointmentList} for:item="appt">
            <div class="slds-m-top_small" key={appt.interactId}>
              <div class="slds-grid slds-gutters">
                <div class="slds-col">
                  <a
                    href="#"
                    onclick={handleViewRecord}
                    data-id={appt.interactId}
                  >
                    {appt.interactName}
                  </a>
                </div>
              </div>
              <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">Date and Time:</div>
                <div class="slds-col slds-size_1-of-2">{appt.interactTime}</div>
              </div>
              <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">Owner Name:</div>
                <div class="slds-col slds-size_1-of-2">{appt.ownerName}</div>
              </div>
            </div>
          </template>
          <footer class="slds-card__footer">
            <a
              class="slds-card__footer-action"
              href="javascript:void(0);"
              onclick={handleViewAll}
              >View All
              <span class="slds-assistive-text">Interactions</span>
            </a>
          </footer>
        </template>
      </template>
    </div>
    <template lwc:if={showMessageTab}>
      <c-interaction-record-service
        str-parent-id={recordId}
        str-record-type-name="Message"
        max-number={maxRecords}
        lightning-page-name={lightningPageName}
        message-record={messageRecord}
        onshowviewall={fetchViewValue}
      ></c-interaction-record-service>
      <template lwc:if={showViewAll}>
        <footer class="slds-card__footer">
          <c-view-all-generic
            any-record-id={recordId}
            record-type-developer-name={messageRecord}
            lightning-page-name={lightningPageName}
          >
          </c-view-all-generic>
        </footer>
      </template>
    </template>
    <template lwc:if={showCallTab}>
      <c-interaction-record-service
        str-parent-id={recordId}
        str-record-type-name="General"
        max-number={maxRecords}
        lightning-page-name={lightningPageName}
        general-record={generalRecord}
        onshowviewall={fetchViewValue}
      ></c-interaction-record-service>
      <template lwc:if={showViewAll}>
        <footer class="slds-card__footer">
          <c-view-all-generic
            any-record-id={recordId}
            record-type-developer-name={generalRecord}
            lightning-page-name={lightningPageName}
          >
          </c-view-all-generic>
        </footer>
      </template>
    </template>
    <template lwc:if={showStoreTab}>
      <c-interaction-record-service
        str-parent-id={recordId}
        str-record-type-name="Store"
        max-number={maxRecords}
        lightning-page-name={lightningPageName}
        store-record={storeRecord}
        onshowviewall={fetchViewValue}
      ></c-interaction-record-service>
      <template lwc:if={showViewAll}>
        <footer class="slds-card__footer">
          <c-view-all-generic
            any-record-id={recordId}
            record-type-developer-name={storeRecord}
            lightning-page-name={lightningPageName}
          >
          </c-view-all-generic>
        </footer>
      </template>
    </template>
    <template lwc:if={showChatTab}>
      <div class="slds-card__body slds-card__body_inner">
        <div>
          <c-chat-topic-related-list
            record-id={recordId}
            object-name={sObjectType}
          >
          </c-chat-topic-related-list>
        </div>
      </div>
    </template>
  </article>
</template>
