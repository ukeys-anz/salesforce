<template>
  <!-- lightning datatable component -->
  <template if:false={showTableWoCheckboxes}>
    <p class="tableHeaderMessage">{tableHeader}</p>
    <template if:true={showComponent}>
      <lightning-datatable
        key-field="Id"
        data={recordsToDisplay}
        columns={columns}
        onrowselection={handlerowselection}
        max-row-selection={maxrowselection}
        onrowaction={handleRowAction}
        selected-rows={selectedRows}
        column-widths-mode="auto"
      >
      </lightning-datatable>
    </template>
  </template>
  <template if:true={showTableWoCheckboxes}>
    <template if:true={showComponent}>
      <lightning-datatable
        key-field="Id"
        data={recordsToDisplay}
        columns={columns}
        onrowaction={handleRowAction}
        hide-checkbox-column
      >
      </lightning-datatable></template
  ></template>
  <template if:true={isOpen}>
    <section
      role="dialog"
      tabindex="-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      aria-describedby="modal-content-id-1"
      class="slds-modal slds-fade-in-open slds-modal_medium"
    >
      <div class="slds-modal__container">
        <lightning-card>
          <!-- modal header start -->
          <header class="slds-modal__header">
            <button
              class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
              title="Close"
              onclick={hideModalBox}
            >
              <lightning-icon
                icon-name="utility:close"
                alternative-text="close"
                variant="inverse"
                size="small"
              ></lightning-icon>
              <span class="slds-assistive-text">Close</span>
            </button>
            <h2
              id="modal-heading-01"
              class="slds-text-heading_medium slds-hyphenate"
            >
              PayTo Details
            </h2>
          </header>
          <!-- modal body start -->
          <div
            class="slds-modal__content slds-p-around_medium"
            id="modal-content-id-1"
          >
            <div class="slds-p-top_medium">
              <p><b>Payment Details</b></p>
            </div>
            <div class="slds-grid slds-wrap slds-p-top_medium">
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">Payee Name</div>
                <div class="slds-grid wrapped-content">
                  {record.initiatingPartyName}
                </div>
              </div>
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">Mandate ID</div>
                <div class="slds-grid wrapped-content">{record.name}</div>
              </div>
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">Status</div>
                <div class="slds-grid wrapped-content">
                  {record.statusDescription}
                </div>
              </div>
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">Amount</div>
                <div class="slds-grid wrapped-content">{record.amount}</div>
              </div>
            </div>
            <div class="slds-p-top_medium">
              <p><b>Payment Terms</b></p>
            </div>
            <div class="slds-grid slds-wrap slds-p-top_medium">
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">Frequency</div>
                <div class="slds-grid wrapped-content">
                  {record.paymentInformation.frequencyDetails}
                </div>
              </div>
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">Start Date</div>
                <div class="slds-grid wrapped-content">{record.startDate}</div>
              </div>
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">
                  Maximum Amount
                </div>
                <div class="slds-grid wrapped-content">{record.maxAmount}</div>
              </div>
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">
                  Status Reason Change
                </div>
                <div class="slds-grid wrapped-content">
                  {record.statusReasonDescription}
                </div>
              </div>
            </div>
            <div class="slds-p-top_medium">
              <p><b>Payer Details</b></p>
            </div>
            <div class="slds-grid slds-p-top_medium">
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">Payer</div>
                <div class="slds-grid wrapped-content">
                  {record.debtorInformation.partyName}
                </div>
              </div>
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">
                  Account Number
                </div>
                <div class="slds-grid wrapped-content">
                  {record.accountNumber}
                </div>
              </div>
              <div class="slds-col slds-size_3-of-12">
                <div class="slds-grid slds-form-element__label">PayID</div>
                <div class="slds-grid wrapped-content">{record.payId}</div>
              </div>
            </div>
          </div>
          <!-- modal footer start-->
          <footer class="slds-modal__footer">
            <button
              class="slds-button slds-button_neutral"
              onclick={hideModalBox}
            >
              Close
            </button>
          </footer>
        </lightning-card>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <!--PAGE NAVIGATION-->
  <template if:true={showNavButtons}>
    <div class="slds-align_absolute-center" style="height: 5rem">
      <button
        disabled={bDisableLast}
        onclick={nextPage}
        class="slds-button slds-button_stretch slds-p-horizontal_x-small"
      >
        Load More
      </button>
    </div>
  </template>
</template>
