<template>
  <template if:true={loading}>
    <div class="slds-align_absolute-center" style="height: 4rem">
      <div role="status" class="slds-spinner_inline">
        <lightning-spinner
          alternative-text="Loading"
          variant="brand"
        ></lightning-spinner>
      </div>
    </div>
  </template>
  <template if:false={loading}>
    <article class="everydayAccount slds-card">
      <div class="slds-card__header slds-grid">
        <header class="slds-has-flexi-truncate">
          <h1 class="slds-card__header-title main-title">
            <span>Everyday Accounts</span>
          </h1>
        </header>
      </div>
      <template if:true={financialAccounts}>
        <template for:each={financialAccounts} for:item="finAccount">
          <div
            class="slds-card__body slds-card__body_inner"
            key={finAccount.Id}
          >
            <article class="slds-card slds-card_boundary">
              <div class="slds-card__header slds-grid">
                <header class="slds-has-flexi-truncate">
                  <h2 class="slds-card__header-title">
                    <a
                      onclick={navigateToRecordViewPage}
                      data-id={finAccount.Id}
                      class="slds-truncate"
                      title={finAccount.Name}
                    >
                      <span>{finAccount.Name}</span>
                    </a>
                    <span class={finAccount.badgeClass}
                      >{finAccount.FinServ__Status__c}</span
                    >
                  </h2>
                </header>
              </div>
              <div class="slds-card__body slds-card__body_inner">
                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                  <li
                    class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-3"
                    style="padding-left: 20px"
                  >
                    <article class="slds-tile slds-hint-parent">
                      <div
                        class="slds-grid slds-grid_align-spread slds-has-flexi-truncate"
                      >
                        <h3
                          class="slds-tile__title slds-truncate"
                          title="Account Number"
                        >
                          Account Number
                        </h3>
                      </div>
                      <div class="slds-tile__detail">
                        <dl class="slds-list_horizontal slds-wrap">
                          <dt
                            class="slds-item_label slds-text-color_weak"
                            title="Account Number"
                          >
                            {finAccount.FinServ__FinancialAccountNumber__c}
                          </dt>
                        </dl>
                      </div>
                    </article>
                  </li>
                  <li
                    class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-3"
                  >
                    <article class="slds-tile slds-hint-parent">
                      <div
                        class="slds-grid slds-grid_align-spread slds-has-flexi-truncate"
                      >
                        <h3
                          class="slds-tile__title slds-truncate"
                          title="Available Balance"
                        >
                          Available Balance
                        </h3>
                      </div>
                      <div class="slds-tile__detail">
                        <dl class="slds-list_horizontal slds-wrap">
                          <dt
                            class="slds-item_label slds-text-color_weak"
                            title="Available"
                          >
                            {finAccount.FinServ__Balance__c}
                          </dt>
                        </dl>
                      </div>
                    </article>
                  </li>
                  <li
                    class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-3"
                  >
                    <article class="slds-tile slds-hint-parent">
                      <div
                        class="slds-grid slds-grid_align-spread slds-has-flexi-truncate"
                      >
                        <h3
                          class="slds-tile__title slds-truncate"
                          title="Current Balance"
                        >
                          Current Balance
                        </h3>
                      </div>
                      <div class="slds-tile__detail">
                        <dl class="slds-list_horizontal slds-wrap">
                          <dt
                            class="slds-item_label slds-text-color_weak"
                            title="Current"
                          >
                            {finAccount.FinServ__CurrentPostedBalance__c}
                          </dt>
                        </dl>
                      </div>
                    </article>
                  </li>
                </ul>
              </div>
            </article>
          </div>
        </template>
      </template>
      <template if:false={financialAccounts}>
        <h1 class="slds-card__header-title main-title">
          <span>No Financial Accounts</span>
        </h1>
      </template>
      <footer class="slds-card__footer">
        <span class="lastUpdated">Last Updated Date/Time {timestamp}</span>
      </footer>
    </article>
  </template>
</template>
