<template>
  <template if:true={loading}>
    <div class="slds-align_absolute-center" style="height: 4rem">
      <div role="status" class="slds-spinner_inline">
        <lightning-spinner
          alternative-text="Loading"
          variant="brand"
        ></lightning-spinner>
      </div>
    </div>
  </template>
  <template if:false={loading}>
    <article class="everydayAccount slds-card">
      <div class="slds-card__header slds-grid">
        <header class="slds-has-flexi-truncate">
          <h1 class="slds-card__header-title main-title">
            <span>{componentTitle}</span>
          </h1>
        </header>
      </div>
      <template if:true={displayContent}>
        <template if:true={hasError}>
          <c-error message={error}></c-error>
        </template>
        <template if:false={hasError}>
          <template if:true={financialAccounts}>
            <template for:each={financialAccounts} for:item="finAccount">
              <div
                class="slds-card__body slds-card__body_inner"
                key={finAccount.Id}
              >
                <article class="slds-card slds-card_boundary">
                  <div class="slds-card__header slds-grid">
                    <header class="slds-has-flexi-truncate">
                      <h2 class="slds-card__header-title">
                        <a
                          onclick={navigateToRecordViewPage}
                          data-id={finAccount.Id}
                          class="slds-truncate"
                          title={finAccount.Name}
                        >
                          <span>{finAccount.Name}</span>
                        </a>
                        <span class={finAccount.badgeClass}
                          >{finAccount.FinServ__Status__c}</span
                        >
                      </h2>
                    </header>
                  </div>
                  <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-grid slds-size_1-of-1">
                      <div class="slds-grid slds-wrap slds-size_1-of-1">
                        <div
                          class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small"
                        >
                          <div class="header-column">
                            <p class="field-title slds-text-color_weak">
                              Account Number
                            </p>
                            <p class="slds-text-title_bold">
                              {finAccount.FinServ__FinancialAccountNumber__c}
                            </p>
                          </div>
                        </div>
                        <div
                          class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-p-around_small balance-padding"
                        >
                          <div class="header-column slds-float_right">
                            <p class="field-title slds-text-color_weak">
                              {balanceTitle}
                              <lightning-icon
                                icon-name="utility:info"
                                size="xx-small"
                                class="tooltip"
                                onclick={handleInfoModal}
                              ></lightning-icon>
                            </p>
                            <p class="slds-text-title_bold">
                              {finAccount.FinServ__Balance__c}
                            </p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <footer class="slds-card__footer account-footer">
                    <span class="lastUpdated"
                      >Last Updated {finAccount.lastUpdated}</span
                    >
                  </footer>
                </article>
              </div>
            </template>
          </template>
          <template if:false={financialAccounts}>
            <h1 class="slds-card__header-title main-title">
              <span class="not-found">No {accountType} Accounts</span>
            </h1>
          </template>
        </template>
      </template>
      <template if:false={displayContent}>
        <div class="slds-grid">
          <p class="message-padding">
            Don’t worry, it’s not broken. To view this you need a higher
            permission level.
          </p>
        </div>
      </template>
    </article>
    <template if:true={showInfoModal}>
      <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
          <header class="slds-modal__header modal-header">
            <lightning-icon
              icon-name="utility:close"
              onclick={handleInfoModal}
              class="slds-button slds-button_icon slds-modal__close close-modal"
            ></lightning-icon>
            <h2 class="slds-modal__title slds-hyphenate">
              What does {balanceTitle} mean?
            </h2>
          </header>
          <div class="slds-modal__content slds-p-around_medium">
            <span>
              <p class="slds-text-title_bold">
                The amount shown is indicative of the amount you may be able to
                use but may not be what is actually available.
              </p>
              <br />
              The amount shown is indicative of the amount you may be able to
              use in your {productTitle} account. This amount, when shown at an
              ATM or on a receipt, may have a different label such as 'Funds' or
              'Balance'. Regardless, the amount shown may not be what is
              actually available because:
              <ul
                class="slds-list_dotted slds-m-top_medium slds-m-bottom_medium"
              >
                <li>
                  some transactions may not have updated the amount shown (e.g.
                  reversals)
                </li>
                <li>
                  some transactions may have updated the amount shown but are
                  not yet fully processed (e.g. pending transactions), and/or
                </li>
                <li>
                  we may not process transactions at the time, on the day or in
                  the order that they are made.
                </li>
              </ul>
              If you proceed with a transaction when there may be insufficient
              funds, your account may go overdrawn or the transaction may be
              declined.
            </span>
          </div>
          <footer class="slds-modal__footer">
            <button
              class="slds-button slds-button_neutral"
              onclick={handleInfoModal}
            >
              Close
            </button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </template>
</template>
