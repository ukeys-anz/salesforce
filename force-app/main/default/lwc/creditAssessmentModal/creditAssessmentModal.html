<template>
  <lightning-modal-header
    class="modal-header"
    label="Select a referral outcome"
  ></lightning-modal-header>

  <div class="slds-p-bottom_xx-small"></div>
  <template lwc:if={showError}>
    <div
      class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error"
      role="alert"
      id="showError"
    >
      <span
        class="slds-icon_container slds-icon-utility-error slds-m-right_x-small"
        title="Description of icon when needed"
      >
        <lightning-icon
          icon-name="utility:error"
          alternative-text="Error"
          title="Error"
          variant="inverse"
        ></lightning-icon>
      </span>
      <h2>{errorMessage}</h2>
      <div class="slds-notify__close">
        <button
          class="slds-button slds-button_icon slds-button_icon-small slds-button_icon-inverse"
          title="Close"
          onclick={closeError}
        >
          <lightning-icon
            icon-name="utility:close"
            alternative-text="Close"
            title="Close"
            variant="inverse"
          ></lightning-icon>
        </button>
      </div>
    </div>
  </template>
  <template lwc:if={saving}>
    <div class="slds-align_absolute-center" style="height: 4rem">
      <div role="status" class="slds-spinner_inline">
        <lightning-spinner
          alternative-text="Loading"
          variant="brand"
        ></lightning-spinner>
      </div>
    </div>
  </template>
  <template lwc:else>
    <lightning-modal-body>
      <div class="slds-grid slds-gutters slds-m-bottom_large">
        <div class="slds-col">
          <p class="slds-text-color_weak field-title">Reason Code</p>
          <p class="slds-text-body_regular">{reasonCode}</p>
        </div>
        <div class="slds-col">
          <p class="slds-text-color_weak field-title">Category</p>
          <p class="slds-text-body_regular">{assessmentCategory}</p>
        </div>
        <div class="slds-col">
          <p class="slds-text-color_weak field-title">Description</p>
          <p class="slds-text-body_regular">{reasonDescription}</p>
        </div>
        <div class="slds-col">
          <p class="slds-text-color_weak field-title">
            Guidance<lightning-helptext
              class="tooltip"
              content="The instructions on how to resolve the referral reason can be found by referring to the knowledge article for the category and looking for the guidance code within."
            ></lightning-helptext>
          </p>
          <p class="slds-text-body_regular">{guidanceCode}</p>
        </div>
      </div>

      <div class="slds-form-element">
        <div class="slds-clearfix">
          <label class="slds-form-element__label" style="margin-top: 5px"
            >Referral Outcome</label
          >
          <div class="slds-float_right">
            <lightning-button
              variant="base"
              label="Clear Referral Outcome"
              onclick={handleDelete}
              disabled={isClearBtnDisabled}
            ></lightning-button>
          </div>
        </div>
        <div class="slds-form-element__control">
          <div class="slds-select_container">
            <select
              disabled={hasOutcome}
              class="slds-select"
              name="referralOutcome"
              onchange={handleSelectedValue}
            >
              <option value="" disabled selected={defaultSelection}>
                Select one referral outcome
              </option>
              <option value="None">--None--</option>
              <template for:each={optionList} for:item="option">
                <option
                  value={option.value}
                  key={option.value}
                  selected={option.selected}
                >
                  {option.name}
                </option>
              </template>
            </select>
          </div>
        </div>
      </div>
      <template lwc:if={showModified}>
        <span class="slds-text-color_weak slds-float_right slds-p-top_small"
          >Last Modified By {modifiedBy}</span
        >
      </template>
    </lightning-modal-body>
    <lightning-modal-footer>
      <lightning-button
        label="Cancel"
        title="Cancel"
        onclick={handleCancel}
        class="slds-m-left_x-small"
      ></lightning-button>
      <lightning-button
        variant="brand"
        label="Save"
        title="Save"
        onclick={handleConfirmClick}
        disabled={disableSave}
        class="slds-m-left_x-small"
      ></lightning-button>
    </lightning-modal-footer>
  </template>
</template>
