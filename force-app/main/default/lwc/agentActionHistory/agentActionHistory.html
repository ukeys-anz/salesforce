<template>
  <template if:true={hasData}>
    <!-- ======================= DETAIL VIEW ==================== -->
    <template if:true={isDetailView}>
      <section
        class="slds-section slds-is-open slds-m-bottom_medium"
        role="region"
        aria-label="Agent Action History"
      >
        <!-- Header -->
        <h3 class="slds-section__title">
          <button class="slds-button slds-section__title-action" type="button">
            <span class="slds-truncate"> Agent Action History </span>
          </button>
        </h3>

        <!-- ONE ROW : BOTH FIELDS INLINE -->
        <div class="inline-system-row slds-border_bottom">
          <!-- Created By -->
          <div class="inline-field">
            <span class="label">Created By</span>
            <span class="value">
              CRM AI Agent,&nbsp;
              <lightning-formatted-date-time
                value={data.createdAt}
                year="numeric"
                month="numeric"
                day="numeric"
                hour="2-digit"
                minute="2-digit"
              >
              </lightning-formatted-date-time>
            </span>
          </div>

          <!-- Last Modified By -->
          <div class="inline-field">
            <span class="label">Last Modified By</span>
            <span class="value">
              CRM AI Agent,&nbsp;
              <lightning-formatted-date-time
                value={data.lastModifiedAt}
                year="numeric"
                month="numeric"
                day="numeric"
                hour="2-digit"
                minute="2-digit"
              >
              </lightning-formatted-date-time>
            </span>
          </div>
        </div>
      </section>
    </template>

    <!-- ======================= LIST VIEW ====================== -->
    <template if:true={isListView}>
      <div class="related-list-container">
        <!-- Header -->
        <div class="related-list-header">
          <lightning-icon
            icon-name="standard:bot"
            size="small"
            class="header-icon"
          >
          </lightning-icon>

          <h2>Agent Action History ({recordCount})</h2>
        </div>

        <!-- Table -->
        <div class="related-list-body">
          <lightning-datatable
            key-field="Id"
            data={data.histories}
            columns={columns}
            hide-checkbox-column
            resize-column-disabled
            class="history-table"
          >
          </lightning-datatable>
        </div>

        <!-- Footer -->
        <template if:true={recordCount}>
          <div class="related-list-footer">
            <a onclick={handleViewAll}>View All</a>
          </div>
        </template>
      </div>
    </template>
  </template></template
>
