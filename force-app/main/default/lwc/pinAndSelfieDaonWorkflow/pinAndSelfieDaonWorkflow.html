<template>
  <template lwc:if={noAccess}><!--No Access--></template>
  <template lwc:else>
    <template lwc:if={metadata}>
      <div class="slds-size_1-of-2 slds-align_absolute-center">
        <c-daon-file-download
          layout={layout}
          metadata={metadata}
        ></c-daon-file-download>
      </div>
    </template>
    <div class="slds-align_absolute-center">
      <lightning-button
        label="Approve"
        onclick={openApprovalModal}
        variant="brand"
        disabled={isApprovButtonDisable}
      ></lightning-button>
      <div class="slds-p-around--medium">
        <lightning-button
          label="Reject"
          onclick={openRejectModal}
          variant="destructive"
          disabled={isRejectButtonDisable}
        ></lightning-button>
      </div>
    </div>
  </template>
</template>
