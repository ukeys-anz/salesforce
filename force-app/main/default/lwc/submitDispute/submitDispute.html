<template>
  <template lwc:if={loading}>
    <lightning-spinner alternative-text="Loading..." variant="brand">
    </lightning-spinner>
  </template>
  <template lwc:if={showMissingTokenCardModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <div class="slds-modal__header">
          <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
            Attention
          </h1>
        </div>
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-id-1"
        >
          <p>
            Please note that the tokenised card number has not been populated
            for this case. Ensure you proceed to PEGA to manually input the card
            number for this case.
          </p>
          <p>Press Proceed to finalise case submission.</p>
        </div>
        <div class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleCancel}
            title="Cancel"
          >
            Cancel
          </button>
          <button
            class="slds-button slds-button_brand"
            onclick={handleProceed}
            title="Proceed"
          >
            Proceed
          </button>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
  </template>
</template>
