<template>
  <!-- Modal Header -->
  <div class="slds-modal__header">
    <h2 class="slds-text-heading_medium bold-heading">Add Accounts to Close</h2>
  </div>

  <!-- Modal Body -->
  <template if:false={isCasesCreated}>
    <template if:false={accountDetails.length}>
      <div
        class="slds-var-m-top_large slds-align_absolute-center slds-text-heading_medium slds-var-m-bottom_medium"
      >
        <h1 class="slds-text-color_weak">
          No Available Financial Accounts to Close
        </h1>
      </div>
    </template>

    <template if:true={accountDetails.length}>
      <!-- Mandatory Information -->
      <template if:true={selectedRows.length}>
        <div class="slds-grid slds-grid_align-end slds-p-horizontal_large">
          <div class="slds-text-color_weak slds-p-around_xx-small">
            <abbr class="slds-required">*</abbr> = Required Information
          </div>
        </div>
      </template>

      <div class="slds-box slds-var-m-around_large">
        <h1
          class="slds-text-heading_small slds-p-around_xx-small slds-theme_shade"
        >
          Available Accounts
        </h1>
        <div
          class="slds-text-body_regular slds-var-m-bottom_small slds-var-p-top_medium"
        >
          Tick the accounts to close and a child case will be created for each
          account.
        </div>

        <!--Loading Spinner TO BE DISCUSS THIS SPINNER IS NEEDED OR NOT-->
        <!--     <template lwc:if={loading}>
                  <lightning-spinner alternative-text="Loading..." variant="brand">
                  </lightning-spinner>
              </template> -->

        <div class="slds-modal__content slds-var-p-top_medium">
          <div class="datatable-container slds-var-m-around_small">
            <lightning-datatable
              key-field="id"
              data={accountDetails}
              columns={columns}
              onrowselection={handleRowSelection}
            >
            </lightning-datatable>
          </div>
        </div>

        <template if:true={selectedRows.length}>
          <div class="slds-var-m-top_large">
            <h2
              class="slds-text-heading_small slds-p-around_xx-small slds-theme_shade"
            >
              Forwarding Account Details
            </h2>

            <template if:true={showCheckbox}>
              <!-- Checkbox -->
              <div
                class="slds-var-m-top_medium slds-grid slds-grid_align-end slds-var-p-horizontal_small"
              >
                <lightning-input
                  type="checkbox"
                  label="Tick to use the same details for all accounts"
                  onchange={handleUseSameDetailsCheckbox}
                >
                </lightning-input>
              </div>
            </template>

            <template for:each={selectedRows} for:item="row">
              <div key={row.id} class="slds-var-m-top_medium">
                <h3 class="bold-heading slds-var-p-top_medium">
                  For {row.productName} {row.accountType} Account
                  ({row.accountNumber})
                </h3>

                <!-- Wrapper for 2 fields per row -->
                <div class="slds-grid slds-gutters slds-var-m-top_medium">
                  <!-- Closure Reason Field -->
                  <div class="slds-col slds-size_1-of-2">
                    <c-editable-field
                      row-id={row.id}
                      name="closureReason"
                      label="Closure Reason"
                      value={row.closureReason}
                      is-invalid={row.isClosureReasonInvalid}
                      error-text="This field is required."
                      type="combobox"
                      options={closureResonValues}
                      onfieldchange={handleFieldChange}
                    >
                    </c-editable-field>
                  </div>

                  <!-- Intended Account Name Field -->
                  <div class="slds-col slds-size_1-of-2">
                    <c-editable-field
                      row-id={row.id}
                      name="intendedAccountName"
                      label="Intended Account Name"
                      value={row.intendedAccountName}
                      help-text="Account name of the recipient where the money was meant to go."
                      is-invalid={row.isAccountNameInvalid}
                      error-text="This field is required."
                      type="input"
                      onfieldchange={handleFieldChange}
                    >
                    </c-editable-field>
                  </div>
                </div>

                <!-- Wrapper for next set of fields (e.g. Intended Account BSB and Intended Account Number) -->
                <div class="slds-grid slds-gutters slds-var-m-top_medium">
                  <!-- Intended Account BSB Field -->
                  <div class="slds-col slds-size_1-of-2">
                    <c-editable-field
                      row-id={row.id}
                      name="intendedAccountBsb"
                      label="Intended Account BSB"
                      value={row.intendedAccountBsb}
                      help-text="Branch code of the recipient's bank where the money was meant to go."
                      is-invalid={row.isaccountBsbInvalid}
                      error-text="This field is required."
                      type="input"
                      onfieldchange={handleFieldChange}
                    >
                    </c-editable-field>
                  </div>

                  <!-- Intended Account Number Field -->
                  <div class="slds-col slds-size_1-of-2">
                    <c-editable-field
                      row-id={row.id}
                      name="intendedAccountNumber"
                      label="Intended Account Number"
                      value={row.intendedAccountNumber}
                      is-invalid={row.isAccountNumberInvalid}
                      error-text="This field is required."
                      type="input"
                      onfieldchange={handleFieldChange}
                    >
                    </c-editable-field>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
      <!-- Modal Footer -->
      <lightning-modal-footer>
        <template if:false={selectedRows.length}>
          <lightning-button
            class="slds-button"
            variant="neutral"
            label="Cancel"
            onclick={handleCancel}
          ></lightning-button>
        </template>
        <template if:true={selectedRows.length}>
          <div class="slds-align_absolute-center">
            <lightning-button
              class="slds-button"
              variant="neutral"
              label="Cancel"
              onclick={handleCancel}
            ></lightning-button>
            <lightning-button
              class="slds-button slds-m-left_x-small"
              variant="brand"
              onclick={handleCreateChildCases}
              label="Create Child Cases"
            ></lightning-button>
          </div>
        </template>
      </lightning-modal-footer>
    </template>
  </template>

  <!--Loading Spinner-->
  <template lwc:if={loading}>
    <lightning-spinner alternative-text="Loading..." variant="brand">
    </lightning-spinner>
  </template>

  <!-- Case creation success screen -->
  <template if:true={isCasesCreated}>
    <div class="slds-modal__content slds-var-p-horizontal_large">
      <lightning-icon
        class="slds-icon-utility-success slds-icon_container slds-align_absolute-center slds-var-m-top_large"
        icon-name="utility:success"
        alternative-text="success"
        variant="success"
        size="large"
        title="success"
      ></lightning-icon>

      <div
        class="slds-var-m-top_large slds-align_absolute-center slds-text-heading_medium slds-var-m-bottom_medium"
      >
        Child Cases have been successfully created to close the following
        accounts.
      </div>
      <lightning-datatable
        key-field="id"
        data={casesData}
        columns={caseColumns}
        hide-checkbox-column
      >
      </lightning-datatable>
    </div>

    <lightning-modal-footer>
      <template if:true={isCasesCreated}>
        <lightning-button
          class="slds-button"
          variant="neutral"
          label="Close"
          onclick={handleCancel}
        ></lightning-button>
      </template>
    </lightning-modal-footer>
  </template>
</template>
