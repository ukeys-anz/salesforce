<template>
  <!-- Modal Header -->
  <div class="slds-modal__header">
    <h2 class="slds-text-heading_medium bold-heading">Add Accounts to Close</h2>
  </div>

  <!-- Modal Body -->
  <template if:false={isCasesCreated}>
    <!-- Mandatory Information Notice -->
    <template if:true={selectedRows.length}>
      <div class="slds-grid slds-grid_align-end slds-p-horizontal_large">
        <div class="slds-text-color_weak slds-p-around_xx-small">
          <abbr class="slds-required">*</abbr> = Required Information
        </div>
      </div>
    </template>

    <div class="slds-box slds-var-m-around_large">
      <h1
        class="slds-text-heading_small slds-p-around_xx-small slds-theme_shade"
      >
        Available Accounts
      </h1>

      <div
        class="slds-text-body_regular slds-var-m-bottom_small slds-var-p-top_medium"
      >
        Tick the accounts to close and a child case will be created for each
        account.
      </div>

      <div class="slds-modal__content slds-var-p-top_medium">
        <div class="datatable-container slds-var-m-around_small">
          <lightning-datatable
            key-field="id"
            data={data}
            columns={columns}
            onrowselection={handleRowSelection}
          >
          </lightning-datatable>
        </div>
      </div>

      <template if:true={selectedRows.length}>
        <div class="slds-var-m-top_large">
          <h2
            class="slds-text-heading_small slds-p-around_xx-small slds-theme_shade"
          >
            Forwarding Account Details
          </h2>

          <template if:true={showCheckbox}>
            <!-- Checkbox -->
            <div
              class="slds-var-m-top_medium slds-grid slds-grid_align-end slds-var-p-horizontal_small"
            >
              <lightning-input
                type="checkbox"
                label="Tick to use the same details for all accounts"
                onchange={handleUseSameDetailsCheckbox}
              >
              </lightning-input>
            </div>
          </template>

          <template for:each={selectedRows} for:item="row">
            <div key={row.id} class="slds-var-m-top_medium">
              <h3 class="bold-heading slds-var-p-top_medium">
                For {row.productName} {row.accountType} Account
                ({row.accountNumber})
              </h3>

              <!-- Dynamic Form Layout -->

              <div class="slds-grid slds-gutters slds-var-m-top_medium">
                <!-- Closure Reason Field -->
                <div class="slds-col slds-size_1-of-2">
                  <template if:true={row.isClosureReasonInvalid}>
                    <div class="slds-form-element slds-has-error">
                      <div
                        class="slds-form-element__control slds-grid slds-grid_vertical-align-center"
                      >
                        <!-- Label with Flexbox: centered vertically -->
                        <label
                          class="slds-form-element__label slds-m-right_small slds-grid_vertical-align-center slds-var-m-top_medium"
                          style="flex-basis: 190px"
                        >
                          <span class="slds-required">*</span> Closure Reason
                        </label>
                        <lightning-combobox
                          value={row.closureReason}
                          data-id={row.id}
                          name="closureReason"
                          options={closureResonValues}
                          onchange={handleInputChange}
                          class="field-width"
                        >
                        </lightning-combobox>
                      </div>
                      <div class="slds-form-element__help">
                        This field is required.
                      </div>
                    </div>
                  </template>
                  <template if:false={row.isClosureReasonInvalid}>
                    <div class="slds-form-element">
                      <div
                        class="slds-form-element__control slds-grid slds-grid_vertical-align-center"
                      >
                        <label
                          class="slds-form-element__label slds-m-right_small slds-grid_vertical-align-center slds-var-m-top_medium"
                          style="flex-basis: 190px"
                        >
                          <span class="slds-required">*</span> Closure
                          Reason</label
                        >
                        <lightning-combobox
                          value={row.closureReason}
                          data-id={row.id}
                          name="closureReason"
                          options={closureResonValues}
                          onchange={handleInputChange}
                          class="field-width"
                        >
                        </lightning-combobox>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- Intended Account Name Field -->
                <div class="slds-col slds-size_1-of-2">
                  <template if:true={row.isAccountNameInvalid}>
                    <div class="slds-form-element slds-has-error">
                      <div
                        class="slds-form-element__control slds-grid slds-grid_vertical-align-center"
                      >
                        <label
                          class="slds-form-element__label slds-m-right_small slds-grid_vertical-align-center slds-var-m-top_medium"
                          style="flex-basis: 190px"
                          ><span class="slds-required">*</span> Intended Account
                          Name
                          <lightning-helptext
                            class="tooltip"
                            content="Account name of the recipient where the money was meant to go."
                          ></lightning-helptext>
                        </label>
                        <lightning-input
                          type="text"
                          value={row.intendedAccountName}
                          data-id={row.id}
                          name="intendedAccountName"
                          onchange={handleInputChange}
                          class="field-width"
                        >
                        </lightning-input>
                      </div>
                      <div class="slds-form-element__help">
                        This field is required.
                      </div>
                    </div>
                  </template>
                  <template if:false={row.isAccountNameInvalid}>
                    <div class="slds-form-element">
                      <div
                        class="slds-form-element__control slds-grid slds-grid_vertical-align-center"
                      >
                        <label
                          class="slds-form-element__label slds-m-right_small slds-grid_vertical-align-center slds-var-m-top_medium"
                          style="flex-basis: 190px"
                        >
                          <span class="slds-required">*</span> Intended Account
                          Name
                          <lightning-helptext
                            class="tooltip"
                            content="Account name of the recipient where the money was meant to go."
                          ></lightning-helptext>
                        </label>
                        <lightning-input
                          type="text"
                          value={row.intendedAccountName}
                          data-id={row.id}
                          name="intendedAccountName"
                          onchange={handleInputChange}
                          class="field-width"
                        >
                        </lightning-input>
                      </div>
                    </div>
                  </template>
                </div>
              </div>

              <div class="slds-grid slds-gutters slds-var-m-top_medium">
                <!-- Intended Account BSB Field -->
                <div class="slds-col slds-size_1-of-2">
                  <template if:true={row.isaccountBsbInvalid}>
                    <div class="slds-form-element slds-has-error">
                      <div
                        class="slds-form-element__control slds-grid slds-grid_vertical-align-center"
                      >
                        <label
                          class="slds-form-element__label slds-m-right_small slds-grid_vertical-align-center slds-var-m-top_medium"
                          style="flex-basis: 190px"
                        >
                          <span class="slds-required">*</span> Intended Account
                          BSB
                          <lightning-helptext
                            class="tooltip"
                            content="Branch code of the recipient's bank where the money was meant to go."
                          ></lightning-helptext
                        ></label>
                        <lightning-input
                          type="text"
                          class="field-width"
                          value={row.intendedAccountBsb}
                          data-id={row.id}
                          name="intendedAccountBsb"
                          onchange={handleInputChange}
                        ></lightning-input>
                      </div>
                      <div class="slds-form-element__help">
                        This field is required.
                      </div>
                    </div>
                  </template>
                  <template if:false={row.isaccountBsbInvalid}>
                    <div class="slds-form-element">
                      <div
                        class="slds-form-element__control slds-grid slds-grid_vertical-align-center"
                      >
                        <label
                          class="slds-form-element__label slds-m-right_small slds-grid_vertical-align-center slds-var-m-top_medium"
                          style="flex-basis: 190px"
                        >
                          <span class="slds-required">*</span> Intended Account
                          BSB
                          <lightning-helptext
                            class="tooltip"
                            content="Branch code of the recipient's bank where the money was meant to go."
                          ></lightning-helptext>
                        </label>
                        <lightning-input
                          type="text"
                          class="field-width"
                          value={row.intendedAccountBsb}
                          data-id={row.id}
                          name="intendedAccountBsb"
                          onchange={handleInputChange}
                        ></lightning-input>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- Intended Account Number Field -->
                <div class="slds-col slds-size_1-of-2">
                  <template if:true={row.isAccountNumberInvalid}>
                    <div class="slds-form-element slds-has-error">
                      <div
                        class="slds-form-element__control slds-grid slds-grid_vertical-align-center"
                      >
                        <label
                          class="slds-form-element__label slds-m-right_small slds-grid_vertical-align-center slds-var-m-top_medium"
                          style="flex-basis: 190px"
                        >
                          <span class="slds-required">*</span> Intended Account
                          Number</label
                        >
                        <lightning-input
                          type="text"
                          value={row.intendedAccountNumber}
                          data-id={row.id}
                          name="intendedAccountNumber"
                          onchange={handleInputChange}
                          class="field-width"
                        >
                        </lightning-input>
                      </div>
                      <div class="slds-form-element__help">
                        This field is required.
                      </div>
                    </div>
                  </template>
                  <template if:false={row.isAccountNumberInvalid}>
                    <div class="slds-form-element">
                      <div
                        class="slds-form-element__control slds-grid slds-grid_vertical-align-center"
                      >
                        <label
                          class="slds-form-element__label slds-m-right_small slds-grid_vertical-align-center slds-var-m-top_medium"
                          style="flex-basis: 190px"
                        >
                          <span class="slds-required">*</span> Intended Account
                          Number</label
                        >
                        <lightning-input
                          type="text"
                          value={row.intendedAccountNumber}
                          data-id={row.id}
                          name="intendedAccountNumber"
                          onchange={handleInputChange}
                          class="field-width"
                        >
                        </lightning-input>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Modal Footer -->
    <lightning-modal-footer>
      <template if:false={selectedRows.length}>
        <lightning-button
          class="slds-button"
          variant="neutral"
          label="Cancel"
          onclick={handleCancel}
        ></lightning-button>
      </template>
      <template if:true={selectedRows.length}>
        <div class="slds-align_absolute-center">
          <lightning-button
            class="slds-button"
            variant="neutral"
            label="Cancel"
            onclick={handleCancel}
          ></lightning-button>
          <lightning-button
            class="slds-button slds-m-left_x-small"
            variant="brand"
            onclick={handleCreateChildCases}
            label="Create Child Cases"
          ></lightning-button>
        </div>
      </template>
    </lightning-modal-footer>
  </template>

  <!-- Case creation success screen -->
  <template if:true={isCasesCreated}>
    <div class="slds-modal__content slds-var-p-horizontal_large">
      <lightning-icon
        class="slds-icon-utility-success slds-icon_container slds-align_absolute-center slds-var-m-top_large"
        icon-name="utility:success"
        alternative-text="success"
        variant="success"
        size="large"
        title="success"
      ></lightning-icon>

      <div
        class="slds-var-m-top_large slds-align_absolute-center slds-text-heading_medium slds-var-m-bottom_medium"
      >
        Child Cases have been successfully created to close the following
        accounts.
      </div>
      <lightning-datatable
        key-field="id"
        data={casesData}
        columns={caseColumns}
        onrowaction={handleCaseRowAction}
        hide-checkbox-column
      >
      </lightning-datatable>
    </div>

    <lightning-modal-footer>
      <template if:true={isCasesCreated}>
        <lightning-button
          class="slds-button"
          variant="neutral"
          label="Close"
          onclick={handleCancel}
        ></lightning-button>
      </template>
    </lightning-modal-footer>
  </template>
</template>
