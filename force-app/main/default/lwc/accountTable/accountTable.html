<template>
  <article class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__figure">
          <span class="slds-icon_container" title="account">
            <lightning-icon
              icon-name="custom:custom41"
              alternative-text="Account"
              title="Account"
            ></lightning-icon>
          </span>
        </div>
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">
            <span>Accounts</span>
          </h2>
        </div>
      </header>
    </div>
    <div class="slds-card__body slds-card__body_inner">
      <template for:each={accounts} for:item="acc">
        <article class="slds-card slds-card_boundary" key={acc.name}>
          <div class="slds-card__header slds-grid">
            <header
              class="slds-media slds-media_center slds-has-flexi-truncate"
            >
              <div class="slds-media__figure">
                <span class="slds-icon_container" title="account">
                  <lightning-icon
                    icon-name="utility:money"
                    alternative-text="Account"
                    title="Account"
                  ></lightning-icon>
                </span>
              </div>
              <div class="slds-media__body">
                <h2 class="slds-card__header-title">
                  <span>Everyday Account</span>
                </h2>
                <span class="account-info">{acc.bsb} {acc.account_number}</span>
              </div>
              <div class="slds-no-flex">
                <button class="slds-button slds-button_neutral">View</button>
              </div>
            </header>
          </div>
          <div class="slds-card__body slds-card__body_inner balance-body">
            <div class="slds-p-top_small">
              Account Balance: {acc.balance.value}
            </div>
            <div class="slds-m-top_small">
              Account Balance Valid As of: {acc.balance_valid_asof}
            </div>
          </div>
        </article>
      </template>
    </div>
  </article>
</template>
