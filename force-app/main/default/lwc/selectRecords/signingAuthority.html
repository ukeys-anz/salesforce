<template>
  <!--Modal Header-->
  <lightning-modal-header label="Select Account to Update Signing Authority">
  </lightning-modal-header>
  <!--Modal Body-->
  <lightning-modal-body class="modalbody">
    <div class="slds-box slds-var-m-around_large">
      <div class="slds-grid slds-grid_align-end">
        <div class="slds-text-color_weak slds-p-around_xx-small">
          <abbr class="slds-required">*</abbr> = Required Information
        </div>
      </div>
      <h1
        class="slds-text-heading_small slds-p-around_xx-small slds-theme_shade"
      >
        <b> Available Accounts </b>
      </h1>
      <div
        class="slds-m-left_small slds-text-body_regular slds-var-m-bottom_small slds-var-p-top_medium"
      >
        {headerMessage}
      </div>
      <div class="slds-modal__content slds-var-p-top_medium">
        <template lwc:if={data.length}>
          <!--Data table-->
          <div class="datatable-container slds-var-m-around_small">
            <lightning-datatable
              key-field="id"
              data={data}
              columns={columns}
              max-row-selection={maxRowSelection}
              onrowselection={handleRowSelection}
            >
            </lightning-datatable>
          </div>
        </template>
        <template lwc:if={showNoDataMessage}>
          <div
            class="slds-var-m-top_large slds-align_absolute-center slds-text-heading_medium slds-var-m-bottom_medium"
          >
            <h1 data-id="noaccounts" class="slds-text-color_weak">
              No Data to Display
            </h1>
          </div>
        </template>
      </div>
    </div>
  </lightning-modal-body>
  <lightning-modal-footer>
    <div class="slds-align_absolute-center">
      <lightning-button
        class="slds-button"
        label="Cancel"
        onclick={closeModal}
      ></lightning-button>
      <lightning-button
        class="slds-button slds-m-left_x-small"
        label="Save"
        variant="brand"
        onclick={updateData}
        disabled={saveDisabled}
      ></lightning-button>
    </div>
  </lightning-modal-footer>
</template>
