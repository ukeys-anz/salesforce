<template>
  <template lwc:if={isLoading}>
    <div class="slds-is-relative spinner-height">
      <lightning-spinner
        alternative-text="Loading..."
        variant="brand"
        size="medium"
        data-text="Loading..."
        class="loader"
      >
      </lightning-spinner>
    </div>
  </template>

  <template lwc:else>
    <template lwc:if={hasPermissionIssue}>
      <c-error permission-issue={hasPermissionIssue}></c-error>
    </template>

    <template lwc:else>
      <template lwc:if={hasError}>
        <c-error message={error}></c-error>
      </template>

      <template lwc:else>
        <template lwc:if={hasStatements}>
          <span
            class="slds-var-m-vertical_large slds-align_absolute-center slds-text-heading_small slds-text-title_bold"
          >
            Only save statements in the permitted share folder and delete
            immediately after it's been sent to the customer.
          </span>
          <lightning-datatable
            key-field="statementId"
            columns={columns}
            data={statements}
            hide-checkbox-column
            onrowaction={handleRowAction}
            default-sort-direction={defaultSortDirection}
            sorted-direction={sortDirection}
            sorted-by={sortedBy}
            onsort={handleSort}
            data-id="statements_table"
          >
          </lightning-datatable>
        </template>
        <template lwc:else>
          <span
            class="slds-var-m-vertical_large slds-align_absolute-center slds-text-heading_small slds-text-title_bold"
          >
            There are currently no statements for this account.
          </span>
        </template>

        <template lwc:if={hasMoreStatements}>
          <lightning-button
            variant="base"
            label="Load More"
            title="Load More Statements"
            onclick={handleLoadMore}
            class="slds-align_absolute-center slds-var-m-top_x-small"
            data-id="load_more_button"
          ></lightning-button>
        </template>
      </template>
    </template>
  </template>
</template>
