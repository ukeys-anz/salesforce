<template>
  <lightning-card title="Account Closure">
    <template lwc:if={loading}>
      <article class="slds-card slds-m-bottom_small">
        <div class="slds-align_absolute-center spinner-height">
          <div role="status" class="slds-spinner_inline">
            <lightning-spinner
              alternative-text="Loading"
              variant="brand"
            ></lightning-spinner>
          </div>
        </div>
      </article>
    </template>
    <template lwc:else>
      <template lwc:if={displayEnabledButton}>
        <lightning-button
          label="Close Account"
          slot="actions"
          onclick={toggleConfirmation}
          data-id="close-account-button"
        ></lightning-button>
      </template>
      <template lwc:else>
        <button
          disabled
          class="slds-button slds-button_neutral disabled-description"
        >
          Close Account
        </button>
        <div class="disabled-tooltip">
          Elevated access is required to perform this action.
        </div>
      </template>

      <div class="slds-grid slds-gutters slds-m-around_x-small">
        <div class="slds-col slds-size_1-of-4">
          <p class="field-title">ANZ Plus</p>
          <p data-id="anz-plus-value">{packageData.meta.accountA1.status}</p>
        </div>
        <div class="slds-col slds-size_1-of-4">
          <p class="field-title">ANZ Save</p>
          <p data-id="anz-save-value">{packageData.meta.accountS1.status}</p>
        </div>
        <div class="slds-col slds-size_1-of-4">
          <p class="field-title">Card</p>
          <p data-id="card-value">{packageData.meta.card.status}</p>
        </div>
        <div class="slds-col slds-size_1-of-4">
          <p class="field-title">Package</p>
          <p data-id="package-value">
            {packageData.meta.overall_package.status}
          </p>
        </div>
      </div>
    </template>
  </lightning-card>

  <template lwc:if={showConfirmation}>
    <section class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <article class="slds-card">
          <div class="slds-card__header slds-grid header-div">
            <header class="slds-has-flexi-truncate card-header">
              <h2>Account Closure</h2>
            </header>
          </div>
          <div class="slds-card__body slds-p-horizontal--small">
            <div class="slds-p-around_medium slds-m-bottom_small">
              <p class="slds-text-title_bold slds-m-bottom_small">
                Are you sure you want to initiate the package closure for the
                customers account?
              </p>
              <p>
                Please ensure the following has been confirmed prior to
                submission:
              </p>
              <ul class="slds-list_dotted">
                <li>There are no pending transactions on the account(s)</li>
                <li>The card has been disabled in CTM</li>
                <li>The account balances have been zeroed out</li>
                <li>There is no interest accrued on the account(s)</li>
                <li>
                  The status of the account(s) has been set to Closed in CAP
                </li>
              </ul>
            </div>
            <button
              class="slds-button slds-button--brand close-button"
              onclick={handleClosure}
              data-id="close-button"
            >
              Close Account
            </button>
          </div>
          <footer class="slds-modal__footer">
            <button
              class="slds-button slds-button--neutral"
              onclick={toggleConfirmation}
            >
              Cancel
            </button>
          </footer>
        </article>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
