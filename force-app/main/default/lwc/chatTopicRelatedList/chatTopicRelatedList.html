<template>
  <template lwc:if={loading}>
    <div class="slds-align_absolute-center" style="height: 4rem">
      <div role="status" class="slds-spinner_inline">
        <lightning-spinner
          alternative-text="Loading"
          variant="brand"
        ></lightning-spinner>
      </div>
    </div>
  </template>
  <template lwc:else>
    <article class="slds-card slds-card_boundary">
      <div class="slds-page-header slds-grid">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
          <div class="slds-media__figure">
            <lightning-icon
              icon-name="standard:live_chat"
              alternative-text="Chat Topics"
              title="Chat Topics"
              size="small"
            >
            </lightning-icon>
          </div>
          <div class="slds-media__body">
            <h2 class="slds-card__header-title">
              <a
                href="javascript:void(0);"
                class="slds-card__header-link slds-truncate"
                title="Card Header"
              >
                <span data-id="component-header"
                  >Chat Topics ({totalRecordCount})</span
                >
              </a>
            </h2>
          </div>
        </header>
      </div>
      <template lwc:if={totalRecordCount}>
        <div
          class="slds-card__body slds-scrollable container"
          style="max-height: 150px; min-height: 80px"
        >
          <table class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
              <tr class="slds-line-height_reset">
                <th class="" scope="col">
                  <div class="slds-truncate" title="Name">Name</div>
                </th>
                <th class="" scope="col">
                  <div class="slds-truncate" title="Status">Status</div>
                </th>
                <th class="" scope="col">
                  <div class="slds-truncate" title="Last Activity">
                    Last Activity
                  </div>
                </th>
                <th class="actionColumnHeader" scope="col">
                  <div
                    class="slds-truncate slds-assistive-text"
                    title="Actions"
                  >
                    Actions
                  </div>
                </th>
              </tr>
            </thead>
            <tbody>
              <template for:each={data} for:item="chatTopic">
                <tr class="slds-hint-parent" key={chatTopic.id}>
                  <td data-label="Name">
                    <div
                      class="slds-truncate slds-cell-wrap"
                      title="Name"
                      data-id="topic-name"
                    >
                      {chatTopic.name}
                    </div>
                  </td>
                  <td data-label="Status">
                    <div class="slds-truncate" title="Status">
                      {chatTopic.topicStatus}
                    </div>
                  </td>
                  <td data-label="Last Activity">
                    <div class="uiOutputDateTime" title="Last Activity">
                      <lightning-formatted-date-time
                        value={chatTopic.lastModified}
                        year="numeric"
                        month="numeric"
                        day="numeric"
                        hour="2-digit"
                        minute="2-digit"
                      ></lightning-formatted-date-time>
                    </div>
                  </td>
                  <td>
                    <lightning-button-menu
                      alternative-text="Show menu"
                      variant="border-filled"
                      menu-alignment="right"
                      icon-size="x-small"
                      data-id={chatTopic.id}
                      onselect={handleOnselect}
                    >
                      <template lwc:if={chatTopic.enableReinitiate}>
                        <lightning-menu-item
                          label="Reply"
                          value="re_initiate"
                          data-id="re_initiate"
                        ></lightning-menu-item>
                      </template>
                      <lightning-menu-item
                        label="Chat History"
                        value="chat_history"
                      ></lightning-menu-item>
                    </lightning-button-menu>
                  </td>
                </tr>
              </template>
            </tbody>
            <template lwc:if={showLoadMore}>
              <tfoot>
                <tr>
                  <td>
                    <template lwc:if={showLoadMore}>
                      <button
                        class="slds-button slds-button_neutral load-more"
                        onclick={handleLoadMore}
                      >
                        Load More
                      </button>
                    </template>
                  </td>
                </tr>
              </tfoot>
            </template>
          </table>
        </div>
      </template>
    </article>
  </template>
</template>
