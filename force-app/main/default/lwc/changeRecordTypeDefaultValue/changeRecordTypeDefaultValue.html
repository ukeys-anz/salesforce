<template>
  <template lwc:if={loading}>
    <lightning-record-edit-form
      record-id={recordId}
      object-api-name="Case"
      record-type-id={updatedRT}
      onsubmit={handleSendValues}
    >
      <lightning-messages></lightning-messages>
      <template for:each={fields} for:item="field">
        <lightning-input-field
          key={field.name}
          field-name={field.name}
          value={field.value}
          data-id={field.name}
          onchange={handleChosenValue}
        ></lightning-input-field>
      </template>
      <footer class="slds-card__footer">
        <lightning-button
          name="cancel"
          class="slds-button_neutral slds-button--neutral cancelBTN"
          label="Cancel"
          onclick={handleCancelButton}
        >
        </lightning-button>
        <lightning-button
          variant="brand"
          type="submit"
          name="update"
          label="Update"
          onclick={handleNextPage}
        >
        </lightning-button>
      </footer>
    </lightning-record-edit-form>
    <lightning-record-edit-form
      record-id={recordId}
      object-api-name="Case"
      onsubmit={handleSubmit}
      class="submitRecordEditForm"
    >
      <template for:each={fields} for:item="field" lwc:if={visibilityFlag}>
        <lightning-input-field
          key={field.name}
          field-name={field.name}
          value={field.value}
        ></lightning-input-field>
      </template>
    </lightning-record-edit-form>
  </template>
</template>
