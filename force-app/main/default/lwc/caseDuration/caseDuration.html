<template>
  <article class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
          <h2 class="slds-card__header-title" style="font-weight: bold">
            <lightning-icon
              icon-name="custom:custom25"
              class="slds-media__figure"
              alternative-text="Case Duration"
              title="Case Duration"
              size="small"
            ></lightning-icon>
            <span>Case Duration</span>{timeVal}
          </h2>
        </div>
      </header>
    </div>
    <div class="clock-face slds-text-heading_large">
      <lightning-formatted-number
        value={hours}
        format-style="decimal"
        minimum-integer-digits="2"
      ></lightning-formatted-number
      ><span class={pulseClass}>:</span>
      <lightning-formatted-number
        value={minutes}
        format-style="decimal"
        minimum-integer-digits="2"
      >
      </lightning-formatted-number>
    </div>
    <template if:true={durationStop}>
      <div
        class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_info"
        role="alert"
      >
        The duration countdown is currently paused due to the case being
        {caseStatus}.
      </div>
    </template>
  </article>
</template>
