<template>
  <article class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
          <h2 class="slds-card__header-title" style="font-weight: bold">
            <span>Case Duration</span>
          </h2>
        </div>
      </header>
    </div>
    <template if:true={durationTime}>
      <div class="clock-face slds-text-heading_large">
        <lightning-formatted-number
          value={durationTime.durationHours}
          format-style="decimal"
          minimum-integer-digits="2"
        ></lightning-formatted-number
        >:
        <lightning-formatted-number
          value={durationTime.durationMins}
          format-style="decimal"
          minimum-integer-digits="2"
        ></lightning-formatted-number>
      </div>
    </template>
  </article>
</template>
