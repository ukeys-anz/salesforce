<template>
  <template if:true={showOptions}>
    <br />

    <lightning-record-edit-form
      object-api-name={caseObject}
      record-type-id={recordTypeId}
      record-id={recordId}
    >
      <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_2-of-4 slds-m-right_large">
          <lightning-input-field
            variant="label-stacked"
            aria-label="Dropdown Complaint Outcome"
            required="true"
            field-name={complaintOutcome}
            onchange={handleComplaintOutcomeChange}
            data-id="compOutCome-id"
            role="textbox"
          ></lightning-input-field>
        </div>
        <div class="slds-col slds-size_2-of-4 slds-m-right_large">
          <lightning-input-field
            variant="label-stacked"
            required="true"
            field-name={outcomeDescription}
            onchange={handleOutcomeDescriptionChange}
            data-id="descOutcome-id"
          ></lightning-input-field>
        </div>
        <div class="slds-col slds-size_2-of-4 slds-m-right_large">
          <lightning-input-field
            variant="label-stacked"
            aria-label="Dropdown Complaint Remedy"
            required="true"
            value={caseRemedyValue}
            field-name={complaintRemedy}
            onchange={handleComplaintRemedy}
            data-id="compRemedy-id"
            role="textbox"
          ></lightning-input-field>
        </div>
        <div class="slds-col slds-size_2-of-4 slds-m-right_large">
          <lightning-input-field
            variant="label-stacked"
            aria-label="Dropdown Complaint Sub Remedy"
            required="true"
            value={subRemedyValue}
            field-name={complaintSubRemedy}
            onchange={handleComplaintSubRemedy}
            data-id="compSubRemedy-id"
            role="textbox"
          ></lightning-input-field>
        </div>
        <div class="slds-col slds-size_2-of-4 slds-m-right_large">
          <template if:true={isOtherSubFinRemedy}>
            <lightning-input-field
              variant="label-stacked"
              required
              field-name={otherNonFinRemedy}
              value={otherRemedyValue}
              onchange={handleotherNonFinRemedy}
              data-id="nonFinancialRemedy-id"
            ></lightning-input-field>
          </template>
        </div>
        <div
          class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
        >
          <template if:true={showFinancialCompensation}>
            <label class="slds-form-element__label" for="text-input-id-149">
              <abbr class="slds-required" title="required">* </abbr>Financial
              Amount</label
            >
            <lightning-input
              variant="label-hidden"
              required
              step="any"
              pattern="^[1-9]\d{0,6}(\.\d{1,2})?$|^0\.(?!0+$)\d{1,2}$"
              formatter="currency"
              type="number"
              value={finRem1}
              onchange={handleFinancialCompensation}
              class="input inputFinCompensation"
              message-when-pattern-mismatch="Must be a positive value with up to 7 whole digits and 2 decimal digits"
              data-id="finAmount-id"
            ></lightning-input>
          </template>
        </div>
        <template if:true={isNonFinancialComplaintRemedy}>
          <template if:true={isRewardPoints}>
            <div class="slds-col slds-size_2-of-4 slds-m-right_large">
              <lightning-input-field
                variant="label-stacked"
                aria-label="Integer financial reward Points"
                required="true"
                field-name={remedyPoints1}
                value={remedyPointsValue}
                onchange={handleFinRemedyPoints}
                data-id="finRemedyPoints1-id"
                role="textbox"
              >
              </lightning-input-field>
            </div>
          </template>
        </template>
        <template if:true={isReferredToProductManufacturer}>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input
              type="checkbox"
              label="The details of this complaint have been provided to the product manufacturer"
              name="thirdPartyIsDetailsProvidedToProductManufacturer"
              required
              message-when-value-missing="Acknowledgement that the complaint details have been provided to the product manufacturer is required"
              field-level-help="Evidence that the details of the complaint have been passed onto the product manufacturer must be included on the case"
              data-id="thirdPartyIsDetailsProvidedToProductManufacturer-id"
              onchange={handleIsDetailsProvidedToProductManufacturer}
              checked={prodManuCheckBox}
            ></lightning-input>
          </div>
        </template>
        <template if:true={showDuration}>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input-field
              variant="label-stacked"
              aria-label="Integer duration of remedy months"
              required="true"
              field-name={remedyDuration}
              value={remedyDurationValue}
              onchange={handleremedyDuration}
              data-id="finRemedyDuration1-id"
              role="textbox"
            >
            </lightning-input-field>
          </div>
        </template>
        <div
          class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
        >
          <lightning-input
            type="toggle"
            label="Second Complaint Remedy Provided?"
            onchange={handle2ndRemedyToggleChange}
            message-toggle-active="Yes"
            message-toggle-inactive="No"
            checked={remedy2Toggle}
            data-id="issue2-id"
          >
          </lightning-input>
        </div>
        <!--Complaint Remedy 2-->
        <template if:true={showRemedy2}>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input-field
              variant="label-stacked"
              aria-label="Dropdown Complaint Remedy2"
              required="true"
              field-name={complaintRemedy2}
              onchange={handleComplaintRemedy2}
              value={caseRemedy2Value}
              data-id="compRemedy2-id"
              role="textbox"
            ></lightning-input-field>
          </div>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input-field
              variant="label-stacked"
              aria-label="Dropdown Complaint Sub Remedy2"
              required="true"
              field-name={complaintSubRemedy2}
              onchange={handleComplaintSubRemedy2}
              value={subRemedy2Value}
              data-id="compSubRemedy2-id"
              role="textbox"
            ></lightning-input-field>
          </div>
          <template if:true={isOtherSubFinRemedy2}>
            <div
              class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
            >
              <lightning-input-field
                variant="label-stacked"
                required
                field-name={otherNonFinRemedy2}
                onchange={handleotherNonFinRemedy2}
                value={otherRemedy2value}
                data-id="nonFinancialRemedy2-id"
              ></lightning-input-field>
            </div>
          </template>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <template if:true={showFinancialCompensation2}>
              <label class="slds-form-element__label" for="text-input-id-149">
                <abbr class="slds-required" title="required">* </abbr>Financial
                Amount 2</label
              >
              <lightning-input
                variant="label-hidden"
                required
                step="any"
                pattern="^[1-9]\d{0,6}(\.\d{1,2})?$|^0\.(?!0+$)\d{1,2}$"
                formatter="currency"
                type="number"
                value={finRem2}
                onchange={handleFinancialCompensation2}
                class="input inputFinCompensation"
                message-when-pattern-mismatch="Must be a positive value with up to 7 whole digits and 2 decimal digits"
                data-id="finAmount2-id"
              ></lightning-input>
            </template>
          </div>
          <template if:true={isNonFinancialComplaintRemedy2}>
            <template if:true={isRewardPoints2}>
              <div
                class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
              >
                <lightning-input-field
                  variant="label-stacked"
                  aria-label="Integer financial reward Points"
                  required="true"
                  field-name={remedyPoints2}
                  onchange={handleFinRemedyPoints2}
                  value={remedyPoints2Value}
                  data-id="finRemedyPoints2-id"
                  role="textbox"
                >
                </lightning-input-field>
              </div>
            </template>
          </template>
          <template if:true={isReferredToProductManufacturer2}>
            <div
              class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
            >
              <lightning-input
                type="checkbox"
                label="The details of this complaint have been provided to the product manufacturer 2"
                name="thirdPartyIsDetailsProvidedToProductManufacturer"
                required
                message-when-value-missing="Acknowledgement that the complaint details have been provided to the product manufacturer is required"
                field-level-help="Evidence that the details of the complaint have been passed onto the product manufacturer must be included on the case"
                data-id="thirdPartyIsDetailsProvidedToProductManufacturer2-id"
                onchange={handleIsDetailsProvidedToProductManufacturer2}
                checked={prodManu2CheckBox}
              ></lightning-input>
            </div>
          </template>
          <template if:true={showDuration2}>
            <div
              class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
            >
              <lightning-input-field
                variant="label-stacked"
                aria-label="Integer duration of remedy months"
                required="true"
                field-name={remedyDuration2}
                onchange={handleremedyDuration2}
                value={remedyDurationValue2}
                data-id="finRemedyDuration2-id"
                role="textbox"
              >
              </lightning-input-field>
            </div>
          </template>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input
              type="toggle"
              label="Third Complaint Remedy Provided?"
              onchange={handle3ndRemedyToggleChange}
              message-toggle-active="Yes"
              message-toggle-inactive="No"
              checked={remedy3Toggle}
              data-id="issue3-id"
            >
            </lightning-input>
          </div>
        </template>
        <!--Complaint Remedy 3-->
        <template if:true={showRemedy3}>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input-field
              variant="label-stacked"
              aria-label="Dropdown Complaint Remedy3"
              required="true"
              field-name={complaintRemedy3}
              onchange={handleComplaintRemedy3}
              value={caseRemedy3Value}
              data-id="compRemedy3-id"
              role="textbox"
            ></lightning-input-field>
          </div>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input-field
              variant="label-stacked"
              aria-label="Dropdown Complaint Sub Remedy3"
              required="true"
              field-name={complaintSubRemedy3}
              onchange={handleComplaintSubRemedy3}
              value={subRemedy3Value}
              data-id="compSubRemedy-id"
              role="textbox"
            ></lightning-input-field>
          </div>
          <template if:true={isOtherSubFinRemedy3}>
            <div
              class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
            >
              <lightning-input-field
                variant="label-stacked"
                required
                field-name={otherNonFinRemedy3}
                onchange={handleotherNonFinRemedy3}
                value={otherRemedy3value}
                data-id="nonFinancialRemedy2-id"
              ></lightning-input-field>
            </div>
          </template>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <template if:true={showFinancialCompensation3}>
              <label class="slds-form-element__label" for="text-input-id-149">
                <abbr class="slds-required" title="required">* </abbr>Financial
                Amount 3</label
              >
              <lightning-input
                variant="label-hidden"
                required
                step="any"
                pattern="^[1-9]\d{0,6}(\.\d{1,2})?$|^0\.(?!0+$)\d{1,2}$"
                formatter="currency"
                type="number"
                value={finRem3}
                onchange={handleFinancialCompensation3}
                class="input inputFinCompensation"
                message-when-pattern-mismatch="Must be a positive value with up to 7 whole digits and 2 decimal digits"
                data-id="finAmount-id"
              ></lightning-input>
            </template>
          </div>
          <template if:true={isNonFinancialComplaintRemedy3}>
            <template if:true={isRewardPoints3}>
              <div
                class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
              >
                <lightning-input-field
                  variant="label-stacked"
                  aria-label="Integer financial reward Points"
                  required="true"
                  field-name={remedyPoints3}
                  onchange={handleFinRemedyPoints3}
                  value={remedyPoints3Value}
                  data-id="finRemedyPoints1-id"
                  role="textbox"
                >
                </lightning-input-field>
              </div>
            </template>
          </template>
          <template if:true={isReferredToProductManufacturer3}>
            <div
              class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
            >
              <lightning-input
                type="checkbox"
                label="The details of this complaint have been provided to the product manufacturer 3"
                name="thirdPartyIsDetailsProvidedToProductManufacturer3"
                required
                message-when-value-missing="Acknowledgement that the complaint details have been provided to the product manufacturer is required"
                field-level-help="Evidence that the details of the complaint have been passed onto the product manufacturer must be included on the case"
                data-id="thirdPartyIsDetailsProvidedToProductManufacturer3-id"
                onchange={handleIsDetailsProvidedToProductManufacturer3}
                checked={prodManu3CheckBox}
              ></lightning-input>
            </div>
          </template>
          <template if:true={showDuration3}>
            <div
              class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
            >
              <lightning-input-field
                variant="label-stacked"
                aria-label="Integer duration of remedy months"
                required="true"
                field-name={remedyDuration3}
                value={remedyDurationValue3}
                onchange={handleremedyDuration3}
                data-id="finRemedyDuration2-id"
                role="textbox"
              >
              </lightning-input-field>
            </div>
          </template>
        </template>
        <template if:true={showAvoidableEscalation}>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input
              type="toggle"
              label="Avoidable Escalation?"
              name="avoidableEscalation"
              data-id="avoidableEscalation-id"
              onchange={handleAvoidableEscalation}
              checked={avoidableEscalationValue}
              message-toggle-active="Yes"
              message-toggle-inactive="No"
              field-level-help="Applicable for complaints that have been manually recorded and escalated either by the Case Owner or by automatic escalation. For complaints received by email or online form, leave as NO as escalation of these records are not avoidable. "
            ></lightning-input>
          </div>
        </template>
        <template if:true={showAvoidableEscalationReason}>
          <div
            class="slds-col slds-size_2-of-4 slds-m-right_large slds-p-top_medium"
          >
            <lightning-input-field
              variant="label-stacked"
              required="true"
              field-name={avoidableEscalationReason}
              data-id="avoidableEscalationReason-id"
              onchange={handleAvoidableEscalationReason}
            ></lightning-input-field>
          </div>
        </template>
      </div>
      <div class="slds-grid slds-wrap">
        <div class={radioStyle}>
          <template if:false={recordId}>
            <lightning-radio-group
              required
              aria-required="true"
              name="realFormRequiredGroup"
              label="Is a REAL form required?"
              onchange={handleRealFormNeeded}
              options={realFormReqOptions}
              value={realFormRequiredValue}
              type="button"
              data-id="realFormRequiredGroup-id"
            ></lightning-radio-group>
            <lightning-helptext
              content="A REAL form must be completed in the event: a failure of internal process, people(e.g. Human error) and/or systems causing a compliance, financial or reputational impact to ANZ or our customers. Ticking this box does not automatically generate a REAL Form. To locate and complete the REAL form, access MAX and search 'REAL Form' or on the MAX homepage go to the Quick Links section 'Operational Risk Events - REAL'."
            >
            </lightning-helptext>
          </template>
          <template if:true={recordId}>
            <lightning-combobox
              required
              aria-required="true"
              name="realFormRequiredGroup"
              label="Is a REAL form required?"
              onchange={handleRealFormNeeded}
              options={realFormReqOptions}
              value={realFormRequiredValue}
              data-id="realFormRequiredGroup-id"
              field-level-help="A REAL form must be completed in the event: a failure of internal process, people(e.g. Human error) and/or systems causing a compliance, financial or reputational impact to ANZ or our customers. Ticking this box does not automatically generate a REAL Form. To locate and complete the REAL form, access MAX and search 'REAL Form' or on the MAX homepage go to the Quick Links section 'Operational Risk Events - REAL'."
            ></lightning-combobox>
          </template>
        </div>
        <template if:true={recordId}>
          <div class="slds-col slds-size_2-of-4"></div>
        </template>
        <template if:true={isRealFormNeededBooleanValue}>
          <div class={elementStyle}>
            <lightning-input
              type="text"
              label="REAL Form MAX ID/ServiceNow ID"
              value={realFormRefNo}
              required={isRealFormNeededBooleanValue}
              max-length="50"
              onchange={handleRealFormRefNoChange}
              data-id="realFormRefNoGroup-id"
              field-level-help="Once a REAL form has been submitted via MAX, an auto-generated REAL form 'MAX ID/ServiceNow ID' will be displayed. Record this 'MAX ID/ServiceNow ID' into this field."
            ></lightning-input>
          </div>
        </template>
      </div>
      <!--Systemic issues-->
      <div class="slds-grid slds-wrap">
        <div class={radioStyle}>
          <template if:false={recordId}>
            <lightning-radio-group
              required
              aria-required="true"
              name="commoncomplaintGroup"
              label="Is this a possible systemic issue?"
              onchange={handleCommonComplaint}
              options={commoncomplaintoptions}
              value={isCommonComplaintYesNo}
              type="button"
              data-id="commoncomplaintGroup-id"
            >
            </lightning-radio-group>

            <lightning-helptext
              content="Issues which may impact more than one customer AND are of a compliance nature. E.g. ANZ systems or processes not working properly or non-compliance with terms and conditions"
            >
            </lightning-helptext>
          </template>
          <template if:true={recordId}>
            <lightning-combobox
              required
              aria-required="true"
              name="commoncomplaintGroup"
              label="Is this a possible systemic issue?"
              onchange={handleCommonComplaint}
              options={commoncomplaintoptions}
              value={isCommonComplaintYesNo}
              data-id="commoncomplaintGroup-id"
              field-level-help="Issues which may impact more than one customer AND are of a compliance nature. E.g. ANZ systems or processes not working properly or non-compliance with terms and conditions"
            >
            </lightning-combobox>
          </template>
        </div>
        <template if:true={isCommonComplaint}>
          <div class={elementStyle}>
            <lightning-input-field
              variant="label-stacked"
              required={isCommonComplaint}
              aria-required={isCommonComplaint}
              field-name={systemicIssueDescriptionField}
              data-id="siDescription-id"
              onchange={handleSystemicIssueDescriptionChange}
            ></lightning-input-field>
          </div>
          <div class={elementStyle}>
            <lightning-input-field
              variant="label-stacked"
              required={isCommonComplaint}
              aria-required={isCommonComplaint}
              field-name={systemicIssueCategoryField}
              onchange={handleSystemicIssueCategoryChange}
              data-id="siCategory-id"
            ></lightning-input-field>
          </div>
          <template if:true={showAdditionalIssues}>
            <template if:false={recordId}>
              <div class="slds-col slds-size_2-of-4"></div>
            </template>
            <div
              class="slds-col slds-grid slds-size_2-of-4 slds-p-right_large slds-p-top_medium"
            >
              <lightning-input-field
                variant="label-stacked"
                field-name={possibleSystemicIssuesField}
                data-id="possibleSystemicIssues-id"
                onchange={handlePossibleSystemicIssuesChange}
              ></lightning-input-field>
            </div>
          </template>
        </template>
      </div>
      <br /><br />
    </lightning-record-edit-form>
  </template>
</template>
