<template>
  <template if:true={showOptions}>
    <lightning-record-edit-form
      object-api-name={caseObject}
      record-type-id={recordTypeId}
      onsubmit={handleSubmit}
      onsuccess={handleCaseSuccess}
      onerror={handleCaseError}
    >
      <lightning-input-field
        variant="label-stacked"
        aria-label="Dropdown Complaint Outcome"
        required="true"
        field-name={complaintOutcome}
        onchange={handleComplaintOutcomeChange}
        data-id="compOutCome2-id"
      ></lightning-input-field>
      <lightning-input-field
        variant="label-stacked"
        required="true"
        field-name={outcomeDescription}
        onchange={handleOutcomeDescriptionChange}
        data-id="descOutcome-id"
      ></lightning-input-field>
      <lightning-input-field
        variant="label-stacked"
        aria-label="Dropdown Complaint Remedy"
        required="true"
        field-name={complaintRemedy}
        onchange={handleComplaintRemedy}
        data-id="compRemedy-id"
      ></lightning-input-field>
      <lightning-input-field
        variant="label-stacked"
        aria-label="Dropdown Complaint Sub Remedy"
        required="true"
        field-name={complaintSubRemedy}
        onchange={handleComplaintSubRemedy}
        data-id="compSubRemedy-id"
      ></lightning-input-field>

      <div
        class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
      >
        <template if:true={isFinancialComplaintRemedy}>
          <label class="slds-form-element__label" for="text-input-id-149">
            <abbr class="slds-required" title="required">* </abbr>Financial
            Amount</label
          >
          <lightning-input
            variant="label-hidden"
            required
            step="any"
            pattern="^[1-9]\d{0,6}(\.\d{1,2})?$|^0\.(?!0+$)\d{1,2}$"
            formatter="currency"
            type="number"
            onchange={handleFinancialCompensation}
            class="input inputFinCompensation"
            message-when-pattern-mismatch="Must be a positive value with up to 7 whole digits and 2 decimal digits"
            data-id="finAmount-id"
          ></lightning-input>
        </template>
      </div>
      <template if:true={isNonFinancialComplaintRemedy}>
        <lightning-input-field
          variant="label-stacked"
          required
          field-name={nonFinancialRemedy}
          onchange={handleNonFinacialRemedy}
          data-id="nonFinancialRemedy-id"
        ></lightning-input-field>
      </template>
      <template if:true={isReferredToProductManufacturer}>
        <lightning-input-field
          variant="label-stacked"
          required
          field-name={thirdPartyProductManufacturer}
          onchange={handleThirdPartyProductManufacturer}
          data-id="thirdPartyProductManufacturer-id"
        >
        </lightning-input-field>
      </template>
      <template if:true={isOtherProductManufacturer}>
        <div
          class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
        >
          <lightning-input-field
            variant="label-stacked"
            required
            field-name={thirdPartyOtherProductManufacturer}
            onchange={handleProductManufacturerNameChange}
            data-id="thirdPartyOtherProductManufacturer-id"
          >
          </lightning-input-field>
        </div>
      </template>
      <!--Complaint Status-->
      <template if:true={isReferredToProductManufacturer}>
        <div
          class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
        >
          <lightning-input
            type="checkbox"
            label="The details of this complaint have been provided to the product manufacturer"
            name="thirdPartyIsDetailsProvidedToProductManufacturer"
            required
            message-when-value-missing="Acknowledgement that the complaint details have been provided to the product manufacturer is required"
            field-level-help="Evidence that the details of the complaint have been passed onto the product manufacturer must be included on the case"
            data-id="thirdPartyIsDetailsProvidedToProductManufacturer-id"
            onchange={handleIsDetailsProvidedToProductManufacturer}
          ></lightning-input>
        </div>
      </template>
    </lightning-record-edit-form>
  </template>
  <template if:true={showModal}>
    <section
      role="dialog"
      tabindex="-1"
      class="slds-modal slds-fade-in-open slds-modal_small"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      aria-describedby="modal-content-id-1"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <lightning-button-icon
            icon-name="utility:close"
            class="slds-float_right"
            onclick={closeModal}
            alternative-text="close"
            arial-label="Press to close the dialog and return to the form"
          ></lightning-button-icon>
          <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
            {modalHeader}
          </h2>
        </header>
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-id-1"
        >
          <lightning-formatted-rich-text
            value={modalMessage}
          ></lightning-formatted-rich-text>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            variant="brand"
            label="Close"
            arial-label="Press to close the dialog and return to the form"
            title="Close"
            onclick={closeModal}
            class="slds-m-left_x-small"
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
