<template>
  <div class="slds-box expressBox">
    <div class="slds-grid slds-wrap">
      <div
        class="slds-col slds-size_1-of-4 slds-m-right_large slds-p-top_medium"
      >
        <lightning-input
          type="toggle"
          class="expressToggle"
          label="Express Case Creation"
          name="expressCaseCheck"
          message-toggle-active="Yes"
          message-toggle-inactive="No"
          onchange={handleExpressCaseToggle}
        ></lightning-input>
      </div>
      <template lwc:if={showKnownOutageSelect}>
        <div class="slds-col slds-size_1-of-4 slds-m-right_large">
          <lightning-combobox
            name="knownOutageSelect"
            label="This complaint is about"
            value={knownIssueValue}
            placeholder="Select Known Issue"
            options={knownIssueOptions}
            onchange={handleKnownIssueChange}
          ></lightning-combobox>
        </div>
      </template>
    </div>
  </div>
</template>
