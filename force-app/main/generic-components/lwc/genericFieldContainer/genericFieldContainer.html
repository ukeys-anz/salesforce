<template>
  <template lwc:if={_hasError}>
    <div class="slds-text-color_error slds-p-around_small">{_errorMessage}</div>
  </template>
  <template lwc:elseif={value}>
    <template lwc:if={hasSectionHeader}>
      <lightning-accordion
        allow-multiple-sections-open
        onsectiontoggle={handleSectionToggle}
        active-section-name={activeSections}
      >
        <!-- Accordion Section -->
        <lightning-accordion-section
          name={_objectConfig.title}
          label={_objectConfig.title}
        >
          <!-- Detail -->
          <lightning-layout
            lwc:spread={_objectConfig.layoutconfig.layout}
            multiple-rows="true"
          >
            <template for:each={_parsedData} for:item="pData">
              <lightning-layout-item
                lwc:spread={_objectConfig.layoutconfig.layoutitem}
                key={pData.key}
              >
                <c-generic-field
                  field={pData}
                  value={pData.value}
                  record-id={recordId}
                  padding-size={_paddingSize}
                  filter-value={pData.useAsFilter}
                >
                </c-generic-field>
              </lightning-layout-item>
            </template>
          </lightning-layout>
        </lightning-accordion-section>
      </lightning-accordion>
    </template>
    <!-- Non-accordion -->
    <template lwc:else>
      <!-- Detail -->
      <lightning-layout
        lwc:spread={_objectConfig.layoutconfig.layout}
        multiple-rows="true"
      >
        <template for:each={_parsedData} for:item="pData">
          <lightning-layout-item
            lwc:spread={_objectConfig.layoutconfig.layoutitem}
            key={pData.key}
          >
            <c-generic-field
              field={pData}
              value={pData.value}
              record-id={recordId}
              padding-size={_paddingSize}
            >
            </c-generic-field>
          </lightning-layout-item>
        </template>
      </lightning-layout>
    </template>
  </template>
</template>
