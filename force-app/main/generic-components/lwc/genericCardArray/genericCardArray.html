<template>
  <lightning-card>
    <div class="slds-card__body">
      <template lwc:if={isLoading}>
        <div class="slds-grid slds-wrap">
          <div class="slds-col slds-size_1-of-1 spinnerHolder">
            <lightning-spinner
              alternative-text="Loading"
              size="medium"
              variant="brand"
            ></lightning-spinner>
          </div>
        </div>
      </template>

      <template lwc:elseif={_hasError}>
        <c-error message={_errorMessage}></c-error>
      </template>

      <template lwc:elseif={cardItems}>
        <h3 class="slds-m-around_small">{title}</h3>
        <div class="slds-box slds-theme_default card-container">
          <template for:each={cardItems} for:item="item" for:index="index">
            <div
              key={item.id}
              class="slds-m-bottom_medium slds-box slds-theme_default slds-box_border"
            >
              <c-generic-card lwc:spread={item} enum-data={_enumData}>
              </c-generic-card>
            </div>
          </template>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
