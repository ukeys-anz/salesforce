<template>
  <template lwc:if={isLoading}>
    <div class="slds-grid slds-wrap">
      <div class="slds-col slds-size_1-of-1 spinnerHolder">
        <lightning-spinner
          alternative-text="Loading"
          size="medium"
          variant="brand"
        ></lightning-spinner>
      </div>
    </div>
  </template>
  <template lwc:elseif={_hasError}>
    <c-error></c-error>
  </template>
  <template lwc:elseif={tableConfig}>
    <lightning-card title={_title} icon-name={_iconName}>
      <div class="slds-card__body slds-card__body_inner table-container">
        <lightning-datatable
          key-field={_keyField}
          columns={tableConfig.columns}
          data={tableData}
          default-sort-direction={defaultSortDirection}
          sorted-direction={sortDirection}
          sorted-by={sortedBy}
          onsort={handleSort}
          hide-checkbox-column={_hideCheckboxColumn}
          show-row-number-column={showRowNumberColumn}
          hide-table-header={hideTableHeader}
          column-widths-mode={columnWidthsMode}
          show-actions-menu={showActionsMenu}
          onrowaction={handleRowAction}
        >
        </lightning-datatable></div
    ></lightning-card>
  </template>
  <template lwc:else>
    <div class="slds-illustration slds-illustration_small slds-p-around_small">
      <div class="slds-text-longform">
        <h3 class="slds-text-heading_medium">Loading datatable...</h3>
        <p class="slds-text-body_regular">Preparing data for datatable...</p>
      </div>
    </div>
  </template>
</template>
