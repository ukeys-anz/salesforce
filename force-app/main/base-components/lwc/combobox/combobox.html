<template>
  <label class={computedLabelClass}>
    <template lwc:if={required}>
      <abbr class="slds-required" title={i18n.required}>*</abbr>
    </template>
    {label}
  </label>
  <lightning-helptext
    lwc:if={_fieldLevelHelp}
    content={_fieldLevelHelp}
  ></lightning-helptext>

  <div class="slds-form-element__control">
    <c-base-combobox
      name={name}
      required={required}
      disabled={disabled}
      variant={variant}
      placeholder={placeholder}
      items={_items}
      input-text={_selectedLabel}
      input-icon-size="xx-small"
      input-icon-name="utility:down"
      multi-select={multiSelect}
      show-dropdown-activity-indicator={spinnerActive}
      dropdown-alignment={dropdownAlignment}
      ondropdownopen={handleDropdownOpen}
      onfocus={handleFocus}
      onblur={handleBlur}
      onready={handleComboboxReady}
      onselect={handleSelect}
    ></c-base-combobox>
  </div>
  <template lwc:if={_helpMessage}>
    <div
      id="help-text"
      data-help-text
      class="slds-form-element__help"
      aria-live="assertive"
    >
      {_helpMessage}
    </div>
  </template>
  <template lwc:if={showSelections}>
    <!-- Multi Select Pills -->
    <template for:each={_items} for:item="item">
      <template lwc:if={item.checked}>
        <lightning-pill
          key={item.value}
          class="slds-m-around_xx-small"
          name={item.value}
          label={item.value}
          aria-label={item.value}
          onremove={removePill}
        ></lightning-pill>
      </template>
    </template>
  </template>
</template>
