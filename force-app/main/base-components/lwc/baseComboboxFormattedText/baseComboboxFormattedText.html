<template>
  <template lwc:if={hasParts}>
    <template for:each={text} for:item="item">
      <template lwc:if={item.part.highlight}>
        <strong key={item.key}>{item.part.text}</strong>
      </template>
      <template lwc:else> {item.part.text} </template>
    </template>
  </template>
  <template lwc:else> {text} </template>
</template>
