<template>
  <!-- SPINNER -->
  <template lwc:if={isLoading}>
    <lightning-spinner
      alternative-text="Loading"
      varient="brand"
      size="large"
      class="slds-align_absolute-center"
    ></lightning-spinner>
  </template>
  <template lwc:else>
    <!--Display modal header-->
    <template lwc:if={isEditScreenCalled}>
      <lightning-modal-header
        class="modal-header slds-text-align_center"
        label="Edit Additional Funds and Purpose"
      ></lightning-modal-header>
    </template>
    <template lwc:else>
      <lightning-modal-header
        class="modal-header slds-text-align_center"
        label="Add New Additional Funds and Purpose"
      ></lightning-modal-header>
    </template>
    <!--Display title and logo image-->
    <lightning-modal-body>
      <template lwc:if={showSelectTextLogoAndButton}>
        <lightning-layout multiple-rows class="slds-box marginStyle">
          <lightning-layout-item size="1" flexibility="shrink">
            <img src={logoImage} class="logoStyle" />
          </lightning-layout-item>
          <lightning-layout multiple-rows>
            <lightning-layout-item
              size="11"
              flexibility="shrink"
              class="textStyleBold slds-p-top_small"
            >
              <template lwc:if={showCategoryScreen}>
                <lightning-formatted-text value="Additional Funds and Purpose">
                </lightning-formatted-text>
              </template>
              <template lwc:if={showPurposeScreen}>
                <lightning-formatted-text value={selectedCategory}>
                </lightning-formatted-text>
              </template>
            </lightning-layout-item>
            <lightning-layout-item
              size="11"
              flexibility="shrink"
              class="textStyle slds-p-top_x-small"
            >
              <lightning-formatted-text
                value="Please select the types of additional funds you would like to add."
              >
              </lightning-formatted-text>
            </lightning-layout-item>
          </lightning-layout>
          <lightning-layout-item
            size="12"
            class="slds-p-left_medium slds-p-top_small"
          >
            <!--Screen to display Category radio button options based on list of category-->
            <template lwc:if={showCategoryScreen}>
              <template for:each={categoryOptions} for:item="categoryValue">
                <lightning-input
                  name="categoryRadioGroup"
                  class="optionStyle"
                  type="radio"
                  value={categoryValue.value}
                  label={categoryValue.label}
                  disabled={categoryValue.disabled}
                  key={categoryValue.label}
                  onchange={handleCategoryChange}
                  checked={categoryValue.isChecked}
                ></lightning-input>
              </template>
            </template>
            <!--Screen to display Purpose checkbox options based on list of purpose-->
            <template lwc:if={showPurposeScreen}>
              <template for:each={purposeOptions} for:item="purposeValue">
                <lightning-input
                  class="optionStyle"
                  type="checkbox"
                  value={purposeValue.value}
                  label={purposeValue.label}
                  disabled={purposeValue.disabled}
                  key={purposeValue.label}
                  onchange={handlePurposeChange}
                  checked={purposeValue.isChecked}
                ></lightning-input>
              </template>
            </template>
          </lightning-layout-item>
        </lightning-layout>
      </template>
      <template lwc:else>
        <lightning-layout
          multiple-rows
          class="slds-m-left_medium slds-m-right_medium"
        >
          <lightning-layout-item
            size="12"
            class="slds-text-align_right requiredStyle"
          >
            <lightning-formatted-text
              class="slds-text-color_error"
              value="*"
            ></lightning-formatted-text>
            <!-- Display the text Required Fields -->
            <lightning-formatted-text
              value="=Required fields"
            ></lightning-formatted-text>
          </lightning-layout-item>
          <lightning-layout-item size="12">
            <lightning-layout multiple-rows>
              <!-- Logo for the Save purpose Screen -->
              <lightning-layout-item
                size="1"
                flexibility="shrink"
                class="slds-p-left_medium"
              >
                <img src={logoImage} class="logoSizing" />
              </lightning-layout-item>
              <lightning-layout-item size="11">
                <lightning-layout multiple-rows>
                  <!-- Modal Heading -->
                  <lightning-layout-item
                    size="12"
                    flexibility="shrink"
                    class="textStyleBold slds-p-top_small"
                  >
                    <lightning-formatted-text
                      value="Additional Funds and Purpose"
                    >
                    </lightning-formatted-text>
                  </lightning-layout-item>
                  <!-- Modal help text -->
                  <lightning-layout-item
                    size="12"
                    flexibility="shrink"
                    class="questionStyle slds-p-top_x-small"
                  >
                    <lightning-formatted-text
                      value="How customer plans to use the additional funds."
                    >
                    </lightning-formatted-text>
                  </lightning-layout-item>
                </lightning-layout>
              </lightning-layout-item>
            </lightning-layout>
          </lightning-layout-item>
        </lightning-layout>
        <lightning-layout
          multiple-rows
          class="slds-m-top_large slds-box slds-m-left_medium slds-m-right_medium"
        >
          <!-- Add Addition Funds Button -->
          <lightning-layout-item
            size="12"
            class="slds-text-align_right slds-p-right_large"
          >
            <lightning-button-menu
              label="Add Additional Funds"
              alternative-text="Show menu"
              class="buttonStyle"
              onselect={handleAddAdditionalFunds}
              disabled={addFundDisabled}
              variant="bare"
              icon-name="utility:add"
            >
              <template for:each={addFundsOptions} for:item="purpose">
                <lightning-menu-item
                  key={purpose}
                  label={purpose.label}
                  value={purpose.value}
                ></lightning-menu-item>
              </template>
            </lightning-button-menu>
          </lightning-layout-item>
          <lightning-layout-item size="12" class="slds-p-top_medium">
            <lightning-layout multiple-rows>
              <!-- Selected category Label -->
              <lightning-layout-item
                size="12"
                class="slds-section__title slds-theme_shade slds-p-left_x-small"
              >
                <lightning-formatted-text
                  value={selectedCategory}
                  class="hearderContentStyle"
                ></lightning-formatted-text>
              </lightning-layout-item>
              <!-- Help text for the selected Category -->
              <lightning-layout-item size="12" class="slds-p-top_small">
                <lightning-formatted-text
                  value={helpTextValue}
                  class="helpTextStyle"
                >
                </lightning-formatted-text>
              </lightning-layout-item>
              <lightning-layout-item size="8">
                <!-- Display list of Purpose options selected with an input for Amount and otherReason -->
                <template
                  for:each={updatedFundsWithAmountAndOtherReason}
                  for:item="purpose"
                >
                  <lightning-layout key={purpose} multiple-rows>
                    <lightning-layout-item size="5" class="slds-p-top_large">
                      <lightning-formatted-text
                        value="*"
                        class="slds-text-color_error"
                      ></lightning-formatted-text>
                      <lightning-formatted-text
                        value={purpose.label}
                        class="slds-p-left_small selectedOptionStyle"
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                    <lightning-layout-item size="6">
                      <lightning-input
                        type="number"
                        data-id={purpose.value}
                        value={purpose.amount}
                        formatter="currency"
                        currency-code="AUD"
                        step="0.01"
                        onchange={handleAmountChange}
                        onfocus={handleAmountSelect}
                        onblur={handleAmountDefaultValue}
                      ></lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item size="1">
                      <lightning-icon
                        icon-name="utility:delete"
                        alternative-text="Delete!"
                        data-id={purpose.value}
                        title="Delete"
                        size="small"
                        onclick={handleDelete}
                        class="slds-p-top_medium slds-p-left_x-small"
                      ></lightning-icon>
                    </lightning-layout-item>
                    <template lwc:if={purpose.showOtherReason}>
                      <lightning-layout-item size="5" class="slds-p-top_large">
                        <lightning-formatted-text
                          value="*"
                          class="slds-text-color_error"
                        ></lightning-formatted-text>
                        <lightning-formatted-text
                          value="Other Reason"
                          class="slds-p-left_small"
                        ></lightning-formatted-text>
                      </lightning-layout-item>
                      <lightning-layout-item size="6">
                        <lightning-input
                          type="text"
                          class="otherReason"
                          maxlength="60"
                          name="otherReason"
                          data-id={purpose.value}
                          value={purpose.otherReason}
                          onblur={handleOtherReason}
                        ></lightning-input>
                      </lightning-layout-item>
                    </template>
                  </lightning-layout>
                </template>
              </lightning-layout-item>
            </lightning-layout>
          </lightning-layout-item>
        </lightning-layout>
      </template>
    </lightning-modal-body>
    <!--Display Next,Back. Save and Cancel button based on different conditions-->
    <lightning-modal-footer class="slds-text-align_center">
      <lightning-layout horizontal-align="center">
        <!-- Modal footer-->
        <lightning-layout-item size="auto">
          <lightning-button
            variant="brand"
            label="Back"
            onclick={handleBack}
            hidden={hideBackButton}
          ></lightning-button>
          <lightning-button
            variant="neutral"
            class="slds-p-left_medium"
            label="Cancel"
            onclick={handleClose}
          ></lightning-button>
          <template lwc:if={showSelectTextLogoAndButton}>
            <lightning-button
              variant="brand"
              class="slds-p-left_medium"
              label="Next"
              onclick={handleNext}
              disabled={disableNextButton}
            ></lightning-button>
          </template>
          <template lwc:else>
            <lightning-button
              variant="brand"
              class="slds-p-left_medium"
              label="Save"
              disabled={disableSaveButton}
              onclick={handleSave}
            ></lightning-button>
          </template>
        </lightning-layout-item>
      </lightning-layout>
    </lightning-modal-footer>
  </template>
</template>
