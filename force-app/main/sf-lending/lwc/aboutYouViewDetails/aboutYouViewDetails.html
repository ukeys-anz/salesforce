<template>
  <template lwc:if={componentSpinner}>
    <lightning-spinner
      alternative-text="Loading"
      varient="brand"
      size="large"
      class="slds-align_absolute-center"
    ></lightning-spinner>
  </template>
  <template lwc:if={showGetSOPErrorScreen}>
    <lightning-layout multiple-rows>
      <lightning-layout-item
        size="12"
        flexibility="shrink"
        class="slds-p-horizontal_small slds-p-top_x-small"
      >
        <lightning-formatted-text
          class="headingStyle"
          value={sopAPIErrorHeader}
        >
        </lightning-formatted-text>
      </lightning-layout-item>
      <lightning-layout-item
        size="12"
        flexibility="shrink"
        class="slds-p-horizontal_small slds-p-top_x-small slds-p-bottom_x-large"
      >
        <lightning-formatted-text class="textStyle" value={sopAPIErrorDetail}>
        </lightning-formatted-text>
      </lightning-layout-item>
    </lightning-layout>
  </template>
  <!-- View only screen starts -->
  <template lwc:if={showViewScreen}>
    <lightning-layout multiple-rows>
      <lightning-layout-item
        size="6"
        flexibility="shrink"
        class="slds-p-horizontal_small slds-p-top_x-small"
      >
        <lightning-layout>
          <lightning-layout-item
            size="4"
            flexibility="shrink"
            class="labelStyle slds-border_bottom slds-p-around_xx-small"
          >
            <lightning-formatted-text value="Dependants">
            </lightning-formatted-text>
          </lightning-layout-item>

          <lightning-layout-item
            size="6"
            flexibility="shrink"
            class="textStyle slds-border_bottom slds-p-around_xx-small"
          >
            <lightning-formatted-number
              value={partiesData.partyDependantsCount}
            >
            </lightning-formatted-number>
          </lightning-layout-item>

          <lightning-layout-item
            size="2"
            flexibility="shrink"
            class="slds-text-align_right slds-border_bottom slds-p-around_xx-small"
          >
            <template lwc:if={isFieldEditable}>
              <lightning-icon
                icon-name="utility:edit"
                onclick={toggleScreen}
                size="xx-small"
                class="slds-align_absolute-right"
              ></lightning-icon>
            </template>
          </lightning-layout-item>
        </lightning-layout>
      </lightning-layout-item>
      <lightning-layout-item
        size="6"
        flexibility="shrink"
        class="slds-p-horizontal_small slds-p-top_x-small"
      >
        <lightning-layout>
          <lightning-layout-item
            size="4"
            flexibility="shrink"
            class="labelStyle slds-border_bottom slds-p-around_xx-small"
          >
            <lightning-formatted-text value="Sole Income Earner">
            </lightning-formatted-text>
          </lightning-layout-item>

          <lightning-layout-item
            size="6"
            flexibility="shrink"
            class="textStyle slds-border_bottom slds-p-around_xx-small"
          >
            <lightning-formatted-text value={partiesData.soleIncomeEarner}>
            </lightning-formatted-text>
          </lightning-layout-item>
          <lightning-layout-item
            size="2"
            flexibility="shrink"
            class="slds-text-align_right slds-border_bottom slds-p-around_xx-small"
          >
            <template lwc:if={isSoleIncomeEarnerEditable}>
              <lightning-icon
                icon-name="utility:edit"
                onclick={toggleScreen}
                size="xx-small"
                class="slds-align_absolute-right"
              ></lightning-icon>
            </template>
          </lightning-layout-item>
        </lightning-layout>
      </lightning-layout-item>

      <lightning-layout-item
        size="6"
        flexibility="shrink"
        class="slds-p-horizontal_small slds-p-top_x-small"
      >
        <lightning-layout>
          <lightning-layout-item
            size="4"
            flexibility="shrink"
            class="labelStyle slds-border_bottom slds-p-around_xx-small"
          >
            <lightning-formatted-text value="Relationship Status">
            </lightning-formatted-text>
          </lightning-layout-item>

          <lightning-layout-item
            size="6"
            flexibility="shrink"
            class="textStyle slds-border_bottom slds-p-around_xx-small"
          >
            <lightning-formatted-text value={partiesData.relationshipState}>
            </lightning-formatted-text>
          </lightning-layout-item>

          <lightning-layout-item
            size="2"
            flexibility="shrink"
            class="slds-text-align_right slds-border_bottom slds-p-around_xx-small"
          >
            <template lwc:if={isRelationshipStateEditable}>
              <lightning-icon
                icon-name="utility:edit"
                onclick={toggleScreen}
                size="xx-small"
                class="slds-align_absolute-right"
              ></lightning-icon>
            </template>
          </lightning-layout-item>
        </lightning-layout>
      </lightning-layout-item>
    </lightning-layout>
  </template>
  <!-- View only screen ends -->
  <!-- Edit SOP screen starts -->
  <template lwc:if={showEditScreen}>
    <!-- Show record data in editable fields -->
    <lightning-layout>
      <lightning-layout-item
        size="12"
        class="requiredTextStyle slds-text-align_right slds-p-around_xx-small"
      >
        <lightning-formatted-text value="*" class="slds-required">
        </lightning-formatted-text>
        <lightning-formatted-text value="= Required fields">
        </lightning-formatted-text>
      </lightning-layout-item>
    </lightning-layout>
    <lightning-card>
      <lightning-layout
        multiple-rows
        class="boxStyling slds-box slds-p-around_xxx-small"
      >
        <lightning-layout-item
          size="6"
          class="textStyle slds-p-around_xx-small"
        >
          <lightning-layout>
            <lightning-layout-item size="12">
              <!-- Display input fields for record fields -->
              <lightning-input
                label="Dependants"
                value={partiesData.partyDependantsCount}
                type="number"
                onchange={handleChange}
                data-id="partyDependantsCount"
                variant="label-inline"
                min="0"
                required
                message-when-range-underflow={dependantsIncorrectFormatError}
                message-when-bad-input={dependantsIncorrectFormatError}
              ></lightning-input>
            </lightning-layout-item>
          </lightning-layout>
        </lightning-layout-item>
        <lightning-layout-item
          size="6"
          class="textStyle slds-p-around_xx-small"
        >
          <lightning-layout>
            <lightning-layout-item size="12">
              <lightning-combobox
                label="Sole Income Earner"
                value={partiesData.soleIncomeEarner}
                onchange={handleChange}
                options={soleIncomesOptions}
                data-id="soleIncomeEarner"
                variant="label-inline"
                disabled={isSoleIncomeEarnerReadOnly}
              ></lightning-combobox>
            </lightning-layout-item>
          </lightning-layout>
        </lightning-layout-item>
        <lightning-layout-item
          size="6"
          class="textStyle slds-p-around_xx-small"
        >
          <lightning-layout>
            <lightning-layout-item size="12">
              <lightning-combobox
                label="Relationship Status"
                value={partiesData.relationshipState}
                onchange={handleChange}
                options={relationshipStatusOptions}
                data-id="relationshipState"
                variant="label-inline"
                required={isRelationshipStateRequired}
                disabled={isApplicationJoint}
              ></lightning-combobox>
            </lightning-layout-item>
          </lightning-layout>
        </lightning-layout-item>
      </lightning-layout>

      <!-- Action buttons -->
      <lightning-layout class="footerStyling slds-box">
        <lightning-layout-item
          size="6"
          class="slds-text-align_right slds-m-left_small slds-p-right_x-small"
        >
          <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleCancel}
          ></lightning-button>
        </lightning-layout-item>
        <lightning-layout-item size="1" class="slds-text-align_center">
          <lightning-button
            variant="brand"
            label="Save"
            onclick={handleSave}
          ></lightning-button>
        </lightning-layout-item>
      </lightning-layout>
    </lightning-card>
  </template>
  <!-- Edit SOP screen ends -->
</template>
