<template>
  <!-- SPINNER -->
  <template lwc:if={componentSpinner}>
    <lightning-spinner
      alternative-text="Loading"
      varient="brand"
      size="large"
      class="slds-align_absolute-center"
    ></lightning-spinner>
  </template>
  <template lwc:else>
    <!--Display modal header-->
    <lightning-modal-header
      class="modal-header slds-text-align_center"
      label={deleteHeaderMessage}
    >
    </lightning-modal-header>
    <!--Display modal body-->
    <lightning-modal-body>
      <lightning-layout
        multiple-rows
        class="slds-p-horizontal_medium slds-p-vertical_x-large"
      >
        <lightning-layout-item size="12" class="slds-p-left_medium textStyle">
          <lightning-formatted-rich-text value={deleteConfirmationMessage}>
          </lightning-formatted-rich-text>
        </lightning-layout-item>
      </lightning-layout>
    </lightning-modal-body>
    <!--Display modal footer-->
    <lightning-modal-footer>
      <lightning-layout>
        <!-- Modal footer-->
        <lightning-layout-item size="auto" alignment-bump="left">
          <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleClose}
          ></lightning-button>
          <lightning-button
            variant="destructive"
            class="slds-p-left_medium"
            label="Delete"
            type="submit"
            onclick={handleDelete}
          ></lightning-button>
        </lightning-layout-item>
      </lightning-layout>
    </lightning-modal-footer>
  </template>
</template>
