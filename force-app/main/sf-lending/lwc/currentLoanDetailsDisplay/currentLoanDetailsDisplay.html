<template>
  <template lwc:if={componentSpinner}>
    <lightning-spinner
      alternative-text="Loading"
      varient="brand"
      size="large"
      class="slds-align_absolute-center"
    ></lightning-spinner>
  </template>
  <lightning-accordion
    allow-multiple-sections-open
    active-section-name="currentLoanDetails"
    class="accordionBorderRadiusStyle iconSpacing accordionPadding"
  >
    <lightning-accordion-section
      name="currentLoanDetails"
      label="Current Loan Details"
      class="accordianSection"
    >
      <template lwc:if={isError}>
        <lightning-layout class="slds-p-left_small">
          <lightning-layout-item size="12" class="slds-p-top_small">
            <lightning-icon
              icon-name={iconName}
              size="x-small"
              class="slds-m-right_x-small"
            ></lightning-icon>
            <lightning-formatted-text value={errorMessage}>
            </lightning-formatted-text>
          </lightning-layout-item>
        </lightning-layout>
      </template>
      <template lwc:else>
        <lightning-card>
          <template
            for:each={currentLoanItems}
            for:item="currentloan"
            for:index="index"
          >
            <!-- Loan Label -->
            <lightning-layout
              class="slds-p-vertical_small slds-grid_vertical-align-end"
              key={currentloan.id}
            >
              <lightning-layout-item
                size="12"
                flexibility="shrink"
                class="slds-p-horizontal_medium"
              >
                <lightning-formatted-text
                  value={currentloan.label}
                  class="headingStyle"
                ></lightning-formatted-text>
              </lightning-layout-item>
            </lightning-layout>
            <lightning-layout
              multiple-rows
              key={currentloan.id}
              class="slds-grid_vertical-align-end"
            >
              <!-- Existing ANZ Plus Home Loan -->
              <template lwc:if={currentloan.anzPlusHomeLoans}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <span
                        >Existing ANZ Plus Home Loan
                        <lightning-helptext
                          class="tooltip"
                          content=""
                        ></lightning-helptext>
                      </span>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.anzPlusHomeLoans}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Loan Balance -->
              <template lwc:if={currentloan.loanBalance}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Loan Balance"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-number
                        value={currentloan.loanBalance}
                        format-style="currency"
                        currency-code="AUD"
                        currency-display-as="symbol"
                      >
                      </lightning-formatted-number>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Total Remaining Loan Term -->
              <template lwc:if={currentloan.totalRemainingTerm}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Total Remaining Loan Term"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.totalRemainingTerm}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Remaining loan Term -->
              <template lwc:if={currentloan.remainingTerm}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Remaining Loan Term"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.remainingTerm}
                      ></lightning-formatted-text>
                    </lightning-layout-item> </lightning-layout
                ></lightning-layout-item>
              </template>

              <!-- Rate Type -->
              <template lwc:if={currentloan.rateType}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Rate Type"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.rateType}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Repayment Type -->
              <template lwc:if={currentloan.repaymentType}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Repayment Type"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.repaymentType}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Remaining Period -->
              <template lwc:if={currentloan.remainingPeriod}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <span
                        >Remaining Period
                        <lightning-helptext
                          class="tooltip"
                          content=""
                        ></lightning-helptext>
                      </span>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.remainingPeriod}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Repayment Frequency -->
              <template lwc:if={currentloan.repaymentFrequency}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Repayment Frequency"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.repaymentFrequency}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Interest Rate -->
              <template lwc:if={currentloan.interestRate}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Interest Rate"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.interestRate}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Subsequent Interest Rate -->
              <template lwc:if={currentloan.subsequentInterestRate}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <span
                        >Subsequent Interest Rate
                        <lightning-helptext
                          class="tooltip"
                          content=""
                        ></lightning-helptext>
                      </span>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.subsequentInterestRate}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Break Costs -->
              <template lwc:if={currentloan.breakCosts}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Break Costs"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.breakCosts}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>

              <!-- Last Updated Date -->
              <template lwc:if={currentloan.updatedTime}>
                <lightning-layout-item
                  size="6"
                  flexibility="shrink"
                  class="slds-p-horizontal_small"
                >
                  <lightning-layout class="slds-p-top_xx-small">
                    <lightning-layout-item
                      size="4"
                      flexibility="shrink"
                      class="labelStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value="Last Updated Date"
                      ></lightning-formatted-text>
                    </lightning-layout-item>

                    <lightning-layout-item
                      size="8"
                      flexibility="shrink"
                      class="valueStyle slds-border_bottom slds-p-around_xx-small"
                    >
                      <lightning-formatted-text
                        value={currentloan.updatedTime}
                      ></lightning-formatted-text>
                    </lightning-layout-item>
                  </lightning-layout>
                </lightning-layout-item>
              </template>
            </lightning-layout>
          </template>
        </lightning-card>
      </template>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
